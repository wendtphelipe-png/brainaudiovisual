name: Deploy to Hostinger VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-24.04
    steps:
      - name: Verificar se Secrets da VPS estão configuradas
        id: check-secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "has_host=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy Ignorado::As credenciais de VPS (VPS_HOST, VPS_USERNAME, VPS_PASSWORD) ainda não foram cadastradas em Settings > Secrets deste repositório. O deploy automático via SSH foi ignorado com sucesso."
          else
            echo "has_host=true" >> "$GITHUB_OUTPUT"
            echo "Credenciais de VPS encontradas. Prosseguindo com deploy SSH..."
          fi

      - name: Deploy application via SSH
        if: steps.check-secrets.outputs.has_host == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }} # Ou use key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # Navega até a pasta do projeto (ajuste o caminho de acordo com sua VPS)
            cd /var/www/brainaudiovisual || cd /var/www/brainlingo || exit
            
            # Puxa o código mais recente do GitHub
            git pull origin main
            
            # --- BUILD FRONTEND ---
            cd frontend
            echo "VITE_LIVEKIT_URL=${{ secrets.LIVEKIT_URL }}" > .env
            npm install
            npm run build
            
            # --- BUILD BACKEND ---
            cd ../backend
            echo "LIVEKIT_URL=${{ secrets.LIVEKIT_URL }}" > .env
            echo "LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}" >> .env
            echo "LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}" >> .env
            
            npm install
            npm run build
            
            # --- RESTART BOT (PM2) ---
            pm2 restart brainaudiovisual-bot || pm2 restart brainlingo-bot || pm2 start dist/index.js --name "brainaudiovisual-bot"
