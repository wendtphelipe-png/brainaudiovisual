name: Deploy

# A cada envio para a main, atualiza a Cabine v2 na VPS
# (https://cabine.brainaudiovisual.com.br). A chave usada aqui só consegue
# rodar o script de atualização na VPS, nada além disso.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  cabine:
    name: Cabine na VPS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Atualizar a VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_DEPLOY_KEY" ]; then
            echo "::warning::Segredos da VPS não configurados; deploy ignorado."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$VPS_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "root@$VPS_HOST" atualizar

      - name: Conferir pela internet
        run: |
          for i in $(seq 1 10); do
            if curl -fsS https://cabine.brainaudiovisual.com.br/saude; then exit 0; fi
            sleep 3
          done
          echo "::error::A cabine não respondeu pela internet depois do deploy"
          exit 1
