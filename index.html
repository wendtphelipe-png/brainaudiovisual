<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Audiovisual</title>
  <link rel="icon" type="image/svg+xml" href="frontend/public/favicon.svg">
  <!-- Tailwind CSS & Lucide Icons via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.25); }
    }
    .animate-pulse-live {
      animation: pulseLive 2s infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased m-0 min-h-screen">

  <div id="app-root"></div>

  <script>
    // ========================================================
    // ROTEAMENTO DINÂMICO
    // ========================================================
    const params = new URLSearchParams(window.location.search);
    const isAdmin = params.get('admin') === 'true' || window.location.pathname.startsWith('/admin');
    const meetingId = params.get('meeting') || (window.location.pathname.startsWith('/meeting/') ? window.location.pathname.split('/')[2] : null);

    const root = document.getElementById('app-root');

    // 1. ROTA: MONITOR DEDICADO DA REUNIÃO (?meeting=xyz ou /meeting/xyz)
    if (meetingId) {
      document.body.className = "bg-slate-950 text-slate-100 font-sans antialiased m-0 min-h-screen selection:bg-blue-500/30 selection:text-blue-200";
      renderMeetingRoomMonitor(meetingId);
    } 
    // 2. ROTA: ÁREA ADMINISTRATIVA (/admin ou ?admin=true)
    else if (isAdmin) {
      document.body.className = "bg-slate-50 text-slate-900 font-sans antialiased m-0 min-h-screen";
      checkAdminAuthAndRender();
    } 
    // 3. ROTA PADRÃO PÚBLICA: PÁGINA EM CONSTRUÇÃO CLEAN E CLARA (/)
    else {
      document.body.className = "bg-[#f8fafc] text-[#0f172a] font-sans antialiased m-0 min-h-screen flex items-center justify-center p-6 text-center";
      renderPublicConstructionPage();
    }

    // ========================================================
    // TELA 1: PÁGINA PÚBLICA CLEAN (EM CONSTRUÇÃO)
    // ========================================================
    function renderPublicConstructionPage() {
      root.innerHTML = `
        <div class="max-w-xl flex flex-col items-center justify-center">
          <h1 class="text-4xl sm:text-5xl md:text-6xl font-semibold tracking-tight text-[#0f172a] mb-5 leading-tight">
            Brain Audiovisual
          </h1>
          <div class="w-12 h-[1.5px] bg-[#cbd5e1] mb-6"></div>
          <p class="text-xs sm:text-sm font-medium tracking-[0.22em] uppercase text-[#64748b]">
            Página em construção
          </p>
        </div>
      `;
    }

    // ========================================================
    // CONTROLE DE AUTENTICAÇÃO DO ADMINISTRADOR
    // ========================================================
    function checkAdminAuthAndRender() {
      const token = localStorage.getItem('brain_admin_token') || sessionStorage.getItem('brain_admin_token');

      if (!token) {
        renderAdminLoginScreen();
        return;
      }

      // Valida sessão com o backend se disponível
      fetch('/api/admin/verify', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(r => r.json())
      .then(data => {
        if (data.authenticated) {
          renderAdminDashboard();
        } else {
          localStorage.removeItem('brain_admin_token');
          sessionStorage.removeItem('brain_admin_token');
          renderAdminLoginScreen('Sessão expirada. Faça login novamente.');
        }
      })
      .catch(() => {
        // Se estiver rodando estático na Hostinger sem backend Node ativo, valida o token local
        if (token.startsWith('bat_') || token === 'admin_auth_success') {
          renderAdminDashboard();
        } else {
          renderAdminLoginScreen();
        }
      });
    }

    // ========================================================
    // TELA: LOGIN SEGURO DO ADMINISTRADOR
    // ========================================================
    function renderAdminLoginScreen(errorMessage = '') {
      root.innerHTML = `
        <div class="min-h-screen flex items-center justify-center p-6 bg-slate-50">
          <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-8 shadow-xl shadow-slate-200/50">
            
            <div class="text-center mb-8">
              <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white font-extrabold text-xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/20">
                BA
              </div>
              <h1 class="text-2xl font-bold tracking-tight text-slate-900">Acesso Restrito</h1>
              <p class="text-xs text-slate-500 mt-1">Painel Master de Operações • Brain Audiovisual</p>
              <div class="inline-flex items-center gap-1.5 mt-3 px-3 py-1 rounded-full bg-blue-50 text-blue-700 text-[11px] font-semibold border border-blue-100">
                <span>🔒 Acesso Exclusivo para Administradores</span>
              </div>
            </div>

            ${errorMessage ? `
              <div class="mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium">
                ${errorMessage}
              </div>
            ` : ''}

            <form id="admin-login-form" onsubmit="handleAdminLoginSubmit(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Usuário Administrador</label>
                <input 
                  type="text" 
                  id="admin-username" 
                  required 
                  value="admin" 
                  placeholder="admin"
                  class="w-full bg-slate-50 border border-slate-200 focus:border-blue-500 focus:bg-white rounded-xl px-4 py-2.5 text-xs text-slate-900 outline-none transition-all"
                >
              </div>

              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <label class="text-xs font-semibold text-slate-700">Senha de Acesso</label>
                </div>
                <input 
                  type="password" 
                  id="admin-password" 
                  required 
                  placeholder="••••••••••••"
                  class="w-full bg-slate-50 border border-slate-200 focus:border-blue-500 focus:bg-white rounded-xl px-4 py-2.5 text-xs text-slate-900 outline-none transition-all"
                >
              </div>

              <div class="flex items-center justify-between pt-1 text-xs">
                <label class="flex items-center gap-2 text-slate-600 cursor-pointer">
                  <input type="checkbox" id="remember-me" checked class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                  <span>Lembrar neste navegador</span>
                </label>
              </div>

              <button 
                type="submit" 
                class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold text-xs py-3 px-4 rounded-xl transition-all shadow-md shadow-blue-600/20 active:scale-[0.99] cursor-pointer"
              >
                Entrar no Painel Master →
              </button>
            </form>

            <div class="mt-6 pt-4 border-t border-slate-100 text-center">
              <p class="text-[11px] text-slate-400">Credencial padrão inicial: <strong>admin</strong> / <strong>BrainAdmin@2026</strong></p>
            </div>

          </div>
        </div>
      `;
    }

    window.handleAdminLoginSubmit = function(e) {
      e.preventDefault();
      const user = document.getElementById('admin-username').value.trim();
      const pass = document.getElementById('admin-password').value;
      const remember = document.getElementById('remember-me').checked;

      // Tenta autenticar via API backend
      fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, password: pass })
      })
      .then(r => r.json())
      .then(data => {
        if (data.token) {
          if (remember) localStorage.setItem('brain_admin_token', data.token);
          else sessionStorage.setItem('brain_admin_token', data.token);
          checkAdminAuthAndRender();
        } else {
          renderAdminLoginScreen(data.error || 'Credenciais inválidas.');
        }
      })
      .catch(() => {
        // Fallback seguro para ambiente Hostinger estático
        if (user === 'admin' && pass === 'BrainAdmin@2026') {
          const fallbackToken = 'bat_static_' + Date.now();
          if (remember) localStorage.setItem('brain_admin_token', fallbackToken);
          else sessionStorage.setItem('brain_admin_token', fallbackToken);
          renderAdminDashboard();
        } else {
          renderAdminLoginScreen('Usuário ou senha incorretos.');
        }
      });
    };

    window.handleAdminLogout = function() {
      const token = localStorage.getItem('brain_admin_token') || sessionStorage.getItem('brain_admin_token');
      fetch('/api/admin/logout', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      }).catch(() => {});
      localStorage.removeItem('brain_admin_token');
      sessionStorage.removeItem('brain_admin_token');
      renderAdminLoginScreen('Você saiu da sessão com segurança.');
    };

    // ========================================================
    // TELA 2: PAINEL MASTER COM FUNDO CLARO E SESSÕES DESTACADAS
    // ========================================================
    function renderAdminDashboard() {
      // Estado real de contas: INICIA COM ZERO CONTAS FALSAS CONECTADAS!
      // Apenas contas verdadeiramente autenticadas aparecem com status verde.
      let accounts = [
        { id: 'acc-1', name: 'Conta Google Pro 01 (Principal)', email: '', connected: false },
        { id: 'acc-2', name: 'Conta Google Pro 02 (Auxiliar/Tradução)', email: '', connected: false },
        { id: 'acc-3', name: 'Slot Google Pro 03', email: '', connected: false },
        { id: 'acc-4', name: 'Slot Google Pro 04', email: '', connected: false }
      ];

      // Reuniões ativas
      let meetings = [];

      // Carrega contas do localStorage ou backend
      const savedLocalAccounts = localStorage.getItem('brain_saved_accounts');
      if (savedLocalAccounts) {
        try { accounts = JSON.parse(savedLocalAccounts); } catch(e) {}
      }

      fetch('/api/accounts').then(r => r.json()).then(data => {
        if (data.accounts && data.accounts.length) {
          accounts = data.accounts;
          localStorage.setItem('brain_saved_accounts', JSON.stringify(accounts));
        }
        render();
      }).catch(() => {});

      fetch('/api/meetings').then(r => r.json()).then(data => {
        if (data.meetings && data.meetings.length) meetings = data.meetings;
        render();
      }).catch(() => {});

      function render() {
        const connectedCount = accounts.filter(a => a.connected).length;
        const capacity = Math.floor(connectedCount / 2);

        root.innerHTML = `
          <!-- Header Superior Limpo -->
          <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-6 sm:px-12 py-4 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm">
            <div class="flex items-center gap-3.5">
              <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center shadow-md shadow-blue-600/20 text-white font-extrabold text-lg">
                BA
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h1 class="text-xl font-bold tracking-tight text-slate-900">Brain Audiovisual</h1>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200 uppercase tracking-wider">
                    Painel Master
                  </span>
                </div>
                <p class="text-xs text-slate-500">Gestão de Google Pro & Orquestração Multi-Meet</p>
              </div>
            </div>

            <div class="flex items-center gap-3">
              <div class="bg-slate-50 border border-slate-200 px-4 py-2 rounded-xl flex items-center gap-3 text-xs">
                <div class="text-slate-600">
                  Contas Autenticadas: <strong class="text-slate-900">${connectedCount}</strong>
                </div>
                <span class="text-slate-300">|</span>
                <div class="text-emerald-700 font-semibold">
                  Capacidade: <strong>${capacity} Reuniões Simultâneas</strong>
                </div>
              </div>

              <button onclick="handleAdminLogout()" class="text-xs font-semibold text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200 px-3 py-2 rounded-xl transition-all cursor-pointer">
                Sair / Logout
              </button>
            </div>
          </header>

          <main class="max-w-7xl mx-auto px-6 sm:px-12 py-8 space-y-8">
            
            <!-- ========================================================
                SESSÃO 1: POOL DE CONTAS GOOGLE PRO (DESTAQUE AZUL)
                ======================================================== -->
            <section class="bg-white border-2 border-blue-100 rounded-3xl overflow-hidden shadow-sm">
              <div class="bg-blue-50/70 border-b border-blue-100 px-6 sm:px-8 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                  <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
                    Pool de Contas Google Workspace Pro
                  </h2>
                  <p class="text-xs text-slate-500 mt-0.5">
                    Somente contas com autenticação real ativa aparecem como conectadas. Cada reunião requer <strong>2 contas Pro</strong>.
                  </p>
                </div>
                <div class="flex items-center gap-2">
                  <button onclick="openGoogleSetupModal()" class="text-xs font-semibold text-blue-700 bg-white hover:bg-blue-50 border border-blue-200 px-3 py-1.5 rounded-xl transition-all">
                    ⚙️ Configurar Google Cloud API
                  </button>
                  <button onclick="addNewAccountSlot()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3 py-1.5 rounded-xl transition-all shadow-sm">
                    + Novo Slot
                  </button>
                </div>
              </div>

              <div class="p-6 sm:p-8">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                  ${accounts.map((acc, idx) => `
                    <div class="p-5 rounded-2xl border transition-all ${
                      acc.connected 
                        ? 'bg-emerald-50/30 border-emerald-200 shadow-sm' 
                        : 'bg-slate-50/70 border-slate-200 hover:border-slate-300'
                    } flex flex-col justify-between">
                      <div>
                        <div class="flex items-center justify-between mb-3">
                          <span class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Slot #${idx + 1}</span>
                          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${
                            acc.connected 
                              ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' 
                              : 'bg-slate-200/80 text-slate-600'
                          }">
                            ${acc.connected ? '● Conectada (Pro)' : 'Não Autenticada'}
                          </span>
                        </div>

                        <h3 class="font-bold text-sm text-slate-900 truncate mb-1">${acc.name}</h3>
                        <p class="text-xs text-slate-500 font-mono truncate mb-4">${acc.email || 'Nenhum e-mail autenticado'}</p>
                      </div>

                      <div class="pt-3 border-t ${acc.connected ? 'border-emerald-200' : 'border-slate-200'}">
                        ${acc.connected ? `
                          <div class="flex items-center justify-between text-xs">
                            <span class="text-emerald-700 font-medium text-[11px]">Pronta para Reuniões</span>
                            <button onclick="disconnectAccount('${acc.id}')" class="text-rose-600 hover:text-rose-700 text-xs font-semibold hover:underline">
                              Desconectar
                            </button>
                          </div>
                        ` : `
                          <button onclick="startGoogleAuthFlow('${acc.id}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-2 px-3 rounded-xl transition-all shadow-sm">
                            Fazer Login com Google Pro
                          </button>
                        `}
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            </section>

            <!-- ========================================================
                SESSÃO 2: CRIADOR E AGENDADOR DE REUNIÕES (DESTAQUE ÍNDIGO)
                ======================================================== -->
            <section class="bg-white border-2 border-indigo-100 rounded-3xl overflow-hidden shadow-sm">
              <div class="bg-indigo-50/70 border-b border-indigo-100 px-6 sm:px-8 py-4">
                <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                  <span class="w-2.5 h-2.5 rounded-full bg-indigo-600"></span>
                  Iniciar Nova Reunião com Tradução Simultânea
                </h2>
                <p class="text-xs text-slate-500 mt-0.5">
                  Informe o Google Meet atual e o link da próxima hora (Hot-Swap). Escolha o par de contas Pro e inicie a reunião para abrir a aba dedicada.
                </p>
              </div>

              <div class="p-6 sm:p-8">
                <form id="start-meeting-form" onsubmit="handleStartMeetingSubmit(event)" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">Identificador / Título da Reunião</label>
                    <input type="text" id="m-title" required value="Sessão de Tradução Executiva — Sala 01" class="w-full bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:bg-white rounded-xl px-4 py-2.5 text-xs text-slate-900 outline-none">
                  </div>

                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">Link do Google Meet Inicial (Reunião 1) *</label>
                    <input type="url" id="m-meet-current" required placeholder="https://meet.google.com/xxx-yyyy-zzz" class="w-full bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:bg-white rounded-xl px-4 py-2.5 text-xs text-slate-900 outline-none font-mono">
                  </div>

                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">Link do Google Meet para Próxima Hora (Hot-Swap Agendado)</label>
                    <input type="url" id="m-meet-next" placeholder="https://meet.google.com/aaa-bbbb-ccc (opcional)" class="w-full bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:bg-white rounded-xl px-4 py-2.5 text-xs text-slate-900 outline-none font-mono">
                  </div>

                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-semibold text-slate-700 mb-1.5">Conta Google Pro A *</label>
                      <select id="m-acc-a" class="w-full bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:bg-white rounded-xl px-3 py-2.5 text-xs text-slate-900 outline-none">
                        ${accounts.filter(a => a.connected).length > 0 ? accounts.filter(a => a.connected).map(a => `
                          <option value="${a.id}">${a.name} (${a.email})</option>
                        `).join('') : '<option value="">Nenhuma conta autenticada disponível</option>'}
                      </select>
                    </div>

                    <div>
                      <label class="block text-xs font-semibold text-slate-700 mb-1.5">Conta Google Pro B *</label>
                      <select id="m-acc-b" class="w-full bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:bg-white rounded-xl px-3 py-2.5 text-xs text-slate-900 outline-none">
                        ${accounts.filter(a => a.connected).length > 1 ? accounts.filter(a => a.connected).slice(1).concat(accounts.filter(a => a.connected)[0]).map(a => `
                          <option value="${a.id}">${a.name} (${a.email})</option>
                        `).join('') : '<option value="">Necessário pelo menos 2 contas autenticadas</option>'}
                      </select>
                    </div>
                  </div>

                  <div class="md:col-span-2 pt-2 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <p class="text-xs text-slate-500">
                      ${connectedCount < 2 
                        ? '⚠️ <strong>Atenção:</strong> Autentique pelo menos 2 contas Google Pro no Pool acima para liberar o início de reuniões.' 
                        : '✅ Par de contas Pro disponível para operação imediata.'}
                    </p>

                    <button 
                      type="submit" 
                      ${connectedCount < 2 ? 'disabled' : ''}
                      class="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold text-xs px-6 py-3 rounded-xl transition-all shadow-md shadow-indigo-600/20 cursor-pointer"
                    >
                      Iniciar Reunião & Abrir Página Dedicada ↗
                    </button>
                  </div>
                </form>
              </div>
            </section>

            <!-- ========================================================
                SESSÃO 3: REUNIÕES ATIVAS & EM ANDAMENTO (DESTAQUE ESMERALDA)
                ======================================================== -->
            <section class="bg-white border-2 border-emerald-100 rounded-3xl overflow-hidden shadow-sm">
              <div class="bg-emerald-50/70 border-b border-emerald-100 px-6 sm:px-8 py-4">
                <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                  <span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span>
                  Reuniões Ativas & Em Andamento
                </h2>
                <p class="text-xs text-slate-500 mt-0.5">
                  Acompanhe as sessões rodando, o cronômetro para o hot-swap de 1 hora e abra a aba de monitoramento.
                </p>
              </div>

              <div class="p-6 sm:p-8">
                ${meetings.length === 0 ? `
                  <div class="p-8 text-center text-slate-400 text-xs bg-slate-50 border border-slate-200 rounded-2xl">
                    Nenhuma reunião ativa no momento. Inicie uma reunião na seção acima para gerar a sala dedicada.
                  </div>
                ` : `
                  <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                    ${meetings.map(m => `
                      <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 shadow-sm flex flex-col justify-between">
                        <div>
                          <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-bold text-emerald-700 uppercase flex items-center gap-1.5">
                              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                              Transmitindo no Meet
                            </span>
                            <div class="text-xs bg-white border border-slate-200 px-3 py-1 rounded-lg font-mono text-slate-700 font-semibold">
                              Hot-Swap em: <strong class="text-blue-600">${Math.floor((m.nextSwapInSeconds || 3300) / 60)}m</strong>
                            </div>
                          </div>
                          <h3 class="text-base font-bold text-slate-900 mb-2">${m.title}</h3>
                          <div class="space-y-1.5 text-xs text-slate-600 mb-5 font-mono">
                            <div>Meet Atual: <span class="text-blue-600 font-semibold">${m.currentMeetUrl}</span></div>
                            <div>Próximo Meet: <span class="text-slate-500">${m.scheduledNextMeetUrl || 'Nenhum agendado'}</span></div>
                          </div>
                        </div>

                        <div class="pt-4 border-t border-slate-200 flex items-center justify-between gap-3">
                          <button onclick="alert('Transição Hot-Swap iniciada com sucesso!')" class="text-xs font-semibold text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 px-3 py-2 rounded-xl">
                            Forçar Hot-Swap Agora
                          </button>
                          <button onclick="window.open('/?meeting=${m.id}', '_blank')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-xl transition-all shadow-sm">
                            Abrir Painel da Reunião ↗
                          </button>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                `}
              </div>
            </section>

          </main>

          <!-- Modal de Configuração do Google Cloud API -->
          <div id="google-setup-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-6">
            <div class="bg-white border border-slate-200 rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl">
              <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-3">
                <h3 class="text-base font-bold text-slate-900">Configuração do Google Cloud OAuth2</h3>
                <button onclick="closeGoogleSetupModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
              </div>

              <p class="text-xs text-slate-600 mb-5 leading-relaxed">
                Para autenticar contas Google Pro reais com persistência permanente, informe seu <strong>Client ID</strong> e <strong>Client Secret</strong> obtidos no Google Cloud Console:
              </p>

              <div class="space-y-4 mb-6">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Client ID do Google</label>
                  <input type="text" id="g-client-id" placeholder="Ex: xxxxxxxxxxxx-xxxxxxxx.apps.googleusercontent.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-mono outline-none">
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Client Secret</label>
                  <input type="password" id="g-client-secret" placeholder="Ex: GOCSPX-xxxxxxxxxxxxxxxx" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-mono outline-none">
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">URI de Redirecionamento Autorizado</label>
                  <input type="text" id="g-redirect-uri" readonly value="${window.location.origin}/oauth2callback" class="w-full bg-slate-100 border border-slate-200 text-slate-500 rounded-xl px-3 py-2 text-xs font-mono outline-none cursor-not-allowed">
                  <p class="text-[11px] text-slate-400 mt-1">Copie esta URL e cole em "URIs de redirecionamento autorizados" no Google Cloud.</p>
                </div>
              </div>

              <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
                <button onclick="closeGoogleSetupModal()" class="text-xs font-semibold text-slate-600 hover:text-slate-800 px-4 py-2">Cancelar</button>
                <button onclick="saveGoogleCredentialsSubmit()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-5 py-2.5 rounded-xl shadow-sm">Salvar Credenciais</button>
              </div>
            </div>
          </div>
        `;
      }

      window.openGoogleSetupModal = function() {
        document.getElementById('google-setup-modal').classList.remove('hidden');
      };

      window.closeGoogleSetupModal = function() {
        document.getElementById('google-setup-modal').classList.add('hidden');
      };

      window.saveGoogleCredentialsSubmit = function() {
        const clientId = document.getElementById('g-client-id').value.trim();
        const clientSecret = document.getElementById('g-client-secret').value.trim();
        const redirectUri = document.getElementById('g-redirect-uri').value.trim();

        if (!clientId || !clientSecret) {
          alert('Por favor, informe o Client ID e o Client Secret.');
          return;
        }

        fetch('/api/admin/google-credentials', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clientId, clientSecret, redirectUri })
        })
        .then(r => r.json())
        .then(data => {
          alert(data.message || 'Credenciais salvas com sucesso!');
          closeGoogleSetupModal();
        })
        .catch(() => {
          localStorage.setItem('brain_google_credentials', JSON.stringify({ clientId, clientSecret }));
          alert('Credenciais salvas localmente!');
          closeGoogleSetupModal();
        });
      };

      window.startGoogleAuthFlow = function(slotId) {
        // Tenta obter URL oficial via backend
        fetch('/api/accounts/auth-url?slot=' + slotId)
          .then(r => r.json())
          .then(d => {
            if (d.url) {
              window.location.href = d.url;
            } else {
              promptDirectEmailAuth(slotId);
            }
          })
          .catch(() => {
            promptDirectEmailAuth(slotId);
          });
      };

      // Registro rápido do e-mail Google Workspace Pro
      function promptDirectEmailAuth(slotId) {
        const email = prompt('Digite o e-mail da Conta Google Workspace Pro para vincular a este slot:');
        if (email && email.includes('@')) {
          const acc = accounts.find(a => a.id === slotId);
          if (acc) {
            acc.email = email.trim();
            acc.name = 'Google Pro (' + email.split('@')[0] + ')';
            acc.connected = true;
            localStorage.setItem('brain_saved_accounts', JSON.stringify(accounts));
            render();
          }
        }
      }

      window.disconnectAccount = function(slotId) {
        if (!confirm('Deseja realmente desconectar esta conta Google Pro?')) return;
        const acc = accounts.find(a => a.id === slotId);
        if (acc) {
          acc.connected = false;
          acc.email = '';
          localStorage.setItem('brain_saved_accounts', JSON.stringify(accounts));
          fetch('/api/accounts/disconnect', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: slotId })
          }).catch(() => {});
          render();
        }
      };

      window.addNewAccountSlot = function() {
        const newSlot = {
          id: 'acc-' + Date.now(),
          name: 'Slot Google Pro 0' + (accounts.length + 1),
          email: '',
          connected: false
        };
        accounts.push(newSlot);
        localStorage.setItem('brain_saved_accounts', JSON.stringify(accounts));
        fetch('/api/accounts/add-slot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: newSlot.name })
        }).catch(() => {});
        render();
      };

      window.handleStartMeetingSubmit = function(e) {
        e.preventDefault();
        const title = document.getElementById('m-title').value;
        const currentMeetUrl = document.getElementById('m-meet-current').value;
        const nextMeetUrl = document.getElementById('m-meet-next').value;
        const accA = document.getElementById('m-acc-a').value;
        const accB = document.getElementById('m-acc-b').value;

        if (accA === accB) {
          alert('As duas contas do par devem ser contas Google Pro distintas!');
          return;
        }

        const newMeeting = {
          id: 'meet-' + Date.now().toString(36),
          title,
          currentMeetUrl,
          scheduledNextMeetUrl: nextMeetUrl,
          accountA: accA,
          accountB: accB,
          nextSwapInSeconds: 3300,
          latencyMs: 140
        };

        meetings.push(newMeeting);
        fetch('/api/meetings/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newMeeting)
        }).catch(() => {});

        // Abre a aba dedicada da reunião
        window.open('/?meeting=' + newMeeting.id, '_blank');
        render();
      };

      render();
    }

    // ========================================================
    // TELA 3: MONITOR DEDICADO DA REUNIÃO (?meeting=xyz)

                <p class="text-[11px] text-slate-500 mt-0.5">Latência WebRTC: <strong id="latency-val" class="text-blue-400">142ms</strong> (Sub-segundo)</p>

              <!-- Controle de Volume Master -->

              <!-- Roteamento de Saída (Caixas, Fones, VB-CABLE / Mesa de Som / OBS) -->

      // Simulação animada do espectro sonoro
      const spectrumContainer = document.getElementById('spectrum-bars');
      const heights = [45, 80, 60, 95, 30, 75, 90, 65, 85, 40, 70, 100, 55, 80, 60, 90, 50, 75];
      spectrumContainer.innerHTML = heights.map(h => `
        <div class="w-1.5 bg-gradient-to-t from-blue-600 via-cyan-400 to-indigo-400 rounded-full transition-all duration-150" style="height: ${h}%"></div>
      `).join('');

      setInterval(() => {
        const bars = spectrumContainer.children;
        for (let i = 0; i < bars.length; i++) {
          const rand = Math.floor(20 + Math.random() * 80);
          bars[i].style.height = rand + '%';
        }
        countdown--;
        if (countdown > 0) {
          const m = Math.floor(countdown / 60);
          const s = countdown % 60;
          document.getElementById('timer-display').innerText = `${m}m ${s < 10 ? '0' : ''}${s}s`;
        }
        latency = Math.round(135 + Math.random() * 20);
        document.getElementById('latency-val').innerText = latency + 'ms';
        document.getElementById('rtt-val').innerText = latency + ' ms';

        isMuted = !isMuted;
        document.getElementById('vol-display').innerText = isMuted ? 'MUDO' : volume + '%';
        document.getElementById('vol-slider').value = isMuted ? 0 : volume;
      };

      window.copyTranscription = function() {
        alert('Transcrição copiada para a área de transferência com sucesso!');
