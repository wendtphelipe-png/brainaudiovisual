<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Audiovisual</title>
  <link rel="icon" type="image/svg+xml" href="frontend/public/favicon.svg">
  <!-- Tailwind CSS & Lucide Icons via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.25); }
    }
    .animate-pulse-live {
      animation: pulseLive 2s infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased m-0 min-h-screen">

  <div id="app-root"></div>

  <script>
    // ========================================================
    // HELPERS GLOBAIS DE ESTADO E PERSISTÊNCIA SEGURA
    // ========================================================
    function getStoredAccounts() {
      try {
        const raw = localStorage.getItem('brain_saved_accounts');
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr) && arr.length > 0) return arr;
        }
      } catch (e) {}
      return [
        { id: 'acc-1', name: 'Conta Google Pro 01 (Principal)', email: '', connected: false },
        { id: 'acc-2', name: 'Conta Google Pro 02 (Auxiliar/Tradução)', email: '', connected: false },
        { id: 'acc-3', name: 'Slot Google Pro 03', email: '', connected: false },
        { id: 'acc-4', name: 'Slot Google Pro 04', email: '', connected: false }
      ];
    }

    function getStoredMeetings() {
      try {
        const raw = localStorage.getItem('brain_saved_meetings');
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) return arr;
        }
      } catch (e) {}
      return [];
    }

    function getStoredAudioLanguageSettings() {
      try {
        const raw = localStorage.getItem('brain_audio_lang_settings');
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return {
        sourceLanguage: 'en-US',
        sourceLanguageLabel: 'Inglês (Estados Unidos / Global)',
        targetLanguage: 'pt-BR',
        targetLanguageLabel: 'Português (Brasil)',
        transmitterInputDevice: 'event-line',
        transmitterInputLabel: 'Áudio do Evento (Mesa de Som / Linha)',
        transmitterSpeakerMuted: true,
        receiverInputMuted: true,
        receiverOutputDevice: 'cable',
        receiverOutputLabel: 'CABLE Output / VB-Audio Virtual Cable (Mesa de Som)',
        cameraDisabled: true
      };
    }

    function saveStoredAudioLanguageSettings(settings) {
      try {
        localStorage.setItem('brain_audio_lang_settings', JSON.stringify(settings));
      } catch (e) {}
    }

    // ========================================================
    // ROTEAMENTO DINÂMICO
    // ========================================================
    const params = new URLSearchParams(window.location.search);
    const isOAuthCallback = params.get('oauth2callback') === 'true' || window.location.pathname.startsWith('/oauth2callback');
    const isAdmin = params.get('admin') === 'true' || window.location.pathname.startsWith('/admin');
    const meetingId = params.get('meeting') || (window.location.pathname.startsWith('/meeting/') ? window.location.pathname.split('/')[2] : null);

    const root = document.getElementById('app-root');

    // 0. ROTA: CALLBACK DE AUTENTICAÇÃO DO GOOGLE EM POPUP (/oauth2callback ou ?oauth2callback=true)
    if (isOAuthCallback) {
      renderOAuthCallbackPopup();
    }
    // 1. ROTA: MONITOR DEDICADO DA REUNIÃO (?meeting=xyz ou /meeting/xyz)
    else if (meetingId) {
      document.body.className = "bg-slate-950 text-slate-100 font-sans antialiased m-0 min-h-screen selection:bg-blue-500/30 selection:text-blue-200";
      try {
        renderMeetingRoomMonitor(meetingId);
      } catch(err) {
        console.error("Erro crítico ao inicializar Cockpit da Reunião:", err);
        root.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-6">
            <div class="max-w-md w-full bg-slate-900 border border-rose-500/40 rounded-3xl p-8 text-center shadow-2xl">
              <div class="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-xl font-bold mx-auto mb-4">⚠️</div>
              <h2 class="text-base font-bold text-white mb-2">Erro ao Iniciar Cockpit</h2>
              <p class="text-xs text-slate-400 mb-6 font-mono">${err.message || String(err)}</p>
              <div class="flex items-center justify-center gap-3">
                <button onclick="window.location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2.5 rounded-xl font-semibold transition-all">Recarregar</button>
                <a href="/admin" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-4 py-2.5 rounded-xl font-semibold transition-all">Voltar ao Admin</a>
              </div>
            </div>
          </div>
        `;
      }
    } 
    // 2. ROTA: ÁREA ADMINISTRATIVA (/admin ou ?admin=true)
    else if (isAdmin) {
      document.body.className = "bg-slate-50 text-slate-900 font-sans antialiased m-0 min-h-screen";
      checkAdminAuthAndRender();
    } 
    // 3. ROTA PADRÃO PÚBLICA: PÁGINA EM CONSTRUÇÃO CLEAN E CLARA (/)
    else {
      document.body.className = "bg-[#f8fafc] text-[#0f172a] font-sans antialiased m-0 min-h-screen flex items-center justify-center p-6 text-center";
      renderPublicConstructionPage();
    }

    // ========================================================
    // TELA 0: CALLBACK DA JANELA POPUP DO GOOGLE OAUTH
    // ========================================================
    function renderOAuthCallbackPopup() {
      document.body.className = "bg-slate-900 text-white font-sans antialiased m-0 flex items-center justify-center min-h-screen p-6 text-center";
      
      const searchParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash);
      
      const error = searchParams.get('error') || hashParams.get('error');
      const code = searchParams.get('code');
      const accessToken = hashParams.get('access_token');
      const slotId = searchParams.get('state') || hashParams.get('state') || 'acc-1';

      root.innerHTML = `
        <div class="max-w-md w-full bg-slate-950 border border-slate-800 rounded-3xl p-8 shadow-2xl">
          <div id="cb-box">
            <div class="w-12 h-12 rounded-full border-4 border-blue-500 border-t-transparent animate-spin mx-auto mb-4"></div>
            <h2 class="text-base font-bold text-white mb-2">Processando Conexão com o Google...</h2>
            <p class="text-xs text-slate-400">Verificando a autenticação da sua conta Google Workspace Pro.</p>
          </div>
        </div>
      `;

      if (error) {
        document.getElementById('cb-box').innerHTML = `
          <div class="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-xl font-bold mx-auto mb-4">✕</div>
          <h2 class="text-base font-bold text-rose-400 mb-2">Autorização Não Concluída</h2>
          <p class="text-xs text-slate-400 mb-5">${error === 'access_denied' ? 'O acesso foi recusado na janela do Google.' : error}</p>
          <button onclick="window.close()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-5 py-2.5 rounded-xl font-semibold">Fechar Janela</button>
        `;
        if (window.opener) {
          try {
            window.opener.postMessage({ type: 'GOOGLE_AUTH_ERROR', error, slotId }, '*');
          } catch (e) {}
        }
        return;
      }

      if (accessToken) {
        // Valida imediatamente com a API oficial do Google
        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: { 'Authorization': 'Bearer ' + accessToken }
        })
        .then(r => r.json())
        .then(userInfo => {
          document.getElementById('cb-box').innerHTML = `
            <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl font-bold mx-auto mb-4">✓</div>
            <h2 class="text-base font-bold text-emerald-400 mb-1">Conta Google Pro Conectada!</h2>
            <p class="text-xs text-slate-300 font-semibold mb-1">${userInfo.name || 'Conta Google'}</p>
            <p class="text-xs text-blue-400 font-mono mb-4">${userInfo.email}</p>
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-[11px] font-medium border border-emerald-500/20 mb-3">
              <span>● Token Pro Verificado com Sucesso</span>
            </div>
            <p class="text-[11px] text-slate-500">Retornando ao painel em instantes...</p>
          `;

          if (window.opener) {
            try {
              window.opener.postMessage({
                type: 'GOOGLE_AUTH_SUCCESS',
                slotId: slotId,
                email: userInfo.email,
                name: userInfo.name,
                picture: userInfo.picture,
                tokens: { access_token: accessToken }
              }, '*');
            } catch (e) {}
          }
          setTimeout(() => { window.close(); }, 1400);
        })
        .catch(err => {
          document.getElementById('cb-box').innerHTML = `
            <div class="text-rose-400 text-xs">Erro na validação do token: ${err.message}</div>
          `;
        });
      } else if (code) {
        // Envia o código para o opener
        if (window.opener) {
          try {
            window.opener.postMessage({
              type: 'GOOGLE_AUTH_CODE',
              slotId: slotId,
              code: code
            }, '*');
          } catch (e) {}
        }
        document.getElementById('cb-box').innerHTML = `
          <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl font-bold mx-auto mb-4">✓</div>
          <h2 class="text-base font-bold text-emerald-400 mb-2">Código de Autorização Recebido!</h2>
          <p class="text-xs text-slate-400 mb-4">Concluindo validação no painel...</p>
        `;
        setTimeout(() => { window.close(); }, 1200);
      }
    }

    // ========================================================
    // TELA 1: PÁGINA PÚBLICA CLEAN (EM CONSTRUÇÃO)
    // ========================================================
    function renderPublicConstructionPage() {
      root.innerHTML = `
        <div class="max-w-xl flex flex-col items-center justify-center">
          <h1 class="text-4xl sm:text-5xl md:text-6xl font-semibold tracking-tight text-[#0f172a] mb-5 leading-tight">
            Brain Audiovisual
          </h1>
          <div class="w-12 h-[1.5px] bg-[#cbd5e1] mb-6"></div>
          <p class="text-xs sm:text-sm font-medium tracking-[0.22em] uppercase text-[#64748b]">
            Página em construção
          </p>
        </div>
      `;
    }

    // ========================================================
    // CONTROLE DE AUTENTICAÇÃO DO ADMINISTRADOR
    // ========================================================
    function checkAdminAuthAndRender() {
      // Suporte a acesso direto via URL (?auto=1 ou ?token=master)
      if (params.get('auto') === '1' || params.get('token') === 'master') {
        localStorage.setItem('brain_admin_token', 'bat_static_master');
        renderAdminDashboard();
        return;
      }

      const token = localStorage.getItem('brain_admin_token') || sessionStorage.getItem('brain_admin_token');

      if (!token) {
        renderAdminLoginScreen();
        return;
      }

      // Se tiver token estático válido, renderiza direto o dashboard sem depender de requisição de rede
      if (token.startsWith('bat_') || token === 'admin_auth_success') {
        renderAdminDashboard();
        return;
      }

      // Valida sessão com o backend se disponível
      fetch('/api/admin/verify', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(r => {
        if (!r.ok) throw new Error('API indisponível');
        return r.json();
      })
      .then(data => {
        if (data.authenticated) {
          renderAdminDashboard();
        } else {
          localStorage.removeItem('brain_admin_token');
          sessionStorage.removeItem('brain_admin_token');
          renderAdminLoginScreen('Sessão expirada. Faça login novamente.');
        }
      })
      .catch(() => {
        renderAdminLoginScreen();
      });
    }

    // ========================================================
    // TELA: LOGIN SEGURO DO ADMINISTRADOR
    // ========================================================
    function renderAdminLoginScreen(errorMessage = '') {
      root.innerHTML = `
        <div class="min-h-screen flex items-center justify-center p-6 bg-slate-50">
          <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-8 shadow-xl shadow-slate-200/50">
            
            <div class="text-center mb-8">
              <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white font-extrabold text-xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/20">
                BA
              </div>
              <h1 class="text-2xl font-bold tracking-tight text-slate-900">Acesso Restrito</h1>
              <p class="text-xs text-slate-500 mt-1">Painel Master de Operações • Brain Audiovisual</p>
              <div class="inline-flex items-center gap-1.5 mt-3 px-3 py-1 rounded-full bg-blue-50 text-blue-700 text-[11px] font-semibold border border-blue-100">
                <span>🔒 Acesso Exclusivo para Administradores</span>
              </div>
            </div>

            ${errorMessage ? `
              <div class="mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium">
                ${errorMessage}
              </div>
            ` : ''}

            <form id="admin-login-form" onsubmit="handleAdminLoginSubmit(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Usuário Administrador</label>
                <input 
                  type="text" 
                  id="admin-username" 
                  required 
                  value="admin" 
                  placeholder="admin"
                  class="w-full bg-slate-50 border border-slate-200 focus:border-blue-500 focus:bg-white rounded-xl px-4 py-2.5 text-xs text-slate-900 outline-none transition-all"
                >
              </div>

              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <label class="text-xs font-semibold text-slate-700">Senha de Acesso</label>
                </div>
                <input 
                  type="password" 
                  id="admin-password" 
                  required 
                  value="BrainAdmin@2026"
                  placeholder="••••••••••••"
                  class="w-full bg-slate-50 border border-slate-200 focus:border-blue-500 focus:bg-white rounded-xl px-4 py-2.5 text-xs text-slate-900 outline-none transition-all"
                >
              </div>

              <div class="flex items-center justify-between pt-1 text-xs">
                <label class="flex items-center gap-2 text-slate-600 cursor-pointer">
                  <input type="checkbox" id="remember-me" checked class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                  <span>Lembrar neste navegador</span>
                </label>
              </div>

              <button 
                type="submit" 
                class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold text-xs py-3 px-4 rounded-xl transition-all shadow-md shadow-blue-600/20 active:scale-[0.99] cursor-pointer"
              >
                Entrar no Painel Master →
              </button>

              <button 
                type="button" 
                onclick="localStorage.setItem('brain_admin_token', 'bat_static_quick'); renderAdminDashboard();" 
                class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs py-2.5 px-4 rounded-xl transition-all cursor-pointer border border-slate-200 text-center"
              >
                Acesso Rápido ao Dashboard (1 Clique)
              </button>
            </form>

            <div class="mt-6 pt-4 border-t border-slate-100 text-center">
              <p class="text-[11px] text-slate-400">Credencial padrão: <strong>admin</strong> / <strong>BrainAdmin@2026</strong></p>
            </div>

          </div>
        </div>
      `;
    }

    window.handleAdminLoginSubmit = function(e) {
      e.preventDefault();
      const user = document.getElementById('admin-username').value.trim();
      const pass = document.getElementById('admin-password').value;
      const remember = document.getElementById('remember-me').checked;

      // Autenticação instantânea para credencial master padrão
      if (user === 'admin' && pass === 'BrainAdmin@2026') {
        const token = 'bat_static_' + Date.now();
        if (remember) localStorage.setItem('brain_admin_token', token);
        else sessionStorage.setItem('brain_admin_token', token);
        renderAdminDashboard();
        return;
      }

      // Tenta autenticar via API backend caso seja outro usuário/senha
      fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, password: pass })
      })
      .then(r => {
        if (!r.ok) throw new Error('API indisponível');
        return r.json();
      })
      .then(data => {
        if (data.token) {
          if (remember) localStorage.setItem('brain_admin_token', data.token);
          else sessionStorage.setItem('brain_admin_token', data.token);
          checkAdminAuthAndRender();
        } else {
          renderAdminLoginScreen(data.error || 'Credenciais inválidas.');
        }
      })
      .catch(() => {
        renderAdminLoginScreen('Usuário ou senha incorretos.');
      });
    };

    window.handleAdminLogout = function() {
      const token = localStorage.getItem('brain_admin_token') || sessionStorage.getItem('brain_admin_token');
      fetch('/api/admin/logout', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      }).catch(() => {});
      localStorage.removeItem('brain_admin_token');
      sessionStorage.removeItem('brain_admin_token');
      renderAdminLoginScreen('Você saiu da sessão com segurança.');
    };

    // ========================================================
    // TELA 2: PAINEL MASTER COM FUNDO CLARO E SESSÕES DESTACADAS
    // ========================================================
    function renderAdminDashboard() {
      // Estado real de contas: INICIA COM ZERO CONTAS FALSAS CONECTADAS!
      // Apenas contas verdadeiramente autenticadas aparecem com status verde.
      let accounts = [
        { id: 'acc-1', name: 'Conta Google Pro 01 (Principal)', email: '', connected: false },
        { id: 'acc-2', name: 'Conta Google Pro 02 (Auxiliar/Tradução)', email: '', connected: false },
        { id: 'acc-3', name: 'Slot Google Pro 03', email: '', connected: false },
        { id: 'acc-4', name: 'Slot Google Pro 04', email: '', connected: false }
      ];

      // Reuniões ativas (carregadas do localStorage e backend)
      let meetings = [];
      const savedMeetings = localStorage.getItem('brain_saved_meetings');
      if (savedMeetings) {
        try { meetings = JSON.parse(savedMeetings); } catch(e) {}
      }

      // Fila de slots de links de reuniões no formulário de início
      if (!window.formMeetingSlots || !Array.isArray(window.formMeetingSlots)) {
        window.formMeetingSlots = ['', ''];
      }

      window.addFormMeetingSlot = function() {
        syncFormMeetingInputs();
        window.formMeetingSlots.push('');
        render();
      };

      window.removeFormMeetingSlot = function(idx) {
        syncFormMeetingInputs();
        if (window.formMeetingSlots.length > 1) {
          window.formMeetingSlots.splice(idx, 1);
          render();
        }
      };

      window.updateFormMeetingSlot = function(idx, val) {
        if (window.formMeetingSlots[idx] !== undefined) {
          window.formMeetingSlots[idx] = val;
        }
      };

      function syncFormMeetingInputs() {
        const inputs = document.querySelectorAll('.dynamic-meet-input');
        if (inputs && inputs.length) {
          inputs.forEach((inp, i) => {
            if (i < window.formMeetingSlots.length) {
              window.formMeetingSlots[i] = inp.value;
            }
          });
        }
      }

      // Carrega contas do localStorage ou backend
      const savedLocalAccounts = localStorage.getItem('brain_saved_accounts');
      if (savedLocalAccounts) {
        try { accounts = JSON.parse(savedLocalAccounts); } catch(e) {}
      }

      fetch('/api/accounts').then(r => r.json()).then(data => {
        if (data.accounts && data.accounts.length) {
          accounts = data.accounts;
          localStorage.setItem('brain_saved_accounts', JSON.stringify(accounts));
        }
        render();
      }).catch(() => {});

      fetch('/api/meetings').then(r => r.json()).then(data => {
        if (data.meetings && data.meetings.length) {
          meetings = data.meetings;
          localStorage.setItem('brain_saved_meetings', JSON.stringify(meetings));
        }
        render();
      }).catch(() => {});

      function render() {
        const connectedCount = accounts.filter(a => a.connected).length;
        const capacity = Math.floor(connectedCount / 2);

        root.innerHTML = `
          <!-- Header Superior Limpo -->
          <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-6 sm:px-12 py-4 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm">
            <div class="flex items-center gap-3.5">
              <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center shadow-md shadow-blue-600/20 text-white font-extrabold text-lg">
                BA
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h1 class="text-xl font-bold tracking-tight text-slate-900">Brain Audiovisual</h1>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200 uppercase tracking-wider">
                    Painel Master
                  </span>
                </div>
                <p class="text-xs text-slate-500">Gestão de Google Pro & Orquestração Multi-Meet</p>
              </div>
            </div>

            <div class="flex items-center gap-3">
              <div class="bg-slate-50 border border-slate-200 px-4 py-2 rounded-xl flex items-center gap-3 text-xs">
                <div class="text-slate-600">
                  Contas Autenticadas: <strong class="text-slate-900">${connectedCount}</strong>
                </div>
                <span class="text-slate-300">|</span>
                <div class="text-emerald-700 font-semibold">
                  Capacidade: <strong>${capacity} Reuniões Simultâneas</strong>
                </div>
              </div>

              <button onclick="handleAdminLogout()" class="text-xs font-semibold text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200 px-3 py-2 rounded-xl transition-all cursor-pointer">
                Sair / Logout
              </button>
            </div>
          </header>

          <main class="max-w-7xl mx-auto px-6 sm:px-12 py-8 space-y-8">
            
            <!-- ========================================================
                SESSÃO 1: POOL DE CONTAS GOOGLE PRO (DESTAQUE AZUL)
                ======================================================== -->
            <section class="bg-white border-2 border-blue-100 rounded-3xl overflow-hidden shadow-sm">
              <div class="bg-blue-50/70 border-b border-blue-100 px-6 sm:px-8 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                  <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
                    Pool de Contas Google Workspace Pro
                  </h2>
                  <p class="text-xs text-slate-500 mt-0.5">
                    Somente contas com autenticação real ativa aparecem como conectadas. Cada reunião requer <strong>2 contas Pro</strong>.
                  </p>
                </div>
                <div class="flex items-center gap-2">
                  <button onclick="openGoogleAuthWizard(accounts[0]?.id || 'acc-1', 1)" class="text-xs font-semibold text-blue-700 bg-white hover:bg-blue-50 border border-blue-200 px-3 py-1.5 rounded-xl transition-all cursor-pointer">
                    ⚙️ Credenciais Google Cloud
                  </button>
                  <button onclick="addNewAccountSlot()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3 py-1.5 rounded-xl transition-all shadow-sm cursor-pointer">

      window.launchGoogleAuthPopup = function() {
        window.wizardState.errorMessage = '';
        const currentSlotId = window.wizardState.slotId || 'acc-1';
        const slotCreds = JSON.parse(localStorage.getItem('brain_google_credentials_' + currentSlotId) || '{}');
        const defaultCreds = JSON.parse(localStorage.getItem('brain_google_credentials') || '{}');
        const clientId = slotCreds.clientId || defaultCreds.clientId;

        if (!clientId) {
          window.wizardState.step = 1;
          window.wizardState.errorMessage = 'Configure o Client ID antes de abrir o login.';
          renderWizardModal();
          return;
        }

        // Tenta obter URL oficial via backend
        fetch('/api/accounts/auth-url?slot=' + currentSlotId)
          .then(r => r.json())
          .then(d => {
            const url = d.url || buildGoogleOAuthUrl(clientId, currentSlotId);
            openPopup(url);
          })
          .catch(() => {
            const url = buildGoogleOAuthUrl(clientId, currentSlotId);
            openPopup(url);
          });

        function openPopup(url) {
          const width = 560;
          const height = 680;
          const left = Math.max(0, (window.screen.width - width) / 2);
          const top = Math.max(0, (window.screen.height - height) / 2);

          window.wizardState.popupRef = window.open(
            url,
            'GoogleProLogin',
            `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes,status=yes`
          );

          if (!window.wizardState.popupRef || window.wizardState.popupRef.closed || typeof window.wizardState.popupRef.closed === 'undefined') {
            window.wizardState.errorMessage = 'O navegador bloqueou a abertura do popup. Permita popups para este site.';
            window.wizardState.popupLaunched = false;
            renderWizardModal();
            return;
          }

          window.wizardState.popupLaunched = true;
          renderWizardModal();

          if (window.wizardState.checkTimer) clearInterval(window.wizardState.checkTimer);
          window.wizardState.checkTimer = setInterval(() => {
            if (window.wizardState.popupRef && window.wizardState.popupRef.closed) {
              clearInterval(window.wizardState.checkTimer);
              if (window.wizardState.step !== 3) {
                window.wizardState.popupLaunched = false;
                window.wizardState.errorMessage = 'A janela do Google foi fechada antes de concluir o login. Se desejar, tente novamente.';
                renderWizardModal();
              }
            }
          }, 1000);
        }
      };

      function buildGoogleOAuthUrl(clientId, slotId) {
        const redirectUri = window.location.origin + '/oauth2callback';
        const scope = encodeURIComponent('openid https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile');
        const nonce = Math.random().toString(36).substring(2);
        return `https://accounts.google.com/o/oauth2/v2/auth?client_id=${encodeURIComponent(clientId.trim())}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=token%20id_token&scope=${scope}&state=${encodeURIComponent(slotId)}&prompt=select_account%20consent&nonce=${nonce}`;
      }

        if (!field || !field.value.trim()) {
          alert('Informe o token de acesso recebido do Google.');
          return;
        }
        const token = field.value.trim();
        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(r => {
          if (!r.ok) throw new Error('Token inválido ou expirado.');
          return r.json();
        })
        .then(userInfo => {
          window.wizardState.verifiedData = {
            email: userInfo.email,
            name: userInfo.name,
            picture: userInfo.picture,
            tokens: { access_token: token }
          };
          window.wizardState.step = 3;
          renderWizardModal();
        })
        .catch(err => {
          alert('Falha ao validar token com a Google API: ' + err.message);
        });

      // ========================================================
      // FUNÇÕES DO COCKPIT, GRAVAÇÃO, TRANSCRIÇÃO & FINALIZAÇÃO
      // ========================================================

      window.toggleTestLabModal = function() {
        const modal = document.getElementById('test-lab-modal');
        if (modal) modal.classList.toggle('hidden');
      };

      window.openFinishMeetingModal = function() {
        isTimerPaused = true;
        const modal = document.getElementById('finish-meeting-modal');
        const timeEl = document.getElementById('finish-total-time');
        const sentEl = document.getElementById('finish-total-sentences');
        if (timeEl) timeEl.innerText = formatDuration(sessionElapsedSeconds);
        if (sentEl) sentEl.innerText = `${transmitterTranscriptions.length} originais / ${receiverTranscriptions.length} traduzidas`;
        if (modal) modal.classList.remove('hidden');
      };

      window.closeFinishMeetingModal = function() {
        const modal = document.getElementById('finish-meeting-modal');
        if (modal) modal.classList.add('hidden');
      };

      window.confirmAndExitMeeting = function() {
        if (confirm('Tem certeza de que deseja encerrar a reunião e fechar as salas?')) {
          try {
            if (transmitterWindowRef && !transmitterWindowRef.closed) transmitterWindowRef.close();
            if (receiverWindowRef && !receiverWindowRef.closed) receiverWindowRef.close();
          } catch(e) {}
          window.location.href = '/admin';
        }
      };

      // 1. GRAVAÇÃO DO PALESTRANTE
      window.toggleTransmitterRecording = async function() {
        const btn = document.getElementById('btn-rec-transmitter');
        const pill = document.getElementById('trans-rec-status-pill');
        const timerBadge = document.getElementById('trans-rec-timer-badge');

        if (isRecordingTransmitter) {
          // Para gravação
          if (transmitterMediaRecorder && transmitterMediaRecorder.state !== 'inactive') {
            transmitterMediaRecorder.stop();
          }
          clearInterval(transmitterRecordingTimer);
          isRecordingTransmitter = false;
          if (btn) {
            btn.innerHTML = '<span>🔴 Iniciar Gravação Palestrante</span>';
            btn.className = 'text-xs font-semibold px-3.5 py-2 rounded-xl border border-rose-300 bg-white hover:bg-rose-50 text-rose-700 transition-all cursor-pointer shadow-2xs flex items-center gap-1.5';
          }
          if (pill) {
            pill.innerText = 'Áudio Salvo ✓';
            pill.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800';
          }
          if (timerBadge) timerBadge.innerText = 'Finalizado';
          appendSystemLog('⏹️ Gravação do áudio original finalizada e armazenada.');
          return;
        }

        try {
          if (!micMediaStream || !micMediaStream.active) {
            micMediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          }
          transmitterAudioChunks = [];
          transmitterMediaRecorder = new MediaRecorder(micMediaStream);
          transmitterMediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) transmitterAudioChunks.push(e.data);
          };
          transmitterMediaRecorder.onstop = () => {
            transmitterRecordedBlob = new Blob(transmitterAudioChunks, { type: 'audio/webm' });
          };
          transmitterMediaRecorder.start(1000);
          isRecordingTransmitter = true;
          transmitterRecordingSeconds = 0;

          if (pill) {
            pill.innerText = 'GRAVANDO ●';
            pill.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-800 border border-rose-300 animate-pulse';
          }

          transmitterRecordingTimer = setInterval(() => {
            transmitterRecordingSeconds++;
            const tStr = formatDuration(transmitterRecordingSeconds);
            if (btn && isRecordingTransmitter) {
              btn.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-600 animate-ping"></span><span>⏹️ Parar [REC ${tStr}]</span>`;
              btn.className = 'text-xs font-bold px-3.5 py-2 rounded-xl border border-rose-500 bg-rose-50 text-rose-800 transition-all cursor-pointer shadow-xs flex items-center gap-1.5';
            }
            if (timerBadge) timerBadge.innerText = `REC ${tStr}`;
          }, 1000);

          appendSystemLog('🔴 Gravação do canal transmissor (palestrante) iniciada!');
        } catch(err) {
          alert('Não foi possível iniciar a gravação do microfone: ' + err.message);
        }
      };

      // 2. GRAVAÇÃO DA TRADUÇÃO (RECEPTOR)
      window.toggleReceiverRecording = async function() {
        const btn = document.getElementById('btn-rec-receiver');
        const pill = document.getElementById('rec-status-pill');
        const timerBadge = document.getElementById('rec-receiver-timer-badge');

        if (isRecordingReceiver) {
          if (receiverMediaRecorder && receiverMediaRecorder.state !== 'inactive') {
            receiverMediaRecorder.stop();
          }
          clearInterval(receiverRecordingTimer);
          isRecordingReceiver = false;
          if (btn) {
            btn.innerHTML = '<span>🔴 Iniciar Gravação da Tradução (VB-CABLE)</span>';
            btn.className = 'text-xs font-semibold px-3.5 py-2 rounded-xl border border-rose-300 bg-white hover:bg-rose-50 text-rose-700 transition-all cursor-pointer shadow-2xs flex items-center gap-1.5';
          }
          if (pill) {
            pill.innerText = 'Áudio Salvo ✓';
            pill.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800';
          }
          if (timerBadge) timerBadge.innerText = 'Finalizado';
          appendSystemLog('⏹️ Gravação do áudio traduzido finalizada e armazenada.');
          return;
        }

        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const dest = audioCtx.createMediaStreamDestination();
          receiverAudioChunks = [];
          receiverMediaRecorder = new MediaRecorder(dest.stream);
          receiverMediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) receiverAudioChunks.push(e.data);
          };
          receiverMediaRecorder.onstop = () => {
            receiverRecordedBlob = new Blob(receiverAudioChunks, { type: 'audio/webm' });
          };
          receiverMediaRecorder.start(1000);
          isRecordingReceiver = true;
          receiverRecordingSeconds = 0;

          if (pill) {
            pill.innerText = 'GRAVANDO ●';
            pill.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-800 border border-rose-300 animate-pulse';
          }

          receiverRecordingTimer = setInterval(() => {
            receiverRecordingSeconds++;
            const tStr = formatDuration(receiverRecordingSeconds);
            if (btn && isRecordingReceiver) {
              btn.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-600 animate-ping"></span><span>⏹️ Parar [REC ${tStr}]</span>`;
              btn.className = 'text-xs font-bold px-3.5 py-2 rounded-xl border border-rose-500 bg-rose-50 text-rose-800 transition-all cursor-pointer shadow-xs flex items-center gap-1.5';
            }
            if (timerBadge) timerBadge.innerText = `REC ${tStr}`;
          }, 1000);

          appendSystemLog('🔴 Gravação do canal receptor (tradução VB-CABLE) iniciada!');
        } catch(err) {
          // Fallback gracioso
          receiverAudioChunks = [];
          receiverRecordedBlob = new Blob(['sample-audio-data'], { type: 'audio/webm' });
          isRecordingReceiver = true;
          receiverRecordingSeconds = 0;
          if (btn) btn.innerHTML = '<span>⏹️ Parar Gravação da Tradução</span>';
          appendSystemLog('🔴 Gravação da tradução ativa no modo simulado.');
        }
      };

      window.changeSpeakerSourceLanguage = function(lang) {

      window.toggleLiveSpeechTranscription = function() {
        const btn = document.getElementById('btn-toggle-transcription');
        if (isTranscribingSpeech) {
          if (speechRecognizer) {
            try { speechRecognizer.stop(); } catch(e) {}
          }
          isTranscribingSpeech = false;
          if (btn) {
            btn.innerHTML = '<span>🎙️ Transcrever Fala ao Vivo</span>';
            btn.className = 'text-xs font-semibold px-3.5 py-2 rounded-xl border border-blue-300 bg-blue-50 hover:bg-blue-100 text-blue-800 transition-all cursor-pointer shadow-2xs flex items-center gap-1.5';
          }
          appendSystemLog('⏸️ Transcrição do palestrante pausada.');
          return;
        }

        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          alert('Reconhecimento de fala contínuo não suportado nativamente neste browser. Por favor, utilize o Google Chrome.');
          return;
        }

        speechRecognizer = new SpeechRec();
        speechRecognizer.continuous = true;
        speechRecognizer.interimResults = true;
        speechRecognizer.lang = selectedSourceLanguage || 'en-US';

        speechRecognizer.onstart = () => {
          isTranscribingSpeech = true;
          if (btn) {
            btn.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span>⏹️ Pausar Transcrição</span>';
            btn.className = 'text-xs font-bold px-3.5 py-2 rounded-xl border border-emerald-400 bg-emerald-50 text-emerald-800 transition-all cursor-pointer shadow-xs flex items-center gap-1.5';
          }
          appendSystemLog(`🎙️ Transcrição do palestrante conectada com sucesso (${selectedSourceLanguage})!`);
        };

        speechRecognizer.onresult = (event) => {
          let interim = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
              const timeSec = sessionElapsedSeconds;
              const timeStr = formatDuration(timeSec);
              addTransmitterSentence(transcript, timeStr, timeSec);
              translateAndAddReceiverSentence(transcript, timeStr, timeSec);
            } else {
              interim += transcript;
            }
          }
          const interimEl = document.getElementById('transmitter-interim-text');
          if (interimEl) interimEl.innerText = interim ? `> ${interim}...` : '';
        };

        speechRecognizer.onerror = (e) => {
          console.warn('SpeechRecognition erro:', e.error);
        };

        speechRecognizer.onend = () => {
          if (isTranscribingSpeech) {
            try { speechRecognizer.start(); } catch(e) {}
          }
        };

        try {
          speechRecognizer.start();
        } catch(e) {
          alert('Erro ao inicializar o microfone para transcrição: ' + e.message);
        }
      };

      function addTransmitterSentence(text, timeStr, timeSec) {
        if (!text || !text.trim()) return;

        transmitterTranscriptions.push({
          id: 'orig-' + Date.now(),

          timeSeconds: timeSec,
          text: text.trim()

        if (countEl) countEl.innerText = `${transmitterTranscriptions.length} frases`;
        if (feed) {
          const div = document.createElement('div');
          div.className = 'p-2 rounded-lg bg-slate-900 border border-slate-800 text-white';

          feed.appendChild(div);
          feed.scrollTop = feed.scrollHeight;

      async function translateAndAddReceiverSentence(originalText, timeStr, timeSec) {
        let translatedText = '';
        try {
          const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=pt&dt=t&q=${encodeURIComponent(originalText)}`);
          const data = await res.json();
          if (Array.isArray(data) && Array.isArray(data[0])) {
            translatedText = data[0].map(item => item[0]).join('');
          }
        } catch(e) {}

        if (!translatedText) {
          translatedText = originalText;
        }

        const feed = document.getElementById('receiver-transcription-feed');
        const countEl = document.getElementById('receiver-words-count');
        receiverTranscriptions.push({
          id: 'trans-' + Date.now(),
          timestamp: timeStr,
          timeSeconds: timeSec,
          text: translatedText.trim()
        });

        if (countEl) countEl.innerText = `${receiverTranscriptions.length} frases`;
        if (feed) {
          const div = document.createElement('div');
          div.className = 'p-2 rounded-lg bg-slate-900 border border-slate-800 text-white';
          div.innerHTML = `<span class="text-emerald-400 font-mono text-[11px] mr-2">[${timeStr}]</span> <span class="text-emerald-200">${translatedText.trim()}</span>`;
          feed.appendChild(div);
          feed.scrollTop = feed.scrollHeight;
        }
      }

      // 4. GERAÇÃO DE ARQUIVOS SRT E VTT
      function formatSrtTime(sec) {
        const pad = (n, z = 2) => String(Math.floor(n)).padStart(z, '0');
        const h = pad(sec / 3600);
        const m = pad((sec % 3600) / 60);
        const s = pad(sec % 60);
        const ms = pad((sec % 1) * 1000, 3);
        return `${h}:${m}:${s},${ms}`;
      }

      function buildSrtContent(items) {
        if (!items || items.length === 0) {
          return '1\n00:00:01,000 --> 00:00:04,000\nSessão de Tradução BrainLingo concluída.\n';
        }
        return items.map((item, idx) => {
          const start = item.timeSeconds || (idx * 4);
          const end = start + Math.max(3, item.text.length * 0.08);
          return `${idx + 1}\n${formatSrtTime(start)} --> ${formatSrtTime(end)}\n${item.text}\n`;
        }).join('\n');
      }

      function buildVttContent(items) {
        return 'WEBVTT\n\n' + buildSrtContent(items).replace(/,/g, '.');
      }

      function triggerDownload(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function playHotSwapSound() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } catch(e) {}
      }

          }
          appendSystemLog('🎙️ Medição real de microfone desativada.');
          return;
        }

        try {
          if (!micAudioContext) micAudioContext = new (window.AudioContext || window.webkitAudioContext)();
          if (micAudioContext.state === 'suspended') await micAudioContext.resume();

          micMediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const source = micAudioContext.createMediaStreamSource(micMediaStream);
          micAnalyserNode = micAudioContext.createAnalyser();
          micAnalyserNode.fftSize = 256;
          source.connect(micAnalyserNode);

          micMonitorGainNode = micAudioContext.createGain();
          micMonitorGainNode.gain.value = 0;
          source.connect(micMonitorGainNode);
          micMonitorGainNode.connect(micAudioContext.destination);

          isRealMicActive = true;
          if (btn) btn.innerText = '⏹️ Desligar Medição Real';
          if (subBtn) subBtn.innerText = '[Mic Real Ativo ●]';
          if (badge) {
            badge.innerText = 'Medindo ao Vivo ●';
            badge.className = 'text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-300';
          }
          appendSystemLog('🎙️ Microfone físico conectado! Fale para ver os decibéis oscilarem.');
          alert('🎙️ Microfone Físico Conectado com Sucesso!\n\nFale no seu microfone agora para ver o VU Meter subir em tempo real.\nVocê também pode clicar em "Ouvir Retorno" para escutar sua própria voz no fone.');
        } catch(err) {
          alert('Não foi possível acessar seu microfone: ' + (err.message || err));
        }
      };

      window.toggleMicMonitoring = function() {
        if (!isRealMicActive || !micMonitorGainNode) {
          alert('Ative primeiro a medição do microfone no botão ao lado.');
          return;
        }
        isMicMonitorActive = !isMicMonitorActive;
        micMonitorGainNode.gain.value = isMicMonitorActive ? 1.0 : 0;
        const btn = document.getElementById('btn-toggle-mic-monitor');
        if (btn) {
          btn.innerText = isMicMonitorActive ? '🔇 Desativar Retorno' : '🎧 Ouvir Retorno';
        }
        appendSystemLog(isMicMonitorActive ? '🎧 Retorno do microfone ativado.' : '🎧 Retorno desativado.');
      };

      window.simulateSpeakerEnglishSpeech = function() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance('Welcome to our conference. Testing the speaker microphone channel one two three.');
          utter.lang = 'en-US';
          window.speechSynthesis.speak(utter);
          appendSystemLog('🗣️ Simulação de fala em inglês do palestrante iniciada no microfone.');
        }
      };

      window.playTestSpeechToOutput = function() {
        appendSystemLog('🔊 Injetando locução de áudio traduzido na saída VB-CABLE...');
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance('Atenção: Teste do canal de áudio traduzido da Brain Audiovisual. O sinal de áudio está ativo e sendo entregue com sucesso no cabo virtual para a mesa de som.');
          utter.lang = 'pt-BR';
          utter.onstart = () => { isPlayingTestSpeech = true; };
          utter.onend = () => { isPlayingTestSpeech = false; appendSystemLog('✅ Locução de teste no cabo virtual concluída!'); };
          window.speechSynthesis.speak(utter);
        }
      };

      window.toggleSineTone = function() {
        const btn = document.getElementById('btn-sine-tone');
        if (isPlayingTestTone && toneOscillator) {
          try { toneOscillator.stop(); } catch(e) {}
          isPlayingTestTone = false;
          if (btn) btn.innerText = '🎵 Tom 1kHz';
          appendSystemLog('🎵 Tom senoidal de teste parado.');
          return;
        }
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          toneOscillator = ctx.createOscillator();
          const gain = ctx.createGain();
          toneOscillator.type = 'sine';
          toneOscillator.frequency.value = 1000;
          gain.gain.value = 0.15;
          toneOscillator.connect(gain);
          gain.connect(ctx.destination);
          toneOscillator.start();
          isPlayingTestTone = true;
          if (btn) btn.innerText = '⏹️ Parar Tom';
          appendSystemLog('🎵 Tom senoidal de calibração de 1kHz iniciado na saída.');
        } catch(e) {
          alert('Erro ao gerar tom: ' + e.message);
        }
      };

      window.toggleTransmitterMic = function() {
        isTransmitterMicMuted = !isTransmitterMicMuted;
        const btn = document.getElementById('toggle-mic-btn');
        const badge = document.getElementById('trans-mic-status-badge');
        if (btn) btn.innerText = isTransmitterMicMuted ? 'Desmutar Microfone' : 'Mutar Microfone';
        if (badge) {
          badge.innerText = isTransmitterMicMuted ? 'Microfone Mutado ✕' : 'Captação Aberta ●';
          badge.className = isTransmitterMicMuted ? 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-50 text-rose-700 border border-rose-200' : 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200';
        }
        appendSystemLog(isTransmitterMicMuted ? '🔇 Microfone do transmissor mutado.' : '🎙️ Microfone do transmissor desmutado.');
      };

      window.changeReceiverVolume = function(val) {
        volume = val;
        const disp = document.getElementById('vol-display');
        if (disp) disp.innerText = val + '%';
      };

      window.toggleReceiverMute = function() {
        isReceiverMuted = !isReceiverMuted;
        const disp = document.getElementById('vol-display');
        const slider = document.getElementById('vol-slider');
        if (disp) disp.innerText = isReceiverMuted ? 'MUDO' : volume + '%';
        if (slider) slider.value = isReceiverMuted ? 0 : volume;
        appendSystemLog(isReceiverMuted ? '🔇 Saída VB-CABLE mutada manualmente.' : '🔊 Saída VB-CABLE restaurada.');
      };

      // Inicializa a interface da fila
      updateMonitorQueueUI();

      // Espectro Sonoro da Saída (18 barras em repouso)
      const spectrumContainer = document.getElementById('spectrum-bars');
      if (spectrumContainer) {
        spectrumContainer.innerHTML = Array.from({ length: 18 }, () => `
          <div class="w-1.5 bg-gradient-to-t from-indigo-600 via-blue-500 to-cyan-400 rounded-full transition-all duration-150" style="height: 4%;"></div>
        `).join('');
      }

      // Loop de Animação de Áudio e VU Meter
      setInterval(() => {
        let currentVoiceEnergy = 0;

        // 1. VU Meter do Transmissor (Medição REAL via Web Audio API)
        const barGreen = document.getElementById('vu-bar-green');
        const barYellow = document.getElementById('vu-bar-yellow');
        const barRed = document.getElementById('vu-bar-red');
        const vuText = document.getElementById('vu-db-text');

        if (barGreen && barYellow && barRed && vuText) {
          if (isTransmitterMicMuted) {
            barGreen.style.width = '0%';
            barYellow.style.width = '0%';
            barRed.style.width = '0%';
            vuText.innerText = '-∞ dB (Mutado)';
            vuText.className = 'text-slate-400 font-bold';
          } else if (isRealMicActive && micAnalyserNode) {
            const data = new Uint8Array(micAnalyserNode.frequencyBinCount);
            micAnalyserNode.getByteFrequencyData(data);
            let sum = 0;
            for (let i = 0; i < data.length; i++) sum += data[i];
            const avg = sum / data.length;
            const pct = Math.min(100, Math.round((avg / 100) * 100));
            const dbVal = avg > 2 ? Math.round(20 * Math.log10(avg / 255)) : -60;

            barGreen.style.width = Math.min(pct, 70) + '%';
            barYellow.style.width = Math.max(0, Math.min(pct - 70, 20)) + '%';
            barRed.style.width = Math.max(0, pct - 90) + '%';

            if (avg > 5) {
              vuText.innerText = `${dbVal} dB (Voz Detectada)`;
              vuText.className = 'text-emerald-600 font-bold';
              currentVoiceEnergy = pct;
            } else {
              vuText.innerText = `${dbVal} dB (Silêncio no Microfone)`;
              vuText.className = 'text-slate-500 font-bold';
            }
          } else {
            barGreen.style.width = '0%';
            barYellow.style.width = '0%';
            barRed.style.width = '0%';
            vuText.innerText = 'Desligado (Clique p/ Ligar)';
            vuText.className = 'text-slate-400 font-bold';
          }
        }

        // 2. Modulador / Espectro de Áudio da Saída (VB-CABLE)
        const statusText = document.getElementById('spectrum-status-text');
        if (spectrumContainer) {
          const bars = spectrumContainer.children;
          const numBars = bars.length;

          if (isReceiverMuted) {
            for (let i = 0; i < numBars; i++) bars[i].style.height = '4%';
            if (statusText) {
              statusText.innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-500"></span> Saída Traduzida Mutada (MUTE Ativo)';
              statusText.className = 'text-[11px] text-rose-600 flex items-center gap-2 font-medium';
            }
          } else if (isPlayingTestSpeech) {
            for (let i = 0; i < numBars; i++) {
              const randHeight = Math.floor(25 + Math.random() * 70);
              bars[i].style.height = randHeight + '%';
            }
            if (statusText) {
              statusText.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Locução de Teste em Reprodução (VB-CABLE)';
              statusText.className = 'text-[11px] text-emerald-700 flex items-center gap-2 font-medium';
            }
          } else if (isPlayingTestTone) {
            for (let i = 0; i < numBars; i++) {
              const centerDist = Math.abs(i - numBars / 2);
              const height = Math.max(10, Math.round(85 - centerDist * 8));
              bars[i].style.height = height + '%';
            }
            if (statusText) {
              statusText.innerHTML = '<span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span> Tom Senoidal de Calibração (1kHz Ativo)';
              statusText.className = 'text-[11px] text-indigo-700 flex items-center gap-2 font-medium';
            }
          } else if (currentVoiceEnergy > 8) {
            for (let i = 0; i < numBars; i++) {
              const bell = Math.sin(((i + 1) / (numBars + 1)) * Math.PI);
              const randVariation = 0.75 + Math.random() * 0.5;
              const barHeight = Math.max(6, Math.min(95, Math.round(currentVoiceEnergy * bell * randVariation)));
              bars[i].style.height = barHeight + '%';
            }
            if (statusText) {
              statusText.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Áudio Traduzido em Reprodução (VB-CABLE Ativo ●)';
              statusText.className = 'text-[11px] text-emerald-700 flex items-center gap-2 font-medium';
            }
          } else {
            for (let i = 0; i < numBars; i++) bars[i].style.height = '4%';
            if (statusText) {
              statusText.innerHTML = '<span class="w-2 h-2 rounded-full bg-slate-400"></span> Modulador em Repouso (Silêncio no microfone)';
              statusText.className = 'text-[11px] text-slate-500 flex items-center gap-2 font-medium';
            }
          }
        }
      }, 150);

      // Loop do Cronômetro & Barra de Progresso de 1 Hora (60 min)
      setInterval(() => {
        if (!isTimerPaused) {
          sessionElapsedSeconds++;
          countdown--;
        }

        // Atualização da Barra de Progresso Grande no Topo
        const progressBar = document.getElementById('meeting-progress-bar');
        const elapsedText = document.getElementById('progress-elapsed-text');
        const remainingText = document.getElementById('progress-remaining-text');
        const pctText = document.getElementById('progress-pct-text');
        const badgeEl = document.getElementById('progress-status-badge');

        const currentElapsedInCycle = meetingTotalDuration - countdown;
        const pct = Math.min(100, Math.max(0, Math.round((currentElapsedInCycle / meetingTotalDuration) * 100)));

        if (progressBar) {
          progressBar.style.width = pct + '%';
          if (pct < 70) {
            progressBar.className = 'h-full rounded-full transition-all duration-700 bg-gradient-to-r from-emerald-500 via-teal-400 to-emerald-600 shadow-sm';
            if (badgeEl) {
              badgeEl.innerText = 'Sessão Confortável ●';
              badgeEl.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-300';
            }
          } else if (pct < 85) {
            progressBar.className = 'h-full rounded-full transition-all duration-700 bg-gradient-to-r from-amber-400 via-orange-400 to-amber-500 shadow-sm';
            if (badgeEl) {
              badgeEl.innerText = 'Atenção: Próxima Sala em Breve ⏱️';
              badgeEl.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-50 text-amber-800 border border-amber-300';
            }
          } else {
            progressBar.className = 'h-full rounded-full transition-all duration-700 bg-gradient-to-r from-rose-500 via-red-500 to-rose-600 shadow-sm animate-pulse';
            if (badgeEl) {
              badgeEl.innerText = '⚠️ HOT-SWAP IMINENTE: Trocar Sala!';
              badgeEl.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-50 text-rose-700 border border-rose-300 animate-pulse';
            }
          }
        }

        if (elapsedText) elapsedText.innerText = formatDuration(currentElapsedInCycle);
        if (remainingText) remainingText.innerText = formatDuration(Math.max(0, countdown));
        if (pctText) pctText.innerText = pct + '%';

        // Disparo automático quando o tempo atinge 0
        if (countdown <= 0) {
          if (queueIdx + 1 < queue.length) {
            triggerMonitorHotSwapNow();
          } else {
            countdown = 0;
            if (remainingText) remainingText.innerText = 'Fila Vazia';
          }
        }
      }, 1000);
    }
  </script>
  </script>
  </script>
