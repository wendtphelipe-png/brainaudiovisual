                id: tDiv.id,
                el: tDiv,
                confirmedSpan: tConfirmed,
                liveSpan: tLive,
                cursorEl: tCursor
              };
            }
          }
        });

        return currentTransmitterParagraph;
      }

      // ========================================================
      // BUFFER INTELIGENTE DE LOCUÇÃO PREMIUM (THOUGHT ACCUMULATOR)
      // Sacrifica velocidade imediata da locução em favor de frases maiores,
      // cadência fluida, sem interrupções e com entonação humana natural.
      // Legendas e transcrições na tela permanecem instantâneas.
      // ========================================================
      const _ttsLocutionBuffers = {}; // targetLang -> { chunks: [], timer: null, lastActivity: number }

      function accumulateTTSLocution(targetLang, cleanSentence) {
        if (!cleanSentence || !cleanSentence.trim()) return;
        const sentence = cleanSentence.trim();

        if (!_ttsLocutionBuffers[targetLang]) {
          _ttsLocutionBuffers[targetLang] = { chunks: [], timer: null, lastActivity: Date.now() };
        }
        const buf = _ttsLocutionBuffers[targetLang];
        buf.lastActivity = Date.now();

        // Anexa a frase traduzida sem cortes
        buf.chunks.push(sentence);

        const combined = buf.chunks.join(' ').trim();
        const words = combined.split(/\s+/).filter(Boolean);

        // Trechos de áudio maiores e humanos (18 a 28 palavras) para locução fluida, contínua e natural
        if (words.length >= 18) {
          if (buf.timer) clearTimeout(buf.timer);
          buf.timer = null;
          flushTTSLocutionBuffer(targetLang);
          return;
        }

        // Aguarda pausa natural do palestrante (1.8s de silêncio) para despachar o trecho completo
        if (buf.timer) clearTimeout(buf.timer);
        buf.timer = setTimeout(() => {
          flushTTSLocutionBuffer(targetLang);
        }, 1800);
      }

      function flushTTSLocutionBuffer(targetLang) {
        const buf = _ttsLocutionBuffers[targetLang];
        if (!buf || buf.chunks.length === 0) return;
        if (buf.timer) {
          clearTimeout(buf.timer);
          buf.timer = null;
        }

        let fullText = buf.chunks.join(' ').trim().replace(/\s+/g, ' ');
        buf.chunks = [];

        if (!fullText || fullText.length < 2) return;

        // Higieniza pontuação final para entonação conclusiva agradável e humana
        if (!/[.!?]$/.test(fullText)) {
          fullText += '.';
        }

        const targetCode = (targetLang || 'en').split('-')[0].toLowerCase();
        broadcastStreamTTS(targetCode, fullText);
        triggerTargetAudioMeter(targetLang, Math.max(3000, fullText.length * 85));
      }

      function flushAllTTSLocutionBuffers() {
        Object.keys(_ttsLocutionBuffers).forEach(lang => {
          flushTTSLocutionBuffer(lang);
        });
      }

      function closeActiveParagraphs() {
        if (paragraphPauseTimer) {
          clearTimeout(paragraphPauseTimer);
          paragraphPauseTimer = null;
        }

        // Flusha qualquer pensamento acumulado na fila de locução premium de todos os idiomas
        flushAllTTSLocutionBuffers();

        if (currentTransmitterParagraph) {
          if (currentTransmitterParagraph.liveSpan && currentTransmitterParagraph.liveSpan.textContent.trim()) {
            const remaining = currentTransmitterParagraph.liveSpan.textContent.trim();
            const prev = currentTransmitterParagraph.confirmedSpan.textContent.trim();
            const normPrev = cleanNorm(prev);
            const normRem = cleanNorm(remaining);
            if (normRem && !normPrev.endsWith(normRem) && normPrev !== normRem) {
              currentTransmitterParagraph.confirmedSpan.textContent = prev ? (prev + ' ' + remaining) : remaining;
            }
            currentTransmitterParagraph.liveSpan.textContent = '';
          }
          if (currentTransmitterParagraph.cursorEl) {
            currentTransmitterParagraph.cursorEl.remove();
            currentTransmitterParagraph.cursorEl = null;
          }
          currentTransmitterParagraph = null;
        }

        Object.keys(currentTargetParagraphs).forEach(targetLang => {
          const tp = currentTargetParagraphs[targetLang];
          if (tp) {
            if (tp.liveSpan && tp.liveSpan.textContent.trim()) {
              const remaining = tp.liveSpan.textContent.trim();
              const prev = tp.confirmedSpan.textContent.trim();
              const normPrev = cleanNorm(prev);
              const normRem = cleanNorm(remaining);
              if (normRem && !normPrev.endsWith(normRem) && normPrev !== normRem) {
                tp.confirmedSpan.textContent = prev ? (prev + ' ' + remaining) : remaining;
              }
              tp.liveSpan.textContent = '';
            }
            if (tp.cursorEl) {
              tp.cursorEl.remove();
              tp.cursorEl = null;
            }
          }
        });
        currentTargetParagraphs = {};
        // Reseta tracker de interim para a próxima frase
        Object.keys(_interimTracker).forEach(lang => {
          _interimTracker[lang] = { lastShownLen: 0, inFlight: false };
        });
        // Notifica Espectador e OBS do fechamento do parágrafo
        broadcastCloseParagraphGlobally('all');
      }

      // Rastreamento por idioma para tradução interim (não cancela em-voo)
      const _interimTracker = {}; // { [lang]: { lastShownLen, inFlight } }

      // Caminho RÁPIDO para tradução em tempo real — rotação multi-cliente Google (dict-chrome-ex, tw-ob, gtx)
      async function fetchInterimTranslation(text, sourceLang, targetLang) {
        const clean = text.trim();
        if (!clean) return null;
        const sourceCode = (sourceLang || 'pt-BR').split('-')[0].toLowerCase();
        const targetCode = (targetLang || 'en').split('-')[0].toLowerCase();
        if (sourceCode === targetCode) return clean;

        // Cache hit imediato
        const cacheKey = `${sourceCode}|${targetCode}|${clean}`;
        if (_translationCache.has(cacheKey)) return _translationCache.get(cacheKey);

        const clients = ['dict-chrome-ex', 'tw-ob', 'gtx'];
        for (const client of clients) {
          try {
            const ctrl = new AbortController();
            const tid = setTimeout(() => ctrl.abort(), 1600);
            const res = await fetch(
              `https://translate.googleapis.com/translate_a/single?client=${client}&sl=${sourceCode}&tl=${targetCode}&dt=t&q=${encodeURIComponent(clean)}`,
              { signal: ctrl.signal }
            );
            clearTimeout(tid);
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data) && Array.isArray(data[0])) {
                const trans = data[0].map(i => i[0]).filter(Boolean).join('');
                if (trans && trans.trim()) {
                  const result = trans.trim();
                  // Salva no cache compartilhado
                  _translationCache.set(cacheKey, result);
                  if (_translationCache.size > 500) {
                    _translationCache.delete(_translationCache.keys().next().value);
                  }
                  return result;
                }
              }
            }
          } catch(e) {}
        }
        return null;
      }

      // CATÁLOGO UNIVERSAL DE IDIOMAS DE TRANSMISSÃO
      // Garante que inglês, espanhol, francês, alemão, italiano, árabe e português tenham
      // EXATAMENTE a mesma velocidade de tradução, interim instantâneo e cadência de locução.
      const ALL_GLOBAL_STREAM_LANGUAGES = ['en-US', 'es-ES', 'fr-FR', 'de-DE', 'it-IT', 'ar-SA', 'pt-BR'];

      function getUniversalStreamTargets() {
        const targets = new Set(activeTargetLanguages);
        ALL_GLOBAL_STREAM_LANGUAGES.forEach(lang => {
          if (lang !== selectedSourceLanguage) {
            targets.add(lang);
          }
        });
        if (selectedSourceLanguage !== 'pt-BR' || isPtColumnExpanded) {
          targets.add('pt-BR');
        }
        return Array.from(targets);
      }

      // TRADUÇÃO EM STREAMING — Padrão Google Tradutor:
      // dispara palavra-a-palavra SEM debounce, SEM cancelar requests anteriores.
      // Usa comprimento do texto para determinar recência (texto mais longo = mais recente).
      // Também faz TTS streaming em chunks com delay de 4s sem esperar término da frase.
      function scheduleLiveStreamTranslation(interimText, utteranceSeq) {
        if (!interimText || !interimText.trim()) return;
        const textNow = interimText.trim();

        const targets = getUniversalStreamTargets();

        targets.forEach(async (targetLang, idx) => {
          if (idx > 0) await new Promise(r => setTimeout(r, idx * 60));
          if (!_interimTracker[targetLang]) {
            _interimTracker[targetLang] = { lastShownLen: 0, inFlight: false };
          }
          const tracker = _interimTracker[targetLang];

          // Se já está traduzindo um texto igual ou mais longo, aguarda
          if (tracker.inFlight && textNow.length <= tracker.lastShownLen) return;

          const now = Date.now();
          if (tracker.inFlight || (now - (tracker.lastReqTime || 0) < 100)) return;

          tracker.inFlight = true;
          tracker.lastReqTime = now;
          const translated = await fetchInterimTranslation(textNow, selectedSourceLanguage, targetLang);
          tracker.inFlight = false;

          if (!translated) return;

          // Se a frase já foi finalizada enquanto esta tradução estava a caminho, descarta para evitar repetição
          if (utteranceSeq !== undefined && utteranceSeq !== currentUtteranceSeq) {
            return;
          }

          // Só atualiza se o texto é referente a algo igual ou mais longo que o atual mostrado
          if (textNow.length >= tracker.lastShownLen) {
            tracker.lastShownLen = textNow.length;

            // Atualiza coluna visual do Cockpit (se existir)
            const tp = currentTargetParagraphs[targetLang];
            if (tp && tp.liveSpan) {
              const prev = tp.confirmedSpan.textContent.trim();
              const normPrev = cleanNorm(prev);
              const normTrans = cleanNorm(translated);
              if (normTrans && (normPrev.endsWith(normTrans) || normPrev === normTrans)) {
                tp.liveSpan.textContent = '';
              } else {
                const hasConfirmed = prev.length > 0;
                tp.liveSpan.textContent = (hasConfirmed ? ' ' : '') + translated;
                tp.liveSpan.style.opacity = '1';
              }
              const els = getTargetColumnElements(targetLang);
              if (els.box) els.box.scrollTop = els.box.scrollHeight;
            }

            // Transmite interim instantaneamente para Espectador e OBS no canal canônico (sem flood redundante)
            const targetCode = targetLang.split('-')[0].toLowerCase();
            broadcastLiveInterimGlobally(targetCode, translated);
          }
        });
      }

      // TRANSCRIÇÃO EM TEMPO REAL INSTANTÂNEA — PADRÃO BARRA DE PESQUISA DO GOOGLE
      // Escreve imediatamente palavra a palavra conforme o palestrante fala, sem esperar terminar frase
      function updateLiveSpeechDisplay(interimText) {
        lastSpeechActivityTimestamp = Date.now();
        if (paragraphPauseTimer) {
          clearTimeout(paragraphPauseTimer);
          paragraphPauseTimer = null;
        }

        const cleanInterim = (interimText || '').trim();

        if (!cleanInterim) {
          if (currentTransmitterParagraph && currentTransmitterParagraph.liveSpan) {
            currentTransmitterParagraph.liveSpan.textContent = '';
          }
          return;
        }

        const para = getOrCreateActiveParagraph();
        if (!para) return;

        const hasConfirmed = para.confirmedSpan.textContent.trim().length > 0;
        para.liveSpan.textContent = (hasConfirmed ? ' ' : '') + cleanInterim;

        const box = document.getElementById('transmitter-subtitle-box');
        if (box) box.scrollTop = box.scrollHeight;

        const thisSeq = currentUtteranceSeq;
        scheduleLiveStreamTranslation(cleanInterim, thisSeq);
        broadcastLiveInterimGlobally('transmitter', cleanInterim);
      }

      function commitFinalSentence(finalText) {
        lastSpeechActivityTimestamp = Date.now();
        let clean = (finalText || '').trim().replace(/\s+/g, ' ');
        if (!clean) return;

        // Elimina sobreposição de palavras nas bordas com a frase anterior (evita repetição da última palavra no início da seguinte frase)
        if (lastConfirmedCleanTranscript) {
          clean = stripUtteranceBoundaryOverlap(clean, lastConfirmedCleanTranscript);
          clean = (clean || '').trim();
          if (!clean) return;
        }

        // Incrementa sequência para invalidar interims assíncronos que ainda estejam em processamento
        currentUtteranceSeq++;

        // Evita duplicatas consecutivas idênticas num intervalo curto
        const now = Date.now();
        const normClean = cleanNorm(clean);
        if (normClean && normClean === cleanNorm(lastConfirmedCleanTranscript) && (now - lastConfirmedTimestamp) < 2500) {
          return;
        }
        lastConfirmedCleanTranscript = clean;
        lastConfirmedTimestamp = now;

        // Reseta tracker interim para nova frase
        Object.keys(_interimTracker).forEach(lang => {
          _interimTracker[lang] = { lastShownLen: 0, inFlight: false };
        });

        const para = getOrCreateActiveParagraph();
        if (!para) return;

        const prev = para.confirmedSpan.textContent.trim();
        para.confirmedSpan.textContent = prev ? (prev + ' ' + clean) : clean;
        para.liveSpan.textContent = '';

        const startSec = para.startTime;
        const endSec = sessionElapsedSeconds > startSec ? sessionElapsedSeconds : startSec + Math.max(1.5, clean.length * 0.08);

        transmitterTranscriptions.push({ text: clean, timeStart: startSec, timeEnd: endSec });
        broadcastSubtitleGlobally('transmitter', clean, startSec, endSec);

        const box = document.getElementById('transmitter-subtitle-box');
        if (box) box.scrollTop = box.scrollHeight;

        dispatchTargetTranslations(clean, startSec, endSec);

        // Inicia temporizador de pausa significante (2.5 segundos de silêncio para fechar parágrafo)
        if (paragraphPauseTimer) clearTimeout(paragraphPauseTimer);
        paragraphPauseTimer = setTimeout(closeActiveParagraphs, 2500);
      }

      function dispatchTargetTranslations(originalText, startSec, endSec) {
        const targets = getUniversalStreamTargets();

        targets.forEach(async (targetLang, idx) => {
          if (idx > 0) await new Promise(r => setTimeout(r, idx * 60));
          const translated = await fetchFastTranslation(originalText, selectedSourceLanguage, targetLang);

          // CRÍTICO: Nunca usar o texto original como tradução — só age se houver tradução real
          if (!translated || !translated.trim()) {
            console.warn('[BrainLingo] Tradução final falhou para', targetLang, '— ignorando broadcast/TTS.');
            // Tenta novamente em 2 segundos (retry automático)
            setTimeout(async () => {
              const retryTranslated = await fetchFastTranslation(originalText, selectedSourceLanguage, targetLang);
              if (retryTranslated && retryTranslated.trim()) {
                _applyFinalTranslation(targetLang, retryTranslated.trim(), startSec, endSec);
              }
            }, 2000);
            return;
          }

          _applyFinalTranslation(targetLang, translated.trim(), startSec, endSec);
        });
      }

      function _applyFinalTranslation(targetLang, cleanTranslated, startSec, endSec) {
        const tp = currentTargetParagraphs[targetLang];
        if (tp) {
          const prev = tp.confirmedSpan.textContent.trim();
          const normPrev = cleanNorm(prev);
          const normClean = cleanNorm(cleanTranslated);
          if (normClean && (normPrev.endsWith(normClean) || normPrev === normClean)) {
            tp.liveSpan.textContent = '';
          } else {
            tp.confirmedSpan.textContent = prev ? (prev + ' ' + cleanTranslated) : cleanTranslated;
            tp.liveSpan.textContent = '';
          }
          tp.liveSpan.style.opacity = '1';
          const els = getTargetColumnElements(targetLang);
          if (els.box) els.box.scrollTop = els.box.scrollHeight;
        }

        if (!targetTranscriptions[targetLang]) targetTranscriptions[targetLang] = [];
        targetTranscriptions[targetLang].push({ text: cleanTranslated, timeStart: startSec, timeEnd: endSec });

        const targetCode = targetLang.split('-')[0].toLowerCase();

        // 1. Broadcast IMEDIATO para exibição de legenda na tela (NEW_SUBTITLE) - apenas canal canônico
        // Velocidade da transcrição e da legenda na tela mantida no máximo, sem qualquer atraso!
        broadcastSubtitleGlobally(targetCode, cleanTranslated, startSec, endSec);

        // Limpa o interim nas janelas imediatamente
        broadcastLiveInterimGlobally(targetCode, '');

        // 2. BUFFER INTELIGENTE DE LOCUÇÃO PREMIUM (THOUGHT ACCUMULATOR):
        // Acumula pensamentos completos para ler pedaços maiores sem interrupções e com entonação humana perfeita
        accumulateTTSLocution(targetLang, cleanTranslated);

        fetchAudioChunkForExport(targetLang, cleanTranslated, 'female');
        fetchAudioChunkForExport(targetLang, cleanTranslated, 'male');
      }

      function handleStreamingSpeechResult(transcript, utteranceIndex, isFinal) {
        if (isFinal) {
          commitFinalSentence(transcript);
        } else {
          updateLiveSpeechDisplay(transcript);
        }
      }

      function safelyDestroySpeechRecognizer(forceCloseParagraph = false) {
        if (paragraphPauseTimer && forceCloseParagraph) {
          clearTimeout(paragraphPauseTimer);
          paragraphPauseTimer = null;
        }
        if (liveTranslationDebounceTimer) {
          clearTimeout(liveTranslationDebounceTimer);
          liveTranslationDebounceTimer = null;
        }
        // Reseta rastreamento interim (sem debounce ativo para cancelar)
        Object.keys(_interimTracker).forEach(lang => {
          _interimTracker[lang] = { lastShownLen: 0, inFlight: false };
        });
        // Flusha qualquer fala remanescente no buffer de locução
        flushAllTTSLocutionBuffers();

        if (forceCloseParagraph) {
          closeActiveParagraphs();
        }

        if (speechRecognizer) {
          try {
            speechRecognizer.onstart = null;
            speechRecognizer.onaudiostart = null;
            speechRecognizer.onresult = null;
            speechRecognizer.onerror = null;
            speechRecognizer.onend = null;
            speechRecognizer.abort();
          } catch(e) {}
          speechRecognizer = null;
        }
        isTranscribingSpeech = false;
        updateSpeechStatusIndicator(false);
      }

      function updateSpeechStatusIndicator(isActive) {
        const dot = document.getElementById('transmitter-speech-dot');
        const text = document.getElementById('transmitter-speech-text');
        const ind = document.getElementById('transmitter-speech-indicator');
        if (dot && text && ind) {
          if (isActive) {
            dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse';
            text.innerText = 'Ouvindo Fala ●';
            ind.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-700 flex items-center gap-1';
          } else {
            dot.className = 'w-1.5 h-1.5 rounded-full bg-slate-400';
            text.innerText = 'Aguardando Voz';
            ind.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400 border border-slate-300 dark:border-slate-700 flex items-center gap-1';
          }
        }
      }

      function scheduleSpeechRestart(delay = 100) {
        if (speechRecognizerRestartTimeout) clearTimeout(speechRecognizerRestartTimeout);
        speechRecognizerRestartTimeout = setTimeout(() => {
          if (isRealMicActive && !isTimerPaused) {
            startContinuousSpeechTranscription();
          }
        }, delay);
      }

      // Watchdog de integridade: reinicia recognizer apenas se estiver inativo por mais de 25s
      if (speechWatchdogInterval) clearInterval(speechWatchdogInterval);
      speechWatchdogInterval = setInterval(() => {
        if (isRealMicActive && !isTimerPaused) {
          const idleTime = Date.now() - lastSpeechActivityTimestamp;
          if (!isTranscribingSpeech || idleTime > 25000) {
            safelyDestroySpeechRecognizer(true);
            startContinuousSpeechTranscription();
          }
        }
      }, 5000);

      function startContinuousSpeechTranscription() {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          console.warn('SpeechRecognition não suportado no navegador.');
          return;
        }

        if (isStartingSpeechRecognition) return;
        isStartingSpeechRecognition = true;
        setTimeout(() => { isStartingSpeechRecognition = false; }, 2000);

        safelyDestroySpeechRecognizer(false);

        setTimeout(() => {
          try {
            const recognizer = new SpeechRec();
            speechRecognizer = recognizer;
            recognizer.continuous = true;
            recognizer.interimResults = true;
            recognizer.lang = selectedSourceLanguage || 'pt-BR';
            recognizer.maxAlternatives = 1;

            recognizer.onstart = () => {
              isStartingSpeechRecognition = false;
              isTranscribingSpeech = true;
              lastSpeechActivityTimestamp = Date.now();
              finalizedUtteranceIndices.clear();
              updateSpeechStatusIndicator(true);
            };

            recognizer.onaudiostart = () => {
              lastSpeechActivityTimestamp = Date.now();
            };

            recognizer.onresult = (event) => {
              let currentInterim = '';
              for (let i = event.resultIndex; i < event.results.length; i++) {
                const res = event.results[i];
                if (!res || !res[0]) continue;
                const transcript = (res[0].transcript || '').trim();
                if (!transcript) continue;

                if (res.isFinal) {
                  if (!finalizedUtteranceIndices.has(i)) {
                    finalizedUtteranceIndices.add(i);
                    commitFinalSentence(transcript);
                  }
                } else {
                  let interimPiece = transcript;
                  if (lastConfirmedCleanTranscript) {
                    interimPiece = stripUtteranceBoundaryOverlap(interimPiece, lastConfirmedCleanTranscript);
                  }
                  if (interimPiece) {
                    currentInterim += (currentInterim ? ' ' : '') + interimPiece;
                  }
                }
              }

              // Atualização instantânea em tempo real (Padrão Barra de Pesquisa do Google)
              updateLiveSpeechDisplay(currentInterim);
            };

            recognizer.onerror = (e) => {
              isStartingSpeechRecognition = false;
              if (e.error === 'not-allowed') {
                isRealMicActive = false;
                stopMasterMicCapture();
                alert('Permissão de microfone negada. Clique no cadeado na barra de endereços para permitir.');
              } else {
                scheduleSpeechRestart(250);
              }
            };

            recognizer.onend = () => {
              isStartingSpeechRecognition = false;
              isTranscribingSpeech = false;
              updateSpeechStatusIndicator(false);

              if (isRealMicActive && !isTimerPaused) {
                scheduleSpeechRestart(40);
              }
            };

            recognizer.start();
          } catch(e) {
            isStartingSpeechRecognition = false;
            scheduleSpeechRestart(300);
          }
        }, 50);
      }

      window.changeSpeakerSourceLanguage = function(newLang) {
        selectedSourceLanguage = newLang;
        meeting.sourceLanguage = newLang;
        try {
          const saved = JSON.parse(localStorage.getItem('brain_saved_meetings') || '[]');
          const idx = saved.findIndex(m => m.id === meeting.id);
          if (idx !== -1) {
            saved[idx].sourceLanguage = newLang;
            localStorage.setItem('brain_saved_meetings', JSON.stringify(saved));
          }
        } catch(e) {}

        const sel = document.getElementById('speaker-lang-select');
        if (sel) sel.value = newLang;

        if (isRealMicActive) {
          safelyDestroySpeechRecognizer(true);
          setTimeout(startContinuousSpeechTranscription, 150);
        }
      };

      // COMMIT DE SENTENÇA E TRADUÇÃO MULTILÍNGUE PARALELA
      let committedHistory = [];

      let lastCommittedSentenceText = '';
      let lastCommittedSentenceTime = 0;

      async function commitSpeechSentence(rawText) {
        if (!rawText || !rawText.trim()) return;
        const clean = rawText.trim().replace(/\s+/g, ' ');
        if (clean.length < 2) return;

        const now = Date.now();
        const cleanLower = clean.toLowerCase();

        // Evita duplicatas disparadas na mesma janela imediata de 1.5s
        if (cleanLower === lastCommittedSentenceText && (now - lastCommittedSentenceTime) < 1500) {
          return;
        }
        lastCommittedSentenceText = cleanLower;
        lastCommittedSentenceTime = now;

        commitFinalSentence(clean);
      }

      function addTransmitterSentenceClean(text, startSec, endSec) {
        if (!text || !text.trim()) return;
        const clean = text.trim();
        transmitterTranscriptions.push({ text: clean, timeStart: startSec, timeEnd: endSec });

        const para = getOrCreateActiveParagraph();
        if (para) {
          const prev = para.confirmedSpan.textContent.trim();
          para.confirmedSpan.textContent = prev ? (prev + ' ' + clean) : clean;
          para.liveSpan.textContent = '';
          const box = document.getElementById('transmitter-subtitle-box');
          if (box) box.scrollTop = box.scrollHeight;
        }

        broadcastSubtitleGlobally('transmitter', clean, startSec, endSec);

        if (paragraphPauseTimer) clearTimeout(paragraphPauseTimer);
        paragraphPauseTimer = setTimeout(closeActiveParagraphs, 2500);
      }

      function getTargetColumnElements(lang) {
        if (!lang) return {};
        const short = lang.split('-')[0].toLowerCase();
        const full = lang.trim();
        return {
          bar: document.getElementById('target-vu-bar-' + full) || document.getElementById('target-vu-bar-' + short),
          led: document.getElementById('target-vu-led-' + full) || document.getElementById('target-vu-led-' + short),
          textEl: document.getElementById('target-vu-text-' + full) || document.getElementById('target-vu-text-' + short),
          statusEl: document.getElementById('target-vu-status-' + full) || document.getElementById('target-vu-status-' + short),
          feed: document.getElementById('target-transcription-feed-' + full) || document.getElementById('target-transcription-feed-' + short),
          box: document.getElementById('target-subtitle-box-' + full) || document.getElementById('target-subtitle-box-' + short)
        };
      }

      async function translateAndDispatchTargetSentence(originalText, targetLang, startSec, endSec) {
        if (!originalText || !originalText.trim()) return;
        const clean = originalText.trim();
        const sourceCode = (selectedSourceLanguage || 'pt-BR').split('-')[0].toLowerCase();
        const targetCode = targetLang.split('-')[0].toLowerCase();

        if (sourceCode === targetCode) {
          addTargetSentenceClean(targetLang, clean, startSec, endSec);
          return;
        }

        const translated = await fetchFastTranslation(clean, selectedSourceLanguage, targetLang);
        if (translated && translated.trim()) {
          addTargetSentenceClean(targetLang, translated.trim(), startSec, endSec);
        }
      }

      function addTargetSentenceClean(targetLang, text, startSec, endSec) {
        if (!text || !text.trim()) return;
        const clean = text.trim();
        if (!targetTranscriptions[targetLang]) targetTranscriptions[targetLang] = [];
        targetTranscriptions[targetLang].push({ text: clean, timeStart: startSec, timeEnd: endSec });

        getOrCreateActiveParagraph();
        const tp = currentTargetParagraphs[targetLang];
        if (tp) {
          const prev = tp.confirmedSpan.textContent.trim();
          tp.confirmedSpan.textContent = prev ? (prev + ' ' + clean) : clean;
          tp.liveSpan.textContent = '';
          const els = getTargetColumnElements(targetLang);
          if (els.box) els.box.scrollTop = els.box.scrollHeight;
        }

        const targetCode = targetLang.split('-')[0].toLowerCase();
        broadcastSubtitleGlobally(targetCode, clean, startSec, endSec);
        if (targetCode === 'en') broadcastSubtitleGlobally('receiver', clean, startSec, endSec);
        if (targetCode === 'es') broadcastSubtitleGlobally('spanish', clean, startSec, endSec);

        triggerTargetAudioMeter(targetLang, Math.max(3000, clean.length * 90));
        fetchAudioChunkForExport(targetLang, clean, 'female');
        fetchAudioChunkForExport(targetLang, clean, 'male');
      }

      function triggerTargetAudioMeter(targetLang, durationMs) {
        const langCode = (targetLang || '').split('-')[0].toLowerCase();
        const duration = durationMs || 3000;
        const until = Date.now() + duration;
        targetMeterStates[targetLang] = { activeUntil: until };
        targetMeterStates[langCode] = { activeUntil: until };
      }

      // SÍNTESE NATIVA DE VOZES MULTILÍNGUES (FEMININA SOFIA E MASCULINA ARTHUR VIA AMAZON POLLY NATIVO)
      async function fetchAudioChunkForExport(targetLang, text, gender = 'female') {
        if (!text || !text.trim()) return null;
        const clean = text.trim();
        try {
          const targetCode = targetLang.split('-')[0].toLowerCase();
          const encoded = encodeURIComponent(clean);
          const candidateUrls = [
            `/tts.php?tl=${targetCode}&gender=${gender}&q=${encoded}`,
            `https://brainaudiovisual.com.br/tts.php?tl=${targetCode}&gender=${gender}&q=${encoded}`
          ];

          let blob = null;
          for (const url of candidateUrls) {
            try {
              const res = await fetch(url);
              if (res.ok) {
                const b = await res.blob();
                if (b && b.size > 250) {
                  blob = b;
                  break;
                }
              }
            } catch(fetchErr) {}
          }

          if (blob) {
            if (gender === 'male') {
              if (!targetAudioBlobsMale[targetLang]) targetAudioBlobsMale[targetLang] = [];
              targetAudioBlobsMale[targetLang].push(blob);
            } else {
              if (!targetAudioBlobsFemale[targetLang]) targetAudioBlobsFemale[targetLang] = [];
              targetAudioBlobsFemale[targetLang].push(blob);
              if (!targetAudioBlobs[targetLang]) targetAudioBlobs[targetLang] = [];
              targetAudioBlobs[targetLang].push(blob);
            }
            return blob;
          }
        } catch(e) {
          console.warn('Erro ao obter áudio nativo de ' + gender + ':', e);
        }
        return null;
      }

      function formatVttTime(sec) {
        const pad = (n, z = 2) => String(Math.floor(n)).padStart(z, '0');
        const h = pad(sec / 3600);
        const m = pad((sec % 3600) / 60);
        const s = pad(sec % 60);
        const ms = pad((sec % 1) * 1000, 3);
        return `${h}:${m}:${s}.${ms}`;
      }

      function buildVttString(items, title) {
        let vtt = 'WEBVTT\n\nNOTE Brain Audiovisual - ' + title + '\n\n';
        if (!items || items.length === 0) {
          return vtt + '1\n00:00:01.000 --> 00:00:04.000\n[' + title + '] Transmissão Brain Audiovisual.\n';
        }
        const sorted = [...items].sort((a, b) => (a.timeStart || 0) - (b.timeStart || 0));
        sorted.forEach((item, idx) => {
          const start = item.timeStart || (idx * 3);
          const end = item.timeEnd || (start + Math.max(2.2, item.text.length * 0.08));
          vtt += `${idx + 1}\n${formatVttTime(start)} --> ${formatVttTime(end)}\n${item.text}\n\n`;
        });
        return vtt;
      }

      // UTILITÁRIOS DE CODIFICAÇÃO E CONVERSÃO PARA MP3 (LAMEJS)
      function generateValidSilentMp3(seconds = 2) {
        if (typeof lamejs !== 'undefined') {
          try {
            const sampleRate = 44100;
            const numSamples = Math.round(sampleRate * Math.max(1, seconds));
            const mp3encoder = new lamejs.Mp3Encoder(1, sampleRate, 128);
            const sampleBlockSize = 1152;
            const silence = new Int16Array(sampleBlockSize);
            const mp3Data = [];

            for (let i = 0; i < numSamples; i += sampleBlockSize) {
              const mp3buf = mp3encoder.encodeBuffer(silence);
              if (mp3buf && mp3buf.length > 0) mp3Data.push(mp3buf);
            }
            const endBuf = mp3encoder.flush();
            if (endBuf && endBuf.length > 0) mp3Data.push(endBuf);
            return new Blob(mp3Data, { type: 'audio/mp3' });
          } catch(e) {}
        }
        return new Blob([new Uint8Array([0xff, 0xfb, 0x90, 0x64])], { type: 'audio/mp3' });
      }

      async function convertAudioBlobToMp3(audioBlob) {
        if (!audioBlob || audioBlob.size === 0) {
          return generateValidSilentMp3(2);
        }
        if (typeof lamejs === 'undefined') {
          console.warn('lamejs não disponível no navegador');
          return audioBlob;
        }

        try {
          const arrayBuffer = await audioBlob.arrayBuffer();
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

          const numChannels = audioBuffer.numberOfChannels;
          const sampleRate = audioBuffer.sampleRate;
          const mp3encoder = new lamejs.Mp3Encoder(numChannels, sampleRate, 128);
          const mp3Data = [];

          // Normalização inteligente de estúdio (-0.5 dBFS) para garantir volume potente e audível
          let maxPeak = 0;
          for (let c = 0; c < numChannels; c++) {
            const ch = audioBuffer.getChannelData(c);
            for (let i = 0; i < ch.length; i++) {
              const v = Math.abs(ch[i]);
              if (v > maxPeak) maxPeak = v;
            }
          }
          const targetPeak = 0.94;
          const normGain = (maxPeak > 0.005) ? Math.min(8.0, targetPeak / maxPeak) : 1.0;

          if (numChannels === 1) {
            const samples = audioBuffer.getChannelData(0);
            const sampleBlockSize = 1152;
            const sample16 = new Int16Array(samples.length);
            for (let i = 0; i < samples.length; i++) {
              const s = Math.max(-1, Math.min(1, samples[i] * normGain));
              sample16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            for (let i = 0; i < sample16.length; i += sampleBlockSize) {
              const chunk = sample16.subarray(i, i + sampleBlockSize);
              const mp3buf = mp3encoder.encodeBuffer(chunk);
              if (mp3buf.length > 0) mp3Data.push(mp3buf);
              if ((i / sampleBlockSize) % 80 === 0) {
                await new Promise(r => setTimeout(r, 0));
              }
            }
          } else {
            const left = audioBuffer.getChannelData(0);
            const right = audioBuffer.getChannelData(1);
            const sampleBlockSize = 1152;
            const left16 = new Int16Array(left.length);
            const right16 = new Int16Array(right.length);
            for (let i = 0; i < left.length; i++) {
              const sl = Math.max(-1, Math.min(1, left[i] * normGain));
              const sr = Math.max(-1, Math.min(1, right[i] * normGain));
              left16[i] = sl < 0 ? sl * 0x8000 : sl * 0x7FFF;
              right16[i] = sr < 0 ? sr * 0x8000 : sr * 0x7FFF;
            }
            for (let i = 0; i < left16.length; i += sampleBlockSize) {
              const leftChunk = left16.subarray(i, i + sampleBlockSize);
              const rightChunk = right16.subarray(i, i + sampleBlockSize);
              const mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
              if (mp3buf.length > 0) mp3Data.push(mp3buf);
              if ((i / sampleBlockSize) % 80 === 0) {
                await new Promise(r => setTimeout(r, 0));
              }
            }
          }

          const endBuf = mp3encoder.flush();
          if (endBuf.length > 0) mp3Data.push(endBuf);

          try { await audioCtx.close(); } catch(e) {}

          return new Blob(mp3Data, { type: 'audio/mp3' });
        } catch(err) {
          console.warn('Erro ao converter áudio do palestrante para MP3:', err);
          return generateValidSilentMp3(2);
        }
      }

      window.saveZipFileWithExplorer = async function() {
        const btn = document.getElementById('btn-save-zip-explorer');
        const progressWrapper = document.getElementById('finish-progress-wrapper');
        const progressBar = document.getElementById('finish-progress-bar');
        const progressPct = document.getElementById('finish-progress-pct');
        const progressStatus = document.getElementById('finish-progress-status');

        if (btn) btn.disabled = true;
        if (progressWrapper) progressWrapper.classList.remove('hidden');

        function updateProgress(pct, statusText) {
          if (progressBar) progressBar.style.width = pct + '%';
          if (progressPct) progressPct.innerText = Math.round(pct) + '%';
          if (progressStatus && statusText) progressStatus.innerText = statusText;
        }

        try {
          updateProgress(5, 'Preparando arquivos para gravação...');
          await new Promise(r => setTimeout(r, 50));

          if (typeof JSZip === 'undefined') {
            throw new Error('Biblioteca JSZip carregando... Tente novamente em 2 segundos.');
          }

          const zip = new JSZip();
          const safeTitle = (meeting.title || 'Reuniao').replace(/[^a-zA-Z0-9_-]/g, '_');
          const dateStr = new Date().toISOString().slice(0, 10);
          const zipFileName = `Gravacao_${safeTitle}_${dateStr}.zip`;

          // 1. Garantir que todas as falas traduzidas tenham áudio MP3 de Sofia e Arthur
          updateProgress(15, 'Validando e preparando áudios com vozes nativas (Sofia e Arthur)...');
          for (const lang of activeTargetLanguages) {
            const list = targetTranscriptions[lang] || [];
            const langInfo = SUPPORTED_LANG_MAP[lang] || { name: lang };

            // Faixa feminina Sofia
            if (!targetAudioBlobsFemale[lang]) targetAudioBlobsFemale[lang] = [];
            if (targetAudioBlobsFemale[lang].length < list.length) {
              const startIdx = targetAudioBlobsFemale[lang].length;
              for (let i = startIdx; i < list.length; i++) {
                const item = list[i];
                if (item && item.text) {
                  updateProgress(15 + Math.round(((i + 1) / list.length) * 10), `Gravando voz nativa Sofia (${langInfo.name}): ${i + 1} de ${list.length}...`);
                  await fetchAudioChunkForExport(lang, item.text, 'female');
                  await new Promise(r => setTimeout(r, 15));
                }
              }
            }

            // Faixa masculina Arthur NATIVA (sem manipulação de pitch)
            if (!targetAudioBlobsMale[lang]) targetAudioBlobsMale[lang] = [];
            if (targetAudioBlobsMale[lang].length < list.length) {
              const startIdx = targetAudioBlobsMale[lang].length;
              for (let i = startIdx; i < list.length; i++) {
                const item = list[i];
                if (item && item.text) {
                  updateProgress(25 + Math.round(((i + 1) / list.length) * 10), `Gravando voz nativa Arthur (${langInfo.name}): ${i + 1} de ${list.length}...`);
                  await fetchAudioChunkForExport(lang, item.text, 'male');
                  await new Promise(r => setTimeout(r, 15));
                }
              }
            }
          }

          // 2. Áudio Original do Palestrante convertido em MP3 (128kbps) com ganho normalizado e yield assíncrono
          updateProgress(40, 'Codificando e normalizando áudio do palestrante em MP3...');
          await new Promise(r => setTimeout(r, 50));

          let rawTransAudio = transmitterRecordedBlob;
          if (!rawTransAudio && transmitterAudioChunks && transmitterAudioChunks.length > 0) {
            rawTransAudio = new Blob(transmitterAudioChunks, { type: 'audio/webm' });
          }

          const speakerMp3Blob = await convertAudioBlobToMp3(rawTransAudio);
          zip.file(`Audio_Palestrante_Original_${safeTitle}.mp3`, speakerMp3Blob);

          // 3. Montagem dos arquivos das traduções (.mp3) com vozes nativas limpas
          updateProgress(55, 'Empacotando faixas traduzidas nativas (Sofia e Arthur)...');
          await new Promise(r => setTimeout(r, 50));

          for (const lang of activeTargetLanguages) {
            const info = SUPPORTED_LANG_MAP[lang] || { name: lang };
            const femaleChunks = (targetAudioBlobsFemale[lang] && targetAudioBlobsFemale[lang].length > 0) ? targetAudioBlobsFemale[lang] : (targetAudioBlobs[lang] || []);
            const maleChunks = targetAudioBlobsMale[lang] || [];

            const langBlobFemale = femaleChunks.length > 0 ? new Blob(femaleChunks, { type: 'audio/mp3' }) : generateValidSilentMp3(3);
            const langBlobMale = maleChunks.length > 0 ? new Blob(maleChunks, { type: 'audio/mp3' }) : generateValidSilentMp3(3);

            zip.file(`Audio_${info.name}_${lang}_Voz_Feminina_Sofia_${safeTitle}.mp3`, langBlobFemale);
            zip.file(`Audio_${info.name}_${lang}_Voz_Masculina_Arthur_${safeTitle}.mp3`, langBlobMale);
          }

          // 4. Legendas .VTT para todos os idiomas
          updateProgress(70, 'Gerando legendas VTT com sincronismo...');
          await new Promise(r => setTimeout(r, 60));

          zip.file(`Legenda_Palestrante_Original_${safeTitle}.vtt`, buildVttString(transmitterTranscriptions, 'Palestrante'));
          for (const lang of activeTargetLanguages) {
            const info = SUPPORTED_LANG_MAP[lang] || { name: lang };
            const list = targetTranscriptions[lang] || [];
            zip.file(`Legenda_${info.name}_${lang}_${safeTitle}.vtt`, buildVttString(list, info.name));
          }

          // 5. Log em Texto Completo
          zip.file(`Transcricao_Completa_${safeTitle}.txt`, buildFullTxtLog());

          // 6. Compactação do ZIP com barra de progresso assíncrona não-bloqueante
          updateProgress(80, 'Compactando pacote ZIP sem travamentos...');
          const zipBlob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 2 } }, (metadata) => {
            const p = 80 + (metadata.percent * 0.20);
            updateProgress(p, 'Compactando pacote ZIP: ' + Math.round(metadata.percent) + '%');
          });

          updateProgress(100, 'Pronto para salvar!');

          // Salvar com Explorer do Windows (showSaveFilePicker)
          if ('showSaveFilePicker' in window) {
            try {
              const handle = await window.showSaveFilePicker({
                suggestedName: zipFileName,
                types: [{
                  description: 'Pacote ZIP com Áudios e Legendas VTT (*.zip)',
                  accept: { 'application/zip': ['.zip'] }
                }]
              });
              const writable = await handle.createWritable();
              await writable.write(zipBlob);
              await writable.close();
              alert('Sucesso! O pacote "' + zipFileName + '" com todos os áudios e legendas VTT foi salvo com sucesso!');
              return;
            } catch(e) {
              if (e.name === 'AbortError') return;
            }
          }

          // Fallback de download direto
          const url = URL.createObjectURL(zipBlob);
          const a = document.createElement('a');
          a.href = url;
          a.download = zipFileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          alert('Pacote ZIP "' + zipFileName + '" baixado com sucesso!');
        } catch(err) {
          alert('Erro ao gerar pacote ZIP: ' + err.message);
        } finally {
          if (btn) btn.disabled = false;
        }
      };

      window.confirmAndExitMeeting = function() {
        if (confirm('Deseja realmente sair da sala e voltar ao painel?')) {
          if (isRealMicActive) stopMasterMicCapture();
          try { flushAllTTSLocutionBuffers(); } catch(e) {}
          try {
            localStorage.removeItem('brain_room_heartbeat_' + id);
            if (typeof roomHeartbeatTimer !== 'undefined') clearInterval(roomHeartbeatTimer);
          } catch(e) {}
          if (mqttPublisherClient && mqttPublisherClient.connected) {
            try {
              mqttPublisherClient.publish('brainaudiovisual/global/active_sessions', JSON.stringify({ id: id, status: 'closed' }), { qos: 0 });
              const safeMeetingMqttId = String(id).replace(/[^a-zA-Z0-9_-]/g, '_');
              mqttPublisherClient.publish('brainaudiovisual/rooms/' + safeMeetingMqttId + '/status', JSON.stringify({ id: id, status: 'closed' }), { qos: 1, retain: true });
            } catch(e) {}
          }
          try {
            fetch(getRoomsEndpointUrl(), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: id, action: 'archive' })
            }).catch(() => {});
          } catch(e) {}
          window.location.href = getAdminBaseUrl('module=translation');
        }
      };

      window.openDedicatedSubtitleOverlay = function() {
        const url = (window.location.protocol === 'file:')
          ? (window.location.pathname + '?meeting=' + encodeURIComponent(id) + '&overlay=subtitles')
          : ('/?meeting=' + encodeURIComponent(id) + '&overlay=subtitles');
        window.open(url, '_blank');
      };

      window.copyTelaoShareLink = function() {
        const url = window.location.origin + window.location.pathname + '?meeting=' + encodeURIComponent(id) + '&overlay=subtitles';
        navigator.clipboard.writeText(url);
        alert('Link da Janela OBS copiado com sucesso!');
      };

      window.toggleTimerPause = function() {
        isTimerPaused = !isTimerPaused;
        const btn = document.getElementById('cockpit-pause-btn');
        if (btn) btn.innerText = isTimerPaused ? 'Retomar' : 'Pausar';
      };

      // Cronômetro global crescente de sessão
      setInterval(() => {
        if (!isTimerPaused) {
          sessionElapsedSeconds++;
          const timerEl = document.getElementById('cockpit-elapsed-timer');
          if (timerEl) timerEl.innerText = formatDuration(sessionElapsedSeconds);
        }
      }, 1000);

      // Loop em tempo real dos VU Meters de Áudio Traduzido & Gravação de cada coluna
      setInterval(() => {
        const now = Date.now();
        activeTargetLanguages.forEach(lang => {
          const els = getTargetColumnElements(lang);
          if (!els.bar || !els.led || !els.textEl) return;

          const shortCode = lang.split('-')[0].toLowerCase();
          const st = targetMeterStates[lang] || targetMeterStates[shortCode];
          const isPlaying = st && st.activeUntil > now;

          if (isPlaying) {
            // Modulação ativa e dinâmica do canal traduzido
            const randLevel = Math.floor(Math.random() * 32) + 68;
            els.bar.style.width = randLevel + '%';
            els.bar.className = 'h-full rounded-full transition-all duration-75 bg-gradient-to-r from-emerald-500 via-teal-400 to-indigo-500 shadow-xs';
            els.textEl.innerText = randLevel + '%';
            els.led.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse';
            if (els.statusEl) els.statusEl.innerText = '● Transmitindo Áudio';
          } else if (isRealMicActive && !isTransmitterMicMuted) {
            // Microfone do palestrante está ativo captando fala: canal traduzido em prontidão imediata
            const activeLevel = Math.max(8, Math.min(30, Math.floor(Math.random() * 12) + 10));
            els.bar.style.width = activeLevel + '%';
            els.bar.className = 'h-full rounded-full transition-all duration-150 bg-emerald-500/60';
            els.textEl.innerText = activeLevel + '%';
            els.led.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400/80';
            if (els.statusEl) els.statusEl.innerText = 'Pronto p/ Traduzir';
          } else {
            // Em espera
            els.bar.style.width = '2%';
            els.bar.className = 'h-full rounded-full transition-all duration-200 bg-slate-300 dark:bg-slate-700';
            els.textEl.innerText = '0%';
            els.led.className = 'w-2.5 h-2.5 rounded-full bg-slate-300 dark:bg-slate-600';
            if (els.statusEl) els.statusEl.innerText = 'Em espera';
          }
        });
      }, 100);
    }

    // ========================================================
    // INICIALIZAÇÃO DO ROTEAMENTO GLOBAL
    // ========================================================
    window.addEventListener('popstate', handleGlobalRouting);
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', handleGlobalRouting);
    } else {
      handleGlobalRouting();
    }

  </script>
</body>
</html>
