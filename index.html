      renderAudienceUI();

      window.changeAudienceLanguage = function(newLang) {
        currentAudienceLang = newLang;
        try { localStorage.setItem('brain_audience_lang', newLang); } catch(e) {}
        
        if ('speechSynthesis' in window) {
          try { window.speechSynthesis.cancel(); } catch(e) {}
        }
        speechQueue = [];
        isSpeakingNow = false;
        startDiscreetVuMeter(false);

        // Dispara imediatamente o batimento de presença para sincronizar o cockpit
        sendAudiencePresenceHeartbeat();

        renderAudienceUI();
      };

      window.setAudienceVolume = function(val) {
        currentVolume = parseFloat(val);
        try { localStorage.setItem('brain_audience_vol', currentVolume); } catch(e) {}
        const el = document.getElementById('audience-vol-value');
        if (el) el.innerText = Math.round(currentVolume * 100) + '%';
      };

      // CONTROLE DE TELA ATIVA (WAKE LOCK) E MANUTENÇÃO EM SEGUNDO PLANO
      function ensureBackgroundAudioCarrier(play = true) {
        if (!backgroundAudioCarrier) {
          try {
            backgroundAudioCarrier = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');
            backgroundAudioCarrier.setAttribute('playsinline', '');
            backgroundAudioCarrier.setAttribute('webkit-playsinline', '');
            backgroundAudioCarrier.loop = true;
            backgroundAudioCarrier.volume = 0.01;
          } catch(e) {}
        }
        if (backgroundAudioCarrier) {
          if (play) {
            try { backgroundAudioCarrier.play().catch(e => {}); } catch(e) {}
          } else {
            try { backgroundAudioCarrier.pause(); } catch(e) {}
          }
        }
      }

      async function acquireWakeLock() {
        if (!isWakeLockEnabled) return;
        try {
          if ('wakeLock' in navigator) {
            wakeLockObj = await navigator.wakeLock.request('screen');
            wakeLockObj.addEventListener('release', () => {
              wakeLockObj = null;
              updateWakeLockUI();
            });
            updateWakeLockUI();
          }
        } catch(e) {
          console.warn('[WakeLock] Info:', e);
        }
      }

      function releaseWakeLock() {
        if (wakeLockObj) {
          try { wakeLockObj.release(); } catch(e) {}
          wakeLockObj = null;
          updateWakeLockUI();
        }
      }

      window.toggleWakeLockManual = function() {
        isWakeLockEnabled = !isWakeLockEnabled;
        if (isWakeLockEnabled) {
          acquireWakeLock();
        } else {
          releaseWakeLock();
        }
        updateWakeLockUI();
      };

      function updateWakeLockUI() {
        const btn = document.getElementById('btn-toggle-wake-lock');
        const textEl = document.getElementById('wake-lock-label');
        const t = getI18n();
        if (btn) {
          if (isWakeLockEnabled) {
            btn.className = 'text-[11px] font-bold px-2.5 py-1.5 rounded-xl border border-amber-400/80 bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-300 transition-all cursor-pointer flex items-center gap-1 shadow-2xs';
            if (textEl) textEl.innerText = t.screenAwakeBtn || 'Tela Ativa';
          } else {
            btn.className = 'text-[11px] font-bold px-2.5 py-1.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 transition-all cursor-pointer flex items-center gap-1 shadow-2xs opacity-70';
            if (textEl) textEl.innerText = t.screenAwakeOff || 'Tela Normal';
          }
        }
      }

      // Ativa o bloqueio de tela por padrão para não desligar
      setTimeout(acquireWakeLock, 800);

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          if (isWakeLockEnabled) acquireWakeLock();
          if (isAudioPlaybackActive) {
            ensureBackgroundAudioCarrier(true);
            if ('speechSynthesis' in window && window.speechSynthesis.paused) {
              try { window.speechSynthesis.resume(); } catch(e) {}
            }
          }
          if (window._mqttAudienceListenerClient && !window._mqttAudienceListenerClient.connected) {
            try { window._mqttAudienceListenerClient.reconnect(); } catch(e) {}
          }
        } else {
          // Quando a tela do celular apaga ou entra em segundo plano:
          if (isAudioPlaybackActive) {
            ensureBackgroundAudioCarrier(true);
          }
        }
      });

      window.testAudienceAudioOutput = function() {
        const t = getI18n();
        if (!('speechSynthesis' in window)) {
          alert(t.notSupportedAlert || 'Síntese de voz não suportada neste navegador.');
          return;
        }
        try {
          window.speechSynthesis.cancel();
          window.speechSynthesis.resume();
        } catch(e) {}

        const persona = getAudienceVoicePersona(selectedVoicePersonaId);
        const utterance = new SpeechSynthesisUtterance(t.audioTestPhrase);
        utterance.lang = currentAudienceLang || 'en-US';
        utterance.volume = Math.max(0.1, currentVolume);
        // Taxa 1.0 direta: sem reamostragem digital para não criar distorção metálica no celular
        utterance.rate = 1.0;

        const voiceResult = getBestVoiceForCurrentLang(persona.gender);
        if (voiceResult && voiceResult.voice) utterance.voice = voiceResult.voice;

        if (persona.gender === 'male') {
          if (voiceResult && voiceResult.isMale) {
            utterance.pitch = (persona.id === 'diego_solene') ? 0.90 : 0.96;
          } else {
            // Conversão de tom para registro barítono masculino autêntico caso o celular só tenha a voz padrão feminina
            utterance.pitch = (persona.id === 'diego_solene') ? 0.72 : (persona.id === 'gabriel_alegre' ? 0.82 : 0.78);
          }
        } else {
          utterance.pitch = (persona.id === 'elena_vibrante') ? 1.04 : 1.00;
        }

        utterance.onstart = () => startDiscreetVuMeter(true);
        utterance.onend = () => startDiscreetVuMeter(false);
        utterance.onerror = () => startDiscreetVuMeter(false);

        window.speechSynthesis.speak(utterance);
      };

      window.toggleAudienceAudioPlayback = function() {
        isAudioPlaybackActive = !isAudioPlaybackActive;
        const t = getI18n();
        const btn = document.getElementById('btn-toggle-audience-audio');
        const dot = document.getElementById('audience-audio-status-dot');

        if (btn) {
          btn.className = isAudioPlaybackActive
            ? AUDIENCE_AUDIO_BTN_ON
            : AUDIENCE_AUDIO_BTN_OFF;
          btn.innerHTML = '<span>' + (isAudioPlaybackActive ? t.audioActive : t.startAudio) + '</span>';
        }

        if (dot) {
          dot.className = isAudioPlaybackActive ? 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse' : 'w-2.5 h-2.5 rounded-full bg-amber-400';
        }

        if (isAudioPlaybackActive) {
          acquireWakeLock();
          ensureBackgroundAudioCarrier(true);

          if ('mediaSession' in navigator) {
            try {
              navigator.mediaSession.metadata = new MediaMetadata({
                title: t.title + ' — ' + t.langName,
                artist: 'Brain Audiovisual',
                album: meeting.title || 'Evento ao Vivo'
              });
              navigator.mediaSession.playbackState = 'playing';
            } catch(e) {}
          }

          // Desbloqueia sintetizador de áudio
          if ('speechSynthesis' in window) {
            try {
              window.speechSynthesis.cancel();
              window.speechSynthesis.resume();
              const persona = getAudienceVoicePersona(selectedVoicePersonaId);
              const phrase = t.audioConnectedPhrase || (t.langName + ' audio connected.');
              const unlock = new SpeechSynthesisUtterance(phrase);
              unlock.lang = currentAudienceLang || 'en-US';
              unlock.volume = 0.08;
              unlock.rate = 1.0;
              const vResult = getBestVoiceForCurrentLang(persona.gender);
              if (vResult && vResult.voice) unlock.voice = vResult.voice;
              if (persona.gender === 'male') {
                unlock.pitch = (vResult && vResult.isMale) ? 0.96 : 0.78;
              } else {
                unlock.pitch = 1.00;
              }
              unlock.onend = () => { processSpeechQueue(); };
              unlock.onerror = () => { processSpeechQueue(); };
              window.speechSynthesis.speak(unlock);
            } catch(e) {}
          }
        } else {
          releaseWakeLock();
          ensureBackgroundAudioCarrier(false);
          if ('mediaSession' in navigator) {
            try { navigator.mediaSession.playbackState = 'paused'; } catch(e) {}
          }
          if ('speechSynthesis' in window) {
            try { window.speechSynthesis.cancel(); } catch(e) {}
          }
          speechQueue = [];
          isSpeakingNow = false;
          startDiscreetVuMeter(false);
        }
      };

      // FILA DE SÍNTESE DE FALA SEQUENCIAL (TTS) HUMANIZADA OTIMIZADA PARA MOBILE
      let speechQueue = [];
      let isSpeakingNow = false;
      let speechQueueWatchdog = null;
      let lastSpokenAudienceText = '';

      function processSpeechQueue() {
        if (!isAudioPlaybackActive || isSpeakingNow || speechQueue.length === 0) return;
        if (!('speechSynthesis' in window)) return;

        try {
          if (window.speechSynthesis.paused) window.speechSynthesis.resume();
        } catch(e) {}

        let nextText = speechQueue.shift();
        if (!nextText || !nextText.trim()) {
          setTimeout(processSpeechQueue, 40);
          return;
        }

        // Concatena blocos subsequentes curtos na fila para leitura fluida e ininterrupta
        while (speechQueue.length > 0 && nextText.split(/\s+/).length < 22) {
          const peek = speechQueue[0];
          if (peek && (nextText.split(/\s+/).length + peek.split(/\s+/).length <= 30)) {
            nextText += ' ' + speechQueue.shift();
          } else {
            break;
          }
        }

        lastSpokenAudienceText = nextText.trim();

        // Garante pontuação final suave para cadência natural humana
        if (!/[.!?]$/.test(nextText)) {
          nextText += '.';
        }

        isSpeakingNow = true;
        const persona = getAudienceVoicePersona(selectedVoicePersonaId);
        const utterance = new SpeechSynthesisUtterance(nextText);
        // CRÍTICO PARA MOBILE: impede que o Garbage Collector do Safari/Chrome no celular destrua a utterance antes do onend
        window._activeAudienceUtterance = utterance;

        utterance.lang = currentAudienceLang || 'en-US';
        utterance.volume = Math.max(0.1, currentVolume);

        // Locução Humana, Fluida e Coesa: velocidade 1.0x (ritmo confortável, natural e sem pressa)
        utterance.rate = 1.00;

        const voiceResult = getBestVoiceForCurrentLang(persona.gender);
        if (voiceResult && voiceResult.voice) utterance.voice = voiceResult.voice;

        // AFINAÇÃO (PITCH): Se a voz do sistema já é nativamente masculina, preserva a afinação original.
        if (persona.gender === 'male') {
          if (voiceResult && voiceResult.isMale) {
            utterance.pitch = (persona.id === 'diego_solene') ? 0.92 : 0.96;
          } else {
            utterance.pitch = (persona.id === 'diego_solene') ? 0.74 : (persona.id === 'gabriel_alegre' ? 0.82 : 0.78);
          }
        } else {
          utterance.pitch = (persona.id === 'elena_vibrante') ? 1.04 : 1.00;
        }

        const finalizeSpeech = () => {
          if (speechQueueWatchdog) clearTimeout(speechQueueWatchdog);
          window._activeAudienceUtterance = null;
          isSpeakingNow = false;
          startDiscreetVuMeter(false);

          // Pausa suave de respiração (220ms) entre trechos falados
          setTimeout(processSpeechQueue, 220);
        };

        utterance.onstart = () => {
          startDiscreetVuMeter(true);
        };
        utterance.onend = finalizeSpeech;
        utterance.onerror = (err) => {
          console.warn('SpeechSynthesis aviso:', err);
          finalizeSpeech();
        };

        // Watchdog adaptado para trechos de áudio maiores (~140ms por caractere)
        const maxExpectedMs = Math.max(5000, nextText.length * 140);
        if (speechQueueWatchdog) clearTimeout(speechQueueWatchdog);
        speechQueueWatchdog = setTimeout(() => {
          if (isSpeakingNow) {
            console.warn('[Audience] Watchdog destravando fala.');
            finalizeSpeech();
          }
        }, maxExpectedMs);

        try {
          if (window.speechSynthesis.paused) window.speechSynthesis.resume();
          window.speechSynthesis.speak(utterance);
        } catch(e) {
          finalizeSpeech();
        }
      }

      function queueAudienceSpeech(text) {
        if (!isAudioPlaybackActive || !text || !text.trim()) return;
        const clean = text.trim();
        if (!clean) return;

        // Trecho de áudio contínuo para locução humana
        speechQueue.push(clean);
        processSpeechQueue();
      }

      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.getVoices(); } catch(e) {}
        window.speechSynthesis.onvoiceschanged = () => {
          try { window.speechSynthesis.getVoices(); } catch(e) {}
        };
      }

      // ROTEAMENTO DE LEGENDAS TRADUZIDAS PARA O ESPECTADOR (FLUXO CONTÍNUO E SEM REPETIÇÃO)
      const audienceSeenPacketIds = new Set();
      const audienceSeenSubtitles = new Map();
      const audienceSeenTTS = new Map();
      let audienceActiveParagraphObj = null;
      let audienceLastSubtitleTime = 0;
      let audienceLastConfirmedTimestamp = 0;

      function createAudienceParagraph(feed, initialText = '') {
        if (feed.lastElementChild) {
          feed.lastElementChild.className = 'leading-relaxed transition-all duration-200 mb-4 whitespace-normal break-words opacity-80 text-slate-700 dark:text-slate-300';
        }

        const p = document.createElement('p');
        p.className = 'speech-paragraph leading-relaxed transition-all duration-300 mb-4 font-normal text-base sm:text-lg whitespace-normal break-words opacity-100 text-slate-900 dark:text-white';

        const tConfirmed = document.createElement('span');
        tConfirmed.className = 'audience-para-confirmed';
        tConfirmed.textContent = initialText || '';

        const tLive = document.createElement('span');
        tLive.className = 'audience-para-live font-normal opacity-90 text-indigo-600 dark:text-indigo-400';

        const tCursor = document.createElement('span');
        tCursor.className = 'streaming-cursor inline-block w-1.5 h-4 ml-1 bg-indigo-500 animate-pulse align-middle rounded-xs';
        tCursor.style.display = initialText ? 'none' : 'inline-block';

        p.appendChild(tConfirmed);
        p.appendChild(tLive);
        p.appendChild(tCursor);
        feed.appendChild(p);

        return {
          p,
          confirmedSpan: tConfirmed,
          liveSpan: tLive,
          cursorEl: tCursor
        };
      }

      async function handleAudienceIncomingSubtitle(data) {
        if (!data) return;

        // 1. DEDUPLICAÇÃO DE PACOTES (impede duplicação entre BroadcastChannel e MQTT)
        const pktId = data.pktId || (data.type + '_' + data.channel + '_' + (data.timestamp || '') + '_' + (data.text || ''));
        if (audienceSeenPacketIds.has(pktId)) return;
        audienceSeenPacketIds.add(pktId);
        if (audienceSeenPacketIds.size > 500) {
          audienceSeenPacketIds.delete(audienceSeenPacketIds.keys().next().value);
        }

        const isStreamTTS = data.type === 'STREAM_TTS';
        const isNewSubtitle = data.type === 'NEW_SUBTITLE';
        const isLiveInterim = data.type === 'LIVE_INTERIM';
        const isCloseParagraph = data.type === 'CLOSE_PARAGRAPH';
        const isSyncSnapshot = data.type === 'SYNC_SNAPSHOT';

        if (!isStreamTTS && !isNewSubtitle && !isLiveInterim && !isCloseParagraph && !isSyncSnapshot) return;

        const currentLangPrefix = (currentAudienceLang || 'en').split('-')[0].toLowerCase();
        const dataChan = (data.channel || '').toLowerCase();

        let isForThisAudience = false;
        if (data.channel === 'all') isForThisAudience = true;
        else if (dataChan === currentLangPrefix) isForThisAudience = true;
        else if (currentLangPrefix === 'en' && (dataChan === 'en' || dataChan === 'receiver' || dataChan === 'en-us')) isForThisAudience = true;
        else if (currentLangPrefix === 'es' && (dataChan === 'es' || dataChan === 'spanish' || dataChan === 'es-es')) isForThisAudience = true;
        else if (currentLangPrefix === 'fr' && (dataChan === 'fr' || dataChan === 'french' || dataChan === 'fr-fr')) isForThisAudience = true;
        else if (currentLangPrefix === 'de' && (dataChan === 'de' || dataChan === 'german' || dataChan === 'de-de')) isForThisAudience = true;
        else if (currentLangPrefix === 'it' && (dataChan === 'it' || dataChan === 'italian' || dataChan === 'it-it')) isForThisAudience = true;
        else if (currentLangPrefix === 'ar' && (dataChan === 'ar' || dataChan === 'arabic' || dataChan === 'ar-sa')) isForThisAudience = true;
        else if (dataChan === currentAudienceLang.toLowerCase()) isForThisAudience = true;

        if (!isForThisAudience) return;

        const now = Date.now();

        // 1. STREAM_TTS: locução sintetizada da frase traduzida completa
        if (isStreamTTS) {
          const text = (data.text || '').trim();
          if (!text) return;

          // Chave de desduplicação fonética/textual normalizada
          const normTTS = cleanNorm(text);
          if (audienceSeenTTS.has(normTTS)) {
            const lastTTSSeen = audienceSeenTTS.get(normTTS);
            if (now - lastTTSSeen < 3500) return;
          }
          audienceSeenTTS.set(normTTS, now);
          if (audienceSeenTTS.size > 200) {
            audienceSeenTTS.delete(audienceSeenTTS.keys().next().value);
          }

          queueAudienceSpeech(text);
          return;
        }

        const feed = document.getElementById('audience-subtitles-feed');
        if (!feed) return;

        const emptyP = feed.querySelector('.placeholder-empty');
        if (emptyP) emptyP.remove();

        // 2. CLOSE_PARAGRAPH: fecha o parágrafo ativo e desativa cursor
        if (isCloseParagraph) {
          if (audienceActiveParagraphObj) {
            // SALVAGUARDA TOTAL DE INTERIM AO FECHAR PARÁGRAFO:
            // Se existia texto no liveSpan que ainda não foi commitado por NEW_SUBTITLE,
            // NUNCA descarta esse texto! Salva-o no confirmedSpan antes de fechar!
            if (audienceActiveParagraphObj.liveSpan && audienceActiveParagraphObj.liveSpan.textContent.trim()) {
              const remaining = audienceActiveParagraphObj.liveSpan.textContent.trim();
              const prev = audienceActiveParagraphObj.confirmedSpan.textContent.trim();
              const normPrev = cleanNorm(prev);
              const normRem = cleanNorm(remaining);
              if (normRem && !normPrev.endsWith(normRem) && normPrev !== normRem) {
                audienceActiveParagraphObj.confirmedSpan.textContent = prev ? (prev + ' ' + remaining) : remaining;
              }
              audienceActiveParagraphObj.liveSpan.textContent = '';
            }
            if (audienceActiveParagraphObj.cursorEl) audienceActiveParagraphObj.cursorEl.style.display = 'none';
            if (audienceActiveParagraphObj.liveSpan) audienceActiveParagraphObj.liveSpan.textContent = '';
            if (audienceActiveParagraphObj.p) {
              audienceActiveParagraphObj.p.className = 'leading-relaxed transition-all duration-300 mb-4 whitespace-normal break-words opacity-85 text-slate-800 dark:text-slate-200';
            }
            audienceActiveParagraphObj = null;
          }
          return;
        }

        // 3. SYNC_SNAPSHOT: reconciliação automática de estado para garantir 100% de paridade com o Cockpit
        if (isSyncSnapshot) {
          const snapshotText = (data.fullParagraph || '').trim();
          if (!snapshotText) return;

          if (audienceActiveParagraphObj && audienceActiveParagraphObj.confirmedSpan) {
            const currentConfirmed = audienceActiveParagraphObj.confirmedSpan.textContent.trim();
            // Se o snapshot do Cockpit for mais completo que o texto local do espectador, reconcilia imediatamente
            if (snapshotText.length > currentConfirmed.length) {
              audienceActiveParagraphObj.confirmedSpan.textContent = snapshotText;
              feed.scrollTop = feed.scrollHeight;
            }
          } else if (snapshotText) {
            audienceActiveParagraphObj = createAudienceParagraph(feed, snapshotText);
            feed.scrollTop = feed.scrollHeight;
          }
          return;
        }

        // 4. LIVE_INTERIM: transcrição/tradução instantânea palavra a palavra com cursor
        if (isLiveInterim) {
          const interimText = (data.text || '').trim();
          if (!interimText) {
            // Não apaga cegamente o liveSpan se ele tiver texto substantivo,
            // aguarda o NEW_SUBTITLE chegar para fazer a transição limpa.
            return;
          }

          if (!audienceActiveParagraphObj || !audienceActiveParagraphObj.p || !audienceActiveParagraphObj.p.isConnected) {
            audienceActiveParagraphObj = createAudienceParagraph(feed);
            audienceActiveParagraphObj.liveSpan.textContent = ' ' + interimText;
            if (audienceActiveParagraphObj.cursorEl) audienceActiveParagraphObj.cursorEl.style.display = 'inline-block';
          } else {
            // SALVAGUARDA DE TRANSIÇÃO ENTRE FRASES:
            // Se o liveSpan atual já tinha texto longo (>= 4 palavras) e o novo interim
            // claramente pertence a outra sentença (não é extensão do atual):
            const currentLive = audienceActiveParagraphObj.liveSpan.textContent.trim();
            if (currentLive && currentLive.split(/\s+/).length >= 4) {
              const normLive = cleanNorm(currentLive);
              const normNew = cleanNorm(interimText);
              const prefixCheck = normLive.substring(0, Math.min(25, normLive.length));
              if (!normNew.startsWith(prefixCheck)) {
                // Comita o texto anterior de salvaguarda para NUNCA perder o que a plateia viu!
                const prev = audienceActiveParagraphObj.confirmedSpan.textContent.trim();
                const normPrev = cleanNorm(prev);
                if (!normPrev.endsWith(normLive) && normPrev !== normLive) {
                  audienceActiveParagraphObj.confirmedSpan.textContent = prev ? (prev + ' ' + currentLive) : currentLive;
                }
              }
            }
            audienceActiveParagraphObj.liveSpan.textContent = ' ' + interimText;
            if (audienceActiveParagraphObj.cursorEl) audienceActiveParagraphObj.cursorEl.style.display = 'inline-block';
          }

          audienceLastSubtitleTime = now;
          feed.scrollTop = feed.scrollHeight;
          return;
        }

        // 5. NEW_SUBTITLE: frase traduzida finalizada
        const text = (data.text || '').trim();
        if (!text) return;

        const normText = cleanNorm(text);
        if (!normText) return;

        audienceLastConfirmedTimestamp = data.timestamp || now;

        // Se o Cockpit enviou o texto completo consolidado do parágrafo ativo (cockpitFullText),
        // usamos para garantir que NENHUMA palavra dita no Cockpit seja perdida aqui!
        if (data.cockpitFullText && typeof data.cockpitFullText === 'string') {
          const cockpitFull = data.cockpitFullText.trim();
          if (cockpitFull) {
            if (!audienceActiveParagraphObj || !audienceActiveParagraphObj.p || !audienceActiveParagraphObj.p.isConnected) {
              audienceActiveParagraphObj = createAudienceParagraph(feed, cockpitFull);
            } else {
              const currentConfirmed = audienceActiveParagraphObj.confirmedSpan.textContent.trim();
              if (cockpitFull.length >= currentConfirmed.length || !currentConfirmed) {
                audienceActiveParagraphObj.confirmedSpan.textContent = cockpitFull;
              } else {
                const normCur = cleanNorm(currentConfirmed);
                if (!normCur.endsWith(normText) && normCur !== normText) {
                  audienceActiveParagraphObj.confirmedSpan.textContent = currentConfirmed + ' ' + text;
                }
              }
              audienceActiveParagraphObj.liveSpan.textContent = '';
              if (audienceActiveParagraphObj.cursorEl) audienceActiveParagraphObj.cursorEl.style.display = 'none';
            }
            audienceLastSubtitleTime = now;
            while (feed.children.length > 50) feed.removeChild(feed.firstChild);
            feed.scrollTop = feed.scrollHeight;
            return;
          }
        }

        // Fallback padrão se não houver cockpitFullText
        if (!audienceActiveParagraphObj || !audienceActiveParagraphObj.p || !audienceActiveParagraphObj.p.isConnected) {
          audienceActiveParagraphObj = createAudienceParagraph(feed, text);
        } else {
          const prev = audienceActiveParagraphObj.confirmedSpan.textContent.trim();
          const normPrev = cleanNorm(prev);
          if (!normPrev.endsWith(normText) && normPrev !== normText) {
            audienceActiveParagraphObj.confirmedSpan.textContent = prev ? (prev + ' ' + text) : text;
          }
          audienceActiveParagraphObj.liveSpan.textContent = '';
          if (audienceActiveParagraphObj.cursorEl) audienceActiveParagraphObj.cursorEl.style.display = 'none';
        }

        audienceLastSubtitleTime = now;
        while (feed.children.length > 50) feed.removeChild(feed.firstChild);
        feed.scrollTop = feed.scrollHeight;
      }

      // 1. SINCRONIZAÇÃO LOCAL (BroadcastChannel)
      try {
        const channel = new BroadcastChannel('brain_subtitles_channel');
        channel.onmessage = (event) => {
          handleAudienceIncomingSubtitle(event.data);
        };
      } catch(e) {}

      // 2. SINCRONIZAÇÃO GLOBAL EM NUVEM (MQTT) E PRESENÇA DE AUDIÊNCIA
      const safeMeetingMqttId = encodeURIComponent((id || '').toLowerCase().trim()).replace(/[^a-z0-9_-]/g, '_');
      const mqttTopic = 'brainaudiovisual/meeting/' + safeMeetingMqttId + '/subtitles';
      const mqttPresenceTopic = 'brainaudiovisual/meeting/' + safeMeetingMqttId + '/presence';

      const audienceSessionId = 'aud_' + Math.random().toString(36).substring(2, 9);
      let presenceBc = null;
      try { presenceBc = new BroadcastChannel('brain_presence_' + safeMeetingMqttId); } catch(e) {}

      function sendAudiencePresenceHeartbeat() {
        const payload = {
          type: 'HEARTBEAT',
          meetingId: id,
          lang: currentAudienceLang,
          clientId: audienceSessionId,
          timestamp: Date.now()
        };
        try { if (presenceBc) presenceBc.postMessage(payload); } catch(e) {}
        try {
          if (window._mqttAudienceListenerClient && window._mqttAudienceListenerClient.connected) {
            window._mqttAudienceListenerClient.publish(mqttPresenceTopic, JSON.stringify(payload), { qos: 0 });
          }
        } catch(e) {}
        try { localStorage.setItem('brain_presence_ping_' + safeMeetingMqttId, JSON.stringify(payload)); } catch(e) {}
      }

      const audienceHeartbeatTimer = setInterval(sendAudiencePresenceHeartbeat, 3000);
      setTimeout(sendAudiencePresenceHeartbeat, 500);
      window.addEventListener('beforeunload', () => {
        clearInterval(audienceHeartbeatTimer);
      });

      try {
        if (typeof mqtt !== 'undefined') {
          const mqttAudienceClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId: 'brain_aud_' + Math.random().toString(16).substring(2, 8),
            clean: true,
            connectTimeout: 7000,
            reconnectPeriod: 2500,
            keepalive: 15
          });
          window._mqttAudienceListenerClient = mqttAudienceClient;
          mqttAudienceClient.on('connect', () => {
            mqttAudienceClient.subscribe(mqttTopic, { qos: 0 });
            sendAudiencePresenceHeartbeat();
            const badge = document.getElementById('audience-cloud-status-badge');
            if (badge) {
              const curI18n = audienceI18n[currentAudienceLang] || audienceI18n['en-US'];
              badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> ' + curI18n.connected;
            }
          });
          mqttAudienceClient.on('message', (topic, payload) => {
            try {
              const parsed = JSON.parse(payload.toString());
              handleAudienceIncomingSubtitle(parsed);
            } catch(e) {}
          });
        }
      } catch(e) {}
    }


    function renderMeetingRoomMonitor(id) {
      let isTimerPaused = false;
      let sessionElapsedSeconds = 0;
      let latency = 24;
      let currentUtteranceSeq = 0;

      function cleanNorm(s) {
        return (s || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[.,!?;:«»""'']/g, ' ').replace(/\s+/g, ' ').trim();
      }

      // 1. CARREGA DADOS DA REUNIÃO (LOCALSTORAGE OU NUVEM REMOTA) IMEDIATAMENTE
      let meeting = null;
      try {
        const saved = JSON.parse(localStorage.getItem('brain_saved_meetings') || '[]');
        meeting = saved.find(m => m.id === id);
      } catch(e) {}

      if (!meeting && window._remoteActiveRooms && window._remoteActiveRooms[id]) {
        meeting = Object.assign({}, window._remoteActiveRooms[id]);
      }
      if (!meeting) {
        try {
          const remoteSaved = JSON.parse(localStorage.getItem('brain_remote_room_' + id) || 'null');
          if (remoteSaved) meeting = remoteSaved;
        } catch(e) {}
      }

      if (!meeting) {
        meeting = {
          id: id,
          title: 'Sessão de Tradução — ' + id,
          createdAt: new Date().toISOString(),
          sourceLanguage: 'pt-BR',
          autoDetectLanguage: true,
          targetLanguages: ['en-US', 'es-ES'],
          inputDevice: 'default'
        };
      }

      let isCoHostMode = false;
      try {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('cohost') === 'true') {
          isCoHostMode = true;
        } else {
          const savedMeetings = JSON.parse(localStorage.getItem('brain_saved_meetings') || '[]');
          const isLocallySaved = savedMeetings.some(m => m.id === id);
          if (!isLocallySaved) {
            isCoHostMode = true;
          }
          if (meeting && meeting.isRemote) {
            isCoHostMode = true;
          }
        }
      } catch(e) {}

      if (meeting && typeof meeting.elapsedSeconds === 'number' && meeting.elapsedSeconds > 0) {
        sessionElapsedSeconds = meeting.elapsedSeconds;
      }

      const safeMeetingMqttId = encodeURIComponent((id || '').toLowerCase().trim()).replace(/[^a-z0-9_-]/g, '_');
      const mqttMeetingTopic = 'brainaudiovisual/meeting/' + safeMeetingMqttId + '/subtitles';
      const mqttPresenceTopic = 'brainaudiovisual/meeting/' + safeMeetingMqttId + '/presence';
      const mqttVuTopic = 'brainaudiovisual/meeting/' + safeMeetingMqttId + '/vu';
      const mqttHistoryReqTopic = 'brainaudiovisual/meeting/' + safeMeetingMqttId + '/history_request';
      const mqttHistoryResTopic = 'brainaudiovisual/meeting/' + safeMeetingMqttId + '/history_response';
      let mqttPublisherClient = null;
      let lastVuBroadcastTime = 0;

      // Mapeamento e metadados de idiomas
      const SUPPORTED_LANG_MAP = {
        'pt-BR': { name: 'Português', tag: 'PT', code: 'pt', channel: 'transmitter' },
        'en-US': { name: 'Inglês', tag: 'EN', code: 'en', channel: 'receiver' },
        'es-ES': { name: 'Espanhol', tag: 'ES', code: 'es', channel: 'spanish' },
        'fr-FR': { name: 'Francês', tag: 'FR', code: 'fr', channel: 'french' },
        'de-DE': { name: 'Alemão', tag: 'DE', code: 'de', channel: 'german' },
        'it-IT': { name: 'Italiano', tag: 'IT', code: 'it', channel: 'italian' },
        'ar-SA': { name: 'Árabe (Fusha)', tag: 'AR', code: 'ar', channel: 'arabic' },
        'zh-CN': { name: 'Mandarim', tag: 'ZH', code: 'zh', channel: 'chinese' },
        'ja-JP': { name: 'Japonês', tag: 'JA', code: 'ja', channel: 'japanese' }
      };

      let selectedSourceLanguage = meeting.sourceLanguage || 'pt-BR';
      let isAutoDetectLanguage = meeting.autoDetectLanguage !== false;
      let activeTargetLanguages = meeting.targetLanguages && meeting.targetLanguages.length ? meeting.targetLanguages : ['en-US', 'es-ES'];

      // Estado do Microfone do Palestrante
      let isRealMicActive = false;
      let isTransmitterMicMuted = false;
      let selectedMicDeviceId = meeting.inputDevice || localStorage.getItem('brain_selected_mic_device') || 'default';
      let micMediaStream = null;
      let micAudioContext = null;
      let micAnalyserNode = null;
      let micMediaRecorder = null;
      let micVuAnimFrameId = null;

      // SISTEMA DE MONITORAMENTO EM TEMPO REAL DE ESPECTADORES POR IDIOMA
      const audiencePresenceClients = new Map(); // clientId -> { lang, timestamp }

      // 2. IDENTIFICAÇÃO GEOGRÁFICA E HEARTBEAT GLOBAL
      let currentClientGeoLocation = null;
      getApproximateGeoLocation().then(geo => {
        currentClientGeoLocation = geo;
        pulseRoomActiveHeartbeat();
      });

      function getRoomsEndpointUrl() {
        if (window.location.protocol === 'file:') return 'rooms.php';
        return new URL('rooms.php', window.location.href).href;
      }

      // Heartbeat periódico da sala ativa (transmite para Nuvem Global MQTT & rooms.php a cada 3.5s)
      function pulseRoomActiveHeartbeat() {
        const now = Date.now();
        try {
          localStorage.setItem('brain_room_heartbeat_' + id, now.toString());
        } catch(e) {}

        const roomPayload = {
          id: id,
          title: meeting.title || ('Sessão de Tradução ' + id),
          sourceLanguage: selectedSourceLanguage || meeting.sourceLanguage || 'pt-BR',
          targetLanguages: activeTargetLanguages || meeting.targetLanguages || ['en-US', 'es-ES'],
          autoDetectLanguage: !!isAutoDetectLanguage,
          createdAt: meeting.createdAt || new Date().toISOString(),
          startTime: (meeting.startTime || (now - sessionElapsedSeconds * 1000)),
          elapsedSeconds: sessionElapsedSeconds,
          isLive: isRealMicActive || !isTimerPaused,
          isMicActive: isRealMicActive,
          audienceCount: audiencePresenceClients.size,
          location: currentClientGeoLocation,
          lastSeen: now
        };

        // 1. Publica no broker MQTT Global (notifica monitores em qualquer navegador no mundo com retain)
        if (mqttPublisherClient && mqttPublisherClient.connected) {
          try {
            mqttPublisherClient.publish('brainaudiovisual/global/active_sessions', JSON.stringify(roomPayload), { qos: 0 });
            const safeMeetingMqttId = String(id).replace(/[^a-zA-Z0-9_-]/g, '_');
            mqttPublisherClient.publish('brainaudiovisual/rooms/' + safeMeetingMqttId + '/status', JSON.stringify(roomPayload), { qos: 1, retain: true });
          } catch(e) {}
        }

        // 2. Notifica o backend HTTP rooms.php
        try {
          fetch(getRoomsEndpointUrl(), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(roomPayload)
          }).catch(() => {});
        } catch(e) {}
      }
      pulseRoomActiveHeartbeat();
      const roomHeartbeatTimer = setInterval(pulseRoomActiveHeartbeat, 3500);

      window.addEventListener('beforeunload', () => {
        clearInterval(roomHeartbeatTimer);
        try {
          localStorage.removeItem('brain_room_heartbeat_' + id);
        } catch(e) {}
        if (mqttPublisherClient && mqttPublisherClient.connected) {
          try {
            mqttPublisherClient.publish('brainaudiovisual/global/active_sessions', JSON.stringify({ id: id, status: 'closed' }), { qos: 0 });
            const safeMeetingMqttId = String(id).replace(/[^a-zA-Z0-9_-]/g, '_');
            mqttPublisherClient.publish('brainaudiovisual/rooms/' + safeMeetingMqttId + '/status', JSON.stringify({ id: id, status: 'closed' }), { qos: 1, retain: true });
          } catch(e) {}
        }
        try {
          fetch(getRoomsEndpointUrl(), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id, action: 'archive' })
          }).catch(() => {});
        } catch(e) {}
      });

      // Estilos independentes por coluna
      let transSubtitleConfig = {
        bgColor: '#000000',
        textColor: '#ffffff',
        fontSize: '16px',
        fontFamily: 'font-sans'
      };
      try {
        const s = localStorage.getItem('brain_trans_subtitle_style');
        if (s) transSubtitleConfig = Object.assign(transSubtitleConfig, JSON.parse(s));
      } catch(e) {}

      let targetColumnConfigs = {};
      activeTargetLanguages.forEach(lang => {
        const defaultColor = lang === 'en-US' ? '#fde047' : (lang === 'es-ES' ? '#38bdf8' : (lang === 'ar-SA' ? '#34B886' : '#c084fc'));
        targetColumnConfigs[lang] = {
          bgColor: '#000000',
          textColor: defaultColor,
          fontSize: '16px',
          fontFamily: 'font-sans'
        };
        try {
          const s = localStorage.getItem('brain_target_style_' + lang);
          if (s) targetColumnConfigs[lang] = Object.assign(targetColumnConfigs[lang], JSON.parse(s));
        } catch(e) {}
      });

      // Estado de Parágrafos Contínuos (Transmissor e Canais Traduzidos)
      let activeSpeechParagraphSeq = 0;
      let currentTransmitterParagraph = null; // { id, el, confirmedSpan, liveSpan, cursorEl, startTime }
      let currentTargetParagraphs = {};       // { [langCode]: { id, el, confirmedSpan, liveSpan, cursorEl } }
      let paragraphPauseTimer = null;         // Silêncio significante (2.5s) que fecha o parágrafo
      let liveTranslationDebounceTimer = null;
      let liveTranslationSeq = 0;
      let finalizedUtteranceIndices = new Set();
      let lastConfirmedCleanTranscript = '';
      let lastConfirmedTimestamp = 0;

      // Histórico de transcrições e áudios gravados
      let transmitterTranscriptions = []; // { text, timeStart, timeEnd }
      let targetTranscriptions = {};     // langCode -> [{ text, timeStart, timeEnd }]
      activeTargetLanguages.forEach(l => { targetTranscriptions[l] = []; });

      // Buffers de áudio para exportação sem travamento
      let transmitterAudioChunks = [];
      let transmitterRecordedBlob = null;
      let isRecordingTransmitter = false;

      let targetAudioBlobs = {}; // langCode -> [Blob]
      let targetAudioBlobsFemale = {}; // langCode -> [Blob] (faixa feminina padrão Sofia)
      let targetAudioBlobsMale = {}; // langCode -> [Blob] (faixa masculina padrão Arthur)
      let targetMeterStates = {}; // langCode -> { activeUntil: timestamp }
      activeTargetLanguages.forEach(l => { 
        targetAudioBlobs[l] = []; 
        targetAudioBlobsFemale[l] = []; 
        targetAudioBlobsMale[l] = []; 
        targetMeterStates[l] = { activeUntil: 0 };
      });

      // Estado de Reconhecimento Contínuo de Fala
      let speechRecognizer = null;
      let isTranscribingSpeech = false;
      let isStartingSpeechRecognition = false;
      let speechInterimBuffer = '';
      let speechSilenceCommitTimer = null;
      let lastSpeechActivityTimestamp = Date.now();
      let lastCommittedSpeechText = '';
      let lastCommittedSpeechTimestamp = 0;
      let speechWatchdogInterval = null;
      let speechRecognizerRestartTimeout = null;
      let isSpeechCycleRestarting = false;

      // Estado de Transcrição e Broadcast

      function handleAudiencePresencePing(data) {
        if (!data || !data.clientId || !data.lang) return;
        audiencePresenceClients.set(data.clientId, {
          lang: data.lang,
          timestamp: Date.now()
        });
        refreshAudienceLiveCounters();
      }

      function refreshAudienceLiveCounters() {
        const now = Date.now();
        // Remove ouvintes inativos há mais de 8 segundos
        for (const [clientId, info] of audiencePresenceClients.entries()) {
          if (now - info.timestamp > 8000) {
            audiencePresenceClients.delete(clientId);
          }
        }

        const countsByLang = {};
        for (const info of audiencePresenceClients.values()) {
          const full = info.lang;
          const short = (info.lang || '').split('-')[0].toLowerCase();
          countsByLang[full] = (countsByLang[full] || 0) + 1;
          countsByLang[short] = (countsByLang[short] || 0) + 1;
        }

        // Atualiza contadores em cada coluna de idioma traduzido
        const allKnownLangs = ['en-US', 'es-ES', 'pt-BR', 'fr-FR', 'de-DE', 'it-IT', 'ar-SA', 'zh-CN', 'ja-JP'];
        allKnownLangs.forEach(code => {
          const short = code.split('-')[0].toLowerCase();
          const total = countsByLang[code] || countsByLang[short] || 0;
          const countEl = document.getElementById('target-audience-count-num-' + code) || document.getElementById('target-audience-count-num-' + short);
          if (countEl) countEl.innerText = total;
        });

        // Atualiza contador da coluna de Português em Prontidão
        const ptTotal = countsByLang['pt-BR'] || countsByLang['pt'] || 0;
        const ptCountEl = document.getElementById('target-audience-count-num-pt-standby');
        if (ptCountEl) ptCountEl.innerText = ptTotal;
      }

      // Escuta presenças locais via BroadcastChannel e LocalStorage
      try {
        const presenceBc = new BroadcastChannel('brain_presence_' + safeMeetingMqttId);
        presenceBc.onmessage = (e) => handleAudiencePresencePing(e.data);
      } catch(e) {}

      window.addEventListener('storage', (e) => {
        if (e.key === 'brain_presence_ping_' + safeMeetingMqttId && e.newValue) {
          try { handleAudiencePresencePing(JSON.parse(e.newValue)); } catch(err) {}
        }
      });

      setInterval(refreshAudienceLiveCounters, 1500);

      // ESTADO DA COLUNA DE PORTUGUÊS EM PRONTIDÃO
      let isPtColumnExpanded = false;
      window.togglePtColumnExpansion = function() {
        isPtColumnExpanded = !isPtColumnExpanded;
        const standbyBanner = document.getElementById('pt-standby-banner');
        const fullCol = document.getElementById('pt-full-translated-column');
        if (standbyBanner && fullCol) {
          if (isPtColumnExpanded) {
            standbyBanner.classList.add('hidden');
            fullCol.classList.remove('hidden');
          } else {
            standbyBanner.classList.remove('hidden');
            fullCol.classList.add('hidden');
          }
        }
      };

      // Sincronização Local (BroadcastChannel) e Nuvem (MQTT)
      let subtitleBroadcast = null;
      try {
        subtitleBroadcast = new BroadcastChannel('brain_subtitles_channel');
      } catch(e) {}

      // Funções de Espelhamento em Tempo Real para o Co-Host
      function mirrorRemoteTransmitterSubtitle(cleanText, startSec, endSec) {
        if (!cleanText || !cleanText.trim()) return;
        const para = getOrCreateActiveParagraph();
        if (para && para.confirmedSpan) {
          const prev = para.confirmedSpan.textContent.trim();
          const normClean = cleanNorm(cleanText);
          const normPrev = cleanNorm(prev);
          if (normClean && (normPrev.endsWith(normClean) || normPrev === normClean)) {
            para.liveSpan.textContent = '';
          } else {
            para.confirmedSpan.textContent = prev ? (prev + ' ' + cleanText) : cleanText;
            para.liveSpan.textContent = '';
          }
        } else {
          const feed = document.getElementById('transmitter-transcription-feed');
          if (feed) {
            const empty = feed.querySelector('.placeholder-empty');
            if (empty) empty.remove();
            const div = document.createElement('div');
            div.className = 'speech-paragraph text-sm sm:text-base leading-relaxed whitespace-normal break-words mb-3';
            div.innerHTML = `<span class="para-confirmed">${cleanText}</span><span class="para-live font-normal"></span>`;
            feed.appendChild(div);
          }
        }
        transmitterTranscriptions.push({ text: cleanText, timeStart: startSec || 0, timeEnd: endSec || 0 });
        const box = document.getElementById('transmitter-subtitle-box');
        if (box) box.scrollTop = box.scrollHeight;
      }

      function mirrorRemoteTransmitterInterim(interimText) {
        const para = getOrCreateActiveParagraph();
        if (para && para.liveSpan) {
          para.liveSpan.textContent = interimText ? (' ' + interimText) : '';
        }
        const box = document.getElementById('transmitter-subtitle-box');
        if (box) box.scrollTop = box.scrollHeight;
      }

      function mirrorRemoteTargetSubtitle(targetLang, cleanText, startSec, endSec) {
        if (!cleanText || !cleanText.trim()) return;
        getOrCreateActiveParagraph();
        let tp = currentTargetParagraphs[targetLang];
        if (!tp) {
          const short = targetLang.split('-')[0].toLowerCase();
          const matchedKey = Object.keys(currentTargetParagraphs).find(k => k.toLowerCase().startsWith(short));
          if (matchedKey) tp = currentTargetParagraphs[matchedKey];
        }
        if (tp && tp.confirmedSpan) {
          const prev = tp.confirmedSpan.textContent.trim();
          const normClean = cleanNorm(cleanText);
          const normPrev = cleanNorm(prev);
          if (normClean && (normPrev.endsWith(normClean) || normPrev === normClean)) {
            tp.liveSpan.textContent = '';
          } else {
            tp.confirmedSpan.textContent = prev ? (prev + ' ' + cleanText) : cleanText;
            tp.liveSpan.textContent = '';
          }
          const els = getTargetColumnElements(targetLang);
          if (els && els.box) els.box.scrollTop = els.box.scrollHeight;
        } else {
          const els = getTargetColumnElements(targetLang);
          if (els && els.feed) {
            const empty = els.feed.querySelector('.placeholder-empty');
            if (empty) empty.remove();
            const div = document.createElement('div');
            div.className = 'speech-paragraph text-sm sm:text-base leading-relaxed whitespace-normal break-words mb-3';
            div.innerHTML = `<span class="para-confirmed">${cleanText}</span><span class="para-live font-normal"></span>`;
            els.feed.appendChild(div);
            if (els.box) els.box.scrollTop = els.box.scrollHeight;
          }
        }
        if (!targetTranscriptions[targetLang]) targetTranscriptions[targetLang] = [];
        targetTranscriptions[targetLang].push({ text: cleanText, timeStart: startSec || 0, timeEnd: endSec || 0 });
      }

      function mirrorRemoteTargetInterim(targetLang, interimText) {
        getOrCreateActiveParagraph();
        let tp = currentTargetParagraphs[targetLang];
        if (!tp) {
          const short = targetLang.split('-')[0].toLowerCase();
          const matchedKey = Object.keys(currentTargetParagraphs).find(k => k.toLowerCase().startsWith(short));
          if (matchedKey) tp = currentTargetParagraphs[matchedKey];
        }
        if (tp && tp.liveSpan) {
          tp.liveSpan.textContent = interimText ? (' ' + interimText) : '';
          const els = getTargetColumnElements(targetLang);
          if (els && els.box) els.box.scrollTop = els.box.scrollHeight;
        }
      }

      const _pendingMqttQueue = [];
      const _cockpitSubtitleSeq = {};
      let _cockpitSyncSnapshotTimer = null;

      function getCockpitParagraphText(channel) {
        const norm = (channel || '').toLowerCase();
        if (norm === 'transmitter' || norm === 'pt' || norm === 'pt-br') {
          if (currentTransmitterParagraph && currentTransmitterParagraph.confirmedSpan) {
            return currentTransmitterParagraph.confirmedSpan.textContent.trim();
          }
        }
        for (const lang of Object.keys(currentTargetParagraphs)) {
          const code = lang.split('-')[0].toLowerCase();
          if (code === norm || lang.toLowerCase() === norm) {
            const tp = currentTargetParagraphs[lang];
            if (tp && tp.confirmedSpan) {
              return tp.confirmedSpan.textContent.trim();
            }
          }
        }
        return '';
      }

      function broadcastSyncSnapshotGlobally() {
        if (!mqttPublisherClient || !mqttPublisherClient.connected) return;
        // Para cada idioma com parágrafo ativo no Cockpit, emite um snapshot leve de reconciliação
        const channels = ['transmitter', 'en', 'es', 'fr', 'de', 'it', 'ar'];
        channels.forEach(ch => {
          const txt = getCockpitParagraphText(ch);
          if (txt) {
            const payload = {
              type: 'SYNC_SNAPSHOT',
              meetingId: id,
              channel: ch,
              fullParagraph: txt,
              timestamp: Date.now()
            };
            try {
              mqttPublisherClient.publish(mqttMeetingTopic, JSON.stringify(payload), { qos: 0 });
            } catch(e) {}
          }
        });
      }

      function connectCockpitMqtt() {
        if (typeof mqtt === 'undefined') return;
        try {
          mqttPublisherClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId: 'brain_cockpit_' + Math.random().toString(16).substring(2, 8),
            clean: true,
            connectTimeout: 7000,
            reconnectPeriod: 2500,
            keepalive: 15
          });

          mqttPublisherClient.on('connect', () => {
            const badge = document.getElementById('cockpit-mqtt-badge');
            if (badge) {
              badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Nuvem Conectada (24ms)';
              badge.className = 'text-[11px] font-bold px-2.5 py-1 rounded-full bg-emerald-50 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-700 flex items-center gap-1.5 shadow-2xs';
            }
            mqttPublisherClient.subscribe(mqttPresenceTopic, { qos: 0 });
            mqttPublisherClient.subscribe('brainaudiovisual/global/active_sessions/ping', { qos: 0 });
            mqttPublisherClient.subscribe(mqttMeetingTopic, { qos: 1 });
            mqttPublisherClient.subscribe(mqttVuTopic, { qos: 0 });

            // Descarrega fila pendente de mensagens perdidas durante eventuais desconexões
            while (_pendingMqttQueue.length > 0) {
              const item = _pendingMqttQueue.shift();
              try {
                mqttPublisherClient.publish(item.topic, JSON.stringify(item.payload), { qos: item.qos || 1 });
              } catch(e) {}
            }

            if (!isCoHostMode) {
              pulseRoomActiveHeartbeat();
            }

            // Inicia timer de sincronização de snapshot de parágrafo a cada 3.5 segundos
            if (_cockpitSyncSnapshotTimer) clearInterval(_cockpitSyncSnapshotTimer);
            _cockpitSyncSnapshotTimer = setInterval(broadcastSyncSnapshotGlobally, 3500);
          });

          mqttPublisherClient.on('message', (topic, payload) => {
            try {
              if (topic.endsWith('/presence')) {
                const data = JSON.parse(payload.toString());
                handleAudiencePresencePing(data);
              } else if (topic === 'brainaudiovisual/global/active_sessions/ping') {
                if (!isCoHostMode) pulseRoomActiveHeartbeat();
              } else if (topic === mqttVuTopic) {
                if (isCoHostMode) {
                  const data = JSON.parse(payload.toString());
                  if (data && typeof data.pct === 'number') {
                    const bar = document.getElementById('transmitter-vu-bar');
                    const text = document.getElementById('transmitter-vu-text');
                    const led = document.getElementById('transmitter-vu-led');
                    if (bar) bar.style.width = data.pct + '%';
                    if (text) text.innerText = data.pct + '%';
                    if (led) {
                      led.className = data.pct > 6 ? 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse' : 'w-2 h-2 rounded-full bg-slate-400';
                    }
                    const speechDot = document.getElementById('transmitter-speech-dot');
                    const speechText = document.getElementById('transmitter-speech-text');
                    if (speechDot && speechText) {
                      if (data.pct > 6) {
                        speechDot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse';
                        speechText.innerText = 'Falando (Ao Vivo)';
                      } else {
                        speechDot.className = 'w-1.5 h-1.5 rounded-full bg-slate-400';
                        speechText.innerText = 'Aguardando Voz';
                      }
                    }
                  }
                }
              } else if (topic === mqttMeetingTopic) {
                if (isCoHostMode) {
                  const data = JSON.parse(payload.toString());
                  if (data) {
                    if (data.type === 'NEW_SUBTITLE' && data.text) {
                      if (data.channel === 'transmitter' || data.channel === 'pt') {
                        mirrorRemoteTransmitterSubtitle(data.text, data.startSec, data.endSec);
                      } else {
                        const tgt = (data.channel === 'receiver' || data.channel === 'en') ? 'en-US' : (data.channel === 'spanish' || data.channel === 'es') ? 'es-ES' : (data.channel === 'french' || data.channel === 'fr') ? 'fr-FR' : (data.channel === 'german' || data.channel === 'de') ? 'de-DE' : (data.channel === 'italian' || data.channel === 'it') ? 'it-IT' : data.channel;
                        mirrorRemoteTargetSubtitle(tgt, data.text, data.startSec, data.endSec);
                      }
                    } else if (data.type === 'LIVE_INTERIM') {
                      if (data.channel === 'transmitter' || data.channel === 'pt') {
                        mirrorRemoteTransmitterInterim(data.text);
                      } else {
                        const tgt = (data.channel === 'receiver' || data.channel === 'en') ? 'en-US' : (data.channel === 'spanish' || data.channel === 'es') ? 'es-ES' : (data.channel === 'french' || data.channel === 'fr') ? 'fr-FR' : (data.channel === 'german' || data.channel === 'de') ? 'de-DE' : (data.channel === 'italian' || data.channel === 'it') ? 'it-IT' : data.channel;
                        mirrorRemoteTargetInterim(tgt, data.text);
                      }
                    } else if (data.type === 'CLOSE_PARAGRAPH') {
                      closeActiveParagraphs();
                    }
                  }
                }
              }
            } catch(e) {
              console.warn('[Cockpit MQTT Message Error]:', e);
            }
          });
        } catch(e) {}
      }

      function broadcastSubtitleGlobally(channel, text, startSec, endSec) {
        _cockpitSubtitleSeq[channel] = (_cockpitSubtitleSeq[channel] || 0) + 1;
        const currentParaFull = getCockpitParagraphText(channel);

        const payload = {
          type: 'NEW_SUBTITLE',
          pktId: 'sub_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9),
          seq: _cockpitSubtitleSeq[channel],
          meetingId: id,
          channel: channel,
          text: text,
          cockpitFullText: currentParaFull,
          startSec: startSec,
          endSec: endSec,
          timestamp: Date.now()
        };

        if (subtitleBroadcast) {
          try { subtitleBroadcast.postMessage(payload); } catch(e) {}
        }
        if (mqttPublisherClient && mqttPublisherClient.connected) {
          try { mqttPublisherClient.publish(mqttMeetingTopic, JSON.stringify(payload), { qos: 1 }); } catch(e) {}
        } else {
          _pendingMqttQueue.push({ topic: mqttMeetingTopic, payload: payload, qos: 1 });
        }
      }

      // Transmissão instantânea de interim (palavra a palavra) para Espectador e OBS
      function broadcastLiveInterimGlobally(channel, interimText) {
        const payload = {
          type: 'LIVE_INTERIM',
          pktId: 'int_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9),
          meetingId: id,
          channel: channel,
          text: interimText || '',
          timestamp: Date.now()
        };
        if (subtitleBroadcast) {
          try { subtitleBroadcast.postMessage(payload); } catch(e) {}
        }
        if (mqttPublisherClient && mqttPublisherClient.connected) {
          try { mqttPublisherClient.publish(mqttMeetingTopic, JSON.stringify(payload), { qos: 0 }); } catch(e) {}
        }
      }

      // Notifica fechamento de parágrafo em todas as telas
      function broadcastCloseParagraphGlobally(channel) {
        const payload = {
          type: 'CLOSE_PARAGRAPH',
          pktId: 'cls_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9),
          meetingId: id,
          channel: channel || 'all',
          timestamp: Date.now()
        };
        if (subtitleBroadcast) {
          try { subtitleBroadcast.postMessage(payload); } catch(e) {}
        }
        if (mqttPublisherClient && mqttPublisherClient.connected) {
          try { mqttPublisherClient.publish(mqttMeetingTopic, JSON.stringify(payload), { qos: 1 }); } catch(e) {}
        } else {
          _pendingMqttQueue.push({ topic: mqttMeetingTopic, payload: payload, qos: 1 });
        }
      }

      // Broadcast exclusivo para voz em streaming (não exibe legenda, apenas faz TTS)
      function broadcastStreamTTS(channel, ttsText) {
        if (!ttsText || !ttsText.trim()) return;
        const payload = {
          type: 'STREAM_TTS',
          pktId: 'tts_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9),
          meetingId: id,
          channel: channel,
          text: ttsText.trim(),
          timestamp: Date.now()
        };
        if (subtitleBroadcast) {
          try { subtitleBroadcast.postMessage(payload); } catch(e) {}
        }
        if (mqttPublisherClient && mqttPublisherClient.connected) {
          try { mqttPublisherClient.publish(mqttMeetingTopic, JSON.stringify(payload), { qos: 1 }); } catch(e) {}
        } else {
          _pendingMqttQueue.push({ topic: mqttMeetingTopic, payload: payload, qos: 1 });
        }
      }

      function formatDuration(sec) {
        const pad = (n) => String(Math.floor(n)).padStart(2, '0');
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = Math.floor(sec % 60);
        return h > 0 ? `${pad(h)}h ${pad(m)}m ${pad(s)}s` : `${pad(m)}m ${pad(s)}s`;
      }

      function formatClockTime(sec) {
        const pad = (n) => String(Math.floor(n)).padStart(2, '0');
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = Math.floor(sec % 60);
        return `${pad(h)}:${pad(m)}:${pad(s)}`;
      }

      // ========================================================
      // ENUMERAÇÃO E CAPTURA DE DISPOSITIVOS DE ÁUDIO

      async function refreshAudioDevicesList(forcePrompt = false) {
        const btnScan = document.getElementById('btn-scan-audio-devices');
        const badge = document.getElementById('transmitter-device-count-badge');
        if (btnScan) btnScan.innerText = "Varrendo...";

        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
          
          let devices = await navigator.mediaDevices.enumerateDevices();
          let audioInputs = devices.filter(d => d.kind === 'audioinput');

          // Se forçado ou se os rótulos de hardware vierem vazios pelo navegador,
          // executa uma sonda limpa com AGC/AEC desligados para carregar os nomes reais
          // das placas de áudio USB sem alterar o mixer mestre do Windows
          if (forcePrompt || audioInputs.length === 0 || audioInputs.some(d => !d.label)) {
            try {
              const probeStream = await navigator.mediaDevices.getUserMedia({
                audio: {
                  echoCancellation: false,
                  noiseSuppression: false,
                  autoGainControl: false
                }
              });
              probeStream.getTracks().forEach(t => t.stop());
              devices = await navigator.mediaDevices.enumerateDevices();
              audioInputs = devices.filter(d => d.kind === 'audioinput');
            } catch(permErr) {
              console.warn('[BrainLingo] Varredura de áudio aguardando autorização de microfone:', permErr);
            }
          }

          const sel = document.getElementById('transmitter-mic-select');
          if (sel) {
            const savedDevId = selectedMicDeviceId || localStorage.getItem('brain_selected_mic_device') || 'default';
            const curVal = sel.value || savedDevId;

            let html = `
              <optgroup label="Captura Digital de Aplicativos e Sistema (VLC / YouTube / Aulas)">
                <option value="display_media_tab" ${curVal === 'display_media_tab' ? 'selected' : ''}>Guia do Chrome (YouTube, Videoaulas, Podcast)</option>
                <option value="display_media_window" ${curVal === 'display_media_window' ? 'selected' : ''}>Janela de um aplicativo (VLC ou outro player)</option>
                <option value="display_media_desktop" ${curVal === 'display_media_desktop' ? 'selected' : ''}>Todo o áudio do computador</option>
              </optgroup>
              <optgroup label="Microfones e Placas de Áudio Físicas">
                <option value="default" ${curVal === 'default' ? 'selected' : ''}>Microfone padrão do Windows</option>
            `;
            
            // Adiciona todas as placas e entradas de áudio detectadas
            audioInputs.forEach((d, i) => {
              if (d.deviceId === 'default') return; // Já incluído como opção limpa acima
              let label = d.label || ("Placa / Entrada de Áudio " + (i + 1));
              const lower = label.toLowerCase();
              if (lower.includes('mix') || lower.includes('estéreo') || lower.includes('stereo') || lower.includes('cable') || lower.includes('virtual') || lower.includes('loopback')) {
                label = "" + label + " [Áudio do Sistema / VLC / YouTube]";
              }
              const isSelected = (curVal === d.deviceId);
              html += `<option value="${d.deviceId}" ${isSelected ? 'selected' : ''}>${label}</option>`;
            });

            html += `</optgroup>`;
            sel.innerHTML = html;
            if (curVal) {
              sel.value = curVal;
            }
          }

          if (badge) {
            const count = audioInputs.length;
            badge.innerText = count + (count === 1 ? ' entrada física' : ' entradas físicas');
          }
        } catch(e) {
          console.error('[BrainLingo] Erro na varredura de dispositivos de áudio:', e);
        } finally {
          if (btnScan) btnScan.innerText = "Escanear Placas";
        }
      }

      // Escuta em tempo real a conexão ou desconexão física de placas de som USB (Hotplug)
      if (navigator.mediaDevices && !window._brainDeviceChangeBound) {
        window._brainDeviceChangeBound = true;
        navigator.mediaDevices.addEventListener('devicechange', async () => {
          console.log('[BrainLingo] Alteração nos dispositivos de áudio (Hotplug). Atualizando entradas...');
          await refreshAudioDevicesList(false);
          if (typeof refreshDashboardAudioDevices === 'function') {

      // ========================================================
      // CAPTURA DE ÁUDIO MULTI-FONTE (MICROFONES, GUIA DO CHROME, JANELAS VLC E DESKTOP)
      // ========================================================
      let isLocalAudioMonitoringActive = false;
      let currentAudioSourceMode = 'mic'; // 'mic' | 'tab' | 'app' | 'desktop'

      // ========================================================
      // ROTEAMENTO DIGITAL DIRETO VIA CABO VIRTUAL (VB-CABLE / STEREO MIX)
      // Injeta o áudio da guia/vídeo diretamente no CABLE Input
      // Alto-falantes 100% silenciosos (0 som), 0% CPU, 0 MB RAM, 0 repetição!
      // ========================================================
      let loopbackAudioEl = null;

      async function routeStreamToVirtualCable(stream) {
        if (!stream) return false;
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const audioOutputs = devices.filter(d => d.kind === 'audiooutput');
          // Procura "CABLE Input" ou dispositivo de loopback virtual instalado no Windows
          const cableInput = audioOutputs.find(d => 
            d.label.toLowerCase().includes('cable input') || 
            d.label.toLowerCase().includes('virtual audio cable') ||
            d.label.toLowerCase().includes('vb-audio')
          );

          if (cableInput) {
            if (!loopbackAudioEl) {
              loopbackAudioEl = document.createElement('audio');
              loopbackAudioEl.id = 'brain-cable-loopback';
              loopbackAudioEl.style.display = 'none';
              document.body.appendChild(loopbackAudioEl);
            }
            loopbackAudioEl.srcObject = stream;
            if (typeof loopbackAudioEl.setSinkId === 'function') {
              await loopbackAudioEl.setSinkId(cableInput.deviceId);
            }
            await loopbackAudioEl.play();
            console.log('[BrainLingo] Fluxo do vídeo injetado digitalmente no CABLE Input:', cableInput.label);
            return true;
          }
        } catch(e) {
          console.warn('[BrainLingo] Erro ao injetar no CABLE Input via setSinkId:', e);
        }
        return false;
      }

      function stopVirtualCableRouting() {
        if (loopbackAudioEl) {
          try {
            loopbackAudioEl.pause();
            loopbackAudioEl.srcObject = null;
          } catch(e) {}
        }
      }

      window.setSystemAudioDevice = async function(target = 'cable') {
        const isCable = (target === 'cable');
        const btn = document.getElementById(isCable ? 'btn-set-cable-default' : 'btn-set-mic-default');
        const originalText = btn ? btn.innerText : '';
        if (btn) {
          btn.disabled = true;
          btn.innerText = "Configurando...";
        }

        // 1. Tenta acionar a API local do BrainLingo (Companion / server.js)
        try {
          const res = await fetch(`http://127.0.0.1:8765/api/set-audio-device?device=${target}`, { 
            signal: AbortSignal.timeout(3000) 
          });
          const data = await res.json();
          if (data && data.ok) {
            if (btn) {
              btn.disabled = false;
              btn.innerText = isCable ? "CABLE Output Ativo" : "Microfone Ativo";
            }
            if (isCable) {
              try {
                navigator.clipboard.writeText('chrome://settings/content/microphone');
              } catch(e) {}
              alert(
                "CONFIGURAÇÃO DO WINDOWS ATIVADA!\n\n" +
                "O 'CABLE Output' foi ativado com sucesso no seu Windows!\n\n" +
                "ÚLTIMO PASSO NO GOOGLE CHROME:\n" +
                "Copiei o link 'chrome://settings/content/microphone' para sua área de transferência.\n\n" +
                "Abra uma nova aba no Chrome, cole com Ctrl+V e dê Enter.\n" +
                "No topo, mude o microfone padrão de 'Microphone' para 'CABLE Output'.\n\n" +
                "Pronto! A transcrição lerá o vídeo com perfeição em silêncio absoluto!"
              );
            } else {
              alert("SUCESSO!\n\nO Microfone do laptop foi restaurado como o Microfone Padrão do Windows.");
            }
            if (isRealMicActive) {
              safelyDestroySpeechRecognizer(true);
              setTimeout(startContinuousSpeechTranscription, 400);
            }
            return;
          }
        } catch(e) {
          // Servidor local não respondeu (ex: rodando direto da nuvem ou em outro PC)
        }

        if (btn) {
          btn.disabled = false;
          btn.innerText = originalText;
        }

        // 2. Se estiver em outro PC puramente na web, abre a autorização nativa do Windows
        showWebAudioDeviceModal(target);
      };

      window.showWebAudioDeviceModal = function(target = 'cable') {
        const isCable = (target === 'cable');
        const targetName = isCable ? 'CABLE Output (VB-Audio Virtual Cable)' : 'Microfone do Computador';
        const index = isCable ? 5 : 6;

        const choice = confirm(
          "AUTORIZAÇÃO DE ÁUDIO DO WINDOWS:\n\n" +
          "Deseja alternar o microfone padrão do Windows para: " + targetName + "?\n\n" +
          "• Clique em 'OK' para abrir as Configurações de Som do Windows agora.\n" +
          "• Ou clique em 'Cancelar' para baixar o assistente executável de 1 clique."
        );

        if (choice) {
          window.location.href = 'ms-settings:sound';
        } else {
          const batContent = `@echo off\r\npowershell -NoProfile -Command "Import-Module AudioDeviceCmdlets -ErrorAction SilentlyContinue; Set-AudioDevice -Index ${index}; Write-Host 'Dispositivo configurado: ${targetName}' -ForegroundColor Green"\r\necho Concluido com sucesso! Pode fechar esta janela.\r\ntimeout /t 3 >nul\r\n`;
          const blob = new Blob([batContent], { type: 'application/x-bat' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = isCable ? 'Ativar_CABLE_Output.bat' : 'Restaurar_Microfone.bat';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }
      };

      // VU METER DO MICROFONE EM TEMPO REAL (BASEADO EM RMS REAL)
      function startMicVuMeterLoop() {
        if (!micAnalyserNode) return;
        const timeData = new Float32Array(micAnalyserNode.fftSize);

        function updateVu() {
          if (!isRealMicActive || !micAnalyserNode) return;
          micAnalyserNode.getFloatTimeDomainData(timeData);

          let sumSquares = 0;
          for (let i = 0; i < timeData.length; i++) {
            sumSquares += timeData[i] * timeData[i];
          }
          const rms = Math.sqrt(sumSquares / timeData.length);
          // Conversão de RMS para dB (-50dB a 0dB) para resposta dinâmica natural
          const db = 20 * Math.log10(Math.max(rms, 0.00005));
          const pct = Math.max(0, Math.min(100, Math.round(((db + 46) / 46) * 100)));

          const bar = document.getElementById('transmitter-vu-bar');
          const text = document.getElementById('transmitter-vu-text');
          const led = document.getElementById('transmitter-vu-led');

          if (bar) bar.style.width = pct + '%';
          if (text) text.innerText = pct + '%';
          if (led) {
            led.className = pct > 6 ? 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse' : 'w-2 h-2 rounded-full bg-slate-400';
          }

          if (isRealMicActive && mqttPublisherClient && mqttPublisherClient.connected) {
            const nowTime = Date.now();
            if (nowTime - lastVuBroadcastTime > 350) {
              lastVuBroadcastTime = nowTime;
              try {
                mqttPublisherClient.publish(mqttVuTopic, JSON.stringify({ pct: pct }), { qos: 0 });
              } catch(e) {}
            }
          }

          micVuAnimFrameId = requestAnimationFrame(updateVu);
        }
        micVuAnimFrameId = requestAnimationFrame(updateVu);
      }

      window.toggleMasterMicCapture = async function() {
        if (!isRealMicActive) {

      async function startMasterMicCapture() {
        const select = document.getElementById('transmitter-mic-select');
        const targetDeviceId = select ? select.value : (selectedMicDeviceId || 'default');
        const isDisplayMedia = (typeof targetDeviceId === 'string' && targetDeviceId.startsWith('display_media'));

        try {
          if (micMediaStream) {
            micMediaStream.getTracks().forEach(t => t.stop());
            micMediaStream = null;
          }

          if (isDisplayMedia) {
            const displayOpts = {
              video: {
                width: { ideal: 640 },
                height: { ideal: 360 },
                frameRate: { ideal: 15 }
              },
              audio: {
                autoGainControl: false,
                echoCancellation: false,
                noiseSuppression: false,
                systemAudio: 'include'
              }
            };
            if (targetDeviceId === 'display_media_tab') {
              displayOpts.video.displaySurface = 'browser';
            } else if (targetDeviceId === 'display_media_window') {
              displayOpts.video.displaySurface = 'window';
            } else if (targetDeviceId === 'display_media_desktop') {
              displayOpts.video.displaySurface = 'monitor';
            }

            micMediaStream = await navigator.mediaDevices.getDisplayMedia(displayOpts);
            const audioTracks = micMediaStream.getAudioTracks();
            if (audioTracks.length === 0) {
              micMediaStream.getTracks().forEach(t => t.stop());
              micMediaStream = null;
              alert(
                "Atenção: Nenhum canal de áudio foi compartilhado!\n\n" +
                "Ao selecionar a Guia do YouTube, Janela do VLC ou Desktop na janela do Chrome, " +
                "você DEVE marcar a caixinha 'Compartilhar áudio' (Share audio) no canto inferior esquerdo."
              );
              return;
            }

            micMediaStream.getTracks().forEach(t => {
              t.onended = () => {
                console.log('[BrainLingo] Compartilhamento de áudio de aplicativo encerrado pelo usuário.');
                if (isRealMicActive) stopMasterMicCapture();
              };
            });
          } else {
            const audioConstraints = {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false,
              channelCount: { ideal: 2, min: 1 },
              sampleRate: { ideal: 48000 }
            };

            if (targetDeviceId && targetDeviceId !== 'default') {
              audioConstraints.deviceId = { exact: targetDeviceId };
            }
            micMediaStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
          }

          try {
            localStorage.setItem('brain_selected_mic_device', targetDeviceId);
          } catch(e) {}

          await refreshAudioDevicesList(false);

          if (!micAudioContext || micAudioContext.state === 'closed') {
            micAudioContext = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (micAudioContext.state === 'suspended') await micAudioContext.resume();

          const source = micAudioContext.createMediaStreamSource(micMediaStream);

          // Pré-amplificador de Estúdio (+7dB) para encorpar a captação
          const micGainNode = micAudioContext.createGain();
          micGainNode.gain.value = 2.24; // +7.0 dB de reforço limpo

          // Compressor Dinâmico de Broadcast (evita clipping e valoriza sussurros)
          const micCompressor = micAudioContext.createDynamicsCompressor();
          micCompressor.threshold.setValueAtTime(-24, micAudioContext.currentTime);
          micCompressor.knee.setValueAtTime(24, micAudioContext.currentTime);
          micCompressor.ratio.setValueAtTime(3.5, micAudioContext.currentTime);
          micCompressor.attack.setValueAtTime(0.003, micAudioContext.currentTime);
          micCompressor.release.setValueAtTime(0.25, micAudioContext.currentTime);
          window._currentMicCompressorNode = micCompressor;

          micAnalyserNode = micAudioContext.createAnalyser();
          micAnalyserNode.fftSize = 256;
          micAnalyserNode.smoothingTimeConstant = 0.35;

          const micDestination = micAudioContext.createMediaStreamDestination();

          source.connect(micGainNode);
          micGainNode.connect(micCompressor);
          micCompressor.connect(micAnalyserNode);
          micCompressor.connect(micDestination);

          // ALTO-FALANTES SILENCIADOS: O áudio da guia/vídeo NÃO é emitido nos alto-falantes
          isLocalAudioMonitoringActive = false;
          if (isLocalAudioMonitoringActive) {
            micCompressor.connect(micAudioContext.destination);
          }

          // Se for captura digital de aplicativo/guia (Vimeo, YouTube, VLC, Desktop),
          // injeta o fluxo diretamente no CABLE Input do VB-Audio Cable (0 som nos alto-falantes)
          if (isDisplayMedia) {
            await routeStreamToVirtualCable(micMediaStream);
          }

          isRealMicActive = true;
          updateAudioInputUIState();
          startMicVuMeterLoop();

          // Gravação do áudio
          try {
            transmitterAudioChunks = [];
            micMediaRecorder = new MediaRecorder(micDestination.stream);
            micMediaRecorder.ondataavailable = (e) => {
              if (e.data.size > 0) transmitterAudioChunks.push(e.data);
            };
            micMediaRecorder.onstop = () => {
              transmitterRecordedBlob = new Blob(transmitterAudioChunks, { type: 'audio/webm' });
            };
            micMediaRecorder.start(1000);
            isRecordingTransmitter = true;
          } catch(e) {}

          // Inicia reconhecimento contínuo de fala nativo (0% CPU, 0 MB RAM, sem sobrecarga ou repetições)
          startContinuousSpeechTranscription();
        } catch(err) {
          if (err.name !== 'NotAllowedError') {
            alert('Erro ao ativar entrada de áudio: ' + err.message + '\n\nCertifique-se de que o dispositivo ou aplicativo está disponível.');
          }
          isRealMicActive = false;
          updateAudioInputUIState();
        }
      }
