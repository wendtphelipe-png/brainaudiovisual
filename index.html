      }

      renderAudienceUI();

      window.changeAudienceLanguage = function(newLang) {
        currentAudienceLang = newLang;
        try { localStorage.setItem('brain_audience_lang', newLang); } catch(e) {}
        
        if ('speechSynthesis' in window) {
          try { window.speechSynthesis.cancel(); } catch(e) {}
        }
        speechQueue = [];
        isSpeakingNow = false;
        startDiscreetVuMeter(false);

        // Dispara imediatamente o batimento de presença para sincronizar o cockpit
        sendAudiencePresenceHeartbeat();

        renderAudienceUI();
      };

      window.setAudienceVolume = function(val) {
        currentVolume = parseFloat(val);
        try { localStorage.setItem('brain_audience_vol', currentVolume); } catch(e) {}
        const el = document.getElementById('audience-vol-value');
        if (el) el.innerText = Math.round(currentVolume * 100) + '%';
      };

      // CONTROLE DE TELA ATIVA (WAKE LOCK) E MANUTENÇÃO EM SEGUNDO PLANO
      function ensureBackgroundAudioCarrier(play = true) {
        if (!backgroundAudioCarrier) {
          try {
            backgroundAudioCarrier = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');
            backgroundAudioCarrier.setAttribute('playsinline', '');
            backgroundAudioCarrier.setAttribute('webkit-playsinline', '');
            backgroundAudioCarrier.loop = true;
            backgroundAudioCarrier.volume = 0.01;
          } catch(e) {}
        }
        if (backgroundAudioCarrier) {
          if (play) {
            try { backgroundAudioCarrier.play().catch(e => {}); } catch(e) {}
          } else {
            try { backgroundAudioCarrier.pause(); } catch(e) {}
          }
        }
      }

      async function acquireWakeLock() {
        if (!isWakeLockEnabled) return;
        try {
          if ('wakeLock' in navigator) {
            wakeLockObj = await navigator.wakeLock.request('screen');
            wakeLockObj.addEventListener('release', () => {
              wakeLockObj = null;
              updateWakeLockUI();
            });
            updateWakeLockUI();
          }
        } catch(e) {
          console.warn('[WakeLock] Info:', e);
        }
      }

      function releaseWakeLock() {
        if (wakeLockObj) {
          try { wakeLockObj.release(); } catch(e) {}
          wakeLockObj = null;
          updateWakeLockUI();
        }
      }

      window.toggleWakeLockManual = function() {
        isWakeLockEnabled = !isWakeLockEnabled;
        if (isWakeLockEnabled) {
          acquireWakeLock();
        } else {
          releaseWakeLock();
        }
        updateWakeLockUI();
      };

      function updateWakeLockUI() {
        const btn = document.getElementById('btn-toggle-wake-lock');
        const textEl = document.getElementById('wake-lock-label');
        const t = getI18n();
        if (btn) {
          if (isWakeLockEnabled) {
            btn.className = 'text-[11px] font-bold px-2.5 py-1.5 rounded-xl border border-amber-400/80 bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-300 transition-all cursor-pointer flex items-center gap-1 shadow-2xs';
            if (textEl) textEl.innerText = t.screenAwakeBtn || 'Tela Ativa';
          } else {
            btn.className = 'text-[11px] font-bold px-2.5 py-1.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 transition-all cursor-pointer flex items-center gap-1 shadow-2xs opacity-70';
            if (textEl) textEl.innerText = t.screenAwakeOff || 'Tela Normal';
          }
        }
      }

      // Ativa o bloqueio de tela por padrão para não desligar
      setTimeout(acquireWakeLock, 800);

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          if (isWakeLockEnabled) acquireWakeLock();
          if (isAudioPlaybackActive) {
            ensureBackgroundAudioCarrier(true);
            if ('speechSynthesis' in window && window.speechSynthesis.paused) {
              try { window.speechSynthesis.resume(); } catch(e) {}
            }
          }
          if (window._mqttAudienceListenerClient && !window._mqttAudienceListenerClient.connected) {
            try { window._mqttAudienceListenerClient.reconnect(); } catch(e) {}
          }
        } else {
          // Quando a tela do celular apaga ou entra em segundo plano:
          if (isAudioPlaybackActive) {
            ensureBackgroundAudioCarrier(true);
          }
        }
      });

      window.testAudienceAudioOutput = function() {
        const t = getI18n();
        if (!('speechSynthesis' in window)) {
          alert(t.notSupportedAlert || 'Síntese de voz não suportada neste navegador.');
          return;
        }
        try {
          window.speechSynthesis.cancel();
          window.speechSynthesis.resume();
        } catch(e) {}

        const persona = getAudienceVoicePersona(selectedVoicePersonaId);
        const utterance = new SpeechSynthesisUtterance(t.audioTestPhrase);
        utterance.lang = currentAudienceLang || 'en-US';
        utterance.volume = Math.max(0.1, currentVolume);
        // Taxa 1.0 direta: sem reamostragem digital para não criar distorção metálica no celular
        utterance.rate = 1.0;

        const voiceResult = getBestVoiceForCurrentLang(persona.gender);
        if (voiceResult && voiceResult.voice) utterance.voice = voiceResult.voice;

        if (persona.gender === 'male') {
          if (voiceResult && voiceResult.isMale) {
            utterance.pitch = (persona.id === 'diego_solene') ? 0.90 : 0.96;
          } else {
            // Conversão de tom para registro barítono masculino autêntico caso o celular só tenha a voz padrão feminina
            utterance.pitch = (persona.id === 'diego_solene') ? 0.72 : (persona.id === 'gabriel_alegre' ? 0.82 : 0.78);
          }
        } else {
          utterance.pitch = (persona.id === 'elena_vibrante') ? 1.04 : 1.00;
        }

        utterance.onstart = () => startDiscreetVuMeter(true);
        utterance.onend = () => startDiscreetVuMeter(false);
        utterance.onerror = () => startDiscreetVuMeter(false);

        window.speechSynthesis.speak(utterance);
      };

      window.toggleAudienceAudioPlayback = function() {
        isAudioPlaybackActive = !isAudioPlaybackActive;
        const t = getI18n();
        const btn = document.getElementById('btn-toggle-audience-audio');
        const dot = document.getElementById('audience-audio-status-dot');

        if (btn) {
          btn.className = isAudioPlaybackActive
            ? 'w-full py-4 px-4 rounded-2xl font-black text-sm sm:text-base transition-all duration-300 flex items-center justify-center gap-2.5 cursor-pointer shadow-md bg-emerald-600 hover:bg-emerald-700 text-white shadow-emerald-600/20'
            : 'w-full py-4 px-4 rounded-2xl font-black text-sm sm:text-base transition-all duration-300 flex items-center justify-center gap-2.5 cursor-pointer shadow-md bg-gradient-to-r from-emerald-500 via-indigo-600 to-purple-600 hover:from-emerald-600 hover:to-indigo-500 text-white shadow-indigo-600/25 ring-2 ring-emerald-400/40';
          btn.innerHTML = '<span>' + (isAudioPlaybackActive ? t.audioActive : t.startAudio) + '</span>';
        }

        if (dot) {
          dot.className = isAudioPlaybackActive ? 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse' : 'w-2.5 h-2.5 rounded-full bg-amber-400';
        }

        if (isAudioPlaybackActive) {
          acquireWakeLock();
          ensureBackgroundAudioCarrier(true);

          if ('mediaSession' in navigator) {
            try {
              navigator.mediaSession.metadata = new MediaMetadata({
                title: t.title + ' — ' + t.langName,
                artist: 'Brain Audiovisual',
                album: meeting.title || 'Evento ao Vivo'
              });
              navigator.mediaSession.playbackState = 'playing';
            } catch(e) {}
          }

          // Desbloqueia sintetizador de áudio
          if ('speechSynthesis' in window) {
            try {
              window.speechSynthesis.cancel();
              window.speechSynthesis.resume();
              const persona = getAudienceVoicePersona(selectedVoicePersonaId);
              const phrase = t.audioConnectedPhrase || (t.langName + ' audio connected.');
              const unlock = new SpeechSynthesisUtterance(phrase);
              unlock.lang = currentAudienceLang || 'en-US';
              unlock.volume = 0.08;
              unlock.rate = 1.0;
              const vResult = getBestVoiceForCurrentLang(persona.gender);
              if (vResult && vResult.voice) unlock.voice = vResult.voice;
              if (persona.gender === 'male') {
                unlock.pitch = (vResult && vResult.isMale) ? 0.96 : 0.78;
              } else {
                unlock.pitch = 1.00;
              }
              window.speechSynthesis.speak(unlock);
            } catch(e) {}
          }
          processSpeechQueue();
        } else {
          releaseWakeLock();
          ensureBackgroundAudioCarrier(false);
          if ('mediaSession' in navigator) {
            try { navigator.mediaSession.playbackState = 'paused'; } catch(e) {}
          }
          if ('speechSynthesis' in window) {
            try { window.speechSynthesis.cancel(); } catch(e) {}
          }
          speechQueue = [];
          isSpeakingNow = false;
          startDiscreetVuMeter(false);
        }
      };

      // FILA DE SÍNTESE DE FALA SEQUENCIAL (TTS) HUMANIZADA OTIMIZADA PARA MOBILE
      let speechQueue = [];
      let isSpeakingNow = false;
      let speechQueueWatchdog = null;

      function processSpeechQueue() {
        if (!isAudioPlaybackActive || isSpeakingNow || speechQueue.length === 0) return;
        if (!('speechSynthesis' in window)) return;

        try {
          if (window.speechSynthesis.paused) window.speechSynthesis.resume();
        } catch(e) {}

        let nextText = speechQueue.shift();
        if (!nextText || !nextText.trim()) {
          setTimeout(processSpeechQueue, 40);
          return;
        }

        // Garante pontuação final suave para cadência natural (preserva vírgula no streaming)
        nextText = nextText.trim();
        if (!/[.,!?;]$/.test(nextText)) nextText += '.';

        isSpeakingNow = true;
        const persona = getAudienceVoicePersona(selectedVoicePersonaId);
        const utterance = new SpeechSynthesisUtterance(nextText);
        // CRÍTICO PARA MOBILE: impede que o Garbage Collector do Safari/Chrome no celular destrua a utterance antes do onend
        window._activeAudienceUtterance = utterance;

        utterance.lang = currentAudienceLang || 'en-US';
        utterance.volume = Math.max(0.1, currentVolume);
        // Taxa 1.0 direta: elimina 100% o artefato metálico/robótico gerado pelo timestretch do WebKit/Blink
        utterance.rate = 1.0;

        const voiceResult = getBestVoiceForCurrentLang(persona.gender);
        if (voiceResult && voiceResult.voice) utterance.voice = voiceResult.voice;

        // AFINAÇÃO (PITCH): Se a voz do sistema já é nativamente masculina, preserva a afinação original.
        // Se o celular tiver apenas a voz feminina padrão de fábrica, abaixamos a frequência fundamental (F0)
        // para 0.76 - 0.82, produzindo um timbre masculino e encorpado de homem adulto sem parecer mulher!
        if (persona.gender === 'male') {
          if (voiceResult && voiceResult.isMale) {
            utterance.pitch = (persona.id === 'diego_solene') ? 0.90 : 0.96;
          } else {
            utterance.pitch = (persona.id === 'diego_solene') ? 0.72 : (persona.id === 'gabriel_alegre' ? 0.82 : 0.78);
          }
        } else {
          utterance.pitch = (persona.id === 'elena_vibrante') ? 1.04 : 1.00;
        }

        const finalizeSpeech = () => {
          if (speechQueueWatchdog) clearTimeout(speechQueueWatchdog);
          window._activeAudienceUtterance = null;
          isSpeakingNow = false;
          startDiscreetVuMeter(false);
          setTimeout(processSpeechQueue, 60);
        };

        utterance.onstart = () => {
          startDiscreetVuMeter(true);
        };
        utterance.onend = finalizeSpeech;
        utterance.onerror = (err) => {
          console.warn('SpeechSynthesis aviso:', err);
          finalizeSpeech();
        };

        // Watchdog adaptado para a cadência humana (~110ms por caractere)
        const maxExpectedMs = Math.max(4000, nextText.length * 110);
        if (speechQueueWatchdog) clearTimeout(speechQueueWatchdog);
        speechQueueWatchdog = setTimeout(() => {
          if (isSpeakingNow) finalizeSpeech();
        }, maxExpectedMs);

        try {
          if (window.speechSynthesis.paused) window.speechSynthesis.resume();
          window.speechSynthesis.speak(utterance);
        } catch(e) {
          finalizeSpeech();
        }
      }

      function queueAudienceSpeech(text) {
        if (!isAudioPlaybackActive || !text || !text.trim()) return;
        const clean = text.trim();
        const norm = cleanNorm(clean);
        // Evita texto duplicado acumulado na fila
        if (speechQueue.some(item => cleanNorm(item) === norm)) return;
        // Limita a fila a no máximo 3 sentenças no celular para não acumular atraso de fala
        if (speechQueue.length >= 3) {
          speechQueue.shift();
        }
        speechQueue.push(clean);
        processSpeechQueue();
      }

      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.getVoices(); } catch(e) {}
        window.speechSynthesis.onvoiceschanged = () => {
          try { window.speechSynthesis.getVoices(); } catch(e) {}
        };
      }

      // ROTEAMENTO DE LEGENDAS TRADUZIDAS PARA O ESPECTADOR (FLUXO CONTÍNUO E SEM REPETIÇÃO)
      const audienceSeenSubtitles = new Map();
      const audienceSeenTTS = new Map();
      let audienceActiveParagraphObj = null;
      let audienceLastSubtitleTime = 0;
      let audienceLastInterimTimestamp = 0;
      let audienceLastConfirmedTimestamp = 0;

      async function handleAudienceIncomingSubtitle(data) {
        if (!data) return;

        const isStreamTTS = data.type === 'STREAM_TTS';
        const isNewSubtitle = data.type === 'NEW_SUBTITLE';
        const isLiveInterim = data.type === 'LIVE_INTERIM';
        const isCloseParagraph = data.type === 'CLOSE_PARAGRAPH';

        if (!isStreamTTS && !isNewSubtitle && !isLiveInterim && !isCloseParagraph) return;

        const currentLangPrefix = (currentAudienceLang || 'en').split('-')[0].toLowerCase();
        const dataChan = (data.channel || '').toLowerCase();

        let isForThisAudience = false;
        if (data.channel === 'all') isForThisAudience = true;
        else if (dataChan === currentLangPrefix) isForThisAudience = true;
        else if (currentLangPrefix === 'en' && (dataChan === 'en' || dataChan === 'receiver' || dataChan === 'en-us')) isForThisAudience = true;
        else if (currentLangPrefix === 'es' && (dataChan === 'es' || dataChan === 'spanish' || dataChan === 'es-es')) isForThisAudience = true;
        else if (currentLangPrefix === 'fr' && (dataChan === 'fr' || dataChan === 'french' || dataChan === 'fr-fr')) isForThisAudience = true;
        else if (currentLangPrefix === 'de' && (dataChan === 'de' || dataChan === 'german' || dataChan === 'de-de')) isForThisAudience = true;
        else if (currentLangPrefix === 'it' && (dataChan === 'it' || dataChan === 'italian' || dataChan === 'it-it')) isForThisAudience = true;
        else if (dataChan === currentAudienceLang.toLowerCase()) isForThisAudience = true;

        if (!isForThisAudience) return;

        const now = Date.now();

        // STREAM_TTS: direto para a fila de voz, com rigoroso descarte de duplicatas da rede móvel
        if (isStreamTTS) {
          const text = (data.text || '').trim();
          if (!text) return;

          // Chave de desduplicação fonética/textual normalizada
          const normTTS = cleanNorm(text);
          if (audienceSeenTTS.has(normTTS)) {
            const lastTTSSeen = audienceSeenTTS.get(normTTS);
            if (now - lastTTSSeen < 7000) {
              // Já enfileirado nos últimos 7 segundos - ignora duplicação de rede
              return;
            }
          }
          audienceSeenTTS.set(normTTS, now);
          if (audienceSeenTTS.size > 200) {
            audienceSeenTTS.delete(audienceSeenTTS.keys().next().value);
          }

          queueAudienceSpeech(text);
          return;
        }

        // CLOSE_PARAGRAPH: fecha o parágrafo ativo e remove cursor
        if (isCloseParagraph) {
          if (audienceActiveParagraphObj) {
            if (audienceActiveParagraphObj.cursorEl) audienceActiveParagraphObj.cursorEl.remove();
            audienceActiveParagraphObj = null;
          }
          return;
        }

        const feed = document.getElementById('audience-subtitles-feed');
        if (!feed) return;

        const emptyP = feed.querySelector('.placeholder-empty');
        if (emptyP) emptyP.remove();

        const isPause = (now - audienceLastSubtitleTime) > 2500 || !audienceActiveParagraphObj || !audienceActiveParagraphObj.p || !audienceActiveParagraphObj.p.isConnected;

        // LIVE_INTERIM: transcrição/tradução instantânea palavra a palavra com cursor
        if (isLiveInterim) {
          const pktTime = data.timestamp || 0;
          // Se chegou pacote interim mais antigo do que a última frase confirmada ou do que o último interim recebido, descarta (pacote fora de ordem da rede)
          if (pktTime && audienceLastConfirmedTimestamp && pktTime < audienceLastConfirmedTimestamp) {
            return;
          }
          if (pktTime && audienceLastInterimTimestamp && pktTime < audienceLastInterimTimestamp) {
            return;
          }
          if (pktTime) audienceLastInterimTimestamp = pktTime;

          const interimText = (data.text || '').trim();
          const normInterim = cleanNorm(interimText);

          // Se o interim já está no parágrafo ativo ou no parágrafo anterior, não exibe
          const prevConfirmed = audienceActiveParagraphObj ? cleanNorm(audienceActiveParagraphObj.confirmedSpan.textContent) : '';
          const lastFeedPara = feed.lastElementChild ? cleanNorm(feed.lastElementChild.textContent) : '';
          if (normInterim && (prevConfirmed.endsWith(normInterim) || prevConfirmed === normInterim || lastFeedPara.endsWith(normInterim) || lastFeedPara === normInterim)) {
            if (audienceActiveParagraphObj && audienceActiveParagraphObj.liveSpan) {
              audienceActiveParagraphObj.liveSpan.textContent = '';
            }
            return;
          }

          if (isPause) {
            if (!interimText) return;
            if (feed.lastElementChild) {
              feed.lastElementChild.className = 'leading-relaxed transition-all duration-200 mb-3 whitespace-normal break-words opacity-70';
            }

            const p = document.createElement('p');
            p.className = 'leading-relaxed transition-all duration-300 mb-3 font-bold whitespace-normal break-words opacity-100 text-slate-900 dark:text-white';

            const tConfirmed = document.createElement('span');
            tConfirmed.className = 'audience-para-confirmed';

            const tLive = document.createElement('span');
            tLive.className = 'audience-para-live font-normal opacity-90';
            tLive.textContent = interimText;

            const tCursor = document.createElement('span');
            tCursor.className = 'streaming-cursor inline-block w-1.5 h-3.5 ml-1 bg-amber-400 animate-pulse align-middle rounded-xs';

            p.appendChild(tConfirmed);
            p.appendChild(tLive);
            p.appendChild(tCursor);
            feed.appendChild(p);

            audienceActiveParagraphObj = { p, confirmedSpan: tConfirmed, liveSpan: tLive, cursorEl: tCursor };
          } else {
            const prev = audienceActiveParagraphObj.confirmedSpan.textContent.trim();
            const normPrev = cleanNorm(prev);

            // Se o texto já foi confirmado neste parágrafo, não re-exibe no interim
            if (normInterim && (normPrev.endsWith(normInterim) || normPrev === normInterim)) {
              audienceActiveParagraphObj.liveSpan.textContent = '';
            } else {
              const hasConfirmed = prev.length > 0;
              audienceActiveParagraphObj.liveSpan.textContent = interimText ? ((hasConfirmed ? ' ' : '') + interimText) : '';
            }
          }
          audienceLastSubtitleTime = now;
          feed.scrollTop = feed.scrollHeight;
          return;
        }

        // NEW_SUBTITLE: frase finalizada (consolida no parágrafo ativo e limpa interim)
        const text = (data.text || '').trim();
        if (!text) return;

        const normText = cleanNorm(text);
        if (!normText) return;

        if (audienceSeenSubtitles.has(normText)) {
          const lastTime = audienceSeenSubtitles.get(normText);
          if (now - lastTime < 15000) return;
        }
        audienceSeenSubtitles.set(normText, now);
        if (audienceSeenSubtitles.size > 200) {
          audienceSeenSubtitles.delete(audienceSeenSubtitles.keys().next().value);
        }

        audienceLastConfirmedTimestamp = data.timestamp || now;
        audienceLastInterimTimestamp = audienceLastConfirmedTimestamp;

        // Se a frase já foi exibida no parágrafo ativo ou no parágrafo anterior, não duplica
        const prevConfirmed = audienceActiveParagraphObj ? cleanNorm(audienceActiveParagraphObj.confirmedSpan.textContent) : '';
        const lastFeedPara = feed.lastElementChild ? cleanNorm(feed.lastElementChild.textContent) : '';

        if (prevConfirmed.endsWith(normText) || prevConfirmed === normText || lastFeedPara.endsWith(normText) || lastFeedPara === normText) {
          if (audienceActiveParagraphObj && audienceActiveParagraphObj.liveSpan) {
            audienceActiveParagraphObj.liveSpan.textContent = '';
          }
          return;
        }

        if (isPause) {
          if (feed.lastElementChild) {
            feed.lastElementChild.className = 'leading-relaxed transition-all duration-200 mb-3 whitespace-normal break-words opacity-70';
          }

          const p = document.createElement('p');
          p.className = 'leading-relaxed transition-all duration-300 mb-3 font-bold whitespace-normal break-words opacity-100 text-slate-900 dark:text-white';

          const tConfirmed = document.createElement('span');
          tConfirmed.className = 'audience-para-confirmed';
          tConfirmed.textContent = text;

          const tLive = document.createElement('span');
          tLive.className = 'audience-para-live font-normal opacity-90';

          const tCursor = document.createElement('span');
          tCursor.className = 'streaming-cursor inline-block w-1.5 h-3.5 ml-1 bg-amber-400 animate-pulse align-middle rounded-xs';

          p.appendChild(tConfirmed);
          p.appendChild(tLive);
          p.appendChild(tCursor);
          feed.appendChild(p);

          audienceActiveParagraphObj = { p, confirmedSpan: tConfirmed, liveSpan: tLive, cursorEl: tCursor };
        } else {
          const prev = audienceActiveParagraphObj.confirmedSpan.textContent.trim();
          const normPrev = cleanNorm(prev);
          if (normPrev.endsWith(normText) || normPrev === normText) {
            audienceActiveParagraphObj.liveSpan.textContent = '';
          } else {
            audienceActiveParagraphObj.confirmedSpan.textContent = prev ? (prev + ' ' + text) : text;
            audienceActiveParagraphObj.liveSpan.textContent = '';
          }
        }
        audienceLastSubtitleTime = now;

        while (feed.children.length > 30) feed.removeChild(feed.firstChild);
        feed.scrollTop = feed.scrollHeight;
      }

      // 1. SINCRONIZAÇÃO LOCAL (BroadcastChannel)
      try {
        const channel = new BroadcastChannel('brain_subtitles_channel');
        channel.onmessage = (event) => {
          handleAudienceIncomingSubtitle(event.data);
        };
      } catch(e) {}

      // 2. SINCRONIZAÇÃO GLOBAL EM NUVEM (MQTT) E PRESENÇA DE AUDIÊNCIA
      const safeMeetingMqttId = encodeURIComponent((id || '').toLowerCase().trim()).replace(/[^a-z0-9_-]/g, '_');
      const mqttTopic = 'brainaudiovisual/meeting/' + safeMeetingMqttId + '/subtitles';
      const mqttPresenceTopic = 'brainaudiovisual/meeting/' + safeMeetingMqttId + '/presence';

      const audienceSessionId = 'aud_' + Math.random().toString(36).substring(2, 9);
      let presenceBc = null;
      try { presenceBc = new BroadcastChannel('brain_presence_' + safeMeetingMqttId); } catch(e) {}

      function sendAudiencePresenceHeartbeat() {
        const payload = {
          type: 'HEARTBEAT',
          meetingId: id,
          lang: currentAudienceLang,
          clientId: audienceSessionId,
          timestamp: Date.now()
        };
        try { if (presenceBc) presenceBc.postMessage(payload); } catch(e) {}
        try {
          if (window._mqttAudienceListenerClient && window._mqttAudienceListenerClient.connected) {
            window._mqttAudienceListenerClient.publish(mqttPresenceTopic, JSON.stringify(payload), { qos: 0 });
          }
        } catch(e) {}
        try { localStorage.setItem('brain_presence_ping_' + safeMeetingMqttId, JSON.stringify(payload)); } catch(e) {}
      }

      const audienceHeartbeatTimer = setInterval(sendAudiencePresenceHeartbeat, 3000);
      setTimeout(sendAudiencePresenceHeartbeat, 500);
      window.addEventListener('beforeunload', () => {
        clearInterval(audienceHeartbeatTimer);
      });

      try {
        if (typeof mqtt !== 'undefined') {
          const mqttAudienceClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId: 'brain_aud_' + Math.random().toString(16).substring(2, 8),
            clean: true,
            connectTimeout: 7000,
            reconnectPeriod: 2500,
            keepalive: 15
          });
          window._mqttAudienceListenerClient = mqttAudienceClient;
          mqttAudienceClient.on('connect', () => {
            mqttAudienceClient.subscribe(mqttTopic, { qos: 0 });
            sendAudiencePresenceHeartbeat();
            const badge = document.getElementById('audience-cloud-status-badge');
            if (badge) {
              const curI18n = audienceI18n[currentAudienceLang] || audienceI18n['en-US'];
              badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> ' + curI18n.connected;
            }
          });
          mqttAudienceClient.on('message', (topic, payload) => {
            try {
              const parsed = JSON.parse(payload.toString());
              handleAudienceIncomingSubtitle(parsed);
            } catch(e) {}
          });
        }
      } catch(e) {}
    }


    function renderMeetingRoomMonitor(id) {
      let isTimerPaused = false;
      let sessionElapsedSeconds = 0;
      let latency = 24;
      let currentUtteranceSeq = 0;

      function cleanNorm(s) {
        return (s || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[.,!?;:«»""'']/g, ' ').replace(/\s+/g, ' ').trim();
      }

      const safeMeetingMqttId = encodeURIComponent((id || '').toLowerCase().trim()).replace(/[^a-z0-9_-]/g, '_');
      const mqttMeetingTopic = 'brainaudiovisual/meeting/' + safeMeetingMqttId + '/subtitles';
      let mqttPublisherClient = null;

      // Heartbeat periódico da sala ativa (atualiza a cada 3s enquanto o Cockpit estiver aberto)
      function pulseRoomActiveHeartbeat() {
        try {
          localStorage.setItem('brain_room_heartbeat_' + id, Date.now().toString());
        } catch(e) {}
      }
      pulseRoomActiveHeartbeat();
      const roomHeartbeatTimer = setInterval(pulseRoomActiveHeartbeat, 3000);

      let meeting = null;

      } catch(e) {}

      if (!meeting) {
        meeting = {

      const SUPPORTED_LANG_MAP = {

        'fr-FR': { name: 'Francês', tag: 'FR', code: 'fr', channel: 'french' },
        'de-DE': { name: 'Alemão', tag: 'DE', code: 'de', channel: 'german' },
        'it-IT': { name: 'Italiano', tag: 'IT', code: 'it', channel: 'italian' },
        'zh-CN': { name: 'Mandarim', tag: 'ZH', code: 'zh', channel: 'chinese' },

      };

      let selectedSourceLanguage = meeting.sourceLanguage || 'pt-BR';
      let isAutoDetectLanguage = meeting.autoDetectLanguage !== false;
      let activeTargetLanguages = meeting.targetLanguages && meeting.targetLanguages.length ? meeting.targetLanguages : ['en-US', 'es-ES'];

      // Estilos independentes por coluna
      let transSubtitleConfig = {

      };

          fontFamily: 'font-sans'
        };

          if (s) targetColumnConfigs[lang] = Object.assign(targetColumnConfigs[lang], JSON.parse(s));
        } catch(e) {}

      // Histórico de transcrições e áudios gravados

      let targetMeterStates = {}; // langCode -> { activeUntil: timestamp }
      activeTargetLanguages.forEach(l => { 
        targetAudioBlobs[l] = []; 
        targetAudioBlobsFemale[l] = []; 
        targetAudioBlobsMale[l] = []; 
        targetMeterStates[l] = { activeUntil: 0 };
      });

      // Estado do Microfone do Palestrante
      let isRealMicActive = false;
      let isTransmitterMicMuted = false;
      let selectedMicDeviceId = meeting.inputDevice || 'default';
      let micMediaStream = null;
      let micAudioContext = null;
      let micAnalyserNode = null;
      let micMediaRecorder = null;
      let micVuAnimFrameId = null;

      // Estado de Reconhecimento Contínuo de Fala
      let speechRecognizer = null;
      let isTranscribingSpeech = false;
      let isStartingSpeechRecognition = false;
      let speechInterimBuffer = '';
      let speechSilenceCommitTimer = null;
      let lastSpeechActivityTimestamp = Date.now();
      let lastCommittedSpeechText = '';
      let lastCommittedSpeechTimestamp = 0;
      let speechWatchdogInterval = null;
      let speechRecognizerRestartTimeout = null;
      let isSpeechCycleRestarting = false;

      // Estado de Transcrição e Broadcast

      // SISTEMA DE MONITORAMENTO EM TEMPO REAL DE ESPECTADORES POR IDIOMA
      const audiencePresenceClients = new Map(); // clientId -> { lang, timestamp }

      function handleAudiencePresencePing(data) {
        if (!data || !data.clientId || !data.lang) return;
        audiencePresenceClients.set(data.clientId, {
          lang: data.lang,
          timestamp: Date.now()
        });
        refreshAudienceLiveCounters();
      }

      function refreshAudienceLiveCounters() {
        const now = Date.now();
        // Remove ouvintes inativos há mais de 8 segundos
        for (const [clientId, info] of audiencePresenceClients.entries()) {
          if (now - info.timestamp > 8000) {
            audiencePresenceClients.delete(clientId);
          }
        }

        const countsByLang = {};
        for (const info of audiencePresenceClients.values()) {
          const full = info.lang;
          const short = (info.lang || '').split('-')[0].toLowerCase();
          countsByLang[full] = (countsByLang[full] || 0) + 1;
          countsByLang[short] = (countsByLang[short] || 0) + 1;
        }

        // Atualiza contadores em cada coluna de idioma traduzido
        const allKnownLangs = ['en-US', 'es-ES', 'pt-BR', 'fr-FR', 'de-DE', 'it-IT', 'zh-CN', 'ja-JP'];
        allKnownLangs.forEach(code => {
          const short = code.split('-')[0].toLowerCase();
          const total = countsByLang[code] || countsByLang[short] || 0;
          const countEl = document.getElementById('target-audience-count-num-' + code) || document.getElementById('target-audience-count-num-' + short);
          if (countEl) countEl.innerText = total;
        });

        // Atualiza contador da coluna de Português em Prontidão
        const ptTotal = countsByLang['pt-BR'] || countsByLang['pt'] || 0;
        const ptCountEl = document.getElementById('target-audience-count-num-pt-standby');
        if (ptCountEl) ptCountEl.innerText = ptTotal;
      }

      // Escuta presenças locais via BroadcastChannel e LocalStorage
      try {
        const presenceBc = new BroadcastChannel('brain_presence_' + safeMeetingMqttId);
        presenceBc.onmessage = (e) => handleAudiencePresencePing(e.data);
      } catch(e) {}

      window.addEventListener('storage', (e) => {
        if (e.key === 'brain_presence_ping_' + safeMeetingMqttId && e.newValue) {
          try { handleAudiencePresencePing(JSON.parse(e.newValue)); } catch(err) {}

      // Sincronização Local (BroadcastChannel) e Nuvem (MQTT)
      let subtitleBroadcast = null;
      try {
        subtitleBroadcast = new BroadcastChannel('brain_subtitles_channel');
      } catch(e) {}

      function connectCockpitMqtt() {
        if (typeof mqtt === 'undefined') return;
        try {
          mqttPublisherClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId: 'brain_cockpit_' + Math.random().toString(16).substring(2, 8),
            clean: true,
            connectTimeout: 5000,

          mqttPublisherClient.on('connect', () => {

            if (badge) {
              badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Nuvem Conectada (24ms)';
              badge.className = 'text-[11px] font-bold px-2.5 py-1 rounded-full bg-emerald-50 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-700 flex items-center gap-1.5 shadow-2xs';
            }
            // Inscreve no tópico de presença global para contar espectadores conectados via celular (QR Code)
            const mqttPresenceTopic = 'brainaudiovisual/meeting/' + safeMeetingMqttId + '/presence';
            mqttPublisherClient.subscribe(mqttPresenceTopic, { qos: 0 });
          });
          mqttPublisherClient.on('message', (topic, payload) => {
            try {
              if (topic.endsWith('/presence')) {
                const data = JSON.parse(payload.toString());
                handleAudiencePresencePing(data);
              }
            } catch(e) {}
          });
        } catch(e) {}
      }
      connectCockpitMqtt();

      function broadcastSubtitleGlobally(channel, text, startSec, endSec) {

          meetingId: id,

          text: text,
          startSec: startSec,
          endSec: endSec,

          try { subtitleBroadcast.postMessage(payload); } catch(e) {}
        }
        if (mqttPublisherClient && mqttPublisherClient.connected) {
          try { mqttPublisherClient.publish(mqttMeetingTopic, JSON.stringify(payload), { qos: 0 }); } catch(e) {}
        }
      }

        }
        if (mqttPublisherClient && mqttPublisherClient.connected) {
          try { mqttPublisherClient.publish(mqttMeetingTopic, JSON.stringify(payload), { qos: 0 }); } catch(e) {}
        }
      }

      function formatDuration(sec) {
        const pad = (n) => String(Math.floor(n)).padStart(2, '0');
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = Math.floor(sec % 60);
        return h > 0 ? `${pad(h)}h ${pad(m)}m ${pad(s)}s` : `${pad(m)}m ${pad(s)}s`;
      }

      function formatClockTime(sec) {
        const pad = (n) => String(Math.floor(n)).padStart(2, '0');
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = Math.floor(sec % 60);
        return `${pad(h)}:${pad(m)}:${pad(s)}`;
      }

      // ========================================================
      // ENUMERAÇÃO E CAPTURA DE DISPOSITIVOS DE ÁUDIO
      // ========================================================
      async function refreshAudioDevicesList(forcePrompt = false) {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
          if (forcePrompt) {
            try {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              stream.getTracks().forEach(t => t.stop());
            } catch(e) {}
          }
          const devices = await navigator.mediaDevices.enumerateDevices();
          const audioInputs = devices.filter(d => d.kind === 'audioinput');
          const sel = document.getElementById('transmitter-mic-select');
          if (sel && audioInputs.length > 0) {
            const curVal = sel.value;
            sel.innerHTML = audioInputs.map((d, i) => `
              <option value="${d.deviceId}" ${(curVal === d.deviceId || (i === 0 && curVal === 'default')) ? 'selected' : ''}>
                ${d.label || ("Entrada de Microfone " + (i + 1))}
              </option>
            `).join('');
          }
        } catch(e) {}
      }

      window.onTransmitterMicDeviceSelected = function(deviceId) {
        selectedMicDeviceId = deviceId;
        meeting.inputDevice = deviceId;
        if (isRealMicActive) {
          stopMasterMicCapture();
          setTimeout(startMasterMicCapture, 150);
        }
      };

      // VU METER DO MICROFONE EM TEMPO REAL (BASEADO EM RMS REAL)
      function startMicVuMeterLoop() {
        if (!micAnalyserNode) return;
        const timeData = new Float32Array(micAnalyserNode.fftSize);

        function updateVu() {
          if (!isRealMicActive || !micAnalyserNode) return;
          micAnalyserNode.getFloatTimeDomainData(timeData);

          let sumSquares = 0;
          for (let i = 0; i < timeData.length; i++) {
            sumSquares += timeData[i] * timeData[i];
          }
          const rms = Math.sqrt(sumSquares / timeData.length);
          // Conversão de RMS para dB (-50dB a 0dB) para resposta dinâmica natural
          const db = 20 * Math.log10(Math.max(rms, 0.00005));
          const pct = Math.max(0, Math.min(100, Math.round(((db + 46) / 46) * 100)));

          const bar = document.getElementById('transmitter-vu-bar');
          const text = document.getElementById('transmitter-vu-text');
          const led = document.getElementById('transmitter-vu-led');

          if (bar) bar.style.width = pct + '%';
          if (text) text.innerText = pct + '%';
          if (led) {
            led.className = pct > 6 ? 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse' : 'w-2 h-2 rounded-full bg-slate-400';
          }

          micVuAnimFrameId = requestAnimationFrame(updateVu);
        }
        micVuAnimFrameId = requestAnimationFrame(updateVu);
      }

      window.toggleMasterMicCapture = async function() {
        if (!isRealMicActive) {
          await startMasterMicCapture();
        } else {
          stopMasterMicCapture();
        }
      };

      async function startMasterMicCapture() {
        const select = document.getElementById('transmitter-mic-select');
        const targetDeviceId = select ? select.value : selectedMicDeviceId;
        // Permite controle de ganho automático do hardware/navegador para assegurar volume potente
        const constraints = {
          audio: (targetDeviceId && targetDeviceId !== 'default') 
            ? { deviceId: { exact: targetDeviceId }, echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
            : { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        };

        try {
          if (micMediaStream) micMediaStream.getTracks().forEach(t => t.stop());
          micMediaStream = await navigator.mediaDevices.getUserMedia(constraints);
          await refreshAudioDevicesList();

          if (!micAudioContext || micAudioContext.state === 'closed') {
            micAudioContext = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (micAudioContext.state === 'suspended') await micAudioContext.resume();

          const source = micAudioContext.createMediaStreamSource(micMediaStream);

          // Pré-amplificador de Estúdio (+7dB) para encorpar a captação
          const micGainNode = micAudioContext.createGain();
          micGainNode.gain.value = 2.24; // +7.0 dB de reforço limpo

          // Compressor Dinâmico de Broadcast (evita clipping e valoriza sussurros)
          const micCompressor = micAudioContext.createDynamicsCompressor();
          micCompressor.threshold.setValueAtTime(-24, micAudioContext.currentTime);
          micCompressor.knee.setValueAtTime(24, micAudioContext.currentTime);
          micCompressor.ratio.setValueAtTime(3.5, micAudioContext.currentTime);
          micCompressor.attack.setValueAtTime(0.003, micAudioContext.currentTime);
          micCompressor.release.setValueAtTime(0.25, micAudioContext.currentTime);

          micAnalyserNode = micAudioContext.createAnalyser();
          micAnalyserNode.fftSize = 256;
          micAnalyserNode.smoothingTimeConstant = 0.35;

          const micDestination = micAudioContext.createMediaStreamDestination();

          source.connect(micGainNode);
          micGainNode.connect(micCompressor);
          micCompressor.connect(micAnalyserNode);
          micCompressor.connect(micDestination);

          isRealMicActive = true;

          const btn = document.getElementById('btn-toggle-mic-master');
          if (btn) {
            btn.innerHTML = "<span>Pausar Microfone</span>";
            btn.className = 'flex-1 py-2 px-3 rounded-xl text-xs font-bold transition-all shadow-xs cursor-pointer flex items-center justify-center gap-1.5 bg-rose-600 hover:bg-rose-700 text-white';
          }

          startMicVuMeterLoop();

          // Gravação do áudio do microfone a partir do fluxo pré-amplificado e tratado
          try {
            transmitterAudioChunks = [];
            micMediaRecorder = new MediaRecorder(micDestination.stream);
            micMediaRecorder.ondataavailable = (e) => {
              if (e.data.size > 0) transmitterAudioChunks.push(e.data);
            };
            micMediaRecorder.onstop = () => {
              transmitterRecordedBlob = new Blob(transmitterAudioChunks, { type: 'audio/webm' });
            };
            micMediaRecorder.start(1000);
            isRecordingTransmitter = true;
          } catch(e) {}

          // Inicia reconhecimento contínuo de fala
          startContinuousSpeechTranscription();
        } catch(err) {
          alert('Erro ao ativar microfone: ' + err.message + '\n\nCertifique-se de que o dispositivo está conectado e que o navegador possui permissão.');
        }
      }

      function stopMasterMicCapture() {
        if (micMediaStream) {
          micMediaStream.getTracks().forEach(t => t.stop());
          micMediaStream = null;
        }
        if (micAudioContext && micAudioContext.state !== 'closed') {
          micAudioContext.close().catch(() => {});
        }
        if (micMediaRecorder && micMediaRecorder.state !== 'inactive') {
          try { micMediaRecorder.stop(); } catch(e) {}
        }
        isRealMicActive = false;

        const btn = document.getElementById('btn-toggle-mic-master');
        if (btn) {
          btn.innerHTML = "<span>Ativar Microfone & Transcrição</span>";
          btn.className = 'flex-1 py-2 px-3 rounded-xl text-xs font-bold transition-all shadow-xs cursor-pointer flex items-center justify-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white';
        }

        const bar = document.getElementById('transmitter-vu-bar');
        const text = document.getElementById('transmitter-vu-text');
        const led = document.getElementById('transmitter-vu-led');
        if (bar) bar.style.width = '0%';
        if (text) text.innerText = '0%';
        if (led) led.className = 'w-2 h-2 rounded-full bg-slate-400';

        safelyDestroySpeechRecognizer(true);
      }

      window.toggleTransmitterMicMute = function() {
        if (!micMediaStream) return;
        isTransmitterMicMuted = !isTransmitterMicMuted;
        micMediaStream.getAudioTracks().forEach(t => { t.enabled = !isTransmitterMicMuted; });
        const icon = document.getElementById('icon-mute-transmitter');
        if (icon) {
          icon.innerText = isTransmitterMicMuted ? "Microfone Mutado" : "Microfone Aberto";
        }
      };

      // ========================================================
      // MOTOR DE TRANSCRIÇÃO E TRADUÇÃO INSTANTÂNEA EM FLUXO CONTÍNUO
      // (PARÁGRAFO CONTÍNUO, SOFT-WRAP POR LARGURA, QUEBRA SÓ EM PAUSAS)
      // ========================================================
      let activeSpeechParagraphSeq = 0;
      let currentTransmitterParagraph = null; // { id, el, confirmedSpan, liveSpan, cursorEl, startTime }
      let currentTargetParagraphs = {};       // { [langCode]: { id, el, confirmedSpan, liveSpan, cursorEl } }
      let paragraphPauseTimer = null;         // Silêncio significante (2.5s) que fecha o parágrafo
      let liveTranslationDebounceTimer = null;
      let liveTranslationSeq = 0;
      let finalizedUtteranceIndices = new Set();
      let lastConfirmedCleanTranscript = '';
      let lastConfirmedTimestamp = 0;

      // Cache de traduções para evitar chamadas repetidas
      const _translationCache = new Map();

      async function fetchFastTranslation(text, sourceLang, targetLang) {
        if (!text || !text.trim()) return '';
        const clean = text.trim();
        const sourceCode = (sourceLang || 'pt-BR').split('-')[0].toLowerCase();
        const targetCode = (targetLang || 'en').split('-')[0].toLowerCase();
        if (sourceCode === targetCode) return clean;

        // Cache hit imediato
        const cacheKey = `${sourceCode}|${targetCode}|${clean}`;
        if (_translationCache.has(cacheKey)) return _translationCache.get(cacheKey);

        const clients = ['dict-chrome-ex', 'tw-ob', 'gtx'];
        for (const client of clients) {
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2200);
            const googleUrl = `https://translate.googleapis.com/translate_a/single?client=${client}&sl=${sourceCode}&tl=${targetCode}&dt=t&q=${encodeURIComponent(clean)}`;
            const res = await fetch(googleUrl, { signal: controller.signal });
            clearTimeout(timeoutId);
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data) && Array.isArray(data[0])) {
                const trans = data[0].map(item => item[0]).filter(Boolean).join('');
                if (trans && trans.trim()) {
                  const result = trans.trim();
                  _translationCache.set(cacheKey, result);
                  if (_translationCache.size > 500) {
                    const firstKey = _translationCache.keys().next().value;
                    _translationCache.delete(firstKey);
                  }
                  return result;
                }
              }
            }
          } catch(e) {}
        }

        // Fallback final: proxy allorigins com dict-chrome-ex
        try {
          const directUrl = `https://translate.googleapis.com/translate_a/single?client=dict-chrome-ex&sl=${sourceCode}&tl=${targetCode}&dt=t&q=${encodeURIComponent(clean)}`;
          const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(directUrl)}`;
          const controller2 = new AbortController();
          const timeoutId2 = setTimeout(() => controller2.abort(), 2500);
          const res2 = await fetch(proxyUrl, { signal: controller2.signal });
          clearTimeout(timeoutId2);
          if (res2.ok) {
            const data2 = await res2.json();
            if (Array.isArray(data2) && Array.isArray(data2[0])) {
              const trans2 = data2[0].map(item => item[0]).filter(Boolean).join('');
              if (trans2 && trans2.trim()) {
                const result2 = trans2.trim();
                _translationCache.set(cacheKey, result2);
                return result2;
              }
            }
          }
        } catch(e2) {}

        console.warn('[BrainLingo] Tradução falhou para:', sourceCode, '->', targetCode, '| texto:', clean.substring(0, 40));
        return null;
      }

      function getOrCreateActiveParagraph() {
        const feed = document.getElementById('transmitter-transcription-feed');
        const box = document.getElementById('transmitter-subtitle-box');

        if (!currentTransmitterParagraph || !currentTransmitterParagraph.el || !currentTransmitterParagraph.el.isConnected) {
          activeSpeechParagraphSeq++;
          const pId = 'speech-para-' + activeSpeechParagraphSeq;

          if (feed) {
            const empty = feed.querySelector('.placeholder-empty');
            if (empty) empty.remove();

            const div = document.createElement('div');
            div.id = pId;
            // Soft-wrap contínuo: texto corre normalmente e só quebra linha ao exceder a largura do container
            div.className = 'speech-paragraph text-sm sm:text-base leading-relaxed whitespace-normal break-words mb-3 transition-opacity';
            div.style.color = transSubtitleConfig.textColor;

            const confirmedSpan = document.createElement('span');
            confirmedSpan.className = 'para-confirmed';

            const liveSpan = document.createElement('span');
            liveSpan.className = 'para-live font-normal';

            const cursorEl = document.createElement('span');
            cursorEl.className = 'streaming-cursor inline-block w-1.5 h-3.5 ml-1 bg-blue-500 animate-pulse align-middle rounded-xs';

            div.appendChild(confirmedSpan);
            div.appendChild(liveSpan);
            div.appendChild(cursorEl);

            feed.appendChild(div);
            if (box) box.scrollTop = box.scrollHeight;

            currentTransmitterParagraph = {
              id: pId,
              el: div,
              confirmedSpan: confirmedSpan,
              liveSpan: liveSpan,
              cursorEl: cursorEl,
              startTime: sessionElapsedSeconds
            };
          }
        }

        // Garante e sincroniza parágrafos contínuos para as colunas traduzidas ativas
        const targets = new Set(activeTargetLanguages);
        if (selectedSourceLanguage !== 'pt-BR' || isPtColumnExpanded) {
          targets.add('pt-BR');
        }

        targets.forEach(targetLang => {
          const existing = currentTargetParagraphs[targetLang];
          if (!existing || !existing.el || !existing.el.isConnected) {
            const els = getTargetColumnElements(targetLang);
            const cfg = targetColumnConfigs[targetLang] || { textColor: '#fde047' };
            if (els.feed) {
              const empty = els.feed.querySelector('.placeholder-empty');
              if (empty) empty.remove();

              const tDiv = document.createElement('div');
              tDiv.id = `target-para-${targetLang}-${activeSpeechParagraphSeq}`;
              tDiv.className = 'target-speech-paragraph text-sm sm:text-base leading-relaxed whitespace-normal break-words mb-3 transition-opacity';
              tDiv.style.color = cfg.textColor;

              const tConfirmed = document.createElement('span');
              tConfirmed.className = 'target-para-confirmed';

              const tLive = document.createElement('span');
              tLive.className = 'target-para-live font-normal';

              const tCursor = document.createElement('span');
              tCursor.className = 'streaming-cursor inline-block w-1.5 h-3.5 ml-1 bg-amber-400 animate-pulse align-middle rounded-xs';

              tDiv.appendChild(tConfirmed);
              tDiv.appendChild(tLive);
              tDiv.appendChild(tCursor);

              els.feed.appendChild(tDiv);
              if (els.box) els.box.scrollTop = els.box.scrollHeight;

              currentTargetParagraphs[targetLang] = {
                id: tDiv.id,
                el: tDiv,
                confirmedSpan: tConfirmed,
                liveSpan: tLive,
                cursorEl: tCursor
              };
            }
          }
        });

        return currentTransmitterParagraph;
      }

      function closeActiveParagraphs() {
        if (paragraphPauseTimer) {
          clearTimeout(paragraphPauseTimer);
          paragraphPauseTimer = null;
        }

        if (currentTransmitterParagraph) {
          if (currentTransmitterParagraph.liveSpan && currentTransmitterParagraph.liveSpan.textContent.trim()) {
            const remaining = currentTransmitterParagraph.liveSpan.textContent.trim();
            const prev = currentTransmitterParagraph.confirmedSpan.textContent.trim();
            const normPrev = cleanNorm(prev);
            const normRem = cleanNorm(remaining);
            if (normRem && !normPrev.endsWith(normRem) && normPrev !== normRem) {
              currentTransmitterParagraph.confirmedSpan.textContent = prev ? (prev + ' ' + remaining) : remaining;
            }
            currentTransmitterParagraph.liveSpan.textContent = '';
          }
          if (currentTransmitterParagraph.cursorEl) {
            currentTransmitterParagraph.cursorEl.remove();
            currentTransmitterParagraph.cursorEl = null;
          }
          currentTransmitterParagraph = null;
        }

        Object.keys(currentTargetParagraphs).forEach(targetLang => {
          const tp = currentTargetParagraphs[targetLang];
          if (tp) {
            if (tp.liveSpan && tp.liveSpan.textContent.trim()) {
              const remaining = tp.liveSpan.textContent.trim();
              const prev = tp.confirmedSpan.textContent.trim();
              const normPrev = cleanNorm(prev);
              const normRem = cleanNorm(remaining);
              if (normRem && !normPrev.endsWith(normRem) && normPrev !== normRem) {
                tp.confirmedSpan.textContent = prev ? (prev + ' ' + remaining) : remaining;
              }
              tp.liveSpan.textContent = '';
            }
            if (tp.cursorEl) {
              tp.cursorEl.remove();
              tp.cursorEl = null;
            }
          }
        });
        currentTargetParagraphs = {};
        // Reseta tracker de interim para a próxima frase
        Object.keys(_interimTracker).forEach(lang => {
          _interimTracker[lang] = { lastShownLen: 0, inFlight: false };
        });
        // Cancela timers pendentes de TTS streaming e reseta estado
        Object.keys(_liveTTSStreamState).forEach(lang => {
          if (_liveTTSStreamState[lang].timer) {
            clearTimeout(_liveTTSStreamState[lang].timer);
            _liveTTSStreamState[lang].timer = null;
          }
          _liveTTSStreamState[lang] = {
            spokenWordCount: 0,
            firstWordTimestamp: 0,
            timer: null,
            latestTranslation: ''
          };
        });
        // Notifica Espectador e OBS do fechamento do parágrafo
        broadcastCloseParagraphGlobally('all');
      }

      // Rastreamento por idioma para tradução interim (não cancela em-voo)
      const _interimTracker = {}; // { [lang]: { lastShownLen, inFlight } }

      // Caminho RÁPIDO para tradução em tempo real — rotação multi-cliente Google (dict-chrome-ex, tw-ob, gtx)
      async function fetchInterimTranslation(text, sourceLang, targetLang) {
        const clean = text.trim();
        if (!clean) return null;
        const sourceCode = (sourceLang || 'pt-BR').split('-')[0].toLowerCase();
        const targetCode = (targetLang || 'en').split('-')[0].toLowerCase();
        if (sourceCode === targetCode) return clean;

        // Cache hit imediato
        const cacheKey = `${sourceCode}|${targetCode}|${clean}`;
        if (_translationCache.has(cacheKey)) return _translationCache.get(cacheKey);

        const clients = ['dict-chrome-ex', 'tw-ob', 'gtx'];
        for (const client of clients) {
          try {
            const ctrl = new AbortController();
            const tid = setTimeout(() => ctrl.abort(), 1600);
            const res = await fetch(
              `https://translate.googleapis.com/translate_a/single?client=${client}&sl=${sourceCode}&tl=${targetCode}&dt=t&q=${encodeURIComponent(clean)}`,
              { signal: ctrl.signal }
            );
            clearTimeout(tid);
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data) && Array.isArray(data[0])) {
                const trans = data[0].map(i => i[0]).filter(Boolean).join('');
                if (trans && trans.trim()) {
                  const result = trans.trim();
                  // Salva no cache compartilhado
                  _translationCache.set(cacheKey, result);
                  if (_translationCache.size > 500) {
                    _translationCache.delete(_translationCache.keys().next().value);
                  }
                  return result;
                }
              }
            }
          } catch(e) {}
        }
        return null;
      }

      // RASTREAMENTO DE TTS STREAMING EM TEMPO REAL COM DELAY DE 4 SEGUNDOS
      // Permite locução contínua acompanhando o ritmo em que a tradução é escrita na tela,
      // com delay de 4s para acumular blocos sonoros completos, sem picotar e sem repetições.
      const _liveTTSStreamState = {};

      function extractNextTTSChunk(spokenCount, fullText, isFinal) {
        const currentWords = (fullText || '').trim().split(/\s+/).filter(Boolean);
        if (currentWords.length === 0) return { chunk: '', newCount: spokenCount };
        if (spokenCount >= currentWords.length) return { chunk: '', newCount: spokenCount };

        const unsaid = currentWords.slice(spokenCount);
        // No interim, requer no mínimo 4 palavras para formar um bloco com ritmo e sentido pleno
        if (!isFinal && unsaid.length < 4) {
          return { chunk: '', newCount: spokenCount };
        }

        // Se não for final e tiver 6 ou mais palavras, reserva 1 palavra de margem para o próximo bloco
        let countToTake = unsaid.length;
        if (!isFinal && unsaid.length >= 6) {
          countToTake = unsaid.length - 1;
        }

        const chunkWords = unsaid.slice(0, countToTake);
        const chunk = chunkWords.join(' ');
        const newCount = spokenCount + countToTake;
        return { chunk, newCount };
      }

      // CATÁLOGO UNIVERSAL DE IDIOMAS DE TRANSMISSÃO
      // Garante que inglês, espanhol, francês, alemão, italiano e português tenham
      // EXATAMENTE a mesma velocidade de tradução, interim instantâneo e cadência de locução.
      const ALL_GLOBAL_STREAM_LANGUAGES = ['en-US', 'es-ES', 'fr-FR', 'de-DE', 'it-IT', 'pt-BR'];

      function getUniversalStreamTargets() {
        const targets = new Set(activeTargetLanguages);
        ALL_GLOBAL_STREAM_LANGUAGES.forEach(lang => {
          if (lang !== selectedSourceLanguage) {
            targets.add(lang);
          }
        });
        if (selectedSourceLanguage !== 'pt-BR' || isPtColumnExpanded) {
          targets.add('pt-BR');
        }
        return Array.from(targets);
      }

      // TRADUÇÃO EM STREAMING — Padrão Google Tradutor:
      // dispara palavra-a-palavra SEM debounce, SEM cancelar requests anteriores.
      // Usa comprimento do texto para determinar recência (texto mais longo = mais recente).
      // Também faz TTS streaming em chunks com delay de 4s sem esperar término da frase.
      function scheduleLiveStreamTranslation(interimText, utteranceSeq) {
        if (!interimText || !interimText.trim()) return;
        const textNow = interimText.trim();

        const targets = getUniversalStreamTargets();

        targets.forEach(async (targetLang, idx) => {
          if (idx > 0) await new Promise(r => setTimeout(r, idx * 60));
          if (!_interimTracker[targetLang]) {
            _interimTracker[targetLang] = { lastShownLen: 0, inFlight: false };
          }
          const tracker = _interimTracker[targetLang];

          // Se já está traduzindo um texto igual ou mais longo, aguarda
          if (tracker.inFlight && textNow.length <= tracker.lastShownLen) return;

          const now = Date.now();
          if (tracker.inFlight || (now - (tracker.lastReqTime || 0) < 100)) return;

          tracker.inFlight = true;
          tracker.lastReqTime = now;
          const translated = await fetchInterimTranslation(textNow, selectedSourceLanguage, targetLang);
          tracker.inFlight = false;

          if (!translated) return;

          // Se a frase já foi finalizada enquanto esta tradução estava a caminho, descarta para evitar repetição
          if (utteranceSeq !== undefined && utteranceSeq !== currentUtteranceSeq) {
            return;
          }

          // Só atualiza se o texto é referente a algo igual ou mais longo que o atual mostrado
          if (textNow.length >= tracker.lastShownLen) {
            tracker.lastShownLen = textNow.length;

            // Atualiza coluna visual do Cockpit (se existir)
            const tp = currentTargetParagraphs[targetLang];
            if (tp && tp.liveSpan) {
              const prev = tp.confirmedSpan.textContent.trim();
              const normPrev = cleanNorm(prev);
              const normTrans = cleanNorm(translated);
              if (normTrans && (normPrev.endsWith(normTrans) || normPrev === normTrans)) {
                tp.liveSpan.textContent = '';
              } else {
                const hasConfirmed = prev.length > 0;
                tp.liveSpan.textContent = (hasConfirmed ? ' ' : '') + translated;
                tp.liveSpan.style.opacity = '1';
              }
              const els = getTargetColumnElements(targetLang);
              if (els.box) els.box.scrollTop = els.box.scrollHeight;
            }

            // Transmite interim instantaneamente para Espectador e OBS no canal canônico (sem flood redundante)
            const targetCode = targetLang.split('-')[0].toLowerCase();
            broadcastLiveInterimGlobally(targetCode, translated);

            // ---- LOCUÇÃO EM TEMPO REAL (STREAMING TTS) COM DELAY DE 4s ----
            if (!_liveTTSStreamState[targetLang]) {
              _liveTTSStreamState[targetLang] = {
                spokenWordCount: 0,
                firstWordTimestamp: 0,
                timer: null,
                latestTranslation: ''
              };
            }
            const ttsState = _liveTTSStreamState[targetLang];
            ttsState.latestTranslation = translated.trim();
            if (!ttsState.firstWordTimestamp) {
              ttsState.firstWordTimestamp = Date.now();
            }

            // Inicia o ciclo de disparo com delay de 4s a partir do momento em que começou a escrever
            if (!ttsState.timer) {
              const runTTSStreamTick = () => {
                ttsState.timer = null;
                const latest = ttsState.latestTranslation;
                if (latest) {
                  const { chunk, newCount } = extractNextTTSChunk(ttsState.spokenWordCount, latest, false);
                  if (chunk && chunk.trim()) {
                    ttsState.spokenWordCount = newCount;
                    // Pontuação suave para cadência humana de streaming contínuo
                    const speechChunk = /[,;.!?]$/.test(chunk.trim()) ? chunk.trim() : (chunk.trim() + ',');
                    broadcastStreamTTS(targetCode, speechChunk);
                    triggerTargetAudioMeter(targetLang, Math.max(2500, speechChunk.length * 90));
                  }
                }
                // Continua o fluxo agendando o próximo bloco a cada ~3s enquanto o orador estiver falando
                ttsState.timer = setTimeout(runTTSStreamTick, 3000);
              };

              const elapsed = Date.now() - ttsState.firstWordTimestamp;
              const initialDelay = Math.max(500, 4000 - elapsed);
              ttsState.timer = setTimeout(runTTSStreamTick, initialDelay);
            }
          }
        });
      }

      // TRANSCRIÇÃO EM TEMPO REAL INSTANTÂNEA — PADRÃO BARRA DE PESQUISA DO GOOGLE
      // Escreve imediatamente palavra a palavra conforme o palestrante fala, sem esperar terminar frase
      function updateLiveSpeechDisplay(interimText) {
        lastSpeechActivityTimestamp = Date.now();
        if (paragraphPauseTimer) {
          clearTimeout(paragraphPauseTimer);
          paragraphPauseTimer = null;
        }

        const cleanInterim = (interimText || '').trim();

        if (!cleanInterim) {
          if (currentTransmitterParagraph && currentTransmitterParagraph.liveSpan) {
            currentTransmitterParagraph.liveSpan.textContent = '';
          }
          return;
        }

        const para = getOrCreateActiveParagraph();
        if (!para) return;

        const hasConfirmed = para.confirmedSpan.textContent.trim().length > 0;
        para.liveSpan.textContent = (hasConfirmed ? ' ' : '') + cleanInterim;

        const box = document.getElementById('transmitter-subtitle-box');
        if (box) box.scrollTop = box.scrollHeight;

        const thisSeq = currentUtteranceSeq;
        scheduleLiveStreamTranslation(cleanInterim, thisSeq);
        broadcastLiveInterimGlobally('transmitter', cleanInterim);
      }

      function commitFinalSentence(finalText) {
        lastSpeechActivityTimestamp = Date.now();
        const clean = (finalText || '').trim().replace(/\s+/g, ' ');
        if (!clean) return;

        // Incrementa sequência para invalidar interims assíncronos que ainda estejam em processamento
        currentUtteranceSeq++;

        // Evita duplicatas consecutivas idênticas num intervalo curto
        const now = Date.now();
        const normClean = cleanNorm(clean);
        if (normClean && normClean === cleanNorm(lastConfirmedCleanTranscript) && (now - lastConfirmedTimestamp) < 2500) {
          return;
        }
        lastConfirmedCleanTranscript = clean;
        lastConfirmedTimestamp = now;

        // Reseta tracker interim para nova frase
        Object.keys(_interimTracker).forEach(lang => {
          _interimTracker[lang] = { lastShownLen: 0, inFlight: false };
        });

        const para = getOrCreateActiveParagraph();
        if (!para) return;

        const prev = para.confirmedSpan.textContent.trim();
        para.confirmedSpan.textContent = prev ? (prev + ' ' + clean) : clean;
        para.liveSpan.textContent = '';

        const startSec = para.startTime;
        const endSec = sessionElapsedSeconds > startSec ? sessionElapsedSeconds : startSec + Math.max(1.5, clean.length * 0.08);

        transmitterTranscriptions.push({ text: clean, timeStart: startSec, timeEnd: endSec });
        broadcastSubtitleGlobally('transmitter', clean, startSec, endSec);

        const box = document.getElementById('transmitter-subtitle-box');
        if (box) box.scrollTop = box.scrollHeight;

        dispatchTargetTranslations(clean, startSec, endSec);

        // Inicia temporizador de pausa significante (2.5 segundos de silêncio para fechar parágrafo)
        if (paragraphPauseTimer) clearTimeout(paragraphPauseTimer);
        paragraphPauseTimer = setTimeout(closeActiveParagraphs, 2500);
      }

      function dispatchTargetTranslations(originalText, startSec, endSec) {
        const targets = getUniversalStreamTargets();

        targets.forEach(async (targetLang, idx) => {
          if (idx > 0) await new Promise(r => setTimeout(r, idx * 60));
          const translated = await fetchFastTranslation(originalText, selectedSourceLanguage, targetLang);

          // CRÍTICO: Nunca usar o texto original como tradução — só age se houver tradução real
          if (!translated || !translated.trim()) {
            console.warn('[BrainLingo] Tradução final falhou para', targetLang, '— ignorando broadcast/TTS.');
            // Tenta novamente em 2 segundos (retry automático)
            setTimeout(async () => {
              const retryTranslated = await fetchFastTranslation(originalText, selectedSourceLanguage, targetLang);
              if (retryTranslated && retryTranslated.trim()) {
                _applyFinalTranslation(targetLang, retryTranslated.trim(), startSec, endSec);
              }
            }, 2000);
            return;
          }

          _applyFinalTranslation(targetLang, translated.trim(), startSec, endSec);
        });
      }

      function _applyFinalTranslation(targetLang, cleanTranslated, startSec, endSec) {
        const tp = currentTargetParagraphs[targetLang];
        if (tp) {
          const prev = tp.confirmedSpan.textContent.trim();
          const normPrev = cleanNorm(prev);
          const normClean = cleanNorm(cleanTranslated);
          if (normClean && (normPrev.endsWith(normClean) || normPrev === normClean)) {
            tp.liveSpan.textContent = '';
          } else {
            tp.confirmedSpan.textContent = prev ? (prev + ' ' + cleanTranslated) : cleanTranslated;
            tp.liveSpan.textContent = '';
          }
          tp.liveSpan.style.opacity = '1';
          const els = getTargetColumnElements(targetLang);
          if (els.box) els.box.scrollTop = els.box.scrollHeight;
        }

        if (!targetTranscriptions[targetLang]) targetTranscriptions[targetLang] = [];
        targetTranscriptions[targetLang].push({ text: cleanTranslated, timeStart: startSec, timeEnd: endSec });

        const targetCode = targetLang.split('-')[0].toLowerCase();

        // 1. Broadcast IMEDIATO para exibição de legenda na tela (NEW_SUBTITLE) - apenas canal canônico
        broadcastSubtitleGlobally(targetCode, cleanTranslated, startSec, endSec);

        // Limpa o interim nas janelas
        broadcastLiveInterimGlobally(targetCode, '');

        // 2. LOCUÇÃO EM TEMPO REAL: completa a frase que estava sendo transmitida
        const ttsState = _liveTTSStreamState[targetLang];
        if (ttsState && ttsState.timer) {
          clearTimeout(ttsState.timer);
          ttsState.timer = null;
        }

        const spokenCount = ttsState ? ttsState.spokenWordCount : 0;
        const firstTime = (ttsState && ttsState.firstWordTimestamp) ? ttsState.firstWordTimestamp : Date.now();

        const { chunk } = extractNextTTSChunk(spokenCount, cleanTranslated, true);

        if (chunk && chunk.trim()) {
          const finalChunk = /[.!?]$/.test(chunk.trim()) ? chunk.trim() : (chunk.trim() + '.');
          if (spokenCount > 0) {
            // Já começou a ler durante o interim: lê as palavras restantes IMEDIATAMENTE para manter o fluxo contínuo
            broadcastStreamTTS(targetCode, finalChunk);
            triggerTargetAudioMeter(targetLang, Math.max(2500, finalChunk.length * 90));
          } else {
            // Frase curta em que nada foi lido no interim: dá o delay de 4s desde que a primeira palavra foi escrita
            const elapsed = Date.now() - firstTime;
            const remainingDelay = Math.max(0, 4000 - elapsed);
            setTimeout(() => {
              broadcastStreamTTS(targetCode, finalChunk);
              triggerTargetAudioMeter(targetLang, Math.max(2500, finalChunk.length * 90));
            }, remainingDelay);
          }
        }

        // Reseta o estado para a próxima frase
        _liveTTSStreamState[targetLang] = {
          spokenWordCount: 0,
          firstWordTimestamp: 0,
          timer: null,
          latestTranslation: ''
        };

        fetchAudioChunkForExport(targetLang, cleanTranslated, 'female');
        fetchAudioChunkForExport(targetLang, cleanTranslated, 'male');
      }

      function handleStreamingSpeechResult(transcript, utteranceIndex, isFinal) {
        if (isFinal) {
          commitFinalSentence(transcript);
        } else {
          updateLiveSpeechDisplay(transcript);
        }

      function safelyDestroySpeechRecognizer(forceCloseParagraph = false) {
        if (paragraphPauseTimer && forceCloseParagraph) {
          clearTimeout(paragraphPauseTimer);
          paragraphPauseTimer = null;
        }
        if (liveTranslationDebounceTimer) {
          clearTimeout(liveTranslationDebounceTimer);
          liveTranslationDebounceTimer = null;
        }
        // Reseta rastreamento interim (sem debounce ativo para cancelar)
        Object.keys(_interimTracker).forEach(lang => {
          _interimTracker[lang] = { lastShownLen: 0, inFlight: false };
        });
        // Cancela timers de streaming TTS
        Object.keys(_liveTTSStreamState).forEach(lang => {
          if (_liveTTSStreamState[lang].timer) {
            clearTimeout(_liveTTSStreamState[lang].timer);
            _liveTTSStreamState[lang].timer = null;
          }
          _liveTTSStreamState[lang] = {
            spokenWordCount: 0,
            firstWordTimestamp: 0,
            timer: null,
            latestTranslation: ''
          };
        });

        if (forceCloseParagraph) {
          closeActiveParagraphs();
        }

        if (speechRecognizer) {
          try {
            speechRecognizer.onstart = null;
            speechRecognizer.onaudiostart = null;
            speechRecognizer.onresult = null;
            speechRecognizer.onerror = null;
            speechRecognizer.onend = null;
            speechRecognizer.abort();
          } catch(e) {}
          speechRecognizer = null;
        }
        isTranscribingSpeech = false;
        updateSpeechStatusIndicator(false);
      }

      function updateSpeechStatusIndicator(isActive) {
        const dot = document.getElementById('transmitter-speech-dot');
        const text = document.getElementById('transmitter-speech-text');

          } else {

            text.innerText = 'Aguardando Voz';
            ind.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400 border border-slate-300 dark:border-slate-700 flex items-center gap-1';
          }

      function scheduleSpeechRestart(delay = 100) {
        if (speechRecognizerRestartTimeout) clearTimeout(speechRecognizerRestartTimeout);
        speechRecognizerRestartTimeout = setTimeout(() => {
          if (isRealMicActive && !isTimerPaused) {
            startContinuousSpeechTranscription();
          }
        }, delay);
      }

      // Watchdog de integridade: reinicia recognizer apenas se estiver inativo por mais de 25s
      if (speechWatchdogInterval) clearInterval(speechWatchdogInterval);
      speechWatchdogInterval = setInterval(() => {
        if (isRealMicActive && !isTimerPaused) {
          const idleTime = Date.now() - lastSpeechActivityTimestamp;
          if (!isTranscribingSpeech || idleTime > 25000) {
            safelyDestroySpeechRecognizer(true);
            startContinuousSpeechTranscription();
          }
        }
      }, 5000);

      function startContinuousSpeechTranscription() {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          console.warn('SpeechRecognition não suportado no navegador.');
          return;
        }

        if (isStartingSpeechRecognition) return;
        isStartingSpeechRecognition = true;
        setTimeout(() => { isStartingSpeechRecognition = false; }, 2000);

        safelyDestroySpeechRecognizer(false);

        setTimeout(() => {
          try {
            const recognizer = new SpeechRec();
            speechRecognizer = recognizer;
            recognizer.continuous = true;
            recognizer.interimResults = true;
            recognizer.lang = selectedSourceLanguage || 'pt-BR';
            recognizer.maxAlternatives = 1;

            recognizer.onstart = () => {
              isStartingSpeechRecognition = false;
              isTranscribingSpeech = true;
              lastSpeechActivityTimestamp = Date.now();
              finalizedUtteranceIndices.clear();
              updateSpeechStatusIndicator(true);
            };

            recognizer.onaudiostart = () => {
              lastSpeechActivityTimestamp = Date.now();
            };

            recognizer.onresult = (event) => {
              let currentInterim = '';
              for (let i = event.resultIndex; i < event.results.length; i++) {
                const res = event.results[i];
                if (!res || !res[0]) continue;
                const transcript = (res[0].transcript || '').trim();
                if (!transcript) continue;

                if (res.isFinal) {
                  if (!finalizedUtteranceIndices.has(i)) {
                    finalizedUtteranceIndices.add(i);
                    commitFinalSentence(transcript);
                  }
                } else {
                  currentInterim += (currentInterim ? ' ' : '') + transcript;
                }
              }

              // Atualização instantânea em tempo real (Padrão Barra de Pesquisa do Google)
              updateLiveSpeechDisplay(currentInterim);
            };

            recognizer.onerror = (e) => {
              isStartingSpeechRecognition = false;
              if (e.error === 'not-allowed') {
                isRealMicActive = false;
                stopMasterMicCapture();
                alert('Permissão de microfone negada. Clique no cadeado na barra de endereços para permitir.');
              } else {
                scheduleSpeechRestart(250);
              }
            };

            recognizer.onend = () => {
              isStartingSpeechRecognition = false;
              isTranscribingSpeech = false;
              updateSpeechStatusIndicator(false);

              if (isRealMicActive && !isTimerPaused) {
                scheduleSpeechRestart(40);
              }
            };

            recognizer.start();
          } catch(e) {
            isStartingSpeechRecognition = false;
            scheduleSpeechRestart(300);
          }
        }, 50);
      }

      let committedHistory = [];

      let lastCommittedSentenceText = '';

      async function commitSpeechSentence(rawText) {
        if (!rawText || !rawText.trim()) return;
        const clean = rawText.trim().replace(/\s+/g, ' ');
        if (clean.length < 2) return;

        const now = Date.now();
        const cleanLower = clean.toLowerCase();

        // Evita duplicatas disparadas na mesma janela imediata de 1.5s
        if (cleanLower === lastCommittedSentenceText && (now - lastCommittedSentenceTime) < 1500) {
          return;
        }
        lastCommittedSentenceText = cleanLower;
        lastCommittedSentenceTime = now;

        commitFinalSentence(clean);
      }

      async function translateAndDispatchTargetSentence(originalText, targetLang, startSec, endSec) {
        if (!originalText || !originalText.trim()) return;
        const clean = originalText.trim();
        const sourceCode = (selectedSourceLanguage || 'pt-BR').split('-')[0].toLowerCase();
        const targetCode = targetLang.split('-')[0].toLowerCase();

        if (sourceCode === targetCode) {
          addTargetSentenceClean(targetLang, clean, startSec, endSec);
          return;
        }

        const translated = await fetchFastTranslation(clean, selectedSourceLanguage, targetLang);
        if (translated && translated.trim()) {
          addTargetSentenceClean(targetLang, translated.trim(), startSec, endSec);
        }
