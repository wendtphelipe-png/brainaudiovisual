    // Cérebro de ondas de fala no topo do Hub. Para sozinho fora da tela,
    // ao trocar de página e com "reduzir movimento" ligado.
    function mountBrainWaves(canvas) {
      if (window.__brainWavesStop) window.__brainWavesStop();
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const path = new Path2D(BRAIN_SIDE_PATH);
      let raf = 0, ctx = null, running = false;

      function fit() {
        const r = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.round(r.width * dpr));
        canvas.height = Math.max(1, Math.round(r.height * dpr));
        ctx = canvas.getContext('2d');
        const sc = Math.min(canvas.width / 400, canvas.height / 320);
        ctx.setTransform(sc, 0, 0, sc, (canvas.width - 400 * sc) / 2, (canvas.height - 320 * sc) / 2);
      }
      function draw(t) {
        const time = t / 1000;
        ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.restore();
        ctx.save(); ctx.clip(path);
        // Duas rajadas de "fala" atravessam o cérebro em ritmos diferentes
        const c1 = 60 + ((time * 70) % 340), c2 = 60 + ((time * 46 + 170) % 340);
        for (let k = 0; k < 30; k++) {
          const y = 44 + k * 8.4, mid = k === 15;
          ctx.beginPath();
          for (let x = 60; x <= 364; x += 3) {
            const env = Math.exp(-((x - c1) ** 2) / 1800) + 0.7 * Math.exp(-((x - c2) ** 2) / 2600);
            const amp = 1.2 + env * (7 - Math.abs(k - 15) * 0.25);
            const yy = y + Math.sin(x * 0.11 + time * 5 + k * 0.6) * amp * (0.6 + 0.4 * Math.sin(time * 2.3 + k));
            if (x === 60) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
          }
          ctx.lineWidth = mid ? 2 : 1.2;
          ctx.strokeStyle = mid ? '#FFB224' : 'rgba(234, 240, 247, ' + (0.28 + 0.5 * Math.exp(-((k - 15) ** 2) / 90)).toFixed(3) + ')';
          ctx.stroke();
        }
        ctx.restore();
        ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(234, 240, 247, 0.35)'; ctx.stroke(path);
      }

        if (!canvas.isConnected) { stop(); return; }
        draw(t); raf = requestAnimationFrame(loop);
      }
      function start() {
        fit();
        if (reduce) { draw(1200); return; }
        if (running) return;
        running = true; raf = requestAnimationFrame(loop);
      }
      function stop() { running = false; cancelAnimationFrame(raf); }

    function renderOAuthCallbackPopup() {
      document.body.className = "bg-slate-900 text-white font-sans antialiased m-0 flex items-center justify-center min-h-screen p-6 text-center";
      
      const searchParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash);
      
      const error = searchParams.get('error') || hashParams.get('error');
      const code = searchParams.get('code');
      const accessToken = hashParams.get('access_token');
      const slotId = searchParams.get('state') || hashParams.get('state') || 'acc-1';

      root.innerHTML = `
        <div class="max-w-md w-full bg-slate-950 border border-slate-800 rounded-3xl p-8 shadow-2xl">
          <div id="cb-box">
            <div class="w-12 h-12 rounded-full border-4 border-blue-500 border-t-transparent animate-spin mx-auto mb-4"></div>
            <h2 class="text-base font-bold text-white mb-2">Processando Conexão com o Google...</h2>
            <p class="text-xs text-slate-400">Verificando a autenticação da sua conta Google Workspace Pro.</p>
          </div>
        </div>
      `;

      if (error) {
        document.getElementById('cb-box').innerHTML = `
          <div class="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-xs font-black mx-auto mb-4">ERRO</div>
          <h2 class="text-base font-bold text-rose-400 mb-2">Autorização Não Concluída</h2>
          <p class="text-xs text-slate-400 mb-5">${error === 'access_denied' ? 'O acesso foi recusado na janela do Google.' : error}</p>
          <button onclick="window.close()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-5 py-2.5 rounded-xl font-semibold">Fechar Janela</button>
        `;
        if (window.opener) {
          try {
            window.opener.postMessage({ type: 'GOOGLE_AUTH_ERROR', error, slotId }, '*');
          } catch (e) {}
        }
        return;
      }

      if (accessToken) {
        // Valida imediatamente com a API oficial do Google
        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: { 'Authorization': 'Bearer ' + accessToken }
        })
        .then(r => r.json())
        .then(userInfo => {
          document.getElementById('cb-box').innerHTML = `
            <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs font-black mx-auto mb-4">CONECTADO</div>
            <h2 class="text-base font-bold text-emerald-400 mb-1">Conta Google Pro Conectada!</h2>
            <p class="text-xs text-slate-300 font-semibold mb-1">${userInfo.name || 'Conta Google'}</p>
            <p class="text-xs text-blue-400 font-mono mb-4">${userInfo.email}</p>
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-[11px] font-medium border border-emerald-500/20 mb-3">
              <span>● Token Pro Verificado com Sucesso</span>
            </div>
            <p class="text-[11px] text-slate-500">Retornando ao painel em instantes...</p>
          `;

          if (window.opener) {
            try {
              window.opener.postMessage({
                type: 'GOOGLE_AUTH_SUCCESS',
                slotId: slotId,
                email: userInfo.email,
                name: userInfo.name,
                picture: userInfo.picture,
                tokens: { access_token: accessToken }
              }, '*');
            } catch (e) {}
          }
          setTimeout(() => { window.close(); }, 1400);
        })
        .catch(err => {
          document.getElementById('cb-box').innerHTML = `
            <div class="text-rose-400 text-xs">Erro na validação do token: ${err.message}</div>
          `;
        });
      } else if (code) {
        // Envia o código para o opener
        if (window.opener) {
          try {
            window.opener.postMessage({
              type: 'GOOGLE_AUTH_CODE',
              slotId: slotId,
              code: code
            }, '*');
          } catch (e) {}
        }
        document.getElementById('cb-box').innerHTML = `
          <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs font-black mx-auto mb-4">CONECTADO</div>
          <h2 class="text-base font-bold text-emerald-400 mb-2">Código de Autorização Recebido!</h2>
          <p class="text-xs text-slate-400 mb-4">Concluindo validação no painel...</p>

    // Animações da página inicial: entrada ao rolar, cartões que seguem o
    // mouse, cérebro com leve paralaxe e menu de idiomas.
    function mountHomeInteractions() {
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const io = new IntersectionObserver(entries => entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      }), { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
      document.querySelectorAll('.home .reveal, .home .reveal-img, .home .reveal-line').forEach(el => reduce ? el.classList.add('in') : io.observe(el));

      if (!reduce && window.matchMedia('(pointer: fine)').matches) {
        document.querySelectorAll('.home .tilt').forEach(el => {
          el.addEventListener('mousemove', ev => {
            const r = el.getBoundingClientRect();
            const px = (ev.clientX - r.left) / r.width, py = (ev.clientY - r.top) / r.height;
            el.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
            el.style.setProperty('--my', (py * 100).toFixed(1) + '%');
            el.style.transform = `perspective(900px) rotateX(${((0.5 - py) * 7).toFixed(2)}deg) rotateY(${((px - 0.5) * 9).toFixed(2)}deg)`;
          });
          el.addEventListener('mouseleave', () => { el.style.transform = ''; });
        });
        const hero = document.getElementById('heroBrain');
        if (hero) window.addEventListener('mousemove', ev => {
          const x = ev.clientX / window.innerWidth - 0.5, y = ev.clientY / window.innerHeight - 0.5;
          hero.style.transform = `translate(${(x * 18).toFixed(1)}px, ${(y * 14).toFixed(1)}px)`;
        }, { passive: true });
      }

      const menu = document.getElementById('langMenu'), btn = document.getElementById('langBtn');
      if (menu && btn) {
        btn.onclick = e => { e.stopPropagation(); const open = menu.classList.toggle('open'); btn.setAttribute('aria-expanded', open); };
        document.addEventListener('click', () => { menu.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); });
      }
    }

    async function sha256Hex(text) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }

      if (!ok) { renderAdminLoginScreen('Usuário ou senha incorretos.'); return; }

    // FORMATADOR UNIVERSAL DE DURAÇÃO (HH:MM:SS ou MM:SS)
    function formatDuration(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      const pad = (n) => String(Math.floor(n)).padStart(2, '0');
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const remSec = Math.floor(s % 60);
      return h > 0 ? `${pad(h)}h ${pad(m)}m ${pad(remSec)}s` : `${pad(m)}m ${pad(remSec)}s`;
    }

    // NORMALIZAÇÃO FONÉTICA/TEXTUAL UNIVERSAL
    function cleanNorm(s) {
      return (s || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function cleanNormWord(w) {
      return (w || '').toLowerCase().replace(/[^a-z0-9\u00C0-\u024F]/gi, '').trim();
    }

    // HIGIENIZADOR DE SOBREPOSIÇÃO DE BORDAS ENTRE FRASES
    // Elimina a repetição da última palavra da frase anterior no início da frase seguinte
    function stripUtteranceBoundaryOverlap(newText, prevText) {
      if (!newText || !prevText) return newText;
      const prevWords = prevText.trim().split(/\s+/);
      const newWords = newText.trim().split(/\s+/);
      if (prevWords.length === 0 || newWords.length === 0) return newText;

      const prevNorm = prevWords.map(cleanNormWord);
      const newNorm = newWords.map(cleanNormWord);

      const maxOverlap = Math.min(5, prevNorm.length, newNorm.length);
      for (let len = maxOverlap; len >= 1; len--) {
        const prevSlice = prevNorm.slice(prevNorm.length - len);
        const newSlice = newNorm.slice(0, len);
        let match = true;
        for (let i = 0; i < len; i++) {
          if (prevSlice[i] !== newSlice[i] || !prevSlice[i]) {
            match = false;
            break;
          }
        }
        if (match) {
          const remainingWords = newWords.slice(len);
          if (remainingWords.length === 0) return '';
          return remainingWords.join(' ');
        }
      }
      return newText;
    }

    // RESOLVER DE GEOLOCALIZAÇÃO APROXIMADA (PARA MARCADOR GEOGRÁFICO DE SALAS)
    let _cachedClientGeo = null;
    async function getApproximateGeoLocation() {
      if (_cachedClientGeo) return _cachedClientGeo;
      try {
        const saved = localStorage.getItem('brain_client_geo');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.city && (Date.now() - (parsed.timestamp || 0)) < 86400000) {
            _cachedClientGeo = parsed;
            return parsed;
          }
        }
      } catch(e) {}

      // Fallback inicial ultra-rápido derivado do fuso horário do sistema
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
      let city = 'Local Remoto';
      let region = '';
      let country = 'Brasil';

      if (tz.includes('Sao_Paulo')) { city = 'São Paulo'; region = 'SP'; country = 'Brasil'; }
      else if (tz.includes('Rio')) { city = 'Rio de Janeiro'; region = 'RJ'; country = 'Brasil'; }
      else if (tz.includes('Fortaleza')) { city = 'Fortaleza'; region = 'CE'; country = 'Brasil'; }
      else if (tz.includes('Recife')) { city = 'Recife'; region = 'PE'; country = 'Brasil'; }
      else if (tz.includes('Belem')) { city = 'Belém'; region = 'PA'; country = 'Brasil'; }
      else if (tz.includes('Manaus')) { city = 'Manaus'; region = 'AM'; country = 'Brasil'; }
      else if (tz.includes('Cuiaba')) { city = 'Cuiabá'; region = 'MT'; country = 'Brasil'; }
      else if (tz.includes('Porto_Alegre')) { city = 'Porto Alegre'; region = 'RS'; country = 'Brasil'; }
      else if (tz.includes('Curitiba')) { city = 'Curitiba'; region = 'PR'; country = 'Brasil'; }
      else if (tz.includes('Lisbon')) { city = 'Lisboa'; region = 'PT'; country = 'Portugal'; }
      else if (tz.includes('Madrid')) { city = 'Madri'; region = 'ES'; country = 'Espanha'; }
      else if (tz.includes('New_York')) { city = 'Nova York'; region = 'NY'; country = 'EUA'; }
      else if (tz.includes('London')) { city = 'Londres'; region = 'UK'; country = 'Reino Unido'; }

      let geo = { city, region, country, timezone: tz, timestamp: Date.now() };

      // Consulta não-bloqueante a serviços GeoIP rápidos sem chave de API
      try {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 2000);
        const res = await fetch('https://ipapi.co/json/', { signal: ctrl.signal });
        clearTimeout(tid);
        if (res.ok) {
          const data = await res.json();
          if (data && (data.city || data.region)) {
            geo = {
              city: data.city || city,
              region: data.region_code || data.region || region,
              country: data.country_name || country,
              lat: data.latitude,
              lng: data.longitude,
              timezone: data.timezone || tz,
              timestamp: Date.now()
            };
          }
        }
      } catch(e) {
        try {
          const ctrl2 = new AbortController();
          const tid2 = setTimeout(() => ctrl2.abort(), 1500);
          const res2 = await fetch('https://ipwho.is/', { signal: ctrl2.signal });
          clearTimeout(tid2);
          if (res2.ok) {
            const data2 = await res2.json();
            if (data2 && data2.success) {
              geo = {
                city: data2.city || city,
                region: data2.region_code || region,
                country: data2.country || country,
                lat: data2.latitude,
                lng: data2.longitude,
                timezone: data2.timezone?.id || tz,
                timestamp: Date.now()
              };
            }
          }
        } catch(err2) {}
      }

      _cachedClientGeo = geo;
      try { localStorage.setItem('brain_client_geo', JSON.stringify(geo)); } catch(e) {}
      return geo;
    }

    function isMeetingActiveNow(m) {
      if (!m || !m.id) return false;
      if (m.status === 'archived' || m.status === 'completed' || m.status === 'closed') {
        return false;
      }

      // 1. Verifica no mapa de salas ativas globais em tempo real (Nuvem / Multi-Cidades)
      if (window._remoteActiveRooms && window._remoteActiveRooms[m.id]) {
        const remote = window._remoteActiveRooms[m.id];
        const lastSeenMs = (remote.lastSeen && remote.lastSeen < 1e11) ? (remote.lastSeen * 1000) : (remote.lastSeen || 0);
        if (lastSeenMs && (Date.now() - lastSeenMs) < 60000) {
          return true;
        }
      }

      // 2. Verifica heartbeat ativo local (cockpit aberto nesta máquina)
      try {
        const hb = localStorage.getItem('brain_room_heartbeat_' + m.id);
        if (hb) {
          const lastHb = parseInt(hb, 10);
          if (lastHb > 0 && (Date.now() - lastHb) < 20000) {
            return true;
          }
        }
      } catch(e) {}

      // 3. Se a sala acabou de ser criada nesta sessão (há menos de 60 segundos), mantém ativa temporariamente para abertura do cockpit
      try {
        if (m.createdAt) {
          const created = new Date(m.createdAt).getTime();
          if (!isNaN(created) && (Date.now() - created) < 60000) {
            return true;
          }
        }
      } catch(e) {}

      return false;
    }

      if (p.startsWith('/meeting')) p = '/';
      if (!p.endsWith('/') && !p.endsWith('.html') && !p.endsWith('.php')) p += '/';
      return window.location.origin + p;

    window.handleCreateMeetingSubmit = function(e) {
      if (e) {
        if (e.preventDefault) e.preventDefault();
        if (e.stopPropagation) e.stopPropagation();
      }
      const titleInput = document.getElementById('new-m-title');
      const idInput = document.getElementById('new-m-id');
      const sourceLangSelect = document.getElementById('new-m-source-lang');
      const autoDetectCheckbox = document.getElementById('new-m-auto-detect');
      const inputDeviceSelect = document.getElementById('new-m-input-device');

      const title = (titleInput && titleInput.value.trim()) || 'Palco Principal — Sessão Internacional';
      let meetingId = (idInput && idInput.value.trim()) || ('sala-' + Math.random().toString(36).substring(2, 7));
      meetingId = meetingId.toLowerCase().replace(/[^a-z0-9_-]/g, '-').replace(/^-+|-+$/g, '');
      if (!meetingId) meetingId = 'sala-' + Math.random().toString(36).substring(2, 7);

      const sourceLanguage = sourceLangSelect ? sourceLangSelect.value : 'pt-BR';
      const autoDetectLanguage = autoDetectCheckbox ? autoDetectCheckbox.checked : true;
      const inputDevice = inputDeviceSelect ? inputDeviceSelect.value : 'default';
      const targetLanguages = (window._newMeetingFormState && window._newMeetingFormState.selectedTargetLangs && window._newMeetingFormState.selectedTargetLangs.length > 0)
        ? window._newMeetingFormState.selectedTargetLangs
        : ['en-US', 'es-ES'];

      const newMeeting = {
        id: meetingId,
        title: title,
        createdAt: new Date().toISOString(),
        status: 'active',
        sourceLanguage: sourceLanguage,
        autoDetectLanguage: autoDetectLanguage,
        inputDevice: inputDevice,
        targetLanguages: targetLanguages
      };

      let meetingsList = [];
      try {
        meetingsList = JSON.parse(localStorage.getItem('brain_saved_meetings') || '[]');
        if (!Array.isArray(meetingsList)) meetingsList = [];
      } catch(err) {
        meetingsList = [];
      }

      const existingIdx = meetingsList.findIndex(m => m && m.id === meetingId);
      if (existingIdx !== -1) {
        meetingsList[existingIdx] = newMeeting;
      } else {
        meetingsList.unshift(newMeeting);
      }

      try {
        localStorage.setItem('brain_saved_meetings', JSON.stringify(meetingsList));
        localStorage.setItem('brain_room_heartbeat_' + meetingId, Date.now().toString());
      } catch(err) {}

      try {
        if (typeof saveStoredAudioLanguageSettings === 'function') {
          saveStoredAudioLanguageSettings({
            sourceLanguage: sourceLanguage,
            targetLanguages: targetLanguages,
            autoDetectLanguage: autoDetectLanguage,
            transmitterInputDevice: inputDevice
          });
        }
      } catch(err) {}

      // Redireciona imediatamente para o Cockpit da nova reunião
      const cockpitUrl = getMeetingCockpitUrl(meetingId);
      window.location.href = cockpitUrl;
      return false;
    };

      try {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), 1200);
        const res = await fetch('http://127.0.0.1:3050/api/status', { signal: ctrl.signal });
        clearTimeout(tid);
        if (res.ok) {
          const d = await res.json();
          return d && (d.status === 'online' || d.success === true);
        }
      } catch (_) {}
      try {
        const ctrl2 = new AbortController();
        const tid2 = setTimeout(() => ctrl2.abort(), 1000);
        const res2 = await fetch('http://127.0.0.1:8765/api/status', { signal: ctrl2.signal });

        if (res2.ok) {
          const d2 = await res2.json();
          return d2 && (d2.status === 'online' || d2.success === true);
        }
      } catch (_) {}
      return false;
    };

    window.avStartProcessing = async function() {
      const apiBase = window.getAvApiBase();
      const startBtn = document.getElementById('avStartBtn');

      if (window.location.protocol === 'https:' && !apiBase) {
        window.showEngineSetupModal();
        return;
      }

      const audioModeEl = document.querySelector('input[name="avAudioMode"]:checked');
      const audioMode = audioModeEl ? audioModeEl.value : 'dubbing';
      const voiceProfileEl = document.getElementById('avVoiceProfile');
      const voiceProfile = voiceProfileEl ? voiceProfileEl.value : 'female_studio';
      const sourceLanguageEl = document.getElementById('avSourceLanguage');
      const sourceLanguage = sourceLanguageEl ? sourceLanguageEl.value : 'pt-BR';

      const targetLanguages = [];
      const langPt = document.getElementById('avLangPt');
      const langEn = document.getElementById('avLangEn');
      const langEs = document.getElementById('avLangEs');
      if (langPt && langPt.checked) targetLanguages.push('pt');
      if (langEn && langEn.checked) targetLanguages.push('en');
      if (langEs && langEs.checked) targetLanguages.push('es');
      if (targetLanguages.length === 0) targetLanguages.push('en', 'es');

      let payload = {
        sourceType: avCurrentTab,
        sourceLanguage,
        audioMode,
        voiceProfile,
        targetLanguages
      };

      if (avCurrentTab === 'url') {
        const urlInput = document.getElementById('avVideoUrl');
        const url = urlInput ? urlInput.value.trim() : '';
        if (!url) {
          alert('Por favor, informe a URL do YouTube ou Vimeo.');
          if (urlInput) urlInput.focus();
          return;
        }
        payload.url = url;
        const cookieInput = document.getElementById('avCookieData');
        payload.cookieData = cookieInput ? cookieInput.value.trim() : '';
      } else {
        if (!avSelectedFile) {
          alert('Por favor, selecione um arquivo de vídeo ou áudio do computador.');
          return;
        }
        if (startBtn) startBtn.disabled = true;
        window.avAppendLog(`Enviando arquivo local: ${avSelectedFile.name}...`, '#818cf8');

        try {
          const upRes = await fetch(apiBase + '/api/upload', {
            method: 'POST',
            headers: {
              'Content-Type': avSelectedFile.type || 'application/octet-stream',
              'X-File-Name': encodeURIComponent(avSelectedFile.name)
            },
            body: avSelectedFile
          });
          const rawUp = await upRes.text();
          let upData;
          try {
            upData = JSON.parse(rawUp);
          } catch (e) {
            throw new Error('O servidor retornou resposta não-JSON no upload. Certifique-se de usar o console local http://127.0.0.1:8765/admin?module=audiovisual');
          }
          if (!upData.success) throw new Error(upData.error || 'Erro no upload');
          payload.uploadedFilePath = upData.uploadedFilePath;
          payload.uploadedFileName = avSelectedFile.name;
          window.avAppendLog('Upload concluído com sucesso. Iniciando pipeline...', '#34d399');
        } catch (err) {
          alert('Falha ao enviar arquivo para o servidor de processamento: ' + err.message);
          if (startBtn) startBtn.disabled = false;
          return;
        }
      }

      if (startBtn) startBtn.disabled = true;
      const dlCard = document.getElementById('avDownloadCard');
      const prevCard = document.getElementById('avPreviewCard');
      if (dlCard) dlCard.style.display = 'none';
      if (prevCard) prevCard.style.display = 'none';

      try {
        window.avStartTimer();
        window.avAppendLog('Registrando job audiovisual na fila...', '#818cf8');
        const res = await fetch(apiBase + '/api/process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const rawText = await res.text();
        let data;
        try {
          data = JSON.parse(rawText);
        } catch (e) {
          if (window.location.protocol === 'https:') {
            throw new Error('O motor de renderização roda localmente no seu computador. Para iniciar o processamento, abra o console local da sua máquina: http://127.0.0.1:8765/admin?module=audiovisual');
          }
          throw new Error('O servidor de processamento retornou resposta inesperada. Certifique-se de que o backend local (porta 3050 ou 8765) está ativo.');
        }
        if (!data.success) throw new Error(data.error);

        const jobId = data.jobId;
        window.avAppendLog(`Job iniciado! ID: ${jobId}`, '#34d399');
        window.avConnectSSE(jobId);
      } catch (err) {
        window.avPauseTimer(false);
        alert('Erro ao iniciar job: ' + err.message);
        if (startBtn) startBtn.disabled = false;
      }
    };

    window.avConnectSSE = function(jobId) {
      const apiBase = window.getAvApiBase();
      if (avCurrentEventSource) avCurrentEventSource.close();

      avCurrentEventSource = new EventSource(apiBase + `/api/progress/${jobId}`);
      avCurrentEventSource.addEventListener('progress', e => {
        const data = JSON.parse(e.data);
        window.avUpdateProgressUI(data);
      });
      avCurrentEventSource.onerror = () => {
        console.warn('SSE reconectando...');
      };
    };

    window.avUpdateProgressUI = function(data) {
      const apiBase = window.getAvApiBase();
      const fillEl = document.getElementById('avProgressBarFill');
      const pctEl = document.getElementById('avPercentLabel');
      const statusEl = document.getElementById('avStatusMessage');
      const startBtn = document.getElementById('avStartBtn');

      if (fillEl) fillEl.style.width = data.percent + '%';
      if (pctEl) pctEl.innerText = data.percent + '%';
      if (statusEl && data.statusText) statusEl.innerText = data.statusText;

      // Atualiza os círculos do Stepper
      for (let i = 1; i <= 6; i++) {
        const item = document.getElementById(`avStep${i}`);
        if (!item) continue;
        const circle = item.querySelector('.av-step-circle') || item.querySelector('div');
        if (!circle) continue;

        if (i < data.step) {
          circle.style.backgroundColor = '#0E9F6E';
          circle.style.color = '#ffffff';
          circle.style.borderColor = '#0E9F6E';
          circle.innerText = '✓';
        } else if (i === data.step) {
          circle.style.backgroundColor = '#1F2A40';
          circle.style.color = '#ffffff';
          circle.style.borderColor = '#1F2A40';
          circle.innerText = String(i);
        } else {
          circle.style.backgroundColor = '#EAEEF3';
          circle.style.color = '#8592A8';
          circle.style.borderColor = '#D9DEE6';
          circle.innerText = String(i);
        }
      }

      // Logs
      if (data.logs && data.logs.length > 0) {
        const term = document.getElementById('avTerminalLogs');
        if (term) {
          term.innerHTML = '';
          data.logs.forEach(l => {
            const div = document.createElement('div');
            div.style.color = l.type === 'error' ? '#f87171' : '#BFC7D3';
            div.innerHTML = `<span style="color:#5F6B80; font-family:monospace; margin-right:6px;">[${l.timestamp}]</span> ${l.message}`;
            term.appendChild(div);
          });
          term.scrollTop = term.scrollHeight;
        }
      }

      // Áudios prontos
      if (data.tracks && Object.keys(data.tracks).length > 0) {
        avActiveAudioTracks = data.tracks;
        const prevCard = document.getElementById('avPreviewCard');
        if (prevCard && prevCard.style.display === 'none') {
          prevCard.style.display = 'block';
          window.avSwitchAudioTrack('original');
        }
      }

      // Concluído
      if (data.completed) {
        window.avPauseTimer(true);
        if (startBtn) startBtn.disabled = false;
        const dlCard = document.getElementById('avDownloadCard');
        const dlLink = document.getElementById('avDownloadZipLink');
        if (dlCard) dlCard.style.display = 'block';
        if (dlLink) dlLink.href = apiBase + data.zipUrl;
        if (avCurrentEventSource) avCurrentEventSource.close();
      }

      // Erro
      if (data.error) {
        window.avPauseTimer(false);
        if (startBtn) startBtn.disabled = false;
        if (statusEl) {
          statusEl.innerText = 'Erro: ' + data.error;
          statusEl.style.color = '#dc2626';
        }
        if (avCurrentEventSource) avCurrentEventSource.close();
      }
    };

    window.avSwitchAudioTrack = function(trackKey) {
      const apiBase = window.getAvApiBase();
      const player = document.getElementById('avAudioPlayer');

    // SINCRONIZAÇÃO GLOBAL DE SALAS EM TEMPO REAL (MULTI-CIDADES / NUVEM MQTT & HTTP)
    function startDashboardGlobalRoomsSync() {
      if (window._dashboardSyncInitialized) return;
      window._dashboardSyncInitialized = true;

      // 1. Conexão com broker MQTT global para descoberta instantânea de salas em qualquer cidade
      if (typeof mqtt !== 'undefined') {
        try {
          const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId: 'brain_dash_' + Math.random().toString(16).substring(2, 8),
            clean: true,
            connectTimeout: 5000,
            reconnectPeriod: 3000
          });
          window._mqttDashboardSyncClient = client;

          client.on('connect', () => {
            console.log('[BrainLingo] Monitor conectado ao broker MQTT global de salas.');
            // Subscreve nos tópicos de salas ativas globais (broadcast e salas individuais com retain)
            client.subscribe('brainaudiovisual/global/active_sessions', { qos: 0 });
            client.subscribe('brainaudiovisual/rooms/+/status', { qos: 1 });
            // Solicita anúncio imediato de todas as salas ativas no mundo
            client.publish('brainaudiovisual/global/active_sessions/ping', JSON.stringify({ ping: Date.now() }), { qos: 0 });
          });

          client.on('message', (topic, payload) => {
            if (topic === 'brainaudiovisual/global/active_sessions' || topic.startsWith('brainaudiovisual/rooms/')) {
              try {
                const roomData = JSON.parse(payload.toString());
                if (roomData && roomData.id) {
                  handleRemoteDiscoveredRoom(roomData);
                }
              } catch(e) {}
            }
          });
        } catch(e) {}
      }

      // 2. Polling no backend rooms.php (backup garantido para redes com restrições WebSocket)
      async function pollRoomsBackend() {
        try {
          const apiUrl = (window.location.protocol === 'file:') ? 'rooms.php' : new URL('rooms.php', window.location.href).href;
          const res = await fetch(apiUrl + '?t=' + Date.now());
          if (res.ok) {
            const data = await res.json();
            if (data && Array.isArray(data.rooms)) {
              data.rooms.forEach(r => {
                if (r && r.id) handleRemoteDiscoveredRoom(r);
              });
            }
          }
        } catch(e) {}
      }
      pollRoomsBackend();
      setInterval(pollRoomsBackend, 3500);

      // 3. Ticker contínuo de 1 segundo para o tempo corrido das salas
      setInterval(() => {
        const timerEls = document.querySelectorAll('.room-live-timer');
        timerEls.forEach(el => {
          const rid = el.getAttribute('data-room-id');
          let sec = parseInt(el.getAttribute('data-elapsed') || '0', 10);
          sec++;
          el.setAttribute('data-elapsed', sec.toString());
          el.innerText = formatDuration(sec);
          if (window._remoteActiveRooms && window._remoteActiveRooms[rid]) {
            window._remoteActiveRooms[rid].elapsedSeconds = sec;
          }
        });
      }, 1000);
    }

    function handleRemoteDiscoveredRoom(room) {
      if (!room || !room.id) return;
      window._remoteActiveRooms = window._remoteActiveRooms || {};

      if (room.status === 'closed' || room.status === 'archived' || room.status === 'deleted') {
        delete window._remoteActiveRooms[room.id];
        try { localStorage.removeItem('brain_remote_room_' + room.id); } catch(e) {}
        if (typeof window._renderDashboardUI === 'function') {
          window._renderDashboardUI();
        } else if (typeof renderSimultaneousTranslationDashboard === 'function') {
          renderSimultaneousTranslationDashboard();
        }
        return;
      }

      const isNew = !window._remoteActiveRooms[room.id];
      const remoteLastSeenMs = (room.lastSeen && room.lastSeen < 1e11) ? (room.lastSeen * 1000) : (room.lastSeen || Date.now());
      room.lastSeen = remoteLastSeenMs;
      window._remoteActiveRooms[room.id] = Object.assign({}, window._remoteActiveRooms[room.id], room, { lastSeen: Date.now() });

      try {
        localStorage.setItem('brain_remote_room_' + room.id, JSON.stringify(window._remoteActiveRooms[room.id]));
      } catch(e) {}

      if (isNew) {
        if (typeof window._renderDashboardUI === 'function') {
          window._renderDashboardUI();
        } else if (typeof renderSimultaneousTranslationDashboard === 'function') {
          renderSimultaneousTranslationDashboard();
        }
      } else {
        // Atualiza elementos já renderizados no card
        const geoEl = document.getElementById('room-geo-text-' + room.id);
        if (geoEl && room.location) {
          const locStr = (room.location.city || 'Local Remoto') + 
            (room.location.region ? ', ' + room.location.region : '') + 
            (room.location.country ? ' — ' + room.location.country : '');
          geoEl.innerText = locStr;
        }
        const timerEl = document.getElementById('room-elapsed-' + room.id);
        if (timerEl && typeof room.elapsedSeconds === 'number') {
          timerEl.setAttribute('data-elapsed', room.elapsedSeconds.toString());
          timerEl.innerText = formatDuration(room.elapsedSeconds);
        }
      }
    }

    // ========================================================
    // TELA 2.4: DASHBOARD DO SIMULTANEOUS TRANSLATION (APENAS ATIVAS)
    // ========================================================
    function renderSimultaneousTranslationDashboard() {
      startDashboardGlobalRoomsSync();

      // 0. Carrega todas as salas remotas salvas no localStorage
      window._remoteActiveRooms = window._remoteActiveRooms || {};
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith('brain_remote_room_')) {
            try {
              const r = JSON.parse(localStorage.getItem(k));
              if (r && r.id) {
                const lastSeenMs = (r.lastSeen && r.lastSeen < 1e11) ? (r.lastSeen * 1000) : (r.lastSeen || 0);
                if (lastSeenMs && (Date.now() - lastSeenMs) < 120000) {
                  window._remoteActiveRooms[r.id] = r;
                }
              }
            } catch(e) {}
          }
        }
      } catch(e) {}

      // Reuniões salvas no localStorage com higienização estrita
      let meetings = [];
      try {
        const savedMeetings = localStorage.getItem('brain_saved_meetings');
        if (savedMeetings) {
          const parsed = JSON.parse(savedMeetings);
          if (Array.isArray(parsed)) {
            meetings = parsed.filter(m => m && typeof m === 'object').map(m => {
              const id = m.id || ('sala-' + Math.random().toString(36).substring(2, 7));
              const title = m.title || ('Sessão de Tradução ' + id);
              const sourceLanguage = (typeof m.sourceLanguage === 'string' && m.sourceLanguage) ? m.sourceLanguage : 'pt-BR';
              const targetLanguages = Array.isArray(m.targetLanguages) && m.targetLanguages.length > 0 
                ? m.targetLanguages.filter(t => typeof t === 'string') 
                : ['en-US', 'es-ES'];
              return {
                id,
                title,
                createdAt: m.createdAt || new Date().toISOString(),
                status: m.status || 'active',
                sourceLanguage,
                autoDetectLanguage: !!m.autoDetectLanguage,
                inputDevice: m.inputDevice || 'default',
                targetLanguages: targetLanguages.length > 0 ? targetLanguages : ['en-US', 'es-ES']
              };
            });
          }
        }
      } catch(e) {
        meetings = [];
      }

      // Mescla salas ativas descobertas remotamente em qualquer cidade
      if (window._remoteActiveRooms) {
        Object.values(window._remoteActiveRooms).forEach(remote => {
          if (!remote || !remote.id) return;
          const lastSeenMs = (remote.lastSeen && remote.lastSeen < 1e11) ? (remote.lastSeen * 1000) : (remote.lastSeen || 0);
          if (lastSeenMs && (Date.now() - lastSeenMs) > 120000) return;
          const idx = meetings.findIndex(m => m.id === remote.id);
          if (idx !== -1) {
            meetings[idx] = Object.assign({}, meetings[idx], remote, { isRemote: true });
          } else {
            meetings.unshift({
              id: remote.id,
              title: remote.title || ('Sessão de Tradução ' + remote.id),
              createdAt: remote.createdAt || new Date().toISOString(),
              startTime: remote.startTime || Date.now(),
              elapsedSeconds: remote.elapsedSeconds || 0,
              status: 'active',
              sourceLanguage: remote.sourceLanguage || 'pt-BR',
              autoDetectLanguage: !!remote.autoDetectLanguage,
              inputDevice: 'default',
              targetLanguages: Array.isArray(remote.targetLanguages) && remote.targetLanguages.length > 0 ? remote.targetLanguages : ['en-US', 'es-ES'],
              location: remote.location,
              isLive: remote.isLive !== false,
              isRemote: true
            });
          }
        });
      }

      // Separa reuniões ativas vs históricas
      const activeMeetings = meetings.filter(m => isMeetingActiveNow(m));
      const historyMeetings = meetings.filter(m => !isMeetingActiveNow(m));

      // Idiomas do sistema
      const SUPPORTED_LANGS = [
        { code: 'en-US', name: 'Inglês (Estados Unidos / Global)', tag: 'EN', default: true },
        { code: 'es-ES', name: 'Espanhol (Internacional)', tag: 'ES', default: true },
        { code: 'pt-BR', name: 'Português (Brasil)', tag: 'PT', default: false },
        { code: 'fr-FR', name: 'Francês', tag: 'FR', default: false },
        { code: 'de-DE', name: 'Alemão', tag: 'DE', default: false },
        { code: 'it-IT', name: 'Italiano', tag: 'IT', default: false },
        { code: 'ar-SA', name: 'Árabe Padrão Moderno (Fusha)', tag: 'AR', default: false },
        { code: 'zh-CN', name: 'Mandarim (China)', tag: 'ZH', default: false },
        { code: 'ja-JP', name: 'Japonês', tag: 'JA', default: false }
      ];

      // Estado do formulário de criação
      if (!window._newMeetingFormState) {
        window._newMeetingFormState = {
          title: 'Palco Principal — Sessão Internacional',
          customId: 'sala-' + Math.random().toString(36).substring(2, 7),
          sourceLanguage: 'pt-BR',
          autoDetectLanguage: true,
          inputDevice: 'default',
          selectedTargetLangs: ['en-US', 'es-ES']
        };
      }

      let audioInputDevices = [];
      async function refreshDashboardAudioDevices(forcePrompt = false) {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
          let devs = await navigator.mediaDevices.enumerateDevices();
          let inputs = devs.filter(d => d.kind === 'audioinput');

          // Se os rótulos estão em branco ou foi forçado, faz uma sonda limpa sem alterar o mixer do Windows
          if (forcePrompt || inputs.length === 0 || inputs.some(d => !d.label)) {
            try {
              const probeStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
              });
              probeStream.getTracks().forEach(t => t.stop());
              devs = await navigator.mediaDevices.enumerateDevices();
              inputs = devs.filter(d => d.kind === 'audioinput');
            } catch(e) {}
          }

          audioInputDevices = inputs;
          const selectEl = document.getElementById('new-m-input-device');
          if (selectEl) {
            const currentVal = selectEl.value;
            let optionsHtml = `
              <optgroup label="Captura Digital de Aplicativos e Sistema (VLC / YouTube / Aulas)">
                <option value="display_media_tab" ${currentVal === 'display_media_tab' ? 'selected' : ''}>Guia do Chrome (YouTube, Videoaulas, Podcast)</option>
                <option value="display_media_window" ${currentVal === 'display_media_window' ? 'selected' : ''}>Janela de um aplicativo (VLC ou outro player)</option>
                <option value="display_media_desktop" ${currentVal === 'display_media_desktop' ? 'selected' : ''}>Todo o áudio do computador</option>
              </optgroup>
              <optgroup label="Microfones e Placas Físicas">
                <option value="default" ${currentVal === 'default' ? 'selected' : ''}>Microfone padrão do Windows</option>
            `;
            inputs.forEach((d, i) => {
              if (d.deviceId === 'default') return;
              let label = d.label || ("Placa / Entrada de Áudio " + (i + 1));
              const lower = label.toLowerCase();
              if (lower.includes('mix') || lower.includes('estéreo') || lower.includes('stereo') || lower.includes('cable') || lower.includes('virtual') || lower.includes('loopback')) {
                label = "" + label + " [Áudio do Sistema / VLC / YouTube]";
              }
              const isSel = (currentVal === d.deviceId);

      window.handleCreateMeetingSubmit = function(e) {
        e.preventDefault();
        const titleInput = document.getElementById('new-m-title');
        const idInput = document.getElementById('new-m-id');
        const sourceLangSelect = document.getElementById('new-m-source-lang');
        const autoDetectCheckbox = document.getElementById('new-m-auto-detect');
        const inputDeviceSelect = document.getElementById('new-m-input-device');

        const title = (titleInput && titleInput.value.trim()) || 'Palco Principal — Sessão Internacional';
        let meetingId = (idInput && idInput.value.trim()) || ('sala-' + Math.random().toString(36).substring(2, 7));
        meetingId = meetingId.toLowerCase().replace(/[^a-z0-9_-]/g, '-').replace(/^-+|-+$/g, '');
        if (!meetingId) meetingId = 'sala-' + Math.random().toString(36).substring(2, 7);

        const sourceLanguage = sourceLangSelect ? sourceLangSelect.value : 'pt-BR';
        const autoDetectLanguage = autoDetectCheckbox ? autoDetectCheckbox.checked : true;
        const inputDevice = inputDeviceSelect ? inputDeviceSelect.value : 'default';
        const targetLanguages = (window._newMeetingFormState && window._newMeetingFormState.selectedTargetLangs && window._newMeetingFormState.selectedTargetLangs.length > 0)
          ? window._newMeetingFormState.selectedTargetLangs
          : ['en-US', 'es-ES'];

        const newMeeting = {
          id: meetingId,
          title: title,
          createdAt: new Date().toISOString(),
          status: 'active',
          sourceLanguage: sourceLanguage,
          autoDetectLanguage: autoDetectLanguage,
          inputDevice: inputDevice,
          targetLanguages: targetLanguages
        };

        const existingIdx = meetings.findIndex(m => m.id === meetingId);
        if (existingIdx !== -1) {
          meetings[existingIdx] = newMeeting;
        } else {
          meetings.unshift(newMeeting);
        }

        try {
          localStorage.setItem('brain_saved_meetings', JSON.stringify(meetings));
          localStorage.setItem('brain_room_heartbeat_' + meetingId, Date.now().toString());
        } catch(err) {}

        try {
          saveStoredAudioLanguageSettings({
            sourceLanguage: sourceLanguage,
            targetLanguages: targetLanguages,
            autoDetectLanguage: autoDetectLanguage,
            transmitterInputDevice: inputDevice

        } catch(err) {}

        window.location.href = getMeetingCockpitUrl(meetingId);

    // ========================================================
    // TELA DEDICADA: OVERLAY EXCLUSIVO DE LEGENDAS (OBS / vMIX / BROADCAST)
    // ========================================================
    function renderSubtitleOverlayPage(id) {
      const audioSettings = getStoredAudioLanguageSettings();
      let meeting = null;
      try {
        const saved = JSON.parse(localStorage.getItem('brain_saved_meetings') || '[]');
        meeting = saved.find(m => m.id === id);
      } catch(e) {}

      if (!meeting) {
        meeting = {
          id: id,
          title: 'Sessão de Tradução — ' + id,
          sourceLanguage: audioSettings.sourceLanguage || 'pt-BR',
          targetLanguages: audioSettings.targetLanguages || ['en-US', 'es-ES']
        };
      }

      // Parâmetros de URL
      const urlParams = new URLSearchParams(window.location.search);
      const urlBg = urlParams.get('bg'); // 'chroma' | 'black' | 'transparent'
      let currentBg = urlBg === 'chroma' ? '#00ff00' : (urlBg === 'transparent' ? 'transparent' : '#000000');
      let areControlsHidden = false;

      // Colunas de idiomas suportadas (Padrão: Português, Inglês, Espanhol)
      const ALL_POSSIBLE_COLS = [
        { key: 'trans', name: 'Português (Palestrante)', tag: 'PT', defaultColor: '#ffffff' },
        { key: 'rec', name: 'Inglês (Tradução)', tag: 'EN', defaultColor: '#fde047' },
        { key: 'spanish', name: 'Espanhol', tag: 'ES', defaultColor: '#38bdf8' },
        { key: 'french', name: 'Francês', tag: 'FR', defaultColor: '#c084fc' },
        { key: 'german', name: 'Alemão', tag: 'DE', defaultColor: '#fb923c' },
        { key: 'italian', name: 'Italiano', tag: 'IT', defaultColor: '#4ade80' },
        { key: 'arabic', name: 'Árabe Padrão Moderno (Fusha)', tag: 'AR', defaultColor: '#34B886' }
      ];

      // Colunas ativas carregadas do localStorage (Padrão: trans, rec, spanish)
      let enabledCols = ['trans', 'rec', 'spanish'];
      try {
        const storedCols = localStorage.getItem('brain_overlay_enabled_cols');
        if (storedCols) {
          const parsed = JSON.parse(storedCols);
          if (Array.isArray(parsed) && parsed.length > 0) enabledCols = parsed;
        }
      } catch(e) {}

      // Configurações e estilos independentes para cada coluna
      let overlayActiveCustomCol = enabledCols[0] || 'trans';
      let overlayColConfigs = {};
      ALL_POSSIBLE_COLS.forEach(col => {
        overlayColConfigs[col.key] = {
          label: col.name,
          flag: col.flag,
          textColor: localStorage.getItem('brain_overlay_' + col.key + '_color') || col.defaultColor,
          fontSize: parseInt(localStorage.getItem('brain_overlay_' + col.key + '_size')) || 24
        };
      });

      function saveColStyles(colKey) {
        try {
          localStorage.setItem('brain_overlay_' + colKey + '_color', overlayColConfigs[colKey].textColor);
          localStorage.setItem('brain_overlay_' + colKey + '_size', overlayColConfigs[colKey].fontSize);
        } catch(e) {}
      }

      function updateGridColClasses() {
        const grid = document.getElementById('overlay-grid');
        if (!grid) return;
        const visibleCount = enabledCols.length;
        grid.className = 'grid gap-6 w-full ' + (
          visibleCount >= 4 ? 'grid-cols-4 max-w-[98%]' :
          visibleCount === 3 ? 'grid-cols-3 max-w-[96%]' :
          visibleCount === 2 ? 'grid-cols-2 max-w-5xl' :
          'grid-cols-1 max-w-3xl'
        ) + ' mx-auto';

        ALL_POSSIBLE_COLS.forEach(col => {
          const colEl = document.getElementById('overlay-col-' + col.key);
          if (colEl) {
            colEl.classList.toggle('hidden', !enabledCols.includes(col.key));
          }
        });
      }

      window.toggleOverlayColVisibility = function(colKey) {
        const idx = enabledCols.indexOf(colKey);
        if (idx !== -1) {
          if (enabledCols.length <= 1) {
            alert('A janela do OBS precisa de pelo menos 1 coluna de idioma visível.');
            return;
          }
          enabledCols.splice(idx, 1);
        } else {
          enabledCols.push(colKey);
        }
        try {
          localStorage.setItem('brain_overlay_enabled_cols', JSON.stringify(enabledCols));
        } catch(e) {}

        if (!enabledCols.includes(overlayActiveCustomCol)) {
          overlayActiveCustomCol = enabledCols[0] || 'trans';
        }

        renderOverlayUI();
      };

      window.selectOverlayCustomCol = function(colKey) {
        overlayActiveCustomCol = colKey;
        const cfg = overlayColConfigs[colKey];
        const label = document.getElementById('overlay-col-editing-label');
        if (label) label.innerText = cfg.flag + ' ' + cfg.label.split(' ')[0] + ':';
        const ind = document.getElementById('overlay-font-indicator');
        if (ind) ind.innerText = cfg.fontSize + 'px';
        const picker = document.getElementById('overlay-color-picker');
        if (picker) picker.value = cfg.textColor;

        ALL_POSSIBLE_COLS.forEach(col => {
          const tab = document.getElementById('tab-custom-' + col.key);
          if (tab) {
            tab.className = col.key === colKey
              ? 'px-2 py-0.5 rounded-md bg-indigo-600 text-white font-bold'
              : 'px-2 py-0.5 rounded-md text-slate-300 hover:text-white';
          }
        });
      };

      window.setOverlayActiveColColor = function(color) {
        const colKey = overlayActiveCustomCol;
        overlayColConfigs[colKey].textColor = color;
        saveColStyles(colKey);

        const feed = document.getElementById('overlay-feed-' + colKey);
        if (feed) {
          feed.style.color = color;
          feed.querySelectorAll('p').forEach(p => {
            if (!p.classList.contains('italic')) p.style.color = color;
          });
        }
        const picker = document.getElementById('overlay-color-picker');
        if (picker) picker.value = color;
      };

      window.changeOverlayActiveColFont = function(delta) {
        const colKey = overlayActiveCustomCol;
        overlayColConfigs[colKey].fontSize = Math.max(16, Math.min(56, overlayColConfigs[colKey].fontSize + delta));
        saveColStyles(colKey);

        const ind = document.getElementById('overlay-font-indicator');
        if (ind) ind.innerText = overlayColConfigs[colKey].fontSize + 'px';

        const feed = document.getElementById('overlay-feed-' + colKey);
        if (feed) feed.style.fontSize = overlayColConfigs[colKey].fontSize + 'px';
      };

      window.setOverlayBg = function(bg) {
        currentBg = bg;
        const container = document.getElementById('overlay-container');
        if (container) {
          container.style.backgroundColor = bg;
          document.body.style.backgroundColor = bg;
        }
      };

      window.toggleOverlayControls = function() {
        areControlsHidden = !areControlsHidden;
        const bar = document.getElementById('overlay-topbar');
        const hint = document.getElementById('overlay-hidden-hint');
        if (bar) bar.style.display = areControlsHidden ? 'none' : 'flex';
        if (hint) hint.classList.toggle('hidden', !areControlsHidden);
      };

      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          toggleOverlayControls();
        }
      });

      function renderOverlayUI() {
        const activeCfg = overlayColConfigs[overlayActiveCustomCol];

        root.innerHTML = `
          <div id="overlay-container" class="min-h-screen flex flex-col justify-between transition-colors duration-300 relative select-none" style="background-color: ${currentBg};">
            <!-- BARRA DE CONTROLE SUPERIOR (OCULTÁVEL COM 'H') -->
            <div id="overlay-topbar" class="p-3 bg-slate-900/95 backdrop-blur-md border-b border-slate-700 flex flex-wrap items-center justify-between gap-3 text-xs z-50 text-slate-200">
              
              <div class="flex items-center gap-2.5">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <strong class="font-bold text-white tracking-wide">BROADCAST MULTI-IDIOMAS (OBS & TELÃO)</strong>
                <span class="text-slate-400 font-mono text-[11px]">(${meeting.title})</span>
                
                <span id="overlay-cloud-indicator" class="hidden sm:flex items-center gap-1.5 text-[11px] font-semibold text-emerald-400 bg-emerald-950/40 border border-emerald-800/60 px-2 py-0.5 rounded-full">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Nuvem Ao Vivo
                </span>
              </div>

              <!-- SELETOR DE COLUNAS VISÍVEIS (CHECKBOXES DE IDIOMAS) -->
              <div class="flex items-center gap-1.5 bg-slate-800/90 p-1 rounded-xl border border-slate-700 text-xs">
                <span class="text-slate-400 text-[11px] font-semibold px-1">Exibir Colunas:</span>
                <div class="flex flex-wrap items-center gap-1">
                  ${ALL_POSSIBLE_COLS.slice(0, 4).map(col => {
                    const isChecked = enabledCols.includes(col.key);
                    return `
                      <button 
                        type="button" 
                        onclick="toggleOverlayColVisibility('${col.key}')" 
                        class="px-2 py-1 rounded-lg text-[11px] font-bold transition-all cursor-pointer flex items-center gap-1 ${
                          isChecked 
                            ? 'bg-indigo-600 text-white shadow-2xs' 
                            : 'bg-slate-700/60 text-slate-400 hover:text-white'
                        }"
                      >
                        <span class="text-[10px] font-mono px-1 rounded bg-slate-800 text-slate-200">${col.tag || col.key.toUpperCase()}</span>
                        <span>${col.name.split(' ')[0]}</span>
                        <span class="text-[9px] opacity-80 font-bold">${isChecked ? "Ativo" : ""}</span>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>

              <!-- CONTROLES DA COLUNA SELECIONADA (COR E TAMANHO) -->
              <div class="flex items-center gap-2 border-l border-slate-700 pl-2">
                <div class="flex items-center bg-slate-800 p-0.5 rounded-lg border border-slate-700 text-[10px] font-bold">
                  ${enabledCols.map(colKey => {
                    const col = ALL_POSSIBLE_COLS.find(c => c.key === colKey) || { name: colKey, tag: colKey.substring(0,2).toUpperCase() };
                    return `
                      <button

                </div>

                <div class="flex items-center gap-1">
                  <button onclick="setOverlayActiveColColor('#ffffff')" title="Branco" class="w-4 h-4 rounded-full bg-white border border-slate-400 cursor-pointer shadow-2xs hover:scale-110"></button>
                  <button onclick="setOverlayActiveColColor('#fde047')" title="Amarelo Cinema" class="w-4 h-4 rounded-full bg-yellow-300 border border-slate-400 cursor-pointer shadow-2xs hover:scale-110"></button>

                  <input type="color" id="overlay-color-picker" value="${activeCfg.textColor}" onchange="setOverlayActiveColColor(this.value)" class="w-4 h-4 rounded cursor-pointer bg-transparent border-0 p-0" title="Cor Personalizada">

                <!-- Tamanho da Fonte -->

                  <span id="overlay-font-indicator" class="font-mono text-[10px] font-bold text-white w-6 text-center">${activeCfg.fontSize}px</span>

      renderOverlayUI();

      // RENDERIZAÇÃO UNIFICADA DE MENSAGENS COM DEDUPLICAÇÃO E FLUXO CONTÍNUO EM TEMPO REAL (OBS OVERLAY)
      const overlaySeenPacketIds = new Set();
      const seenSubtitles = new Set();
      const overlayActiveParagraphObjs = {};
      const overlayLastSubtitleTimes = {};

      function handleIncomingSubtitle(data) {
        if (!data) return;

        // 1. DEDUPLICAÇÃO DE PACOTES (impede duplicação entre BroadcastChannel e MQTT)
        const pktId = data.pktId || (data.type + '_' + data.channel + '_' + (data.timestamp || '') + '_' + (data.text || ''));
        if (overlaySeenPacketIds.has(pktId)) return;
        overlaySeenPacketIds.add(pktId);
        if (overlaySeenPacketIds.size > 300) {
          overlaySeenPacketIds.delete(overlaySeenPacketIds.keys().next().value);
        }

        const isNewSubtitle = data.type === 'NEW_SUBTITLE';
        const isLiveInterim = data.type === 'LIVE_INTERIM';
        const isCloseParagraph = data.type === 'CLOSE_PARAGRAPH';

        if (!isNewSubtitle && !isLiveInterim && !isCloseParagraph) return;

        let feedId = 'overlay-feed-rec';
        let colKey = 'rec';
        const chan = (data.channel || '').toLowerCase();
        if (chan === 'transmitter') {
          feedId = 'overlay-feed-trans';
          colKey = 'trans';
        } else if (chan === 'spanish' || chan === 'es' || chan === 'es-es') {
          feedId = 'overlay-feed-spanish';
          colKey = 'spanish';
        } else if (chan === 'french' || chan === 'fr' || chan === 'fr-fr') {
          feedId = 'overlay-feed-french';
          colKey = 'french';
        } else if (chan === 'german' || chan === 'de' || chan === 'de-de') {
          feedId = 'overlay-feed-german';
          colKey = 'german';
        } else if (chan === 'italian' || chan === 'it' || chan === 'it-it') {
          feedId = 'overlay-feed-italian';
          colKey = 'italian';
        } else if (chan === 'arabic' || chan === 'ar' || chan === 'ar-sa') {
          feedId = 'overlay-feed-arabic';
          colKey = 'arabic';
        }

        if (isCloseParagraph) {
          if (data.channel === 'all') {
            Object.keys(overlayActiveParagraphObjs).forEach(k => {
              if (overlayActiveParagraphObjs[k]?.cursorEl) overlayActiveParagraphObjs[k].cursorEl.remove();
              overlayActiveParagraphObjs[k] = null;
            });
          } else if (overlayActiveParagraphObjs[colKey]) {
            if (overlayActiveParagraphObjs[colKey].cursorEl) overlayActiveParagraphObjs[colKey].cursorEl.remove();
            overlayActiveParagraphObjs[colKey] = null;
          }
          return;
        }

        const feed = document.getElementById(feedId);
        if (!feed) return;

        const firstP = feed.querySelector('.italic');
        if (firstP) firstP.remove();

        const now = Date.now();
        const lastTime = overlayLastSubtitleTimes[colKey] || 0;
        const activeObj = overlayActiveParagraphObjs[colKey];

        if (isLiveInterim) {
          const interimText = (data.text || '').trim();
          if (!interimText) {
            if (activeObj && activeObj.liveSpan) activeObj.liveSpan.textContent = '';
            return;
          }

          const needNewPara = !activeObj || !activeObj.p || !activeObj.p.isConnected || (activeObj.isFinalized && (now - lastTime > 2000));

          if (needNewPara) {
            if (feed.lastElementChild) {
              feed.lastElementChild.className = 'leading-relaxed transition-all duration-200 mb-3 whitespace-normal break-words';
              feed.lastElementChild.style.opacity = '0.70';
              feed.lastElementChild.style.fontWeight = '400';
              feed.lastElementChild.style.color = overlayColConfigs[colKey].textColor;
            }

            const p = document.createElement('p');
            p.className = 'leading-relaxed transition-all duration-300 mb-3 font-bold drop-shadow-md whitespace-normal break-words';
            p.style.opacity = '1.0';
            p.style.color = overlayColConfigs[colKey].textColor;

            const tConfirmed = document.createElement('span');
            const tLive = document.createElement('span');
            tLive.style.opacity = '0.92';
            tLive.textContent = interimText;

            const tCursor = document.createElement('span');
            tCursor.className = 'streaming-cursor inline-block w-1.5 h-3.5 ml-1 bg-amber-400 animate-pulse align-middle rounded-xs';

            p.appendChild(tConfirmed);
            p.appendChild(tLive);
            p.appendChild(tCursor);
            feed.appendChild(p);

            overlayActiveParagraphObjs[colKey] = { p, confirmedSpan: tConfirmed, liveSpan: tLive, cursorEl: tCursor, isFinalized: false };
          } else {
            const hasConfirmed = activeObj.confirmedSpan.textContent.trim().length > 0;
            activeObj.liveSpan.textContent = (hasConfirmed ? ' ' : '') + interimText;
            if (activeObj.cursorEl) activeObj.cursorEl.style.display = 'inline-block';
          }
          overlayLastSubtitleTimes[colKey] = now;
          feed.scrollTop = feed.scrollHeight;
          const stage = document.getElementById('overlay-stage');
          if (stage) stage.scrollTop = stage.scrollHeight;
          return;
        }

        // NEW_SUBTITLE (frase finalizada)
        const text = (data.text || '').trim();
        if (!text) return;

        const dedupeKey = data.channel + '_' + text;
        if (seenSubtitles.has(dedupeKey)) return;
        seenSubtitles.add(dedupeKey);
        if (seenSubtitles.size > 150) {
          const first = seenSubtitles.values().next().value;
          seenSubtitles.delete(first);
        }

        // Se há um parágrafo que estava exibindo o interim desta frase, consolida nele sem duplicar
        if (activeObj && !activeObj.isFinalized && activeObj.p.isConnected) {
          const prev = activeObj.confirmedSpan.textContent.trim();
          if (!prev || !prev.includes(text)) {
            activeObj.confirmedSpan.textContent = prev ? (prev + ' ' + text) : text;
          }
          activeObj.liveSpan.textContent = '';
          if (activeObj.cursorEl) activeObj.cursorEl.style.display = 'none';
          activeObj.isFinalized = true;
        } else {
          if (feed.lastElementChild) {
            feed.lastElementChild.className = 'leading-relaxed transition-all duration-200 mb-3 whitespace-normal break-words';
            feed.lastElementChild.style.opacity = '0.70';
            feed.lastElementChild.style.fontWeight = '400';
            feed.lastElementChild.style.color = overlayColConfigs[colKey].textColor;
          }

          const p = document.createElement('p');
          p.className = 'leading-relaxed transition-all duration-300 mb-3 font-bold drop-shadow-md whitespace-normal break-words';
          p.style.opacity = '1.0';
          p.style.color = overlayColConfigs[colKey].textColor;

          const tConfirmed = document.createElement('span');
          tConfirmed.textContent = text;
          const tLive = document.createElement('span');
          const tCursor = document.createElement('span');
          tCursor.className = 'streaming-cursor inline-block w-1.5 h-3.5 ml-1 bg-amber-400 animate-pulse align-middle rounded-xs';
          tCursor.style.display = 'none';

          p.appendChild(tConfirmed);
          p.appendChild(tLive);
          p.appendChild(tCursor);
          feed.appendChild(p);

          overlayActiveParagraphObjs[colKey] = { p, confirmedSpan: tConfirmed, liveSpan: tLive, cursorEl: tCursor, isFinalized: true };
        }
        overlayLastSubtitleTimes[colKey] = now;

        while (feed.children.length > 25) {
          feed.removeChild(feed.firstChild);
        }

        feed.scrollTop = feed.scrollHeight;
        const stage = document.getElementById('overlay-stage');
        if (stage) stage.scrollTop = stage.scrollHeight;
      }

      // 1. SINCRONIZAÇÃO LOCAL (BroadcastChannel)
      try {
        const channel = new BroadcastChannel('brain_subtitles_channel');
        channel.onmessage = (event) => {
          handleIncomingSubtitle(event.data);
        };
      } catch(e) {}

      // 2. SINCRONIZAÇÃO GLOBAL EM NUVEM (MQTT) E PRESENÇA DE AUDIÊNCIA
      const safeMeetingId = encodeURIComponent(id).replace(/[^a-zA-Z0-9_-]/g, '_');
      const mqttTopic = 'brainaudiovisual/meeting/' + safeMeetingId + '/subtitles';
      const mqttPresenceTopic = 'brainaudiovisual/meeting/' + safeMeetingId + '/presence';

      const audienceSessionId = 'aud_' + Math.random().toString(36).substring(2, 9);
      let presenceBc = null;
      try { presenceBc = new BroadcastChannel('brain_presence_' + safeMeetingId); } catch(e) {}

      function sendAudiencePresenceHeartbeat() {
        const payload = {
          type: 'HEARTBEAT',
          meetingId: id,
          lang: currentAudienceLang,
          clientId: audienceSessionId,
          timestamp: Date.now()
        };
        try { if (presenceBc) presenceBc.postMessage(payload); } catch(e) {}
        try {
          if (typeof mqttAudienceClient !== 'undefined' && mqttAudienceClient && mqttAudienceClient.connected) {
            mqttAudienceClient.publish(mqttPresenceTopic, JSON.stringify(payload));
          }
        } catch(e) {}
        try { localStorage.setItem('brain_presence_ping_' + safeMeetingId, JSON.stringify(payload)); } catch(e) {}
      }

      setInterval(sendAudiencePresenceHeartbeat, 3000);
      setTimeout(sendAudiencePresenceHeartbeat, 600);
      try {
        if (typeof mqtt !== 'undefined') {
          window.mqttAudienceClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId: 'brain_aud_' + Math.random().toString(16).substring(2, 8),
            clientId: 'brain_telao_' + Math.random().toString(16).substring(2, 8),
            clean: true,
            connectTimeout: 7000,
            reconnectPeriod: 3000
          });
          const mqttClient = window.mqttAudienceClient;
          mqttClient.on('connect', () => {
            sendAudiencePresenceHeartbeat();
            const ind = document.getElementById('overlay-cloud-indicator');
            if (ind) {
              ind.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Nuvem Ao Vivo';
              ind.className = 'hidden sm:flex items-center gap-1.5 text-[11px] font-semibold text-emerald-400 bg-emerald-950/40 border border-emerald-800/60 px-2 py-0.5 rounded-full';
            }
          });
          mqttClient.on('message', (topic, payload) => {
            try {
              const parsed = JSON.parse(payload.toString());
              handleIncomingSubtitle(parsed);
            } catch(err) {}
          });
        }
      } catch(e) {}
    }

      // Dicionário i18n completo para a experiência 100% no idioma do espectador
      const audienceI18n = {

        return (s || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[.,!?;:«»""'']/g, ' ').replace(/\s+/g, ' ').trim();
      }

      // GERENCIAMENTO DE VOZES HUMANIZADAS (Web Speech API) COM PONTUAÇÃO NEURAL E RESILIÊNCIA MOBILE
      function getBestVoiceForCurrentLang(genderPref) {
        if (!('speechSynthesis' in window)) return null;
        const voices = window.speechSynthesis.getVoices();
        if (!voices || voices.length === 0) return null;

        const langCode = (currentAudienceLang || 'en').split('-')[0].toLowerCase();
        const fullLang = (currentAudienceLang || 'en-US').toLowerCase().replace('_', '-');

        const matched = voices.filter(v => {
          if (!v.lang) return false;
          const vl = v.lang.toLowerCase().replace('_', '-');
          return vl.startsWith(langCode) || vl === fullLang;
        });
        if (matched.length === 0) return null;

        const cleanStr = (s) => (s || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

        const maleKeywords = [
          'male', 'homem', 'masculino', 'uomo', 'homme', 'mann', 'man', 'boy', 'guy',
          'arthur', 'jorge', 'diego', 'carlos', 'daniel', 'alvaro', 'alex', 'david',
          'mark', 'george', 'thomas', 'henri', 'hans', 'stefan', 'cosimo', 'gabriel',
          'paul', 'felipe', 'antonio', 'manuel', 'pedro', 'miguel', 'enrique', 'alberto',
          'ricardo', 'roberto', 'vicente', 'lucas', 'matheus', 'joao', 'gustavo',
          'tariq', 'omar', 'khalid', 'maged', 'naayf', 'zeid', 'faisal', 'salim', 'hassan', 'mustafa', 'ahmed',
          'voice 1', 'voice 3', 'voice 5', 'voice-1', 'voice-3', 'voice-5',
          '-m-', '-male', '#male', 'male-', 'x-yda', 'x-eed', 'x-sfg', 'x-m'
        ];

        const femaleKeywords = [
          'female', 'mulher', 'feminina', 'donna', 'femme', 'frau', 'woman', 'girl',
          'sofia', 'luciana', 'helena', 'monica', 'maria', 'paulina', 'victoria',
          'samantha', 'karen', 'elena', 'zira', 'jenny', 'aria', 'alice', 'anna',
          'denise', 'celine', 'hortense', 'clara', 'beatriz', 'katja', 'marlene',
          'laura', 'giulia', 'amalie', 'conchita', 'penelope', 'francisca',
          'mariam', 'layla', 'nour', 'hoda', 'salma', 'fatima', 'zeina', 'yasmin',
          'voice 2', 'voice 4', 'voice-2', 'voice-4',
          '-f-', '-female', '#female', 'female-', 'x-afs', 'x-ana', 'x-f'
        ];

        const scored = matched.map(v => {
          const name = cleanStr(v.name);
          const uri = cleanStr(v.voiceURI);
          let score = 0;

          // 1. Alta fidelidade neural / natural / studio
          if (name.includes('natural') || name.includes('neural')) score += 140;
          if (name.includes('enhanced') || name.includes('premium')) score += 130;
          if (name.includes('siri') || name.includes('apple')) score += 110;
          if (name.includes('google')) score += 100;
          if (name.includes('online') || name.includes('wavenet') || name.includes('network')) score += 80;
          if (v.localService === false) score += 50;
          if (name.includes('compact') || name.includes('offline') || name.includes('espeak') || name.includes('pico')) score -= 80;

          const hasMaleKeyword = maleKeywords.some(k => name.includes(k) || uri.includes(k));
          const hasFemaleKeyword = femaleKeywords.some(k => name.includes(k) || uri.includes(k));

          // 2. Correspondência estrita de gênero
          if (genderPref === 'male') {
            if (hasMaleKeyword) score += 300;
            if (hasFemaleKeyword) score -= 300;
          } else if (genderPref === 'female') {
            if (hasFemaleKeyword) score += 300;
            if (hasMaleKeyword) score -= 300;
          }

          // 3. Dialeto exato
          if (v.lang.toLowerCase().replace('_', '-') === fullLang) score += 30;

          return { voice: v, score, isMale: hasMaleKeyword, isFemale: hasFemaleKeyword };
        });

        scored.sort((a, b) => b.score - a.score);
        const best = scored[0];
        return { voice: best.voice, isMale: best.isMale, isFemale: best.isFemale };
      }

      // VU METER DISCRETO PARA O ESPECTADOR
      let vuMeterInterval = null;
      function startDiscreetVuMeter(isActive) {
        const bars = document.querySelectorAll('.audience-vu-bar');
        if (!bars || bars.length === 0) return;

        if (vuMeterInterval) clearInterval(vuMeterInterval);
        if (!isActive) {
          bars.forEach(b => { b.style.height = '4px'; b.className = 'audience-vu-bar w-1.5 h-1 bg-slate-300 dark:bg-slate-700 rounded-full transition-all duration-150'; });
          return;
        }

        vuMeterInterval = setInterval(() => {
          bars.forEach((b, i) => {
            const randomH = Math.floor(Math.random() * 16) + 4;
            b.style.height = randomH + 'px';
            b.className = 'audience-vu-bar w-1.5 rounded-full transition-all duration-100 ' + (
              randomH > 14 ? 'bg-emerald-500 shadow-xs shadow-emerald-500/50' :
              randomH > 8 ? 'bg-teal-400' : 'bg-indigo-400'

          });
        }, 120);
      }
