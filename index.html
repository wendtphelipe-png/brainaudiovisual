<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Audiovisual</title>
  <link rel="icon" type="image/svg+xml" href="frontend/public/favicon.svg">
  <!-- Tailwind CSS & Lucide Icons via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.25); }
    }
    .animate-pulse-live {
      animation: pulseLive 2s infinite;
    }

    /* ========================================================
       TEMA CLARO CONFORTÁVEL (Fundo suave anti-reflexo, sem excesso de branco)
       ======================================================== */
    body.light-mode {
      background-color: #f1f5f9 !important;
      color: #0f172a !important;
    }

    /* ========================================================
       TEMA ESCURO PROFISSIONAL (Estúdio / Baixa Luminosidade - 100% da Página)
       ======================================================== */
    html.dark,
    html.dark body,
    body.dark,
    body.dark-mode {
      background-color: #0b0f19 !important;
      color: #f1f5f9 !important;
    }

    /* Headers, Topos Congelados e Barras */
    html.dark header,
    html.dark .sticky,
    html.dark [class*="backdrop-blur"] {
      background-color: rgba(15, 23, 42, 0.96) !important;
      border-color: #334155 !important;
      color: #f8fafc !important;
    }

    /* Cards, Seções e Gradients no Dashboard e Cockpit */
    html.dark section,
    html.dark .bg-white,
    html.dark [class*="bg-white"],
    html.dark [class*="bg-slate-50"],
    html.dark [class*="bg-slate-100"],
    html.dark [class*="bg-slate-200"],
    html.dark [class*="from-blue-50"],
    html.dark [class*="from-indigo-50"],
    html.dark [class*="from-emerald-50"] {
      background-color: #111827 !important;
      background-image: none !important;
      border-color: #374151 !important;
      color: #f8fafc !important;
    }

    /* Cabeçalhos de Seções e Sub-blocos */
    html.dark section > div:first-child,
    html.dark [class*="bg-blue-100"],
    html.dark [class*="bg-indigo-100"],
    html.dark [class*="bg-emerald-100"] {
      background-color: #1e293b !important;
      border-color: #374151 !important;
      color: #f8fafc !important;
    }

    /* Tipografia e Títulos */
    html.dark .text-slate-900,
    html.dark .text-slate-800,
    html.dark .text-slate-700,
    html.dark h1, html.dark h2, html.dark h3, html.dark h4, html.dark strong {
      color: #f8fafc !important;
    }

    html.dark .text-slate-600,
    html.dark .text-slate-500 {
      color: #cbd5e1 !important;
    }

    html.dark .text-slate-400 {
      color: #94a3b8 !important;
    }

    /* Bordas */
    html.dark .border-slate-200,
    html.dark .border-slate-300,
    html.dark .border-blue-100,
    html.dark .border-blue-200,
    html.dark .border-indigo-100,
    html.dark .border-indigo-200,
    html.dark .border-emerald-100,
    html.dark .border-emerald-200 {
      border-color: #374151 !important;
    }

    /* Inputs, Selects e Textareas */
    html.dark input,
    html.dark select,
    html.dark textarea {
      background-color: #1e293b !important;
      color: #f8fafc !important;
      border-color: #4b5563 !important;
    }

    /* Modais */
    html.dark #share-telao-modal > div,
    html.dark #finish-meeting-modal > div,
    html.dark #test-lab-modal > div {
      background-color: #111827 !important;
      border-color: #374151 !important;
      color: #f8fafc !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased m-0 min-h-screen">

  <div id="app-root"></div>

  <script>
    // ========================================================
    // HELPERS GLOBAIS DE ESTADO E PERSISTÊNCIA SEGURA
    // ========================================================
    // ========================================================
    // GERENCIADOR DE TEMA GLOBAL (MODO CLARO CONFORTÁVEL & MODO ESCURO)
    // ========================================================
    function getStoredTheme() {
      try {
        return localStorage.getItem('brain_theme') || 'light';
      } catch(e) { return 'light'; }
    }

    function setGlobalTheme(theme) {
      try {
        localStorage.setItem('brain_theme', theme);
      } catch(e) {}
      const isDark = theme === 'dark';
      if (isDark) {
        document.documentElement.classList.add('dark');
        document.body.classList.add('dark');
        document.body.classList.add('dark-mode');
        document.body.classList.remove('light-mode');
      } else {
        document.documentElement.classList.remove('dark');
        document.body.classList.remove('dark');
        document.body.classList.remove('dark-mode');
        document.body.classList.add('light-mode');
      }
      updateThemeButtonUI();
    }

    window.toggleGlobalTheme = function() {
      const current = getStoredTheme();
      const next = current === 'dark' ? 'light' : 'dark';
      setGlobalTheme(next);
    };

    function updateThemeButtonUI() {
      const isDark = getStoredTheme() === 'dark';
      const btns = document.querySelectorAll('.btn-theme-toggle');
      btns.forEach(btn => {
        btn.innerHTML = isDark 
          ? '<span>☀️ Modo Claro</span>' 
          : '<span>🌙 Modo Escuro</span>';
        btn.className = isDark
          ? 'btn-theme-toggle text-xs font-bold px-3 py-1.5 rounded-xl border border-amber-400/50 bg-amber-500/10 text-amber-300 hover:bg-amber-500/20 transition-all cursor-pointer flex items-center gap-1.5 shadow-2xs'
          : 'btn-theme-toggle text-xs font-bold px-3 py-1.5 rounded-xl border border-slate-300 bg-white hover:bg-slate-100 text-slate-800 transition-all cursor-pointer flex items-center gap-1.5 shadow-2xs';
      });
    }

    // Inicializa o tema memorizado
    setTimeout(() => {
      setGlobalTheme(getStoredTheme());
    }, 10);

    function getStoredAccounts() {
      try {
        const raw = localStorage.getItem('brain_saved_accounts');
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr) && arr.length > 0) return arr;
        }
      } catch (e) {}
      return [
        { id: 'acc-1', name: 'Conta Google Pro 01 (Principal)', email: '', connected: false },
        { id: 'acc-2', name: 'Conta Google Pro 02 (Auxiliar/Tradução)', email: '', connected: false },
        { id: 'acc-3', name: 'Slot Google Pro 03', email: '', connected: false },
        { id: 'acc-4', name: 'Slot Google Pro 04', email: '', connected: false }
      ];
    }

    function getStoredMeetings() {
      try {
        const raw = localStorage.getItem('brain_saved_meetings');
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) return arr;
        }
      } catch (e) {}
      return [];
    }

    function getStoredAudioLanguageSettings() {
      let settings = {
        sourceLanguage: 'pt-BR',
        sourceLanguageLabel: 'Português (Brasil)',
        targetLanguage: 'en-US',
        targetLanguageLabel: 'Inglês (Estados Unidos / Global)',
        transmitterInputDevice: 'event-line',
        transmitterInputLabel: 'Áudio do Evento (Mesa de Som / Linha)',
        transmitterSpeakerMuted: true,
        receiverInputMuted: true,
        receiverOutputDevice: 'cable',
        receiverOutputLabel: 'CABLE Output / VB-Audio Virtual Cable (Mesa de Som)',
        cameraDisabled: true
      };
      try {
        const raw = localStorage.getItem('brain_audio_lang_settings');
        if (raw) {
          const parsed = JSON.parse(raw);
          settings = Object.assign(settings, parsed);
        }
      } catch (e) {}
      return settings;
    }

    function saveStoredAudioLanguageSettings(settings) {
      try {
        localStorage.setItem('brain_audio_lang_settings', JSON.stringify(settings));
      } catch (e) {}
    }

    // ========================================================
    // ROTEAMENTO DINÂMICO
    // ========================================================
    const params = new URLSearchParams(window.location.search);
    const isOAuthCallback = params.get('oauth2callback') === 'true' || window.location.pathname.startsWith('/oauth2callback');
    const isOverlaySubtitles = params.get('overlay') === 'subtitles' || params.get('telao') === 'true' || window.location.pathname.startsWith('/overlay/subtitles') || window.location.pathname.startsWith('/telao');
    const isAdmin = params.get('admin') === 'true' || window.location.pathname.startsWith('/admin');
    const meetingId = params.get('meeting') || (window.location.pathname.startsWith('/meeting/') ? window.location.pathname.split('/')[2] : null);

    const root = document.getElementById('app-root');

    // 0. ROTA: CALLBACK DE AUTENTICAÇÃO DO GOOGLE EM POPUP (/oauth2callback ou ?oauth2callback=true)
    if (isOAuthCallback) {
      renderOAuthCallbackPopup();
    }
    // 1. ROTA DEDICADA: JANELA EXCLUSIVA DE LEGENDAS PARA OBS / BROADCAST (?meeting=xyz&overlay=subtitles)
    else if (isOverlaySubtitles && meetingId) {
      document.body.className = "bg-black text-white font-sans antialiased m-0 min-h-screen overflow-x-hidden selection:bg-blue-500/30 selection:text-blue-200";
      try {
        renderSubtitleOverlayPage(meetingId);
      } catch(err) {
        console.error("Erro crítico ao inicializar Overlay de Legenda:", err);
      }
    }
    // 2. ROTA: MONITOR DEDICADO DO COCKPIT DA REUNIÃO (?meeting=xyz ou /meeting/xyz)
    else if (meetingId) {
      document.body.className = "font-sans antialiased m-0 min-h-screen selection:bg-blue-500/30 selection:text-blue-200";
      setGlobalTheme(getStoredTheme());
      try {
        renderMeetingRoomMonitor(meetingId);
      } catch(err) {
        console.error("Erro crítico ao inicializar Cockpit da Reunião:", err);
        root.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-6">
            <div class="max-w-md w-full bg-slate-900 border border-rose-500/40 rounded-3xl p-8 text-center shadow-2xl">
              <div class="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-xl font-bold mx-auto mb-4">⚠️</div>
              <h2 class="text-base font-bold text-white mb-2">Erro ao Iniciar Cockpit</h2>
              <p class="text-xs text-slate-400 mb-6 font-mono">${err.message || String(err)}</p>
              <div class="flex items-center justify-center gap-3">
                <button onclick="window.location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2.5 rounded-xl font-semibold transition-all">Recarregar</button>
                <a href="/admin" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-4 py-2.5 rounded-xl font-semibold transition-all">Voltar ao Admin</a>
              </div>
            </div>
          </div>
        `;
      }
    } 
    // 2. ROTA: ÁREA ADMINISTRATIVA (/admin ou ?admin=true)
    else if (isAdmin) {
      document.body.className = "font-sans antialiased m-0 min-h-screen";
      setGlobalTheme(getStoredTheme());
      checkAdminAuthAndRender();
    } 
    // 3. ROTA PADRÃO PÚBLICA: PÁGINA EM CONSTRUÇÃO CLEAN E CLARA (/)
    else {
      document.body.className = "bg-[#f8fafc] text-[#0f172a] font-sans antialiased m-0 min-h-screen flex items-center justify-center p-6 text-center";
      renderPublicConstructionPage();
    }

    // ========================================================
    // TELA 0: CALLBACK DA JANELA POPUP DO GOOGLE OAUTH
    // ========================================================
    function renderOAuthCallbackPopup() {
      document.body.className = "bg-slate-900 text-white font-sans antialiased m-0 flex items-center justify-center min-h-screen p-6 text-center";
      
      const searchParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash);
      
      const error = searchParams.get('error') || hashParams.get('error');
      const code = searchParams.get('code');
      const accessToken = hashParams.get('access_token');
      const slotId = searchParams.get('state') || hashParams.get('state') || 'acc-1';

      root.innerHTML = `
        <div class="max-w-md w-full bg-slate-950 border border-slate-800 rounded-3xl p-8 shadow-2xl">
          <div id="cb-box">
            <div class="w-12 h-12 rounded-full border-4 border-blue-500 border-t-transparent animate-spin mx-auto mb-4"></div>
            <h2 class="text-base font-bold text-white mb-2">Processando Conexão com o Google...</h2>
            <p class="text-xs text-slate-400">Verificando a autenticação da sua conta Google Workspace Pro.</p>
          </div>
        </div>
      `;

      if (error) {
        document.getElementById('cb-box').innerHTML = `
          <div class="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-xl font-bold mx-auto mb-4">✕</div>
          <h2 class="text-base font-bold text-rose-400 mb-2">Autorização Não Concluída</h2>
          <p class="text-xs text-slate-400 mb-5">${error === 'access_denied' ? 'O acesso foi recusado na janela do Google.' : error}</p>
          <button onclick="window.close()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-5 py-2.5 rounded-xl font-semibold">Fechar Janela</button>
        `;
        if (window.opener) {
          try {
            window.opener.postMessage({ type: 'GOOGLE_AUTH_ERROR', error, slotId }, '*');
          } catch (e) {}
        }
        return;
      }

      if (accessToken) {
        // Valida imediatamente com a API oficial do Google
        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: { 'Authorization': 'Bearer ' + accessToken }
        })
        .then(r => r.json())
        .then(userInfo => {
          document.getElementById('cb-box').innerHTML = `
            <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl font-bold mx-auto mb-4">✓</div>
            <h2 class="text-base font-bold text-emerald-400 mb-1">Conta Google Pro Conectada!</h2>
            <p class="text-xs text-slate-300 font-semibold mb-1">${userInfo.name || 'Conta Google'}</p>
            <p class="text-xs text-blue-400 font-mono mb-4">${userInfo.email}</p>
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-[11px] font-medium border border-emerald-500/20 mb-3">
              <span>● Token Pro Verificado com Sucesso</span>
            </div>
            <p class="text-[11px] text-slate-500">Retornando ao painel em instantes...</p>
          `;

          if (window.opener) {
            try {
              window.opener.postMessage({
                type: 'GOOGLE_AUTH_SUCCESS',
                slotId: slotId,
                email: userInfo.email,
                name: userInfo.name,
                picture: userInfo.picture,
                tokens: { access_token: accessToken }
              }, '*');
            } catch (e) {}
          }
          setTimeout(() => { window.close(); }, 1400);
        })
        .catch(err => {
          document.getElementById('cb-box').innerHTML = `
            <div class="text-rose-400 text-xs">Erro na validação do token: ${err.message}</div>
          `;
        });
      } else if (code) {
        // Envia o código para o opener
        if (window.opener) {
          try {
            window.opener.postMessage({
              type: 'GOOGLE_AUTH_CODE',
              slotId: slotId,
              code: code
            }, '*');
          } catch (e) {}
        }
        document.getElementById('cb-box').innerHTML = `
          <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl font-bold mx-auto mb-4">✓</div>
          <h2 class="text-base font-bold text-emerald-400 mb-2">Código de Autorização Recebido!</h2>
          <p class="text-xs text-slate-400 mb-4">Concluindo validação no painel...</p>
        `;
        setTimeout(() => { window.close(); }, 1200);
      }
    }

    // ========================================================
    // TELA 1: PÁGINA PÚBLICA CLEAN (EM CONSTRUÇÃO)
    // ========================================================
    function renderPublicConstructionPage() {
      root.innerHTML = `
        <div class="max-w-xl flex flex-col items-center justify-center">
          <h1 class="text-4xl sm:text-5xl md:text-6xl font-semibold tracking-tight text-[#0f172a] mb-5 leading-tight">
            Brain Audiovisual
          </h1>
          <div class="w-12 h-[1.5px] bg-[#cbd5e1] mb-6"></div>
          <p class="text-xs sm:text-sm font-medium tracking-[0.22em] uppercase text-[#64748b]">
            Página em construção
          </p>
        </div>
      `;
    }

    // ========================================================
    // CONTROLE DE AUTENTICAÇÃO DO ADMINISTRADOR
    // ========================================================
    function checkAdminAuthAndRender() {
      // Suporte a acesso direto via URL (?auto=1 ou ?token=master)
      if (params.get('auto') === '1' || params.get('token') === 'master') {
        localStorage.setItem('brain_admin_token', 'bat_static_master');
        renderAdminDashboard();
        return;
      }

      const token = localStorage.getItem('brain_admin_token') || sessionStorage.getItem('brain_admin_token');

      if (!token) {
        renderAdminLoginScreen();
        return;
      }

      // Se tiver token estático válido, renderiza direto o dashboard sem depender de requisição de rede
      if (token.startsWith('bat_') || token === 'admin_auth_success') {
        renderAdminDashboard();
        return;
      }

      // Valida sessão com o backend se disponível
      fetch('/api/admin/verify', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(r => {
        if (!r.ok) throw new Error('API indisponível');
        return r.json();
      })
      .then(data => {
        if (data.authenticated) {
          renderAdminDashboard();
        } else {
          localStorage.removeItem('brain_admin_token');
          sessionStorage.removeItem('brain_admin_token');
          renderAdminLoginScreen('Sessão expirada. Faça login novamente.');
        }
      })
      .catch(() => {
        renderAdminLoginScreen();
      });
    }

    // ========================================================
    // TELA: LOGIN SEGURO DO ADMINISTRADOR
    // ========================================================
    function renderAdminLoginScreen(errorMessage = '') {
      root.innerHTML = `
        <div class="min-h-screen flex items-center justify-center p-6 bg-slate-50">
          <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-8 shadow-xl shadow-slate-200/50">
            
            <div class="text-center mb-8">
              <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white font-extrabold text-xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/20">
                BA
              </div>
              <h1 class="text-2xl font-bold tracking-tight text-slate-900">Acesso Restrito</h1>
              <p class="text-xs text-slate-500 mt-1">Painel Master de Operações • Brain Audiovisual</p>
              <div class="inline-flex items-center gap-1.5 mt-3 px-3 py-1 rounded-full bg-blue-50 text-blue-700 text-[11px] font-semibold border border-blue-100">
                <span>🔒 Acesso Exclusivo para Administradores</span>
              </div>
            </div>

            ${errorMessage ? `
              <div class="mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium">
                ${errorMessage}
              </div>
            ` : ''}

            <form id="admin-login-form" onsubmit="handleAdminLoginSubmit(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Usuário Administrador</label>
                <input 
                  type="text" 
                  id="admin-username" 
                  required 
                  value="admin" 
                  placeholder="admin"
                  class="w-full bg-slate-50 border border-slate-200 focus:border-blue-500 focus:bg-white rounded-xl px-4 py-2.5 text-xs text-slate-900 outline-none transition-all"
                >
              </div>

              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <label class="text-xs font-semibold text-slate-700">Senha de Acesso</label>
                </div>
                <input 
                  type="password" 
                  id="admin-password" 
                  required 
                  value="BrainAdmin@2026"
                  placeholder="••••••••••••"
                  class="w-full bg-slate-50 border border-slate-200 focus:border-blue-500 focus:bg-white rounded-xl px-4 py-2.5 text-xs text-slate-900 outline-none transition-all"
                >
              </div>

              <div class="flex items-center justify-between pt-1 text-xs">
                <label class="flex items-center gap-2 text-slate-600 cursor-pointer">
                  <input type="checkbox" id="remember-me" checked class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                  <span>Lembrar neste navegador</span>
                </label>
              </div>

              <button 
                type="submit" 
                class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold text-xs py-3 px-4 rounded-xl transition-all shadow-md shadow-blue-600/20 active:scale-[0.99] cursor-pointer"
              >
                Entrar no Painel Master →
              </button>

              <button 
                type="button" 
                onclick="localStorage.setItem('brain_admin_token', 'bat_static_quick'); renderAdminDashboard();" 
                class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs py-2.5 px-4 rounded-xl transition-all cursor-pointer border border-slate-200 text-center"
              >
                Acesso Rápido ao Dashboard (1 Clique)
              </button>
            </form>

            <div class="mt-6 pt-4 border-t border-slate-100 text-center">
              <p class="text-[11px] text-slate-400">Credencial padrão: <strong>admin</strong> / <strong>BrainAdmin@2026</strong></p>
            </div>

          </div>
        </div>
      `;
    }

    window.handleAdminLoginSubmit = function(e) {
      e.preventDefault();
      const user = document.getElementById('admin-username').value.trim();
      const pass = document.getElementById('admin-password').value;
      const remember = document.getElementById('remember-me').checked;

      // Autenticação instantânea para credencial master padrão
      if (user === 'admin' && pass === 'BrainAdmin@2026') {
        const token = 'bat_static_' + Date.now();
        if (remember) localStorage.setItem('brain_admin_token', token);
        else sessionStorage.setItem('brain_admin_token', token);
        renderAdminDashboard();
        return;
      }

      // Tenta autenticar via API backend caso seja outro usuário/senha
      fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, password: pass })
      })
      .then(r => {
        if (!r.ok) throw new Error('API indisponível');
        return r.json();
      })
      .then(data => {
        if (data.token) {
          if (remember) localStorage.setItem('brain_admin_token', data.token);
          else sessionStorage.setItem('brain_admin_token', data.token);
          checkAdminAuthAndRender();
        } else {

      window.saveWizardCredentialsSubmit = function() {
        const clientId = document.getElementById('wz-client-id').value.trim();
        const clientSecret = document.getElementById('wz-client-secret').value.trim();
        const redirectUri = window.location.origin + '/oauth2callback';
        const currentSlotId = window.wizardState.slotId || 'acc-1';

        if (!clientId) {
          alert('Por favor, informe o Client ID do Google Cloud.');
          return;
        }

        // Salva isoladamente para este slot específico, garantindo que o Slot 1 não seja perdido
        localStorage.setItem('brain_google_credentials_' + currentSlotId, JSON.stringify({ clientId, clientSecret }));
        // Mantém como fallback geral
        localStorage.setItem('brain_google_credentials', JSON.stringify({ clientId, clientSecret }));

        fetch('/api/admin/google-credentials', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slotId: currentSlotId, clientId, clientSecret, redirectUri })
        }).catch(() => {});

        window.wizardState.step = 2;
        window.wizardState.errorMessage = '';
        renderWizardModal();
      };

      window.launchGoogleAuthPopup = function() {
        window.wizardState.errorMessage = '';
        const currentSlotId = window.wizardState.slotId || 'acc-1';
        const slotCreds = JSON.parse(localStorage.getItem('brain_google_credentials_' + currentSlotId) || '{}');
        const defaultCreds = JSON.parse(localStorage.getItem('brain_google_credentials') || '{}');
        const clientId = slotCreds.clientId || defaultCreds.clientId;

        if (!clientId) {
          window.wizardState.step = 1;
          window.wizardState.errorMessage = 'Configure o Client ID antes de abrir o login.';
          renderWizardModal();
          return;
        }

        // Tenta obter URL oficial via backend
        fetch('/api/accounts/auth-url?slot=' + currentSlotId)
          .then(r => r.json())
          .then(d => {
            const url = d.url || buildGoogleOAuthUrl(clientId, currentSlotId);
            openPopup(url);
          })
          .catch(() => {
            const url = buildGoogleOAuthUrl(clientId, currentSlotId);
            openPopup(url);
          });

        function openPopup(url) {
          const width = 560;
          const height = 680;
          const left = Math.max(0, (window.screen.width - width) / 2);
          const top = Math.max(0, (window.screen.height - height) / 2);

          window.wizardState.popupRef = window.open(
            url,
            'GoogleProLogin',
            `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes,status=yes`
          );

          if (!window.wizardState.popupRef || window.wizardState.popupRef.closed || typeof window.wizardState.popupRef.closed === 'undefined') {
            window.wizardState.errorMessage = 'O navegador bloqueou a abertura do popup. Permita popups para este site.';
            window.wizardState.popupLaunched = false;
            renderWizardModal();
            return;
          }

          window.wizardState.popupLaunched = true;
          renderWizardModal();

          if (window.wizardState.checkTimer) clearInterval(window.wizardState.checkTimer);
          window.wizardState.checkTimer = setInterval(() => {
            if (window.wizardState.popupRef && window.wizardState.popupRef.closed) {
              clearInterval(window.wizardState.checkTimer);
              if (window.wizardState.step !== 3) {
                window.wizardState.popupLaunched = false;
                window.wizardState.errorMessage = 'A janela do Google foi fechada antes de concluir o login. Se desejar, tente novamente.';
                renderWizardModal();
              }
            }
          }, 1000);
        }
      };

      function buildGoogleOAuthUrl(clientId, slotId) {
        const redirectUri = window.location.origin + '/oauth2callback';
        const scope = encodeURIComponent('openid https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile');
        const nonce = Math.random().toString(36).substring(2);
        return `https://accounts.google.com/o/oauth2/v2/auth?client_id=${encodeURIComponent(clientId.trim())}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=token%20id_token&scope=${scope}&state=${encodeURIComponent(slotId)}&prompt=select_account%20consent&nonce=${nonce}`;
      }

      window.handleManualTokenVerificationSubmit = function() {
        const field = document.getElementById('manual-token-field');
        if (!field || !field.value.trim()) {
          alert('Informe o token de acesso recebido do Google.');
          return;
        }
        const token = field.value.trim();
        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(r => {
          if (!r.ok) throw new Error('Token inválido ou expirado.');
          return r.json();
        })
        .then(userInfo => {
          window.wizardState.verifiedData = {
            email: userInfo.email,
            name: userInfo.name,
            picture: userInfo.picture,
            tokens: { access_token: token }
          };
          window.wizardState.step = 3;
          renderWizardModal();
        })
        .catch(err => {
          alert('Falha ao validar token com a Google API: ' + err.message);
        });
      };

          acc.isPro = true;

          acc.tokens = window.wizardState.verifiedData.tokens || { access_token: 'verified' };

            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({

              email: acc.email,

              tokens: acc.tokens

        if (event.data.type === 'GOOGLE_AUTH_SUCCESS') {
          if (wizardState.checkTimer) clearInterval(wizardState.checkTimer);
          wizardState.verifiedData = {
            email: event.data.email,
            name: event.data.name,
            picture: event.data.picture,
            tokens: event.data.tokens
          };
          wizardState.step = 3;
          wizardState.popupLaunched = false;
          renderWizardModal();
        } else if (event.data.type === 'GOOGLE_AUTH_CODE') {
          // Troca código com backend se disponível
          fetch('/api/accounts/oauth-exchange', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: event.data.code, slotId: event.data.slotId })

        const dedupeKey = data.channel + '_' + data.text.trim();
        if (seenSubtitles.has(dedupeKey)) return;
        seenSubtitles.add(dedupeKey);

          seenSubtitles.delete(first);

          p.innerText = data.text;

            feed.removeChild(feed.lastChild);
          }
        }

        if (feed2) feed2.className = `space-y-1.5 ${fontClass} flex-1 overflow-y-auto`;

      };

      // ========================================================
      // SISTEMA DE ÁUDIO MASTER: GRAVAÇÃO, VU METER & TRANSCRIÇÃO
      // ========================================================
      let selectedMicDeviceId = localStorage.getItem('brain_selected_transmitter_mic') || 'default';
      let selectedReceiverAudioDeviceId = localStorage.getItem('brain_selected_receiver_audio') || 'default';
      let availableAudioInputDevices = [];

      async function refreshAudioDevicesList(showFeedback = false) {
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          availableAudioInputDevices = devices.filter(d => d.kind === 'audioinput');
          
          // 1. Canal Transmissor (Microfone)
          const transSelect = document.getElementById('transmitter-mic-select');
          if (transSelect) {
            transSelect.innerHTML = '';
            const defaultOpt = document.createElement('option');
            defaultOpt.value = 'default';
            defaultOpt.innerText = '🎙️ Microfone Padrão do Sistema (Windows)';
            transSelect.appendChild(defaultOpt);

            let foundSelected = false;
            availableAudioInputDevices.forEach((dev, idx) => {
              const opt = document.createElement('option');
              opt.value = dev.deviceId;
              const label = dev.label ? dev.label : `Entrada de Áudio ${idx + 1} (${dev.deviceId.slice(0, 6)}...)`;
              opt.innerText = `🎤 ${label}`;
              if (dev.deviceId === selectedMicDeviceId) {
                opt.selected = true;
                foundSelected = true;
              }
              transSelect.appendChild(opt);
            });

            if (!foundSelected && selectedMicDeviceId && selectedMicDeviceId !== 'default') {
              transSelect.value = 'default';
            }
          }

          // 2. Canal Receptor (VB-CABLE / Saída Traduzida)
          const recSelect = document.getElementById('receiver-audio-select');
          if (recSelect) {
            recSelect.innerHTML = '';
            const defaultRecOpt = document.createElement('option');
            defaultRecOpt.value = 'default';
            defaultRecOpt.innerText = '🎧 Dispositivo Padrão / CABLE Output (VB-Audio)';
            recSelect.appendChild(defaultRecOpt);

            let foundRecSelected = false;
            let detectedCableDeviceId = null;

            availableAudioInputDevices.forEach((dev, idx) => {
              const opt = document.createElement('option');
              opt.value = dev.deviceId;
              const label = dev.label ? dev.label : `Dispositivo ${idx + 1} (${dev.deviceId.slice(0, 6)}...)`;
              opt.innerText = `🎧 ${label}`;

              const lower = label.toLowerCase();
              if (lower.includes('cable') || lower.includes('virtual') || lower.includes('stereo mix') || lower.includes('mixagem')) {
                detectedCableDeviceId = dev.deviceId;
              }

              if (dev.deviceId === selectedReceiverAudioDeviceId) {
                opt.selected = true;
                foundRecSelected = true;
              }
              recSelect.appendChild(opt);
            });

            if (!foundRecSelected && (!selectedReceiverAudioDeviceId || selectedReceiverAudioDeviceId === 'default') && detectedCableDeviceId) {
              recSelect.value = detectedCableDeviceId;
              selectedReceiverAudioDeviceId = detectedCableDeviceId;
              localStorage.setItem('brain_selected_receiver_audio', detectedCableDeviceId);
            }
          }

          if (showFeedback) {
            appendSystemLog(`🔄 Lista de dispositivos atualizada: ${availableAudioInputDevices.length} encontrados.`);
          }
        } catch(e) {
          console.warn('Erro ao enumerar dispositivos de áudio:', e);
        }
      }

      // ESTADO DE ÁUDIO DO CANAL RECEPTOR (LEITURA DO VB-CABLE / RETORNO)
      let receiverAudioContext = null;
      let receiverMediaStream = null;
      let receiverAnalyserNode = null;
      let isReceiverAudioCaptureActive = false;

      window.toggleReceiverAudioCapture = async function() {
        if (!isReceiverAudioCaptureActive) {
          await startReceiverAudioCapture();
        } else {
          stopReceiverAudioCapture();
        }
      };

      async function startReceiverAudioCapture() {
        const select = document.getElementById('receiver-audio-select');
        const targetDeviceId = select ? select.value : selectedReceiverAudioDeviceId;

        const constraints = {
          audio: (targetDeviceId && targetDeviceId !== 'default') 
            ? { deviceId: { exact: targetDeviceId }, echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
            : { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        };

        try {
          if (receiverMediaStream) {
            receiverMediaStream.getTracks().forEach(t => t.stop());
          }
          receiverMediaStream = await navigator.mediaDevices.getUserMedia(constraints);
          await refreshAudioDevicesList();

          if (!receiverAudioContext || receiverAudioContext.state === 'closed') {
            receiverAudioContext = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (receiverAudioContext.state === 'suspended') {
            await receiverAudioContext.resume();
          }

          const source = receiverAudioContext.createMediaStreamSource(receiverMediaStream);
          receiverAnalyserNode = receiverAudioContext.createAnalyser();
          receiverAnalyserNode.fftSize = 256;
          receiverAnalyserNode.smoothingTimeConstant = 0.4;
          source.connect(receiverAnalyserNode);

          isReceiverAudioCaptureActive = true;

          const btn = document.getElementById('btn-toggle-receiver-audio');
          if (btn) {
            btn.innerHTML = '<span>⏹️ Desconectar Leitura</span>';
            btn.className = 'px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition-all shadow-sm flex items-center justify-center gap-1.5 cursor-pointer whitespace-nowrap';
          }

          const badge = document.getElementById('receiver-audio-badge');
          if (badge) {
            badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Ativo ● Lendo VB-CABLE';
            badge.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-950/40 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-700 flex items-center gap-1 shadow-2xs';
          }

          appendSystemLog('🎧 Leitura do canal receptor ativada com sucesso! VU Meter e modulação iniciados.');

          // Gravação real do áudio receptor em paralelo
          try {
            receiverAudioChunks = [];
            receiverMediaRecorder = new MediaRecorder(receiverMediaStream);
            receiverMediaRecorder.ondataavailable = (e) => {
              if (e.data.size > 0) receiverAudioChunks.push(e.data);
            };
            receiverMediaRecorder.onstop = () => {
              receiverRecordedBlob = new Blob(receiverAudioChunks, { type: 'audio/webm' });
            };
            receiverMediaRecorder.start(1000);
            isRecordingReceiver = true;
          } catch(e) {}

          // Inicia reconhecimento direto no áudio receptor
          startReceiverSpeechRecognition();
        } catch(err) {
          alert('Erro ao ativar leitura do canal receptor: ' + err.message + '\n\nCertifique-se de que o dispositivo está conectado e que o navegador possui permissão.');
        }
      }

      function stopReceiverAudioCapture() {
        if (receiverMediaStream) {
          receiverMediaStream.getTracks().forEach(t => t.stop());
          receiverMediaStream = null;
        }
        if (receiverAudioContext && receiverAudioContext.state !== 'closed') {
          receiverAudioContext.close().catch(() => {});
        }
        isReceiverAudioCaptureActive = false;

        const btn = document.getElementById('btn-toggle-receiver-audio');
        if (btn) {
          btn.innerHTML = '<span>🎧 Conectar Leitura da Tradução</span>';
          btn.className = 'px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition-all shadow-sm flex items-center justify-center gap-1.5 cursor-pointer whitespace-nowrap';
        }

        const badge = document.getElementById('receiver-audio-badge');
        if (badge) {
          badge.innerHTML = 'Desconectado ○';
          badge.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-50 text-amber-800 dark:bg-amber-950/40 dark:text-amber-300 border border-amber-300 dark:border-amber-700 flex items-center gap-1';
        }

        const bar = document.getElementById('receiver-vu-bar');
        const text = document.getElementById('receiver-vu-text');
        const led = document.getElementById('receiver-vu-led');
        if (bar) bar.style.width = '0%';
        if (text) text.innerText = '0%';
        if (led) led.className = 'w-2 h-2 rounded-full bg-slate-400';

        if (receiverSpeechRecognizer) {
          try { receiverSpeechRecognizer.stop(); } catch(e) {}
        }

        appendSystemLog('Leitura do canal receptor desconectada.');
      }

      window.onReceiverAudioDeviceSelected = function(deviceId) {
        selectedReceiverAudioDeviceId = deviceId;
        localStorage.setItem('brain_selected_receiver_audio', deviceId);
        if (isReceiverAudioCaptureActive) {
          startReceiverAudioCapture();
        }
      };

      // Auto-detecção de novos dispositivos conectados via USB ou P2
      if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
        navigator.mediaDevices.addEventListener('devicechange', () => {
          appendSystemLog('🔌 Novo dispositivo de áudio detectado no computador!');
          refreshAudioDevicesList(true);
        });

      // VU METER REAL EM TEMPO REAL (REQUESTANIMATIONFRAME)
      let micVuAnimFrameId = null;
      function startMicVuMeterLoop() {
        if (micVuAnimFrameId) cancelAnimationFrame(micVuAnimFrameId);
        if (!micAnalyserNode) return;

        const dataArray = new Uint8Array(micAnalyserNode.frequencyBinCount);
        
        function updateVu() {
          if (!isRealMicActive || !micAnalyserNode) {
            const bar = document.getElementById('mic-vu-bar');
            const text = document.getElementById('mic-vu-text');
            const led = document.getElementById('mic-vu-led');
            if (bar) bar.style.width = '0%';
            if (text) text.innerText = '0%';
            if (led) led.className = 'w-2 h-2 rounded-full bg-slate-400';
            return;
          }
          
          micAnalyserNode.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) {
            sum += dataArray[i];
          }
          const average = sum / dataArray.length;
          
          // Escala natural de sensibilidade para a voz humana (0 a 100%)
          const levelPct = isTransmitterMicMuted ? 0 : Math.min(100, Math.round((average / 115) * 100));
          
          const bar = document.getElementById('mic-vu-bar');
          const text = document.getElementById('mic-vu-text');
          const led = document.getElementById('mic-vu-led');

          if (bar) {
            bar.style.width = levelPct + '%';
            if (levelPct > 75) {
              bar.className = 'h-full rounded-full transition-all duration-75 bg-rose-500 shadow-xs';
            } else if (levelPct > 45) {
              bar.className = 'h-full rounded-full transition-all duration-75 bg-amber-400 shadow-xs';
            } else {
              bar.className = 'h-full rounded-full transition-all duration-75 bg-gradient-to-r from-emerald-500 via-teal-400 to-blue-500 shadow-xs';
            }
          }
          if (text) text.innerText = levelPct + '%';
          if (led) {
            led.className = levelPct > 4 
              ? 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse' 
              : 'w-2 h-2 rounded-full bg-slate-400';
          }
          
          micVuAnimFrameId = requestAnimationFrame(updateVu);
        }
        micVuAnimFrameId = requestAnimationFrame(updateVu);
      }

      function scheduleSpeechRecognizerRestart() {
        if (speechRecognizerRestartTimeout) clearTimeout(speechRecognizerRestartTimeout);
        speechRecognizerRestartTimeout = setTimeout(() => {
          if (isRealMicActive && !isTimerPaused) {
            try {

      function startContinuousSpeechTranscription() {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          appendSystemLog('⚠️ Reconhecimento de voz não suportado neste navegador. Use Google Chrome ou Edge.');
          return;
        }

        try {
          if (speechRecognizer) {
            try { speechRecognizer.abort(); } catch(e) {}
          }
          speechRecognizer = new SpeechRec();
          speechRecognizer.continuous = true;
          speechRecognizer.interimResults = true;
          speechRecognizer.lang = selectedSourceLanguage || 'pt-BR';

          speechRecognizer.onstart = () => {
            isTranscribingSpeech = true;
            appendSystemLog(`🎙️ Reconhecimento de voz ATIVO no microfone (${selectedSourceLanguage}). Fale normalmente.`);
          };

          speechRecognizer.onresult = (event) => {
            let interim = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
              const transcript = event.results[i][0].transcript;
              if (event.results[i].isFinal) {
                const startSec = sessionElapsedSeconds;
                const endSec = startSec + Math.max(2.2, transcript.length * 0.08);

                // FRACIONAMENTO HARMONIOSO EM BLOCOS CURTOS (MÁX ~48 CARACTERES)
                const chunks = splitTextIntoHarmoniousSubtitleChunks(transcript, startSec, endSec, 48);
                chunks.forEach(c => {
                  addTransmitterSentenceClean(c.text, c.timeStart, c.timeEnd);
                });
                
                // Tradução direta das falas reais do palestrante (NUNCA FORÇADA NO SILÊNCIO)
                translateAndAddReceiverSentenceClean(transcript, startSec, endSec);
              } else {
                interim += transcript;
              }
            }
            const interimEl = document.getElementById('transmitter-interim-text');
            if (interimEl) interimEl.innerText = interim ? `💬 ${interim}...` : '';
          };

          speechRecognizer.onerror = (e) => {
            console.warn('Transmitter speechRecognition aviso:', e.error);
            if (e.error === 'not-allowed') {
              isRealMicActive = false;
              stopMasterMicCapture();
              appendSystemLog('❌ Permissão de microfone negada. Clique no ícone de cadeado na barra de endereços do Chrome para permitir o microfone.');
            } else if (e.error === 'no-speech' || e.error === 'network' || e.error === 'aborted') {
              scheduleSpeechRecognizerRestart();
            }
          };

          speechRecognizer.onend = () => {
            if (isRealMicActive && !isTimerPaused) {
              scheduleSpeechRecognizerRestart();
            } else {
              isTranscribingSpeech = false;
            }
          };

          speechRecognizer.start();
        } catch(e) {
          scheduleSpeechRecognizerRestart();
        }
      }

      // FRACIONAMENTO HARMONIOSO EM BLOCOS CURTOS (MÁX ~48 CARACTERES)
      function splitTextIntoHarmoniousSubtitleChunks(text, totalStartSec, totalEndSec, maxChars = 48) {
        if (!text) return [];
        const trimmed = text.trim();
        if (trimmed.length <= maxChars) {
          return [{ text: trimmed, timeStart: totalStartSec, timeEnd: totalEndSec }];
        }

        const clauses = trimmed.split(/([.,?!;:]+)/).filter(Boolean);
        let chunks = [];
        let current = '';

        for (let i = 0; i < clauses.length; i++) {
          const part = clauses[i];
          if ((current + part).length <= maxChars) {
            current += part;
          } else {
            if (current.trim()) chunks.push(current.trim());
            if (part.trim().length > maxChars) {
              const words = part.trim().split(' ');
              let wordChunk = '';
              for (const w of words) {
                if ((wordChunk + ' ' + w).length <= maxChars) {
                  wordChunk += (wordChunk ? ' ' : '') + w;
                } else {
                  if (wordChunk.trim()) chunks.push(wordChunk.trim());
                  wordChunk = w;
                }
              }
              if (wordChunk.trim()) current = wordChunk.trim();
              else current = '';
            } else {
              current = part.trim();
            }
          }
        }
        if (current.trim()) chunks.push(current.trim());
        if (chunks.length === 0) chunks = [trimmed];

        const totalDuration = Math.max(chunks.length * 2, totalEndSec - totalStartSec);
        const totalLength = chunks.reduce((sum, c) => sum + c.length, 0) || 1;
        let runningStart = totalStartSec;

        return chunks.map((chunk, idx) => {
          const chunkDuration = Math.max(1.8, (chunk.length / totalLength) * totalDuration);
          const start = runningStart;
          const end = idx === chunks.length - 1 ? Math.max(start + 1.8, totalEndSec) : start + chunkDuration;
          runningStart = end + 0.1;
          return {
            text: chunk,
            timeStart: start,
            timeEnd: end
          };
        });
      }

      async function translateAndAddReceiverSentenceClean(originalText, startSec, endSec) {
        let translatedText = '';
        try {
          const targetCode = (selectedTargetLanguage || 'en-US').split('-')[0] || 'en';
          const sourceCode = (selectedSourceLanguage || 'pt-BR').split('-')[0] || 'auto';
          const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceCode}&tl=${targetCode}&dt=t&q=${encodeURIComponent(originalText)}`);
          const data = await res.json();
          if (Array.isArray(data) && Array.isArray(data[0])) {
            translatedText = data[0].map(item => item[0]).join('');
          }
        } catch(e) {
          console.warn('Aviso na tradução do receptor:', e);
        }

        if (!translatedText) translatedText = originalText;
        const chunks = splitTextIntoHarmoniousSubtitleChunks(translatedText, startSec, endSec, 48);
        chunks.forEach(c => {
          addReceiverSentenceClean(c.text, c.timeStart, c.timeEnd, false);
        });
      }

      // ========================================================
      // CONVERSÃO DE ÁUDIO PARA MP3 (LAMEJS) & EXPORTAÇÃO ZIP
      // ========================================================
      async function convertAudioBlobToMp3(audioBlob) {
        if (!audioBlob || audioBlob.size === 0) return audioBlob;
        if (typeof lamejs === 'undefined') {
          console.warn('lamejs não disponível, usando blob original.');
          return audioBlob;
        }

        try {
          const arrayBuffer = await audioBlob.arrayBuffer();
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

          const numChannels = audioBuffer.numberOfChannels;
          const sampleRate = audioBuffer.sampleRate;
          const mp3encoder = new lamejs.Mp3Encoder(numChannels, sampleRate, 128);
          const mp3Data = [];

          if (numChannels === 1) {
            const samples = audioBuffer.getChannelData(0);
            const sampleBlockSize = 1152;
            const sample16 = new Int16Array(samples.length);
            for (let i = 0; i < samples.length; i++) {
              const s = Math.max(-1, Math.min(1, samples[i]));
              sample16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            for (let i = 0; i < sample16.length; i += sampleBlockSize) {
              const chunk = sample16.subarray(i, i + sampleBlockSize);
              const mp3buf = mp3encoder.encodeBuffer(chunk);
              if (mp3buf.length > 0) mp3Data.push(mp3buf);
            }
          } else {
            const left = audioBuffer.getChannelData(0);
            const right = audioBuffer.getChannelData(1);
            const sampleBlockSize = 1152;
            const left16 = new Int16Array(left.length);
            const right16 = new Int16Array(right.length);
            for (let i = 0; i < left.length; i++) {
              const sl = Math.max(-1, Math.min(1, left[i]));
              const sr = Math.max(-1, Math.min(1, right[i]));
              left16[i] = sl < 0 ? sl * 0x8000 : sl * 0x7FFF;
              right16[i] = sr < 0 ? sr * 0x8000 : sr * 0x7FFF;
            }
            for (let i = 0; i < left16.length; i += sampleBlockSize) {
              const leftChunk = left16.subarray(i, i + sampleBlockSize);
              const rightChunk = right16.subarray(i, i + sampleBlockSize);
              const mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
              if (mp3buf.length > 0) mp3Data.push(mp3buf);
            }
          }

          const endBuf = mp3encoder.flush();
          if (endBuf.length > 0) mp3Data.push(endBuf);

          return new Blob(mp3Data, { type: 'audio/mp3' });
        } catch(err) {
          console.warn('Erro ao converter para MP3, mantendo áudio original:', err);
          return audioBlob;
        }
      }

      function formatSrtTime(sec) {
        const pad = (n, z = 2) => String(Math.floor(n)).padStart(z, '0');
        const h = pad(sec / 3600);
        const m = pad((sec % 3600) / 60);
        const s = pad(sec % 60);
        const ms = pad((sec % 1) * 1000, 3);
        return `${h}:${m}:${s},${ms}`;
      }

      function buildSrtWithTimestamps(items, fallbackTitle) {
        if (!items || items.length === 0) {
          return `1\n00:00:01,000 --> 00:00:04,500\n[${fallbackTitle}] Sessão Brain Audiovisual.\n`;
        }
        let refinedItems = [];
        items.forEach(it => {
          const sub = splitTextIntoHarmoniousSubtitleChunks(it.text, it.timeStart, it.timeEnd, 48);
          refinedItems.push(...sub);
        });

        const sorted = [...refinedItems].sort((a, b) => (a.timeStart || 0) - (b.timeStart || 0));
        return sorted.map((item, idx) => {
          const start = item.timeStart || (idx * 3);
          const end = item.timeEnd || (start + Math.max(2, item.text.length * 0.08));
          return `${idx + 1}\n${formatSrtTime(start)} --> ${formatSrtTime(end)}\n${item.text}\n`;
        }).join('\n');
      }

      function buildVttWithTimestamps(items, fallbackTitle) {
        return 'WEBVTT\n\n' + buildSrtWithTimestamps(items, fallbackTitle).replace(/,/g, '.');
      }

      function buildFullTxtReport() {
        const dateNow = new Date().toLocaleString('pt-BR');
        let txt = `============================================================\n`;
        txt += `BRAIN AUDIOVISUAL — TRANSCRIÇÃO & GRAVAÇÃO DA SESSÃO\n`;
        txt += `Reunião: ${meeting.title || 'Transmissão Ao Vivo'}\n`;
        txt += `Data: ${dateNow}\n`;
        txt += `Duração Total: ${formatDuration(sessionElapsedSeconds)}\n`;
        txt += `Palestrante: ${accTransmitter.email} [${selectedSourceLanguage}]\n`;
        txt += `Tradução: ${accReceiver.email} [${selectedTargetLanguage}]\n`;
        txt += `============================================================\n\n`;

        txt += `--- TRANSCRIÇÃO DO PALESTRANTE ---\n`;
        const sortedTrans = [...transmitterTranscriptions].sort((a, b) => (a.timeStart || 0) - (b.timeStart || 0));
        sortedTrans.forEach(it => {
          txt += `[${formatSrtTime(it.timeStart || 0)}] ${it.text}\n`;
        });

        txt += `\n--- TRANSCRIÇÃO DA TRADUÇÃO ---\n`;
        const sortedRec = [...receiverTranscriptions].sort((a, b) => (a.timeStart || 0) - (b.timeStart || 0));
        sortedRec.forEach(it => {
          txt += `[${formatSrtTime(it.timeStart || 0)}] ${it.text}\n`;
        });

        return txt;
      }

      window.saveZipFileWithExplorer = async function() {
        const btn = document.getElementById('btn-save-zip-explorer');
        if (btn) {
          btn.disabled = true;
          btn.innerHTML = '<span class="w-4 h-4 rounded-full bg-white animate-spin mr-2"></span><span>Convertendo canais de áudio para MP3 e gerando ZIP...</span>';
        }

        try {
          if (typeof JSZip === 'undefined') {
            throw new Error('Biblioteca JSZip carregando... Tente novamente em 2 segundos.');
          }

          const zip = new JSZip();
          const safeTitle = (meeting.title || 'Reuniao').replace(/[^a-zA-Z0-9_-]/g, '_');
          const dateStr = new Date().toISOString().slice(0, 10);

          const audioTransName = `Audio_Transmissor_${safeTitle}_${dateStr}.mp3`;
          const audioRecName = `Audio_Receptor_${safeTitle}_${dateStr}.mp3`;
          const srtTransName = `Legenda_Transmissor_Original_${safeTitle}_${dateStr}.srt`;
          const vttTransName = `Legenda_Transmissor_Original_${safeTitle}_${dateStr}.vtt`;
          const srtRecName = `Legenda_Receptor_Traduzido_${safeTitle}_${dateStr}.srt`;
          const vttRecName = `Legenda_Receptor_Traduzido_${safeTitle}_${dateStr}.vtt`;
          const txtReportName = `Transcricao_Completa_${safeTitle}_${dateStr}.txt`;
          const zipFileName = `Gravacao_${safeTitle}_${dateStr}.zip`;

          const rawTransAudio = transmitterRecordedBlob || new Blob(transmitterAudioChunks.length ? transmitterAudioChunks : ['[Audio Palestrante Vazio]'], { type: 'audio/webm' });
          const rawRecAudio = receiverRecordedBlob || new Blob(receiverAudioChunks.length ? receiverAudioChunks : ['[Audio Traduzido Vazio]'], { type: 'audio/webm' });

          const transMp3Blob = await convertAudioBlobToMp3(rawTransAudio);
          const recMp3Blob = await convertAudioBlobToMp3(rawRecAudio);

          const srtTransContent = buildSrtWithTimestamps(transmitterTranscriptions, 'Palestrante');
          const vttTransContent = buildVttWithTimestamps(transmitterTranscriptions, 'Palestrante');
          const srtRecContent = buildSrtWithTimestamps(receiverTranscriptions, 'Tradução');
          const vttRecContent = buildVttWithTimestamps(receiverTranscriptions, 'Tradução');
          const txtContent = buildFullTxtReport();

          zip.file(audioTransName, transMp3Blob);
          zip.file(audioRecName, recMp3Blob);
          zip.file(srtTransName, srtTransContent);
          zip.file(vttTransName, vttTransContent);
          zip.file(srtRecName, srtRecContent);
          zip.file(vttRecName, vttRecContent);
          zip.file(txtReportName, txtContent);

          const zipBlob = await zip.generateAsync({ type: 'blob' });

          if ('showSaveFilePicker' in window) {
            try {
              const handle = await window.showSaveFilePicker({
                suggestedName: zipFileName,
                types: [{
                  description: 'Pacote ZIP com Áudios MP3 e Legendas (*.zip)',
                  accept: { 'application/zip': ['.zip'] }
                }]
              });
              const writable = await handle.createWritable();
              await writable.write(zipBlob);
              await writable.close();

              alert(`✅ Sucesso!\n\nO pacote "${zipFileName}" com áudios em MP3 e legendas curtas foi salvo com sucesso!`);
              appendSystemLog(`📁 Pacote ZIP salvo no computador: ${zipFileName}`);
              return;
            } catch(e) {
              if (e.name === 'AbortError') return;
            }
          }

          const url = URL.createObjectURL(zipBlob);
          const a = document.createElement('a');
          a.href = url;
          a.download = zipFileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          alert(`✅ Pacote ZIP "${zipFileName}" com áudios em MP3 baixado com sucesso!`);
        } catch(err) {
          alert('Erro ao gerar o pacote ZIP: ' + err.message);
        } finally {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<span>📁 Escolher Pasta e Salvar Pacote ZIP com MP3 (Abre o Explorer)</span>';
          }
        }
      };

      function initOutputAudioVisualizer() {
        const container = document.getElementById('spectrum-bars');
        if (!container) return;
        container.innerHTML = '';
        const numBars = 28;
        for (let i = 0; i < numBars; i++) {
          const bar = document.createElement('div');

      // Loop do Modulador Visual de Saída & VU Meter do Canal Receptor
      setInterval(() => {
        const container = document.getElementById('spectrum-bars');
        const statusText = document.getElementById('spectrum-status-text');
        const recVuBar = document.getElementById('receiver-vu-bar');
        const recVuText = document.getElementById('receiver-vu-text');
        const recVuLed = document.getElementById('receiver-vu-led');
        if (!container) return;
        const bars = container.children;
        const numBars = bars.length;

        let receiverEnergy = 0;

        // Medição em tempo real do sinal que realmente entra/sai do canal receptor
        if (isReceiverAudioCaptureActive && receiverAnalyserNode) {
          const freqData = new Uint8Array(receiverAnalyserNode.frequencyBinCount);
          receiverAnalyserNode.getByteFrequencyData(freqData);
          let sum = 0;
          for (let i = 0; i < freqData.length; i++) sum += freqData[i];
          const avg = sum / freqData.length;
          receiverEnergy = isReceiverMuted ? 0 : (avg / 115) * 100 * (volume / 100);

          // Animação espectral de frequências reais
          const step = Math.max(1, Math.floor(freqData.length / numBars));
          for (let i = 0; i < numBars; i++) {
            const val = isReceiverMuted ? 0 : freqData[i * step] || 0;
            const h = Math.max(4, Math.min(100, Math.round((val / 255) * 100 * (volume / 100))));
            bars[i].style.height = h + '%';
          }
        }

        const levelPct = Math.min(100, Math.round(receiverEnergy));
        if (recVuBar) {
          recVuBar.style.width = levelPct + '%';
          if (levelPct > 75) recVuBar.className = 'h-full rounded-full transition-all duration-75 bg-rose-500 shadow-xs';
          else if (levelPct > 45) recVuBar.className = 'h-full rounded-full transition-all duration-75 bg-amber-400 shadow-xs';
          else recVuBar.className = 'h-full rounded-full transition-all duration-75 bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-400 shadow-xs';
        }
        if (recVuText) recVuText.innerText = levelPct + '%';
        if (recVuLed) {
          recVuLed.className = levelPct > 4 ? 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse' : 'w-2 h-2 rounded-full bg-slate-400';
        }

        if (isReceiverMuted) {
          for (let i = 0; i < numBars; i++) bars[i].style.height = '4%';
          if (statusText) {
            statusText.innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-500"></span> Saída Silenciada (Mute Ativo)';
            statusText.className = 'text-[11px] text-rose-600 flex items-center gap-2 font-medium';

        } else if (isPlayingTestSpeech) {
          for (let i = 0; i < numBars; i++) {
            const randHeight = Math.floor(Math.random() * 85) + 15;
            bars[i].style.height = randHeight + '%';
          }
          if (statusText) {
            statusText.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Reproduzindo Teste de Voz Traduzida (VB-CABLE)';
            statusText.className = 'text-[11px] text-emerald-700 dark:text-emerald-400 flex items-center gap-2 font-medium';
          }
        } else if (isPlayingTestTone) {
          for (let i = 0; i < numBars; i++) {
            const wave = Math.sin((i / numBars) * Math.PI) * 75 + 10;
            bars[i].style.height = wave + '%';
          }
          if (statusText) {
            statusText.innerHTML = '<span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span> Tom Senoidal de Calibração (1kHz Ativo)';
            statusText.className = 'text-[11px] text-indigo-700 dark:text-indigo-400 flex items-center gap-2 font-medium';

        } else if (isReceiverAudioCaptureActive && receiverEnergy > 4) {
          if (statusText) {
            statusText.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Áudio Traduzido em Reprodução (Sinal Detectado ●)';
            statusText.className = 'text-[11px] text-emerald-700 dark:text-emerald-400 flex items-center gap-2 font-medium';

        } else if (isReceiverAudioCaptureActive) {
          for (let i = 0; i < numBars; i++) bars[i].style.height = '4%';
          if (statusText) {
            statusText.innerHTML = '<span class="w-2 h-2 rounded-full bg-slate-400"></span> Canal Receptor em Repouso (Silêncio na reunião)';
            statusText.className = 'text-[11px] text-slate-500 dark:text-slate-400 flex items-center gap-2 font-medium';

        const pctText = document.getElementById('progress-pct-text');
        const badgeEl = document.getElementById('progress-status-badge');

        const currentElapsedInCycle = meetingTotalDuration - countdown;
        const pct = Math.min(100, Math.round((currentElapsedInCycle / meetingTotalDuration) * 100));

        if (progressBar) {
          progressBar.style.width = Math.min(100, Math.max(0, pct)) + '%';
          if (pct < 70) {
            progressBar.className = 'h-full rounded-full transition-all duration-700 bg-gradient-to-r from-emerald-500 via-teal-400 to-emerald-600 shadow-xs';
            if (badgeEl) {
              badgeEl.innerText = 'Sessão Confortável ●';
              badgeEl.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-300';
            }
          } else if (pct < 85) {
            progressBar.className = 'h-full rounded-full transition-all duration-700 bg-gradient-to-r from-amber-400 via-orange-400 to-amber-500 shadow-xs';
            if (badgeEl) {
              badgeEl.innerText = 'Atenção: Próxima Sala ⏱️';
              badgeEl.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-50 text-amber-800 border border-amber-300';
            }
          } else {
            progressBar.className = 'h-full rounded-full transition-all duration-700 bg-gradient-to-r from-rose-500 via-red-500 to-rose-600 shadow-xs animate-pulse';
            if (badgeEl) {
              badgeEl.innerText = '⚠️ HOT-SWAP IMINENTE!';
              badgeEl.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-50 text-rose-700 border border-rose-300 animate-pulse';
            }
          }
        }

        if (elapsedText) elapsedText.innerText = formatDuration(currentElapsedInCycle);
        if (remainingText) remainingText.innerText = formatDuration(Math.max(0, countdown));
        if (pctText) pctText.innerText = pct + '%';

        if (countdown <= 0) {
          if (queueIdx + 1 < queue.length) {
            triggerMonitorHotSwapNow();
          } else {
            countdown = 0;
            if (remainingText) remainingText.innerText = 'Fila Vazia';
          }
        }
      }, 1000);

      function initAutomaticRecordings() {}
    }
  </script>
</body>
</html>
