      // ========================================================
      // ENUMERAÇÃO E CAPTURA DE DISPOSITIVOS DE ÁUDIO
      // ========================================================
      async function refreshAudioDevicesList(forcePrompt = false) {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
          if (forcePrompt) {
            try {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              stream.getTracks().forEach(t => t.stop());
            } catch(e) {}
          }
          const devices = await navigator.mediaDevices.enumerateDevices();
          const audioInputs = devices.filter(d => d.kind === 'audioinput');
          const sel = document.getElementById('transmitter-mic-select');
          if (sel && audioInputs.length > 0) {
            const curVal = sel.value;
            sel.innerHTML = audioInputs.map((d, i) => `
              <option value="${d.deviceId}" ${(curVal === d.deviceId || (i === 0 && curVal === 'default')) ? 'selected' : ''}>
                🎙️ ${d.label || ('Entrada de Microfone ' + (i + 1))}
              </option>
            `).join('');
          }
        } catch(e) {}
      }

      window.onTransmitterMicDeviceSelected = function(deviceId) {
        selectedMicDeviceId = deviceId;
        meeting.inputDevice = deviceId;
        if (isRealMicActive) {
          stopMasterMicCapture();
          setTimeout(startMasterMicCapture, 150);
        }
      };

      // VU METER DO MICROFONE EM TEMPO REAL
      function startMicVuMeterLoop() {
        if (!micAnalyserNode) return;
        const dataArray = new Uint8Array(micAnalyserNode.frequencyBinCount);

        function updateVu() {
          if (!isRealMicActive || !micAnalyserNode) return;
          micAnalyserNode.getByteFrequencyData(dataArray);

          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) {
            sum += dataArray[i];
          }
          const avg = sum / dataArray.length;
          const pct = Math.min(100, Math.round((avg / 128) * 100));

          const bar = document.getElementById('transmitter-vu-bar');
          const text = document.getElementById('transmitter-vu-text');
          const led = document.getElementById('transmitter-vu-led');

          if (bar) bar.style.width = pct + '%';
          if (text) text.innerText = pct + '%';
          if (led) {
            led.className = pct > 4 ? 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse' : 'w-2 h-2 rounded-full bg-slate-400';
          }

          micVuAnimFrameId = requestAnimationFrame(updateVu);
        }
        micVuAnimFrameId = requestAnimationFrame(updateVu);
      }

      window.toggleMasterMicCapture = async function() {
        if (!isRealMicActive) {
          await startMasterMicCapture();
        } else {
          stopMasterMicCapture();
        }
      };

      async function startMasterMicCapture() {
        const select = document.getElementById('transmitter-mic-select');
        const targetDeviceId = select ? select.value : selectedMicDeviceId;
        const constraints = {
          audio: (targetDeviceId && targetDeviceId !== 'default') 
            ? { deviceId: { exact: targetDeviceId }, echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
            : { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        };

        try {
          if (micMediaStream) micMediaStream.getTracks().forEach(t => t.stop());
          micMediaStream = await navigator.mediaDevices.getUserMedia(constraints);
          await refreshAudioDevicesList();

          if (!micAudioContext || micAudioContext.state === 'closed') {
            micAudioContext = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (micAudioContext.state === 'suspended') await micAudioContext.resume();

          const source = micAudioContext.createMediaStreamSource(micMediaStream);
          micAnalyserNode = micAudioContext.createAnalyser();
          micAnalyserNode.fftSize = 256;
          micAnalyserNode.smoothingTimeConstant = 0.35;
          source.connect(micAnalyserNode);

          isRealMicActive = true;

          const btn = document.getElementById('btn-toggle-mic-master');
          if (btn) {
            btn.innerHTML = '<span>⏹️ Pausar Microfone</span>';
            btn.className = 'flex-1 py-2 px-3 rounded-xl text-xs font-bold transition-all shadow-xs cursor-pointer flex items-center justify-center gap-1.5 bg-rose-600 hover:bg-rose-700 text-white';
          }

          startMicVuMeterLoop();

          // Gravação do áudio do microfone do palestrante
          try {
            transmitterAudioChunks = [];
            micMediaRecorder = new MediaRecorder(micMediaStream);
            micMediaRecorder.ondataavailable = (e) => {
              if (e.data.size > 0) transmitterAudioChunks.push(e.data);
            };
            micMediaRecorder.onstop = () => {
              transmitterRecordedBlob = new Blob(transmitterAudioChunks, { type: 'audio/webm' });
            };
            micMediaRecorder.start(1000);
            isRecordingTransmitter = true;
          } catch(e) {}

          // Inicia reconhecimento contínuo de fala
          startContinuousSpeechTranscription();
        } catch(err) {
          alert('Erro ao ativar microfone: ' + err.message + '\n\nCertifique-se de que o dispositivo está conectado e que o navegador possui permissão.');
        }
      }

      function stopMasterMicCapture() {
        if (micMediaStream) {
          micMediaStream.getTracks().forEach(t => t.stop());
          micMediaStream = null;
        }
        if (micAudioContext && micAudioContext.state !== 'closed') {
          micAudioContext.close().catch(() => {});
        }
        if (micMediaRecorder && micMediaRecorder.state !== 'inactive') {
          try { micMediaRecorder.stop(); } catch(e) {}
        }
        isRealMicActive = false;

        const btn = document.getElementById('btn-toggle-mic-master');
        if (btn) {
          btn.innerHTML = '<span>🎙️ Ativar Microfone & Transcrição</span>';
          btn.className = 'flex-1 py-2 px-3 rounded-xl text-xs font-bold transition-all shadow-xs cursor-pointer flex items-center justify-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white';
        }

        const bar = document.getElementById('transmitter-vu-bar');
        const text = document.getElementById('transmitter-vu-text');
        const led = document.getElementById('transmitter-vu-led');
        if (bar) bar.style.width = '0%';
        if (text) text.innerText = '0%';
        if (led) led.className = 'w-2 h-2 rounded-full bg-slate-400';

        safelyDestroySpeechRecognizer();
      }

      window.toggleTransmitterMicMute = function() {
        if (!micMediaStream) return;
        isTransmitterMicMuted = !isTransmitterMicMuted;
        micMediaStream.getAudioTracks().forEach(t => { t.enabled = !isTransmitterMicMuted; });
        const icon = document.getElementById('icon-mute-transmitter');
        if (icon) {
          icon.innerText = isTransmitterMicMuted ? '🔇 Mutado' : '🎤 Som Aberto';
        }
      };

      // ========================================================
      // MOTOR DE TRANSCRIÇÃO CONTÍNUA COM AS DUAS CORREÇÕES
      // ========================================================
      let speechLongInterimTimer = null;
      let lastProcessedFinalIndex = -1;

      function safelyDestroySpeechRecognizer() {
        if (speechLongInterimTimer) {
          clearTimeout(speechLongInterimTimer);
          speechLongInterimTimer = null;
        }
        lastProcessedFinalIndex = -1;

        if (speechRecognizer) {
          try {
            speechRecognizer.onstart = null;
            speechRecognizer.onaudiostart = null;
            speechRecognizer.onresult = null;
            speechRecognizer.onerror = null;
            speechRecognizer.onend = null;
            speechRecognizer.abort();
          } catch(e) {}
          speechRecognizer = null;
        }
        isTranscribingSpeech = false;
        updateSpeechStatusIndicator(false);
      }

      function updateSpeechStatusIndicator(isActive) {
        const dot = document.getElementById('transmitter-speech-dot');
        const text = document.getElementById('transmitter-speech-text');
        const ind = document.getElementById('transmitter-speech-indicator');
        if (dot && text && ind) {
          if (isActive) {
            dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse';
            text.innerText = 'Ouvindo Fala ●';
            ind.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-700 flex items-center gap-1';
          } else {
            dot.className = 'w-1.5 h-1.5 rounded-full bg-slate-400';
            text.innerText = 'Aguardando Voz';
            ind.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400 border border-slate-300 dark:border-slate-700 flex items-center gap-1';
          }
        }
      }

      function scheduleSpeechRestart(delay = 150) {
        if (speechRecognizerRestartTimeout) clearTimeout(speechRecognizerRestartTimeout);
        speechRecognizerRestartTimeout = setTimeout(() => {
          if (isRealMicActive && !isTimerPaused) {
            startContinuousSpeechTranscription();
          }
        }, delay);
      }

      // Watchdog de integridade: reinicia recognizer apenas se inativo por mais de 20s
      if (speechWatchdogInterval) clearInterval(speechWatchdogInterval);
      speechWatchdogInterval = setInterval(() => {
        if (isRealMicActive && !isTimerPaused) {
          const idleTime = Date.now() - lastSpeechActivityTimestamp;
          if (!isTranscribingSpeech || idleTime > 20000) {
            safelyDestroySpeechRecognizer();
            startContinuousSpeechTranscription();
          }
        }
      }, 5000);

      function startContinuousSpeechTranscription() {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          console.warn('SpeechRecognition não suportado no navegador.');
          return;
        }

        if (isStartingSpeechRecognition) return;
        isStartingSpeechRecognition = true;
        setTimeout(() => { isStartingSpeechRecognition = false; }, 2000);

        safelyDestroySpeechRecognizer();

        setTimeout(() => {
          try {
            const recognizer = new SpeechRec();
            speechRecognizer = recognizer;
            recognizer.continuous = true;
            recognizer.interimResults = true;
            recognizer.lang = selectedSourceLanguage || 'pt-BR';
            recognizer.maxAlternatives = 1;

            recognizer.onstart = () => {
              isStartingSpeechRecognition = false;
              isTranscribingSpeech = true;
              lastSpeechActivityTimestamp = Date.now();
              lastProcessedFinalIndex = -1;
              updateSpeechStatusIndicator(true);
            };

            recognizer.onaudiostart = () => {
              lastSpeechActivityTimestamp = Date.now();
            };

            recognizer.onresult = (event) => {
              lastSpeechActivityTimestamp = Date.now();
              const interimEl = document.getElementById('transmitter-interim-text');
              let latestInterim = '';

              for (let i = event.resultIndex; i < event.results.length; i++) {
                const res = event.results[i];
                if (!res || !res[0]) continue;

                if (res.isFinal) {
                  // Processa estritamente UMA VEZ cada resultado finalizado pelo motor do navegador
                  if (i > lastProcessedFinalIndex) {
                    lastProcessedFinalIndex = i;
                    const finalPhrase = (res[0].transcript || '').trim();
                    if (finalPhrase) {
                      commitSpeechSentence(finalPhrase);
                    }
                  }
                } else {
                  latestInterim = (res[0].transcript || '').trim();
                }
              }

              // Exibição provisória em tempo real no terminal do palestrante
              if (interimEl) {
                if (latestInterim) {
                  interimEl.style.display = 'block';
                  interimEl.innerText = '● ' + latestInterim;
                  interimEl.style.color = transSubtitleConfig.textColor;
                } else {
                  interimEl.innerText = '';
                  interimEl.style.display = 'none';
                }
              }

              // GESTÃO INTELIGENTE DE CORTES SEM REPETIÇÃO:
              // Se o texto acumulado provisório passar de 80 caracteres e houver uma pausa de respiração (> 650ms),
              // encerramos o recognizer com stop(). Isso força o Chrome a emitir isFinal com a frase limpa
              // e a reiniciar do zero, garantindo zero repetição de buffer!
              if (speechLongInterimTimer) clearTimeout(speechLongInterimTimer);
              if (latestInterim && latestInterim.length > 80) {
                speechLongInterimTimer = setTimeout(() => {
                  try {
                    if (speechRecognizer && isTranscribingSpeech) {
                      speechRecognizer.stop();
                    }
                  } catch(e) {}
                }, 650);
              }
            };

            recognizer.onerror = (e) => {
              isStartingSpeechRecognition = false;
              if (e.error === 'not-allowed') {
                isRealMicActive = false;
                stopMasterMicCapture();
                alert('Permissão de microfone negada. Clique no cadeado na barra de endereços para permitir.');
              } else {
                scheduleSpeechRestart(300);
              }
            };

            recognizer.onend = () => {
              isStartingSpeechRecognition = false;
              isTranscribingSpeech = false;
              updateSpeechStatusIndicator(false);
              const interimEl = document.getElementById('transmitter-interim-text');
              if (interimEl) { interimEl.innerText = ''; interimEl.style.display = 'none'; }

              if (isRealMicActive && !isTimerPaused) {
                scheduleSpeechRestart(80);
              }
            };

            recognizer.start();
          } catch(e) {
            isStartingSpeechRecognition = false;
            scheduleSpeechRestart(400);
          }
        }, 60);
      }

      window.changeSpeakerSourceLanguage = function(newLang) {

      // COMMIT DE SENTENÇA E TRADUÇÃO MULTILÍNGUE PARALELA
      let committedHistory = [];

      async function commitSpeechSentence(rawText) {
        if (!rawText || !rawText.trim()) return;
        let clean = rawText.trim().replace(/\s+/g, ' ');
        if (clean.length < 2) return;

        const now = Date.now();
        const cleanLower = clean.toLowerCase();

        // 1. Limpa histórico com mais de 20 segundos
        committedHistory = committedHistory.filter(h => now - h.time < 20000);

        // 2. Se for IDÊNTICA a qualquer frase dita nos últimos 20 segundos: descarta
        if (committedHistory.some(h => h.text === cleanLower)) {
          return;
        }

        // 3. Se a frase for uma repetição de prefixo da frase anterior, extrai somente a novidade
        if (committedHistory.length > 0) {
          const lastEntry = committedHistory[committedHistory.length - 1];
          if (cleanLower.startsWith(lastEntry.text) && cleanLower.length > lastEntry.text.length) {
            clean = clean.substring(lastEntry.text.length).trim();
          } else {
            // Verifica sobreposição de palavras (ex: últimas 2 ou 3 palavras da anterior repetidas no início desta)
            const prevWords = lastEntry.text.split(' ');
            const currWords = clean.toLowerCase().split(' ');
            for (let w = Math.min(5, prevWords.length, currWords.length); w >= 2; w--) {
              const prevTail = prevWords.slice(-w).join(' ');
              const currHead = currWords.slice(0, w).join(' ');
              if (prevTail === currHead) {
                clean = clean.split(' ').slice(w).join(' ').trim();
                break;
              }
            }
          }
        }

        if (!clean || clean.length < 2) return;

        // Se após remoção de sobreposição ainda constar no histórico recente, descarta
        if (committedHistory.some(h => h.text === clean.toLowerCase())) {
          return;
        }

        committedHistory.push({ text: clean.toLowerCase(), time: now });
        if (committedHistory.length > 25) committedHistory.shift();

        // Quebra frases muito longas (> 110 caracteres) em orações naturais por pontuação
        const sentenceParts = splitLongSentenceNaturally(clean);

        for (const part of sentenceParts) {
          if (!part || !part.trim()) continue;
          const trimmedPart = part.trim();
          const startSec = sessionElapsedSeconds;
          const endSec = startSec + Math.max(2.0, trimmedPart.length * 0.08);

          // 1. Registra no terminal do Palestrante (sem timestamps na tela)
          addTransmitterSentenceClean(trimmedPart, startSec, endSec);

          // 2. Dispara tradução em paralelo para cada idioma de saída da reunião
          activeTargetLanguages.forEach(targetLang => {
            translateAndDispatchTargetSentence(trimmedPart, targetLang, startSec, endSec);
          });
        }
      }

      function splitLongSentenceNaturally(text) {
        if (!text || text.length <= 110) return [text];
        const regex = /([^.,;!?]+[.,;!?]+|[^.,;!?]+$)/g;
        const matches = text.match(regex);
        if (!matches || matches.length <= 1) return [text];

        let result = [];
        let currentChunk = '';
        for (const m of matches) {
          if ((currentChunk + ' ' + m).trim().length > 100 && currentChunk) {
            result.push(currentChunk.trim());
            currentChunk = m;
          } else {
            currentChunk = currentChunk ? (currentChunk + ' ' + m) : m;
          }
        }
        if (currentChunk.trim()) result.push(currentChunk.trim());
        return result.length > 0 ? result : [text];
      }

      function addTransmitterSentenceClean(text, startSec, endSec) {
        transmitterTranscriptions.push({ text: text, timeStart: startSec, timeEnd: endSec });

      async function translateAndDispatchTargetSentence(originalText, targetLang, startSec, endSec) {
        if (!originalText || !originalText.trim()) return;
        const clean = originalText.trim();
        const sourceCode = (selectedSourceLanguage || 'pt-BR').split('-')[0].toLowerCase();
        const targetCode = targetLang.split('-')[0].toLowerCase();

        if (sourceCode === targetCode) {
          addTargetSentenceClean(targetLang, clean, startSec, endSec);
          return;
        }

        let translated = '';
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 3500);
          const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceCode}&tl=${targetCode}&dt=t&q=${encodeURIComponent(clean)}`, {
            signal: controller.signal
          });
          clearTimeout(timeoutId);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && Array.isArray(data[0])) {
              translated = data[0].map(item => item[0]).join('');
            }
          }
        } catch(e) {}

        if (!translated) {
          try {
            const controller2 = new AbortController();
            const timeoutId2 = setTimeout(() => controller2.abort(), 2500);
            const res2 = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean)}&langpair=${sourceCode}|${targetCode}`, {
              signal: controller2.signal
            });
            clearTimeout(timeoutId2);
            if (res2.ok) {
              const data2 = await res2.json();
              if (data2 && data2.responseData && data2.responseData.translatedText) {
                translated = data2.responseData.translatedText;
              }
            }
          } catch(e2) {}
        }

        if (translated && translated.trim()) {
          addTargetSentenceClean(targetLang, translated.trim(), startSec, endSec);
        }
      }

      function addTargetSentenceClean(targetLang, text, startSec, endSec) {
        if (!text || !text.trim()) return;
        const clean = text.trim();
        if (!targetTranscriptions[targetLang]) targetTranscriptions[targetLang] = [];
        targetTranscriptions[targetLang].push({ text: clean, timeStart: startSec, timeEnd: endSec });

        const els = getTargetColumnElements(targetLang);
        const cfg = targetColumnConfigs[targetLang] || { textColor: '#fde047' };

        if (els.feed) {
          const empty = els.feed.querySelector('.placeholder-empty');
          if (empty) empty.remove();

          const div = document.createElement('div');
          div.className = 'text-sm leading-relaxed p-1.5 rounded-lg border-b border-white/5 transition-all';
          div.style.color = cfg.textColor;
          // SEM TIMESTAMP - apenas o texto traduzido limpo
          div.innerHTML = `<span>${clean}</span>`;

          els.feed.insertBefore(div, els.feed.firstChild);
          if (els.box) els.box.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Broadcast nos canais padrão (única transmissão desduplicada)
        const targetCode = targetLang.split('-')[0].toLowerCase();
        broadcastSubtitleGlobally(targetCode, clean, startSec, endSec);
        if (targetCode === 'en') broadcastSubtitleGlobally('receiver', clean, startSec, endSec);
        if (targetCode === 'es') broadcastSubtitleGlobally('spanish', clean, startSec, endSec);

        // Feedback visual do canal de áudio traduzido no Cockpit (VU Meter)
        triggerTargetAudioMeter(targetLang, Math.max(3000, clean.length * 90));

        // Pre-fetch silencioso do chunk de áudio em MP3 para gravação final (faixas feminina e masculina)
        fetchAudioChunkForExport(targetLang, clean);
      }

      function triggerTargetAudioMeter(targetLang, durationMs) {
        const langCode = (targetLang || '').split('-')[0].toLowerCase();
        const duration = durationMs || 3000;
        const until = Date.now() + duration;
        targetMeterStates[targetLang] = { activeUntil: until };
        targetMeterStates[langCode] = { activeUntil: until };
      }

      async function fetchAudioChunkForExport(targetLang, text) {
        if (!text || !text.trim()) return null;
        const clean = text.trim();
        try {
          const targetCode = targetLang.split('-')[0].toLowerCase();
          const encoded = encodeURIComponent(clean);
          // Roteia via tts.php (mesmo domínio ou absoluto) com cabeçalhos CORS liberados
          const candidateUrls = [
            `/tts.php?tl=${targetCode}&q=${encoded}`,
            `https://brainaudiovisual.com.br/tts.php?tl=${targetCode}&q=${encoded}`
          ];

          let blob = null;
          for (const url of candidateUrls) {
            try {
              const res = await fetch(url);
              if (res.ok) {
                const b = await res.blob();
                if (b && b.size > 200) {
                  blob = b;
                  break;
                }
              }
            } catch(fetchErr) {}
          }

          if (blob) {
            if (!targetAudioBlobs[targetLang]) targetAudioBlobs[targetLang] = [];
            targetAudioBlobs[targetLang].push(blob);

            // Faixas de áudio dedicadas para exportação (feminina Sofia e masculina Arthur)
            if (!targetAudioBlobsFemale[targetLang]) targetAudioBlobsFemale[targetLang] = [];
            targetAudioBlobsFemale[targetLang].push(blob);

            if (!targetAudioBlobsMale[targetLang]) targetAudioBlobsMale[targetLang] = [];
            targetAudioBlobsMale[targetLang].push(blob);
            return blob;
          }
        } catch(e) {
          console.warn('Erro ao obter chunk de áudio traduzido:', e);
        }
        return null;
      }

      function formatVttTime(sec) {
        const pad = (n, z = 2) => String(Math.floor(n)).padStart(z, '0');
        const h = pad(sec / 3600);
        const m = pad((sec % 3600) / 60);
        const s = pad(sec % 60);
        const ms = pad((sec % 1) * 1000, 3);
        return `${h}:${m}:${s}.${ms}`;
      }

      function buildVttString(items, title) {
        let vtt = 'WEBVTT\n\nNOTE Brain Audiovisual - ' + title + '\n\n';
        if (!items || items.length === 0) {
          return vtt + '1\n00:00:01.000 --> 00:00:04.000\n[' + title + '] Transmissão Brain Audiovisual.\n';
        }
        const sorted = [...items].sort((a, b) => (a.timeStart || 0) - (b.timeStart || 0));
        sorted.forEach((item, idx) => {
          const start = item.timeStart || (idx * 3);
          const end = item.timeEnd || (start + Math.max(2.2, item.text.length * 0.08));
          vtt += `${idx + 1}\n${formatVttTime(start)} --> ${formatVttTime(end)}\n${item.text}\n\n`;
        });
        return vtt;
      }

      // UTILITÁRIOS DE CODIFICAÇÃO E CONVERSÃO PARA MP3 (LAMEJS)
      function generateValidSilentMp3(seconds = 2) {
        if (typeof lamejs !== 'undefined') {
          try {
            const sampleRate = 44100;
            const numSamples = Math.round(sampleRate * Math.max(1, seconds));
            const mp3encoder = new lamejs.Mp3Encoder(1, sampleRate, 128);
            const sampleBlockSize = 1152;
            const silence = new Int16Array(sampleBlockSize);
            const mp3Data = [];

            for (let i = 0; i < numSamples; i += sampleBlockSize) {
              const mp3buf = mp3encoder.encodeBuffer(silence);
              if (mp3buf && mp3buf.length > 0) mp3Data.push(mp3buf);
            }
            const endBuf = mp3encoder.flush();
            if (endBuf && endBuf.length > 0) mp3Data.push(endBuf);
            return new Blob(mp3Data, { type: 'audio/mp3' });
          } catch(e) {}
        }
        return new Blob([new Uint8Array([0xff, 0xfb, 0x90, 0x64])], { type: 'audio/mp3' });
      }

      async function convertAudioBlobToMp3(audioBlob) {
        if (!audioBlob || audioBlob.size === 0) {
          return generateValidSilentMp3(2);
        }
        if (typeof lamejs === 'undefined') {
          console.warn('lamejs não disponível no navegador');
          return audioBlob;
        }

        try {
          const arrayBuffer = await audioBlob.arrayBuffer();
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

          const numChannels = audioBuffer.numberOfChannels;
          const sampleRate = audioBuffer.sampleRate;
          const mp3encoder = new lamejs.Mp3Encoder(numChannels, sampleRate, 128);
          const mp3Data = [];

          if (numChannels === 1) {
            const samples = audioBuffer.getChannelData(0);
            const sampleBlockSize = 1152;
            const sample16 = new Int16Array(samples.length);
            for (let i = 0; i < samples.length; i++) {
              const s = Math.max(-1, Math.min(1, samples[i]));
              sample16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            for (let i = 0; i < sample16.length; i += sampleBlockSize) {
              const chunk = sample16.subarray(i, i + sampleBlockSize);
              const mp3buf = mp3encoder.encodeBuffer(chunk);
              if (mp3buf.length > 0) mp3Data.push(mp3buf);
            }
          } else {
            const left = audioBuffer.getChannelData(0);
            const right = audioBuffer.getChannelData(1);
            const sampleBlockSize = 1152;
            const left16 = new Int16Array(left.length);
            const right16 = new Int16Array(right.length);
            for (let i = 0; i < left.length; i++) {
              const sl = Math.max(-1, Math.min(1, left[i]));
              const sr = Math.max(-1, Math.min(1, right[i]));
              left16[i] = sl < 0 ? sl * 0x8000 : sl * 0x7FFF;
              right16[i] = sr < 0 ? sr * 0x8000 : sr * 0x7FFF;
            }
            for (let i = 0; i < left16.length; i += sampleBlockSize) {
              const leftChunk = left16.subarray(i, i + sampleBlockSize);
              const rightChunk = right16.subarray(i, i + sampleBlockSize);
              const mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
              if (mp3buf.length > 0) mp3Data.push(mp3buf);
            }
          }

          const endBuf = mp3encoder.flush();
          if (endBuf.length > 0) mp3Data.push(endBuf);

          try { await audioCtx.close(); } catch(e) {}

          return new Blob(mp3Data, { type: 'audio/mp3' });
        } catch(err) {
          console.warn('Erro ao converter áudio do palestrante para MP3:', err);
          return generateValidSilentMp3(2);
        }
      }

      window.saveZipFileWithExplorer = async function() {
        const btn = document.getElementById('btn-save-zip-explorer');
        const progressWrapper = document.getElementById('finish-progress-wrapper');
        const progressBar = document.getElementById('finish-progress-bar');
        const progressPct = document.getElementById('finish-progress-pct');
        const progressStatus = document.getElementById('finish-progress-status');

        if (btn) btn.disabled = true;
        if (progressWrapper) progressWrapper.classList.remove('hidden');

        function updateProgress(pct, statusText) {
          if (progressBar) progressBar.style.width = pct + '%';
          if (progressPct) progressPct.innerText = Math.round(pct) + '%';
          if (progressStatus && statusText) progressStatus.innerText = statusText;
        }

        try {
          updateProgress(5, 'Preparando arquivos para gravação...');
          await new Promise(r => setTimeout(r, 50));

          if (typeof JSZip === 'undefined') {
            throw new Error('Biblioteca JSZip carregando... Tente novamente em 2 segundos.');
          }

          const zip = new JSZip();
          const safeTitle = (meeting.title || 'Reuniao').replace(/[^a-zA-Z0-9_-]/g, '_');
          const dateStr = new Date().toISOString().slice(0, 10);
          const zipFileName = `Gravacao_${safeTitle}_${dateStr}.zip`;

          // 1. Garantir que todas as falas traduzidas tenham áudio MP3 gravado
          updateProgress(15, 'Validando e gravando áudios MP3 de todas as falas traduzidas...');
          for (const lang of activeTargetLanguages) {
            const list = targetTranscriptions[lang] || [];
            if (!targetAudioBlobs[lang]) targetAudioBlobs[lang] = [];
            if (targetAudioBlobs[lang].length < list.length) {
              const startIdx = targetAudioBlobs[lang].length;
              for (let i = startIdx; i < list.length; i++) {
                const item = list[i];
                if (item && item.text) {
                  const langInfo = SUPPORTED_LANG_MAP[lang] || { name: lang };
                  updateProgress(15 + Math.round(((i + 1) / list.length) * 15), `Gravando áudio MP3 (${langInfo.name}): ${i + 1} de ${list.length}...`);
                  await fetchAudioChunkForExport(lang, item.text);
                }
              }
            }
          }

          // 2. Áudio Original do Palestrante convertido em MP3 (128kbps)
          updateProgress(35, 'Codificando áudio original do palestrante em MP3 (128kbps)...');
          await new Promise(r => setTimeout(r, 60));

          let rawTransAudio = transmitterRecordedBlob;
          if (!rawTransAudio && transmitterAudioChunks && transmitterAudioChunks.length > 0) {
            rawTransAudio = new Blob(transmitterAudioChunks, { type: 'audio/webm' });
          }

          const speakerMp3Blob = await convertAudioBlobToMp3(rawTransAudio);
          zip.file(`Audio_Palestrante_Original_${safeTitle}.mp3`, speakerMp3Blob);

          // 3. Áudios das Traduções (.mp3) - Faixas Feminina (Sofia) e Masculina (Arthur)
          updateProgress(55, 'Processando faixas traduzidas em MP3 (Sofia e Arthur)...');
          await new Promise(r => setTimeout(r, 60));

          for (const lang of activeTargetLanguages) {
            const info = SUPPORTED_LANG_MAP[lang] || { name: lang };
            const chunks = targetAudioBlobs[lang] || [];
            const femaleChunks = (targetAudioBlobsFemale[lang] && targetAudioBlobsFemale[lang].length > 0) ? targetAudioBlobsFemale[lang] : chunks;
            const maleChunks = (targetAudioBlobsMale[lang] && targetAudioBlobsMale[lang].length > 0) ? targetAudioBlobsMale[lang] : chunks;

            const langBlobFemale = femaleChunks.length > 0 ? new Blob(femaleChunks, { type: 'audio/mp3' }) : generateValidSilentMp3(3);
            const langBlobMale = maleChunks.length > 0 ? new Blob(maleChunks, { type: 'audio/mp3' }) : generateValidSilentMp3(3);

            zip.file(`Audio_${info.name}_${lang}_Voz_Feminina_Sofia_${safeTitle}.mp3`, langBlobFemale);
            zip.file(`Audio_${info.name}_${lang}_Voz_Masculina_Arthur_${safeTitle}.mp3`, langBlobMale);
          }

          // 4. Legendas .VTT para todos os idiomas
          updateProgress(70, 'Gerando legendas VTT com sincronismo...');
          await new Promise(r => setTimeout(r, 60));

          zip.file(`Legenda_Palestrante_Original_${safeTitle}.vtt`, buildVttString(transmitterTranscriptions, 'Palestrante'));
          for (const lang of activeTargetLanguages) {
            const info = SUPPORTED_LANG_MAP[lang] || { name: lang };
            const list = targetTranscriptions[lang] || [];
            zip.file(`Legenda_${info.name}_${lang}_${safeTitle}.vtt`, buildVttString(list, info.name));
          }

          // 5. Log em Texto Completo
          zip.file(`Transcricao_Completa_${safeTitle}.txt`, buildFullTxtLog());

          // 6. Compactação do ZIP com barra de progresso assíncrona não-bloqueante
          updateProgress(80, 'Compactando pacote ZIP sem travamentos...');
          const zipBlob = await zip.generateAsync({ type: 'blob' }, (metadata) => {
            const p = 80 + (metadata.percent * 0.20);
            updateProgress(p, 'Compactando pacote ZIP: ' + Math.round(metadata.percent) + '%');
          });

          updateProgress(100, 'Pronto para salvar!');

          // Salvar com Explorer do Windows (showSaveFilePicker)
          if ('showSaveFilePicker' in window) {
            try {
              const handle = await window.showSaveFilePicker({
                suggestedName: zipFileName,
                types: [{
                  description: 'Pacote ZIP com Áudios e Legendas VTT (*.zip)',
                  accept: { 'application/zip': ['.zip'] }
                }]
              });
              const writable = await handle.createWritable();
              await writable.write(zipBlob);
              await writable.close();
              alert('✅ Sucesso! O pacote "' + zipFileName + '" com todos os áudios e legendas VTT foi salvo com sucesso!');
              return;
            } catch(e) {
              if (e.name === 'AbortError') return;
            }
          }

          // Fallback de download direto
          const url = URL.createObjectURL(zipBlob);
          const a = document.createElement('a');
          a.href = url;
          a.download = zipFileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          alert('✅ Pacote ZIP "' + zipFileName + '" baixado com sucesso!');
        } catch(err) {
          alert('Erro ao gerar pacote ZIP: ' + err.message);
        } finally {
          if (btn) btn.disabled = false;
        }
      };

      window.confirmAndExitMeeting = function() {
        if (confirm('Deseja realmente sair da sala e voltar ao painel?')) {
          if (isRealMicActive) stopMasterMicCapture();
          window.location.href = '/admin';
        }
      };

      window.openDedicatedSubtitleOverlay = function() {
        window.open('/?meeting=' + encodeURIComponent(id) + '&overlay=subtitles', '_blank');
      };

      window.copyTelaoShareLink = function() {
        const url = window.location.origin + window.location.pathname + '?meeting=' + encodeURIComponent(id) + '&overlay=subtitles';
        navigator.clipboard.writeText(url);
        alert('Link da Janela OBS copiado com sucesso!');
      };

      window.toggleTimerPause = function() {
        isTimerPaused = !isTimerPaused;
        const btn = document.getElementById('cockpit-pause-btn');
        if (btn) btn.innerText = isTimerPaused ? '▶️' : '⏸️';
      };

      // Cronômetro global crescente de sessão
      setInterval(() => {
        if (!isTimerPaused) {
          sessionElapsedSeconds++;
          const timerEl = document.getElementById('cockpit-elapsed-timer');
          if (timerEl) timerEl.innerText = formatDuration(sessionElapsedSeconds);
        }
      }, 1000);

      // Loop em tempo real dos VU Meters de Áudio Traduzido & Gravação de cada coluna
      setInterval(() => {
        const now = Date.now();
        activeTargetLanguages.forEach(lang => {
          const els = getTargetColumnElements(lang);
          if (!els.bar || !els.led || !els.textEl) return;

          const shortCode = lang.split('-')[0].toLowerCase();
          const st = targetMeterStates[lang] || targetMeterStates[shortCode];
          const isPlaying = st && st.activeUntil > now;

          if (isPlaying) {
            // Modulação ativa e dinâmica do canal traduzido
            const randLevel = Math.floor(Math.random() * 32) + 68;
            els.bar.style.width = randLevel + '%';
            els.bar.className = 'h-full rounded-full transition-all duration-75 bg-gradient-to-r from-emerald-500 via-teal-400 to-indigo-500 shadow-xs';
            els.textEl.innerText = randLevel + '%';
            els.led.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse';
            if (els.statusEl) els.statusEl.innerText = '● Transmitindo Áudio';
          } else if (isRealMicActive && !isTransmitterMicMuted) {
            // Microfone do palestrante está ativo captando fala: canal traduzido em prontidão imediata
            const activeLevel = Math.max(8, Math.min(30, Math.floor(Math.random() * 12) + 10));
            els.bar.style.width = activeLevel + '%';
            els.bar.className = 'h-full rounded-full transition-all duration-150 bg-emerald-500/60';
            els.textEl.innerText = activeLevel + '%';
            els.led.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400/80';
            if (els.statusEl) els.statusEl.innerText = 'Pronto p/ Traduzir';
          } else {
            // Em espera
            els.bar.style.width = '2%';
            els.bar.className = 'h-full rounded-full transition-all duration-200 bg-slate-300 dark:bg-slate-700';
            els.textEl.innerText = '0%';
            els.led.className = 'w-2.5 h-2.5 rounded-full bg-slate-300 dark:bg-slate-600';
            if (els.statusEl) els.statusEl.innerText = 'Em espera';
          }
        });
      }, 100);
    }

  </script>
</body>
