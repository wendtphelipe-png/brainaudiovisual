<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Audiovisual</title>
  <link rel="icon" type="image/svg+xml" href="frontend/public/favicon.svg">
  <!-- Tailwind CSS & Lucide Icons via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.25); }
    }
    .animate-pulse-live {
      animation: pulseLive 2s infinite;
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .streaming-cursor {
      display: inline-block;
      width: 3.5px;
      height: 14px;
      margin-left: 3px;
      vertical-align: middle;
      border-radius: 2px;
      animation: cursorBlink 0.75s infinite;
    }
    .active-streaming-line {
      transition: all 0.12s ease-in-out;
    }

    /* ========================================================
       TEMA CLARO CONFORTÁVEL (Fundo suave anti-reflexo, sem excesso de branco)
       ======================================================== */
    body.light-mode {
      background-color: #f1f5f9 !important;
      color: #0f172a !important;
    }

    /* ========================================================
       TEMA ESCURO PROFISSIONAL (Estúdio / Baixa Luminosidade - 100% da Página)
       ======================================================== */
    html.dark,
    html.dark body,
    body.dark,
    body.dark-mode {
      background-color: #0b0f19 !important;
      color: #f1f5f9 !important;
    }

    /* Headers, Topos Congelados e Barras */
    html.dark header,
    html.dark .sticky,
    html.dark [class*="backdrop-blur"] {
      background-color: rgba(15, 23, 42, 0.96) !important;
      border-color: #334155 !important;
      color: #f8fafc !important;
    }

    /* Cards, Seções e Gradients no Dashboard e Cockpit */
    html.dark section,
    html.dark .bg-white:not(input):not(select):not(textarea):not(button),
    html.dark [class*="bg-white"]:not(input):not(select):not(textarea):not(button),
    html.dark [class*="bg-slate-50"]:not(input):not(select):not(textarea):not(button),
    html.dark [class*="bg-slate-100"]:not(input):not(select):not(textarea):not(button):not(#meeting-progress-bar),
    html.dark [class*="bg-slate-200"]:not(input):not(select):not(textarea):not(button),
    html.dark [class*="from-blue-50"]:not(button),
    html.dark [class*="from-indigo-50"]:not(button),
    html.dark [class*="from-emerald-50"]:not(button) {
      background-color: #111827 !important;
      border-color: #374151 !important;
      color: #f8fafc !important;
    }

    /* Cabeçalhos de Seções e Sub-blocos */
    html.dark section > div:first-child,
    html.dark [class*="bg-blue-100"]:not(button):not(span),
    html.dark [class*="bg-indigo-100"]:not(button):not(span),
    html.dark [class*="bg-emerald-100"]:not(button):not(span) {
      background-color: #1e293b !important;
      border-color: #374151 !important;
      color: #f8fafc !important;
    }

    /* Tipografia e Títulos */
    html.dark .text-slate-900,
    html.dark .text-slate-800,
    html.dark .text-slate-700,
    html.dark h1, html.dark h2, html.dark h3, html.dark h4, html.dark strong {
      color: #f8fafc !important;
    }

    html.dark .text-slate-600,
    html.dark .text-slate-500 {
      color: #cbd5e1 !important;
    }

    html.dark .text-slate-400 {
      color: #94a3b8 !important;
    }

    /* Bordas */
    html.dark .border-slate-200,
    html.dark .border-slate-300,
    html.dark .border-blue-100,
    html.dark .border-blue-200,
    html.dark .border-indigo-100,
    html.dark .border-indigo-200,
    html.dark .border-emerald-100,
    html.dark .border-emerald-200 {
      border-color: #374151 !important;
    }

    /* CAMPOS DINÂMICOS QUE PODEM SER ALTERADOS (MANTIDOS COM FUNDO BRANCO E TEXTO ESCURO NO DARK MODE) */
    html.dark input:not([type="range"]):not([type="color"]):not([type="checkbox"]):not([type="radio"]),
    html.dark select,
    html.dark textarea {
      background-color: #ffffff !important;
      color: #0f172a !important;
      border: 1.5px solid #cbd5e1 !important;
      font-weight: 600 !important;
    }
    html.dark select option {
      background-color: #ffffff !important;
      color: #0f172a !important;
    }
    html.dark input::placeholder,
    html.dark textarea::placeholder {
      color: #64748b !important;
    }

    /* PRESERVAÇÃO DA BARRA DE PROGRESSO NO DARK MODE (GRADIENTE VIVO) */
    html.dark #meeting-progress-bar {
      opacity: 1 !important;
      background-image: linear-gradient(to right, #10b981, #2dd4bf, #059669) !important;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.5) !important;
    }

    /* PRESERVAÇÃO DAS CORES VIVAS DE TODOS OS BOTÕES COLORIDOS NO DARK MODE */
    html.dark button[class*="bg-blue-"], html.dark a[class*="bg-blue-"] {
      background-color: #2563eb !important;
      color: #ffffff !important;
    }
    html.dark button[class*="bg-blue-"]:hover, html.dark a[class*="bg-blue-"]:hover {
      background-color: #1d4ed8 !important;
    }
    html.dark button[class*="bg-indigo-"], html.dark a[class*="bg-indigo-"] {
      background-color: #4f46e5 !important;
      color: #ffffff !important;
    }
    html.dark button[class*="bg-indigo-"]:hover, html.dark a[class*="bg-indigo-"]:hover {
      background-color: #4338ca !important;
    }
    html.dark button[class*="bg-emerald-"], html.dark a[class*="bg-emerald-"],
    html.dark button[class*="bg-green-"], html.dark a[class*="bg-green-"] {
      background-color: #059669 !important;
      color: #ffffff !important;
    }
    html.dark button[class*="bg-emerald-"]:hover, html.dark a[class*="bg-emerald-"]:hover {
      background-color: #047857 !important;
    }
    html.dark button[class*="bg-rose-"], html.dark a[class*="bg-rose-"],
    html.dark button[class*="bg-red-"], html.dark a[class*="bg-red-"] {
      background-color: #e11d48 !important;
      color: #ffffff !important;
    }
    html.dark button[class*="bg-rose-"]:hover, html.dark a[class*="bg-rose-"]:hover {
      background-color: #be123c !important;
    }
    html.dark button[class*="bg-amber-"], html.dark a[class*="bg-amber-"] {
      background-color: #f59e0b !important;
      color: #020617 !important;
    }
    html.dark button[class*="bg-purple-"], html.dark a[class*="bg-purple-"] {
      background-color: #9333ea !important;
      color: #ffffff !important;
    }
    /* Preserva botões de amostra de paleta de cor das legendas e overlay OBS */
    html.dark button[onclick*="setSubtitleBg"],
    html.dark button[onclick*="setSubtitleText"],
    html.dark button[onclick*="setOverlayBg"],
    html.dark button[onclick*="setOverlayTextColor"] {
      border: 1px solid rgba(255, 255, 255, 0.5) !important;
    }

    /* Modais */
    html.dark #share-telao-modal > div,
    html.dark #finish-meeting-modal > div,
    html.dark #test-lab-modal > div {
      background-color: #111827 !important;
      border-color: #374151 !important;
      color: #f8fafc !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased m-0 min-h-screen">

  <div id="app-root"></div>

  <script>
    // ========================================================
    // HELPERS GLOBAIS DE ESTADO E PERSISTÊNCIA SEGURA
    // ========================================================
    // ========================================================
    // GERENCIADOR DE TEMA GLOBAL (MODO CLARO CONFORTÁVEL & MODO ESCURO)
    // ========================================================
    function getStoredTheme() {
      try {
        return localStorage.getItem('brain_theme') || 'light';
      } catch(e) { return 'light'; }
    }

    function setGlobalTheme(theme) {
      try {
        localStorage.setItem('brain_theme', theme);
      } catch(e) {}
      const isDark = theme === 'dark';
      if (isDark) {
        document.documentElement.classList.add('dark');
        document.body.classList.add('dark');
        document.body.classList.add('dark-mode');
        document.body.classList.remove('light-mode');
      } else {
        document.documentElement.classList.remove('dark');
        document.body.classList.remove('dark');
        document.body.classList.remove('dark-mode');
        document.body.classList.add('light-mode');
      }
      updateThemeButtonUI();
    }

    window.toggleGlobalTheme = function() {
      const current = getStoredTheme();
      const next = current === 'dark' ? 'light' : 'dark';
      setGlobalTheme(next);
    };

    function updateThemeButtonUI() {
      const isDark = getStoredTheme() === 'dark';
      const btns = document.querySelectorAll('.btn-theme-toggle');
      btns.forEach(btn => {
        btn.innerHTML = isDark 
          ? '<span>Modo Claro</span>' 
          : '<span>Modo Escuro</span>';
        btn.className = isDark
          ? 'btn-theme-toggle text-xs font-bold px-3 py-1.5 rounded-xl border border-amber-400/50 bg-amber-500/10 text-amber-300 hover:bg-amber-500/20 transition-all cursor-pointer flex items-center gap-1.5 shadow-2xs'
          : 'btn-theme-toggle text-xs font-bold px-3 py-1.5 rounded-xl border border-slate-300 bg-white hover:bg-slate-100 text-slate-800 transition-all cursor-pointer flex items-center gap-1.5 shadow-2xs';
      });
    }

    // Inicializa o tema memorizado
    setTimeout(() => {
      setGlobalTheme(getStoredTheme());
    }, 10);

    function getStoredAccounts() {
      try {
        const raw = localStorage.getItem('brain_saved_accounts');
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr) && arr.length > 0) return arr;
        }
      } catch (e) {}
      return [
        { id: 'acc-1', name: 'Conta Google Pro 01 (Principal)', email: '', connected: false },
        { id: 'acc-2', name: 'Conta Google Pro 02 (Auxiliar/Tradução)', email: '', connected: false },
        { id: 'acc-3', name: 'Slot Google Pro 03', email: '', connected: false },
        { id: 'acc-4', name: 'Slot Google Pro 04', email: '', connected: false }
      ];
    }

    function getStoredMeetings() {
      try {
        const raw = localStorage.getItem('brain_saved_meetings');
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) return arr;
        }
      } catch (e) {}
      return [];
    }

    function getStoredAudioLanguageSettings() {
      let settings = {
        sourceLanguage: 'pt-BR',
        sourceLanguageLabel: 'Português (Brasil)',
        targetLanguage: 'en-US',
        targetLanguageLabel: 'Inglês (Estados Unidos / Global)',
        transmitterInputDevice: 'event-line',
        transmitterInputLabel: 'Áudio do Evento (Mesa de Som / Linha)',
        transmitterSpeakerMuted: true,
        receiverInputMuted: true,
        receiverOutputDevice: 'cable',
        receiverOutputLabel: 'CABLE Output / VB-Audio Virtual Cable (Mesa de Som)',
        cameraDisabled: true
      };
      try {
        const raw = localStorage.getItem('brain_audio_lang_settings');
        if (raw) {
          const parsed = JSON.parse(raw);
          settings = Object.assign(settings, parsed);
        }
      } catch (e) {}
      return settings;
    }

    function saveStoredAudioLanguageSettings(settings) {
      try {
        localStorage.setItem('brain_audio_lang_settings', JSON.stringify(settings));
      } catch (e) {}
    }
    const saveAudioLanguageSettings = saveStoredAudioLanguageSettings;
    window.saveAudioLanguageSettings = saveStoredAudioLanguageSettings;
    window.saveStoredAudioLanguageSettings = saveStoredAudioLanguageSettings;

    // ========================================================
    // ROTEAMENTO DINÂMICO
    // ========================================================
    const params = new URLSearchParams(window.location.search);
    const isAudiencePortal = params.get('portal') === 'audience' || params.get('view') === 'portal' || params.get('portal') === 'true' || params.has('pool') || window.location.pathname.startsWith('/portal');
    const isAudiencePage = params.get('view') === 'audience' || params.get('view') === 'listener' || params.get('listener') === 'true' || window.location.pathname.startsWith('/listener') || window.location.pathname.startsWith('/audience');
    const isOverlaySubtitles = params.get('overlay') === 'subtitles' || params.get('telao') === 'true' || window.location.pathname.startsWith('/overlay/subtitles') || window.location.pathname.startsWith('/telao');
    const isAdmin = params.get('admin') === 'true' || params.has('admin') || window.location.pathname === '/admin' || window.location.pathname.startsWith('/admin');
    const meetingId = params.get('meeting') || (window.location.pathname.startsWith('/meeting/') ? window.location.pathname.split('/')[2] : null);

    const root = document.getElementById('app-root') || document.body;

    try {
      // 0. ROTA DEDICADA: PORTAL POOL CENTRAL DE IDIOMAS (1 ÚNICO QR CODE PARA O AUDITÓRIO)
      if (isAudiencePortal && meetingId) {
        document.body.className = "bg-slate-50 text-slate-800 font-sans antialiased m-0 min-h-screen selection:bg-indigo-500/30 selection:text-indigo-600";
        setGlobalTheme(getStoredTheme());
        renderAudiencePortalPage(meetingId);
      }
      // 1. ROTA DEDICADA: PÁGINA DO ESPECTADOR / AUDIÊNCIA (?meeting=xyz&view=audience)
      else if (isAudiencePage && meetingId) {
        document.body.className = "bg-slate-50 text-slate-800 font-sans antialiased m-0 min-h-screen selection:bg-indigo-500/30 selection:text-indigo-600";
        setGlobalTheme(getStoredTheme());
        renderAudienceListenerPage(meetingId);
      }
      // 2. ROTA DEDICADA: JANELA EXCLUSIVA DE LEGENDAS PARA OBS / BROADCAST (?meeting=xyz&overlay=subtitles)
      else if (isOverlaySubtitles && meetingId) {
        document.body.className = "bg-black text-white font-sans antialiased m-0 min-h-screen overflow-x-hidden selection:bg-blue-500/30 selection:text-blue-200";
        renderSubtitleOverlayPage(meetingId);
      }
      // 3. ROTA: MONITOR DEDICADO DO COCKPIT DA REUNIÃO (?meeting=xyz ou /meeting/xyz)
      else if (meetingId) {
        document.body.className = "font-sans antialiased m-0 min-h-screen selection:bg-blue-500/30 selection:text-blue-200";
        setGlobalTheme(getStoredTheme());
        try {
          renderMeetingRoomMonitor(meetingId);
        } catch(err) {
          console.error("Erro crítico ao inicializar Cockpit da Reunião:", err);
          root.innerHTML = `
            <div class="min-h-screen flex items-center justify-center p-6">
              <div class="max-w-md w-full bg-slate-900 border border-rose-500/40 rounded-3xl p-8 text-center shadow-2xl">
                <div class="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-xs font-black mx-auto mb-4">AVISO</div>
                <h2 class="text-base font-bold text-white mb-2">Erro ao Iniciar Cockpit</h2>
                <p class="text-xs text-slate-400 mb-6 font-mono">${err.message || String(err)}</p>
                <div class="flex items-center justify-center gap-3">
                  <button onclick="window.location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2.5 rounded-xl font-semibold transition-all">Recarregar</button>
                  <a href="/admin" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-4 py-2.5 rounded-xl font-semibold transition-all">Voltar ao Painel</a>
                </div>
              </div>
            </div>
          `;
        }
      } 
      // 4. ROTA: ÁREA ADMINISTRATIVA / DASHBOARD CENTRAL DE EVENTOS (/admin ou ?admin=true)
      else if (isAdmin) {
        document.body.className = "font-sans antialiased m-0 min-h-screen";
        setGlobalTheme(getStoredTheme());
        routeAdminModule();
      }
      // 5. ROTA PADRÃO PÚBLICA: PÁGINA EM CONSTRUÇÃO CLEAN E CLARA (/)
      else {
        document.body.className = "bg-[#f8fafc] text-[#0f172a] font-sans antialiased m-0 min-h-screen flex items-center justify-center p-6 text-center";
        renderPublicConstructionPage();
      }
    } catch(globalRouterErr) {
      console.error("Erro fatal no roteamento da aplicação:", globalRouterErr);
      if (root) {
        root.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-6">
            <div class="max-w-md w-full bg-white dark:bg-slate-900 border border-rose-300 dark:border-rose-800 rounded-3xl p-8 text-center shadow-xl">
              <div class="w-12 h-12 rounded-2xl bg-rose-500/10 text-rose-500 flex items-center justify-center text-xs font-black mx-auto mb-4">AVISO</div>
              <h2 class="text-base font-bold text-slate-900 dark:text-white mb-2">Erro de Inicialização</h2>
              <p class="text-xs text-slate-500 dark:text-slate-400 mb-6 font-mono">${globalRouterErr.message || String(globalRouterErr)}</p>
              <div class="flex items-center justify-center gap-3">
                <button onclick="window.location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2.5 rounded-xl font-semibold transition-all">Recarregar</button>
                <a href="/admin" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-4 py-2.5 rounded-xl font-semibold transition-all">Acessar Admin</a>
              </div>
            </div>
          </div>
        `;
      }
    }

    // ========================================================
    // TELA 0: CALLBACK DA JANELA POPUP DO GOOGLE OAUTH
    // ========================================================
    function renderOAuthCallbackPopup() {
      document.body.className = "bg-slate-900 text-white font-sans antialiased m-0 flex items-center justify-center min-h-screen p-6 text-center";
      
      const searchParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash);
      
      const error = searchParams.get('error') || hashParams.get('error');
      const code = searchParams.get('code');
      const accessToken = hashParams.get('access_token');
      const slotId = searchParams.get('state') || hashParams.get('state') || 'acc-1';

      root.innerHTML = `
        <div class="max-w-md w-full bg-slate-950 border border-slate-800 rounded-3xl p-8 shadow-2xl">
          <div id="cb-box">
            <div class="w-12 h-12 rounded-full border-4 border-blue-500 border-t-transparent animate-spin mx-auto mb-4"></div>
            <h2 class="text-base font-bold text-white mb-2">Processando Conexão com o Google...</h2>
            <p class="text-xs text-slate-400">Verificando a autenticação da sua conta Google Workspace Pro.</p>
          </div>
        </div>
      `;

      if (error) {
        document.getElementById('cb-box').innerHTML = `
          <div class="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-xs font-black mx-auto mb-4">ERRO</div>
          <h2 class="text-base font-bold text-rose-400 mb-2">Autorização Não Concluída</h2>
          <p class="text-xs text-slate-400 mb-5">${error === 'access_denied' ? 'O acesso foi recusado na janela do Google.' : error}</p>
          <button onclick="window.close()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-5 py-2.5 rounded-xl font-semibold">Fechar Janela</button>
        `;
        if (window.opener) {
          try {
            window.opener.postMessage({ type: 'GOOGLE_AUTH_ERROR', error, slotId }, '*');
          } catch (e) {}
        }
        return;
      }

      if (accessToken) {
        // Valida imediatamente com a API oficial do Google
        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: { 'Authorization': 'Bearer ' + accessToken }
        })
        .then(r => r.json())
        .then(userInfo => {
          document.getElementById('cb-box').innerHTML = `
            <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs font-black mx-auto mb-4">CONECTADO</div>
            <h2 class="text-base font-bold text-emerald-400 mb-1">Conta Google Pro Conectada!</h2>
            <p class="text-xs text-slate-300 font-semibold mb-1">${userInfo.name || 'Conta Google'}</p>
            <p class="text-xs text-blue-400 font-mono mb-4">${userInfo.email}</p>
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-[11px] font-medium border border-emerald-500/20 mb-3">
              <span>● Token Pro Verificado com Sucesso</span>
            </div>
            <p class="text-[11px] text-slate-500">Retornando ao painel em instantes...</p>
          `;

          if (window.opener) {
            try {
              window.opener.postMessage({
                type: 'GOOGLE_AUTH_SUCCESS',
                slotId: slotId,
                email: userInfo.email,
                name: userInfo.name,
                picture: userInfo.picture,
                tokens: { access_token: accessToken }
              }, '*');
            } catch (e) {}
          }
          setTimeout(() => { window.close(); }, 1400);
        })
        .catch(err => {
          document.getElementById('cb-box').innerHTML = `
            <div class="text-rose-400 text-xs">Erro na validação do token: ${err.message}</div>
          `;
        });
      } else if (code) {
        // Envia o código para o opener
        if (window.opener) {
          try {
            window.opener.postMessage({
              type: 'GOOGLE_AUTH_CODE',
              slotId: slotId,
              code: code
            }, '*');
          } catch (e) {}
        }
        document.getElementById('cb-box').innerHTML = `
          <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs font-black mx-auto mb-4">CONECTADO</div>
          <h2 class="text-base font-bold text-emerald-400 mb-2">Código de Autorização Recebido!</h2>
          <p class="text-xs text-slate-400 mb-4">Concluindo validação no painel...</p>
        `;
        setTimeout(() => { window.close(); }, 1200);
      }
    }

    // ========================================================
    // TELA 1: PÁGINA PÚBLICA CLEAN (EM CONSTRUÇÃO)
    // ========================================================
    function renderPublicConstructionPage() {
      document.title = "Brain Audiovisual — Página em construção";
      document.documentElement.classList.remove('dark');
      document.body.className = "bg-[#f8fafc] text-[#0f172a] font-sans antialiased m-0 min-h-screen flex items-center justify-center p-6 text-center";
      root.innerHTML = `
        <div class="max-w-xl flex flex-col items-center justify-center" style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; width: 100%; max-width: 36rem;">

    function isMeetingActiveNow(m) {
      if (!m || !m.id) return false;
      if (m.status === 'archived' || m.status === 'completed' || m.status === 'closed') {
        return false;
      }
      // 1. Verifica heartbeat ativo (cockpit aberto e transmitindo nos últimos 12 segundos)
      try {
        const hb = localStorage.getItem('brain_room_heartbeat_' + m.id);
        if (hb) {
          const lastHb = parseInt(hb, 10);
          if (lastHb > 0 && (Date.now() - lastHb) < 12000) {
            return true;
          }
        }
      } catch(e) {}

      // 2. Se a sala acabou de ser criada nesta sessão (há menos de 60 segundos), mantém ativa temporariamente para abertura do cockpit
      try {
        if (m.createdAt) {
          const created = new Date(m.createdAt).getTime();
          if (!isNaN(created) && (Date.now() - created) < 60000) {
            return true;
          }
        }
      } catch(e) {}

      return false;
    }

    function getMeetingCockpitUrl(meetingId) {
      const currentPath = window.location.pathname;
      if (window.location.protocol === 'file:') {
        return currentPath + '?meeting=' + encodeURIComponent(meetingId);
      }
      return '/?meeting=' + encodeURIComponent(meetingId);
    }

    function getAdminBaseUrl(extraQuery) {
      const q = extraQuery ? ('?' + extraQuery) : '';
      if (window.location.protocol === 'file:') {
        return window.location.pathname + (extraQuery ? ('?admin=true&' + extraQuery) : '?admin=true');
      }
      return '/admin' + q;
    }

    window.openMeetingCockpit = function(meetingId) {
      if (!meetingId) return;
      try {
        localStorage.setItem('brain_room_heartbeat_' + meetingId, Date.now().toString());
      } catch(e) {}
      const url = getMeetingCockpitUrl(meetingId);
      window.location.href = url;
    };

    window.handleCreateMeetingSubmit = function(e) {
      if (e) {
        if (e.preventDefault) e.preventDefault();
        if (e.stopPropagation) e.stopPropagation();
      }
      const titleInput = document.getElementById('new-m-title');
      const idInput = document.getElementById('new-m-id');
      const sourceLangSelect = document.getElementById('new-m-source-lang');
      const autoDetectCheckbox = document.getElementById('new-m-auto-detect');
      const inputDeviceSelect = document.getElementById('new-m-input-device');

      const title = (titleInput && titleInput.value.trim()) || 'Palco Principal — Sessão Internacional';
      let meetingId = (idInput && idInput.value.trim()) || ('sala-' + Math.random().toString(36).substring(2, 7));
      meetingId = meetingId.toLowerCase().replace(/[^a-z0-9_-]/g, '-').replace(/^-+|-+$/g, '');
      if (!meetingId) meetingId = 'sala-' + Math.random().toString(36).substring(2, 7);

      const sourceLanguage = sourceLangSelect ? sourceLangSelect.value : 'pt-BR';
      const autoDetectLanguage = autoDetectCheckbox ? autoDetectCheckbox.checked : true;
      const inputDevice = inputDeviceSelect ? inputDeviceSelect.value : 'default';
      const targetLanguages = (window._newMeetingFormState && window._newMeetingFormState.selectedTargetLangs && window._newMeetingFormState.selectedTargetLangs.length > 0)
        ? window._newMeetingFormState.selectedTargetLangs
        : ['en-US', 'es-ES'];

      const newMeeting = {
        id: meetingId,
        title: title,
        createdAt: new Date().toISOString(),
        status: 'active',
        sourceLanguage: sourceLanguage,
        autoDetectLanguage: autoDetectLanguage,
        inputDevice: inputDevice,
        targetLanguages: targetLanguages
      };

      let meetingsList = [];
      try {
        meetingsList = JSON.parse(localStorage.getItem('brain_saved_meetings') || '[]');
        if (!Array.isArray(meetingsList)) meetingsList = [];
      } catch(err) {
        meetingsList = [];
      }

      const existingIdx = meetingsList.findIndex(m => m && m.id === meetingId);
      if (existingIdx !== -1) {
        meetingsList[existingIdx] = newMeeting;
      } else {
        meetingsList.unshift(newMeeting);
      }

      try {
        localStorage.setItem('brain_saved_meetings', JSON.stringify(meetingsList));
        localStorage.setItem('brain_room_heartbeat_' + meetingId, Date.now().toString());
      } catch(err) {}

      try {
        if (typeof saveStoredAudioLanguageSettings === 'function') {
          saveStoredAudioLanguageSettings({
            sourceLanguage: sourceLanguage,
            targetLanguages: targetLanguages,
            autoDetectLanguage: autoDetectLanguage,
            transmitterInputDevice: inputDevice
          });
        }
      } catch(err) {}

      // Redireciona imediatamente para o Cockpit da nova reunião
      const cockpitUrl = getMeetingCockpitUrl(meetingId);
      window.location.href = cockpitUrl;
      return false;
    };

    // ========================================================
    function renderSimultaneousTranslationDashboard() {
      // Reuniões salvas no localStorage com higienização estrita
      let meetings = [];
      try {
        const savedMeetings = localStorage.getItem('brain_saved_meetings');
        if (savedMeetings) {
          const parsed = JSON.parse(savedMeetings);
          if (Array.isArray(parsed)) {
            meetings = parsed.filter(m => m && typeof m === 'object').map(m => {
              const id = m.id || ('sala-' + Math.random().toString(36).substring(2, 7));
              const title = m.title || ('Sessão de Tradução ' + id);
              const sourceLanguage = (typeof m.sourceLanguage === 'string' && m.sourceLanguage) ? m.sourceLanguage : 'pt-BR';
              const targetLanguages = Array.isArray(m.targetLanguages) && m.targetLanguages.length > 0 
                ? m.targetLanguages.filter(t => typeof t === 'string') 
                : ['en-US', 'es-ES'];
              return {
                id,
                title,
                createdAt: m.createdAt || new Date().toISOString(),
                status: m.status || 'active',
                sourceLanguage,
                autoDetectLanguage: !!m.autoDetectLanguage,
                inputDevice: m.inputDevice || 'default',
                targetLanguages: targetLanguages.length > 0 ? targetLanguages : ['en-US', 'es-ES']
              };
            });
          }
        }
      } catch(e) {
        meetings = [];
      }

      // Separa reuniões ativas vs históricas
      const activeMeetings = meetings.filter(m => isMeetingActiveNow(m));
      const historyMeetings = meetings.filter(m => !isMeetingActiveNow(m));

      // Idiomas do sistema
      const SUPPORTED_LANGS = [
        { code: 'en-US', name: 'Inglês (Estados Unidos / Global)', tag: 'EN', default: true },
        { code: 'es-ES', name: 'Espanhol (Internacional)', tag: 'ES', default: true },
        { code: 'pt-BR', name: 'Português (Brasil)', tag: 'PT', default: false },
        { code: 'fr-FR', name: 'Francês', tag: 'FR', default: false },
        { code: 'de-DE', name: 'Alemão', tag: 'DE', default: false },
        { code: 'it-IT', name: 'Italiano', tag: 'IT', default: false },
        { code: 'zh-CN', name: 'Mandarim (China)', tag: 'ZH', default: false },
        { code: 'ja-JP', name: 'Japonês', tag: 'JA', default: false }
      ];

      // Estado do formulário de criação
      if (!window._newMeetingFormState) {
        window._newMeetingFormState = {
          title: 'Palco Principal — Sessão Internacional',
          customId: 'sala-' + Math.random().toString(36).substring(2, 7),
          sourceLanguage: 'pt-BR',
          autoDetectLanguage: true,
          inputDevice: 'default',
          selectedTargetLangs: ['en-US', 'es-ES']
        };
      }

      let audioInputDevices = [];
      async function refreshDashboardAudioDevices() {
        try {
          if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
            const devs = await navigator.mediaDevices.enumerateDevices();
            audioInputDevices = devs.filter(d => d.kind === 'audioinput');
            const selectEl = document.getElementById('new-m-input-device');

      window.requestMicPermissionForDashboard = async function() {

        } catch(e) {
          alert('Permissão de microfone negada ou dispositivo indisponível.');

      };

      window.toggleTargetLangSelection = function(langCode) {
        const state = window._newMeetingFormState;
        if (state.selectedTargetLangs.includes(langCode)) {

            return;
          }
          state.selectedTargetLangs = state.selectedTargetLangs.filter(l => l !== langCode);
        } else {
          state.selectedTargetLangs.push(langCode);
        }
        renderDashboardUI();
      };

      window.handleCreateMeetingSubmit = function(e) {
        e.preventDefault();
        const titleInput = document.getElementById('new-m-title');
        const idInput = document.getElementById('new-m-id');
        const sourceLangSelect = document.getElementById('new-m-source-lang');
        const autoDetectCheckbox = document.getElementById('new-m-auto-detect');
        const inputDeviceSelect = document.getElementById('new-m-input-device');

        const title = (titleInput && titleInput.value.trim()) || 'Palco Principal — Sessão Internacional';
        let meetingId = (idInput && idInput.value.trim()) || ('sala-' + Math.random().toString(36).substring(2, 7));
        meetingId = meetingId.toLowerCase().replace(/[^a-z0-9_-]/g, '-').replace(/^-+|-+$/g, '');
        if (!meetingId) meetingId = 'sala-' + Math.random().toString(36).substring(2, 7);

        const sourceLanguage = sourceLangSelect ? sourceLangSelect.value : 'pt-BR';
        const autoDetectLanguage = autoDetectCheckbox ? autoDetectCheckbox.checked : true;
        const inputDevice = inputDeviceSelect ? inputDeviceSelect.value : 'default';
        const targetLanguages = (window._newMeetingFormState && window._newMeetingFormState.selectedTargetLangs && window._newMeetingFormState.selectedTargetLangs.length > 0)
          ? window._newMeetingFormState.selectedTargetLangs
          : ['en-US', 'es-ES'];

        const newMeeting = {
          id: meetingId,
          title: title,
          createdAt: new Date().toISOString(),
          status: 'active',
          sourceLanguage: sourceLanguage,
          autoDetectLanguage: autoDetectLanguage,
          inputDevice: inputDevice,
          targetLanguages: targetLanguages
        };

        const existingIdx = meetings.findIndex(m => m.id === meetingId);
        if (existingIdx !== -1) {
          meetings[existingIdx] = newMeeting;
        } else {
          meetings.unshift(newMeeting);
        }

        try {
          localStorage.setItem('brain_saved_meetings', JSON.stringify(meetings));
          localStorage.setItem('brain_room_heartbeat_' + meetingId, Date.now().toString());
        } catch(err) {}

        try {
          saveStoredAudioLanguageSettings({
            sourceLanguage: sourceLanguage,
            targetLanguages: targetLanguages,
            autoDetectLanguage: autoDetectLanguage,
            transmitterInputDevice: inputDevice
          });
        } catch(err) {}

        // Redireciona imediatamente para o Cockpit da nova reunião
        window.location.href = getMeetingCockpitUrl(meetingId);
      };

    // ========================================================
    // TELA DEDICADA: OVERLAY EXCLUSIVO DE LEGENDAS (OBS / vMIX / BROADCAST)
    // ========================================================
    function renderSubtitleOverlayPage(id) {
      const audioSettings = getStoredAudioLanguageSettings();
      let meeting = null;
      try {
        const saved = JSON.parse(localStorage.getItem('brain_saved_meetings') || '[]');
        meeting = saved.find(m => m.id === id);
      } catch(e) {}

      if (!meeting) {
        meeting = {
          id: id,
          title: 'Sessão de Tradução — ' + id,
          sourceLanguage: audioSettings.sourceLanguage || 'pt-BR',
          targetLanguages: audioSettings.targetLanguages || ['en-US', 'es-ES']
        };
      }

      // Parâmetros de URL
      const urlParams = new URLSearchParams(window.location.search);
      const urlBg = urlParams.get('bg'); // 'chroma' | 'black' | 'transparent'
      let currentBg = urlBg === 'chroma' ? '#00ff00' : (urlBg === 'transparent' ? 'transparent' : '#000000');
      let areControlsHidden = false;

      // Colunas de idiomas suportadas (Padrão: Português, Inglês, Espanhol)
      const ALL_POSSIBLE_COLS = [
        { key: 'trans', name: 'Português (Palestrante)', tag: 'PT', defaultColor: '#ffffff' },
        { key: 'rec', name: 'Inglês (Tradução)', tag: 'EN', defaultColor: '#fde047' },
        { key: 'spanish', name: 'Espanhol', tag: 'ES', defaultColor: '#38bdf8' },
        { key: 'french', name: 'Francês', tag: 'FR', defaultColor: '#c084fc' },
        { key: 'german', name: 'Alemão', tag: 'DE', defaultColor: '#fb923c' },
        { key: 'italian', name: 'Italiano', tag: 'IT', defaultColor: '#4ade80' }
      ];

      // Colunas ativas carregadas do localStorage (Padrão: trans, rec, spanish)
      let enabledCols = ['trans', 'rec', 'spanish'];
      try {
        const storedCols = localStorage.getItem('brain_overlay_enabled_cols');
        if (storedCols) {
          const parsed = JSON.parse(storedCols);
          if (Array.isArray(parsed) && parsed.length > 0) enabledCols = parsed;
        }
      } catch(e) {}

      // Configurações e estilos independentes para cada coluna
      let overlayActiveCustomCol = enabledCols[0] || 'trans';
      let overlayColConfigs = {};
      ALL_POSSIBLE_COLS.forEach(col => {
        overlayColConfigs[col.key] = {
          label: col.name,
          flag: col.flag,
          textColor: localStorage.getItem('brain_overlay_' + col.key + '_color') || col.defaultColor,
          fontSize: parseInt(localStorage.getItem('brain_overlay_' + col.key + '_size')) || 24
        };
      });

      function saveColStyles(colKey) {
        try {
          localStorage.setItem('brain_overlay_' + colKey + '_color', overlayColConfigs[colKey].textColor);
          localStorage.setItem('brain_overlay_' + colKey + '_size', overlayColConfigs[colKey].fontSize);
        } catch(e) {}
      }

      function updateGridColClasses() {
        const grid = document.getElementById('overlay-grid');
        if (!grid) return;
        const visibleCount = enabledCols.length;
        grid.className = 'grid gap-6 w-full ' + (
          visibleCount >= 4 ? 'grid-cols-4 max-w-[98%]' :
          visibleCount === 3 ? 'grid-cols-3 max-w-[96%]' :
          visibleCount === 2 ? 'grid-cols-2 max-w-5xl' :
          'grid-cols-1 max-w-3xl'
        ) + ' mx-auto';

        ALL_POSSIBLE_COLS.forEach(col => {
          const colEl = document.getElementById('overlay-col-' + col.key);
          if (colEl) {
            colEl.classList.toggle('hidden', !enabledCols.includes(col.key));
          }
        });
      }

      window.toggleOverlayColVisibility = function(colKey) {
        const idx = enabledCols.indexOf(colKey);
        if (idx !== -1) {
          if (enabledCols.length <= 1) {
            alert('A janela do OBS precisa de pelo menos 1 coluna de idioma visível.');
            return;
          }
          enabledCols.splice(idx, 1);
        } else {
          enabledCols.push(colKey);
        }
        try {
          localStorage.setItem('brain_overlay_enabled_cols', JSON.stringify(enabledCols));
        } catch(e) {}

        if (!enabledCols.includes(overlayActiveCustomCol)) {
          overlayActiveCustomCol = enabledCols[0] || 'trans';
        }

        renderOverlayUI();
      };

      window.selectOverlayCustomCol = function(colKey) {
        overlayActiveCustomCol = colKey;
        const cfg = overlayColConfigs[colKey];
        const label = document.getElementById('overlay-col-editing-label');
        if (label) label.innerText = cfg.flag + ' ' + cfg.label.split(' ')[0] + ':';
        const ind = document.getElementById('overlay-font-indicator');
        if (ind) ind.innerText = cfg.fontSize + 'px';
        const picker = document.getElementById('overlay-color-picker');
        if (picker) picker.value = cfg.textColor;

        ALL_POSSIBLE_COLS.forEach(col => {
          const tab = document.getElementById('tab-custom-' + col.key);
          if (tab) {
            tab.className = col.key === colKey
              ? 'px-2 py-0.5 rounded-md bg-indigo-600 text-white font-bold'
              : 'px-2 py-0.5 rounded-md text-slate-300 hover:text-white';
          }
        });
      };

      window.setOverlayActiveColColor = function(color) {
        const colKey = overlayActiveCustomCol;
        overlayColConfigs[colKey].textColor = color;
        saveColStyles(colKey);

        const feed = document.getElementById('overlay-feed-' + colKey);
        if (feed) {
          feed.style.color = color;
          feed.querySelectorAll('p').forEach(p => {
            if (!p.classList.contains('italic')) p.style.color = color;
          });
        }
        const picker = document.getElementById('overlay-color-picker');
        if (picker) picker.value = color;
      };

      window.changeOverlayActiveColFont = function(delta) {
        const colKey = overlayActiveCustomCol;
        overlayColConfigs[colKey].fontSize = Math.max(16, Math.min(56, overlayColConfigs[colKey].fontSize + delta));
        saveColStyles(colKey);

        const ind = document.getElementById('overlay-font-indicator');
        if (ind) ind.innerText = overlayColConfigs[colKey].fontSize + 'px';

        const feed = document.getElementById('overlay-feed-' + colKey);
        if (feed) feed.style.fontSize = overlayColConfigs[colKey].fontSize + 'px';
      };

      window.setOverlayBg = function(bg) {
        currentBg = bg;
        const container = document.getElementById('overlay-container');
        if (container) {
          container.style.backgroundColor = bg;
          document.body.style.backgroundColor = bg;
        }
      };

      window.toggleOverlayControls = function() {
        areControlsHidden = !areControlsHidden;
        const bar = document.getElementById('overlay-topbar');
        const hint = document.getElementById('overlay-hidden-hint');
        if (bar) bar.style.display = areControlsHidden ? 'none' : 'flex';
        if (hint) hint.classList.toggle('hidden', !areControlsHidden);
      };

      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          toggleOverlayControls();
        }
      });

                <span id="overlay-cloud-indicator" class="hidden sm:flex items-center gap-1.5 text-[11px] font-semibold text-emerald-400 bg-emerald-950/40 border border-emerald-800/60 px-2 py-0.5 rounded-full">

      renderOverlayUI();

      // RENDERIZAÇÃO UNIFICADA DE MENSAGENS COM DEDUPLICAÇÃO E FLUXO CONTÍNUO EM TEMPO REAL (OBS OVERLAY)
      const seenSubtitles = new Set();
      const overlayActiveParagraphObjs = {};
      const overlayLastSubtitleTimes = {};

      function handleIncomingSubtitle(data) {
        if (!data) return;

        const isNewSubtitle = data.type === 'NEW_SUBTITLE';
        const isLiveInterim = data.type === 'LIVE_INTERIM';
        const isCloseParagraph = data.type === 'CLOSE_PARAGRAPH';

        if (!isNewSubtitle && !isLiveInterim && !isCloseParagraph) return;

        let feedId = 'overlay-feed-rec';
        let colKey = 'rec';
        const chan = (data.channel || '').toLowerCase();
        if (chan === 'transmitter') {
          feedId = 'overlay-feed-trans';
          colKey = 'trans';
        } else if (chan === 'spanish' || chan === 'es' || chan === 'es-es') {
          feedId = 'overlay-feed-spanish';
          colKey = 'spanish';
        } else if (chan === 'french' || chan === 'fr' || chan === 'fr-fr') {
          feedId = 'overlay-feed-french';
          colKey = 'french';
        }

        if (isCloseParagraph) {
          if (data.channel === 'all') {
            Object.keys(overlayActiveParagraphObjs).forEach(k => {
              if (overlayActiveParagraphObjs[k]?.cursorEl) overlayActiveParagraphObjs[k].cursorEl.remove();
              overlayActiveParagraphObjs[k] = null;
            });
          } else if (overlayActiveParagraphObjs[colKey]) {
            if (overlayActiveParagraphObjs[colKey].cursorEl) overlayActiveParagraphObjs[colKey].cursorEl.remove();
            overlayActiveParagraphObjs[colKey] = null;
          }
          return;
        }

        const feed = document.getElementById(feedId);
        if (!feed) return;

        const firstP = feed.querySelector('.italic');
        if (firstP) firstP.remove();

        const now = Date.now();
        const lastTime = overlayLastSubtitleTimes[colKey] || 0;
        const activeObj = overlayActiveParagraphObjs[colKey];
        const isPause = (now - lastTime) > 2500 || !activeObj || !activeObj.p || !activeObj.p.isConnected;

        if (isLiveInterim) {
          const interimText = (data.text || '').trim();
          if (isPause) {
            if (feed.lastElementChild) {
              feed.lastElementChild.className = 'leading-relaxed transition-all duration-200 mb-3 whitespace-normal break-words';
              feed.lastElementChild.style.opacity = '0.70';
              feed.lastElementChild.style.fontWeight = '400';
              feed.lastElementChild.style.color = overlayColConfigs[colKey].textColor;
            }

            const p = document.createElement('p');
            p.className = 'leading-relaxed transition-all duration-300 mb-3 font-bold drop-shadow-md whitespace-normal break-words';
            p.style.opacity = '1.0';
            p.style.color = overlayColConfigs[colKey].textColor;

            const tConfirmed = document.createElement('span');
            const tLive = document.createElement('span');
            tLive.style.opacity = '0.92';
            tLive.textContent = interimText;

            const tCursor = document.createElement('span');
            tCursor.className = 'streaming-cursor inline-block w-1.5 h-3.5 ml-1 bg-amber-400 animate-pulse align-middle rounded-xs';

            p.appendChild(tConfirmed);
            p.appendChild(tLive);
            p.appendChild(tCursor);
            feed.appendChild(p);

            overlayActiveParagraphObjs[colKey] = { p, confirmedSpan: tConfirmed, liveSpan: tLive, cursorEl: tCursor };
          } else {
            const hasConfirmed = activeObj.confirmedSpan.textContent.trim().length > 0;
            activeObj.liveSpan.textContent = (hasConfirmed ? ' ' : '') + interimText;
          }
          overlayLastSubtitleTimes[colKey] = now;
          feed.scrollTop = feed.scrollHeight;
          const stage = document.getElementById('overlay-stage');
          if (stage) stage.scrollTop = stage.scrollHeight;
          return;
        }

        // NEW_SUBTITLE (frase finalizada)
        const text = (data.text || '').trim();
        if (!text) return;

        const dedupeKey = data.channel + '_' + text;
        if (seenSubtitles.has(dedupeKey)) return;
        seenSubtitles.add(dedupeKey);
        if (seenSubtitles.size > 150) {
          const first = seenSubtitles.values().next().value;
          seenSubtitles.delete(first);
        }

        if (isPause) {
          if (feed.lastElementChild) {
            feed.lastElementChild.className = 'leading-relaxed transition-all duration-200 mb-3 whitespace-normal break-words';
            feed.lastElementChild.style.opacity = '0.70';
            feed.lastElementChild.style.fontWeight = '400';
            feed.lastElementChild.style.color = overlayColConfigs[colKey].textColor;
          }

          const p = document.createElement('p');
          p.className = 'leading-relaxed transition-all duration-300 mb-3 font-bold drop-shadow-md whitespace-normal break-words';
          p.style.opacity = '1.0';
          p.style.color = overlayColConfigs[colKey].textColor;

          const tConfirmed = document.createElement('span');
          tConfirmed.textContent = text;
          const tLive = document.createElement('span');
          const tCursor = document.createElement('span');
          tCursor.className = 'streaming-cursor inline-block w-1.5 h-3.5 ml-1 bg-amber-400 animate-pulse align-middle rounded-xs';

          p.appendChild(tConfirmed);
          p.appendChild(tLive);
          p.appendChild(tCursor);
          feed.appendChild(p);

          overlayActiveParagraphObjs[colKey] = { p, confirmedSpan: tConfirmed, liveSpan: tLive, cursorEl: tCursor };
        } else {
          const prev = activeObj.confirmedSpan.textContent.trim();
          activeObj.confirmedSpan.textContent = prev ? (prev + ' ' + text) : text;
          activeObj.liveSpan.textContent = '';
        }
        overlayLastSubtitleTimes[colKey] = now;

        while (feed.children.length > 25) {
          feed.removeChild(feed.firstChild);
        }

        feed.scrollTop = feed.scrollHeight;
        const stage = document.getElementById('overlay-stage');
        if (stage) stage.scrollTop = stage.scrollHeight;
      }

      // 1. SINCRONIZAÇÃO LOCAL (BroadcastChannel)
      try {
        const channel = new BroadcastChannel('brain_subtitles_channel');
        channel.onmessage = (event) => {
          handleIncomingSubtitle(event.data);
        };
      } catch(e) {}

      // 2. SINCRONIZAÇÃO GLOBAL EM NUVEM (MQTT) E PRESENÇA DE AUDIÊNCIA
      const safeMeetingId = encodeURIComponent(id).replace(/[^a-zA-Z0-9_-]/g, '_');
      const mqttTopic = 'brainaudiovisual/meeting/' + safeMeetingId + '/subtitles';
      const mqttPresenceTopic = 'brainaudiovisual/meeting/' + safeMeetingId + '/presence';

      const audienceSessionId = 'aud_' + Math.random().toString(36).substring(2, 9);
      let presenceBc = null;
      try { presenceBc = new BroadcastChannel('brain_presence_' + safeMeetingId); } catch(e) {}

      function sendAudiencePresenceHeartbeat() {
        const payload = {
          type: 'HEARTBEAT',
          meetingId: id,
          lang: currentAudienceLang,
          clientId: audienceSessionId,
          timestamp: Date.now()
        };
        try { if (presenceBc) presenceBc.postMessage(payload); } catch(e) {}
        try {
          if (typeof mqttAudienceClient !== 'undefined' && mqttAudienceClient && mqttAudienceClient.connected) {
            mqttAudienceClient.publish(mqttPresenceTopic, JSON.stringify(payload));
          }
        } catch(e) {}
        try { localStorage.setItem('brain_presence_ping_' + safeMeetingId, JSON.stringify(payload)); } catch(e) {}
      }

      setInterval(sendAudiencePresenceHeartbeat, 3000);
      setTimeout(sendAudiencePresenceHeartbeat, 600);
      try {
        if (typeof mqtt !== 'undefined') {
          window.mqttAudienceClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId: 'brain_aud_' + Math.random().toString(16).substring(2, 8),
            clientId: 'brain_telao_' + Math.random().toString(16).substring(2, 8),
            clean: true,
            connectTimeout: 7000,
            reconnectPeriod: 3000
          });
          const mqttClient = window.mqttAudienceClient;
          mqttClient.on('connect', () => {
            sendAudiencePresenceHeartbeat();
            const ind = document.getElementById('overlay-cloud-indicator');
            if (ind) {
              ind.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Nuvem Ao Vivo';
              ind.className = 'hidden sm:flex items-center gap-1.5 text-[11px] font-semibold text-emerald-400 bg-emerald-950/40 border border-emerald-800/60 px-2 py-0.5 rounded-full';
            }
          });
          mqttClient.on('message', (topic, payload) => {
            try {
              const parsed = JSON.parse(payload.toString());
              handleIncomingSubtitle(parsed);
            } catch(err) {}
          });
        }
      } catch(e) {}
    }

      // HELPER DE NORMALIZAÇÃO TEXTUAL PARA ELIMINAÇÃO ABSOLUTA DE REPETIÇÕES
      function cleanNorm(s) {
        return (s || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[.,!?;:«»""'']/g, ' ').replace(/\s+/g, ' ').trim();
      }

      // GERENCIAMENTO DE VOZES HUMANIZADAS (Web Speech API) COM PONTUAÇÃO NEURAL E RESILIÊNCIA MOBILE
      function getBestVoiceForCurrentLang(genderPref) {
        if (!('speechSynthesis' in window)) return null;
        const voices = window.speechSynthesis.getVoices();
        if (!voices || voices.length === 0) return null;

        const langCode = (currentAudienceLang || 'en').split('-')[0].toLowerCase();
        const fullLang = (currentAudienceLang || 'en-US').toLowerCase().replace('_', '-');

        const matched = voices.filter(v => {
          if (!v.lang) return false;
          const vl = v.lang.toLowerCase().replace('_', '-');
          return vl.startsWith(langCode) || vl === fullLang;
        });
        if (matched.length === 0) return null;

        const cleanStr = (s) => (s || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

        const maleKeywords = [
          'male', 'homem', 'masculino', 'uomo', 'homme', 'mann', 'man', 'boy', 'guy',
          'arthur', 'jorge', 'diego', 'carlos', 'daniel', 'alvaro', 'alex', 'david',
          'mark', 'george', 'thomas', 'henri', 'hans', 'stefan', 'cosimo', 'gabriel',
          'paul', 'felipe', 'antonio', 'manuel', 'pedro', 'miguel', 'enrique', 'alberto',
          'ricardo', 'roberto', 'vicente', 'lucas', 'matheus', 'joao', 'gustavo',
          'voice 1', 'voice 3', 'voice 5', 'voice-1', 'voice-3', 'voice-5',
          '-m-', '-male', '#male', 'male-', 'x-yda', 'x-eed', 'x-sfg', 'x-m'
        ];

        const femaleKeywords = [
          'female', 'mulher', 'feminina', 'donna', 'femme', 'frau', 'woman', 'girl',
          'sofia', 'luciana', 'helena', 'monica', 'maria', 'paulina', 'victoria',
          'samantha', 'karen', 'elena', 'zira', 'jenny', 'aria', 'alice', 'anna',
          'denise', 'celine', 'hortense', 'clara', 'beatriz', 'katja', 'marlene',
          'laura', 'giulia', 'amalie', 'conchita', 'penelope', 'francisca',
          'voice 2', 'voice 4', 'voice-2', 'voice-4',
          '-f-', '-female', '#female', 'female-', 'x-afs', 'x-ana', 'x-f'
        ];

        const scored = matched.map(v => {
          const name = cleanStr(v.name);
          const uri = cleanStr(v.voiceURI);
          let score = 0;

          // 1. Alta fidelidade neural / natural / studio
          if (name.includes('natural') || name.includes('neural')) score += 140;
          if (name.includes('enhanced') || name.includes('premium')) score += 130;
          if (name.includes('siri') || name.includes('apple')) score += 110;
          if (name.includes('google')) score += 100;
          if (name.includes('online') || name.includes('wavenet') || name.includes('network')) score += 80;
          if (v.localService === false) score += 50;
          if (name.includes('compact') || name.includes('offline') || name.includes('espeak') || name.includes('pico')) score -= 80;

          const hasMaleKeyword = maleKeywords.some(k => name.includes(k) || uri.includes(k));
          const hasFemaleKeyword = femaleKeywords.some(k => name.includes(k) || uri.includes(k));

          // 2. Correspondência estrita de gênero
          if (genderPref === 'male') {
            if (hasMaleKeyword) score += 300;
            if (hasFemaleKeyword) score -= 300;
          } else if (genderPref === 'female') {
            if (hasFemaleKeyword) score += 300;
            if (hasMaleKeyword) score -= 300;
          }

          // 3. Dialeto exato
          if (v.lang.toLowerCase().replace('_', '-') === fullLang) score += 30;

          return { voice: v, score, isMale: hasMaleKeyword, isFemale: hasFemaleKeyword };
        });

        scored.sort((a, b) => b.score - a.score);
        const best = scored[0];
        return { voice: best.voice, isMale: best.isMale, isFemale: best.isFemale };
      }

      function startDiscreetVuMeter(isActive) {

          return;
        }

        vuMeterInterval = setInterval(() => {
          bars.forEach((b, i) => {
            const randomH = Math.floor(Math.random() * 16) + 4;
            b.style.height = randomH + 'px';
            b.className = 'audience-vu-bar w-1.5 rounded-full transition-all duration-100 ' + (
              randomH > 14 ? 'bg-emerald-500 shadow-xs shadow-emerald-500/50' :
              randomH > 8 ? 'bg-teal-400' : 'bg-indigo-400'
            );
          });
        }, 120);
