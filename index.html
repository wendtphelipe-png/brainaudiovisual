<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Audiovisual</title>
  <link rel="icon" type="image/svg+xml" href="frontend/public/favicon.svg">
  <!-- Tailwind CSS & Lucide Icons via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.25); }
    }
    .animate-pulse-live {
      animation: pulseLive 2s infinite;
    }

    /* ========================================================
       TEMA CLARO CONFORTÁVEL (Fundo suave anti-reflexo, sem excesso de branco)
       ======================================================== */
    body.light-mode {
      background-color: #f1f5f9 !important;
      color: #0f172a !important;
    }

    /* ========================================================
       TEMA ESCURO PROFISSIONAL (Estúdio / Baixa Luminosidade - 100% da Página)
       ======================================================== */
    html.dark,
    html.dark body,
    body.dark,
    body.dark-mode {
      background-color: #0b0f19 !important;
      color: #f1f5f9 !important;
    }

    /* Headers, Topos Congelados e Barras */
    html.dark header,
    html.dark .sticky,
    html.dark [class*="backdrop-blur"] {
      background-color: rgba(15, 23, 42, 0.96) !important;
      border-color: #334155 !important;
      color: #f8fafc !important;
    }

    /* Cards, Seções e Gradients no Dashboard e Cockpit */
    html.dark section,
    html.dark .bg-white:not(input):not(select):not(textarea):not(button),
    html.dark [class*="bg-white"]:not(input):not(select):not(textarea):not(button),
    html.dark [class*="bg-slate-50"]:not(input):not(select):not(textarea):not(button),
    html.dark [class*="bg-slate-100"]:not(input):not(select):not(textarea):not(button):not(#meeting-progress-bar),
    html.dark [class*="bg-slate-200"]:not(input):not(select):not(textarea):not(button),
    html.dark [class*="from-blue-50"]:not(button),
    html.dark [class*="from-indigo-50"]:not(button),
    html.dark [class*="from-emerald-50"]:not(button) {
      background-color: #111827 !important;
      border-color: #374151 !important;
      color: #f8fafc !important;
    }

    /* Cabeçalhos de Seções e Sub-blocos */
    html.dark section > div:first-child,
    html.dark [class*="bg-blue-100"]:not(button):not(span),
    html.dark [class*="bg-indigo-100"]:not(button):not(span),
    html.dark [class*="bg-emerald-100"]:not(button):not(span) {
      background-color: #1e293b !important;
      border-color: #374151 !important;
      color: #f8fafc !important;
    }

    /* Tipografia e Títulos */
    html.dark .text-slate-900,
    html.dark .text-slate-800,
    html.dark .text-slate-700,
    html.dark h1, html.dark h2, html.dark h3, html.dark h4, html.dark strong {
      color: #f8fafc !important;
    }

    html.dark .text-slate-600,
    html.dark .text-slate-500 {
      color: #cbd5e1 !important;
    }

    html.dark .text-slate-400 {
      color: #94a3b8 !important;
    }

    /* Bordas */
    html.dark .border-slate-200,
    html.dark .border-slate-300,
    html.dark .border-blue-100,
    html.dark .border-blue-200,
    html.dark .border-indigo-100,
    html.dark .border-indigo-200,
    html.dark .border-emerald-100,
    html.dark .border-emerald-200 {
      border-color: #374151 !important;
    }

    /* CAMPOS DINÂMICOS QUE PODEM SER ALTERADOS (MANTIDOS COM FUNDO BRANCO E TEXTO ESCURO NO DARK MODE) */
    html.dark input:not([type="range"]):not([type="color"]):not([type="checkbox"]):not([type="radio"]),
    html.dark select,
    html.dark textarea {
      background-color: #ffffff !important;
      color: #0f172a !important;
      border: 1.5px solid #cbd5e1 !important;
      font-weight: 600 !important;
    }
    html.dark select option {
      background-color: #ffffff !important;
      color: #0f172a !important;
    }
    html.dark input::placeholder,
    html.dark textarea::placeholder {
      color: #64748b !important;
    }

    /* PRESERVAÇÃO DA BARRA DE PROGRESSO NO DARK MODE (GRADIENTE VIVO) */
    html.dark #meeting-progress-bar {
      opacity: 1 !important;
      background-image: linear-gradient(to right, #10b981, #2dd4bf, #059669) !important;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.5) !important;
    }

    /* PRESERVAÇÃO DAS CORES VIVAS DE TODOS OS BOTÕES COLORIDOS NO DARK MODE */
    html.dark button[class*="bg-blue-"], html.dark a[class*="bg-blue-"] {
      background-color: #2563eb !important;
      color: #ffffff !important;
    }
    html.dark button[class*="bg-blue-"]:hover, html.dark a[class*="bg-blue-"]:hover {
      background-color: #1d4ed8 !important;
    }
    html.dark button[class*="bg-indigo-"], html.dark a[class*="bg-indigo-"] {
      background-color: #4f46e5 !important;
      color: #ffffff !important;
    }
    html.dark button[class*="bg-indigo-"]:hover, html.dark a[class*="bg-indigo-"]:hover {
      background-color: #4338ca !important;
    }
    html.dark button[class*="bg-emerald-"], html.dark a[class*="bg-emerald-"],
    html.dark button[class*="bg-green-"], html.dark a[class*="bg-green-"] {
      background-color: #059669 !important;
      color: #ffffff !important;
    }
    html.dark button[class*="bg-emerald-"]:hover, html.dark a[class*="bg-emerald-"]:hover {
      background-color: #047857 !important;
    }
    html.dark button[class*="bg-rose-"], html.dark a[class*="bg-rose-"],
    html.dark button[class*="bg-red-"], html.dark a[class*="bg-red-"] {
      background-color: #e11d48 !important;
      color: #ffffff !important;
    }
    html.dark button[class*="bg-rose-"]:hover, html.dark a[class*="bg-rose-"]:hover {
      background-color: #be123c !important;
    }
    html.dark button[class*="bg-amber-"], html.dark a[class*="bg-amber-"] {
      background-color: #f59e0b !important;
      color: #020617 !important;
    }
    html.dark button[class*="bg-purple-"], html.dark a[class*="bg-purple-"] {
      background-color: #9333ea !important;
      color: #ffffff !important;
    }
    /* Preserva botões de amostra de paleta de cor das legendas e overlay OBS */
    html.dark button[onclick*="setSubtitleBg"],
    html.dark button[onclick*="setSubtitleText"],
    html.dark button[onclick*="setOverlayBg"],
    html.dark button[onclick*="setOverlayTextColor"] {
      border: 1px solid rgba(255, 255, 255, 0.5) !important;
    }

    /* Modais */
    html.dark #share-telao-modal > div,
    html.dark #finish-meeting-modal > div,
    html.dark #test-lab-modal > div {
      background-color: #111827 !important;
      border-color: #374151 !important;
      color: #f8fafc !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased m-0 min-h-screen">

  <div id="app-root"></div>

  <script>
    // ========================================================
    // HELPERS GLOBAIS DE ESTADO E PERSISTÊNCIA SEGURA
    // ========================================================
    // ========================================================
    // GERENCIADOR DE TEMA GLOBAL (MODO CLARO CONFORTÁVEL & MODO ESCURO)
    // ========================================================
    function getStoredTheme() {
      try {
        return localStorage.getItem('brain_theme') || 'light';
      } catch(e) { return 'light'; }
    }

    function setGlobalTheme(theme) {
      try {
        localStorage.setItem('brain_theme', theme);
      } catch(e) {}
      const isDark = theme === 'dark';
      if (isDark) {
        document.documentElement.classList.add('dark');
        document.body.classList.add('dark');
        document.body.classList.add('dark-mode');
        document.body.classList.remove('light-mode');
      } else {
        document.documentElement.classList.remove('dark');
        document.body.classList.remove('dark');
        document.body.classList.remove('dark-mode');
        document.body.classList.add('light-mode');
      }
      updateThemeButtonUI();
    }

    window.toggleGlobalTheme = function() {
      const current = getStoredTheme();
      const next = current === 'dark' ? 'light' : 'dark';
      setGlobalTheme(next);
    };

    function updateThemeButtonUI() {
      const isDark = getStoredTheme() === 'dark';
      const btns = document.querySelectorAll('.btn-theme-toggle');
      btns.forEach(btn => {
        btn.innerHTML = isDark 
          ? '<span>☀️ Modo Claro</span>' 
          : '<span>🌙 Modo Escuro</span>';
        btn.className = isDark
          ? 'btn-theme-toggle text-xs font-bold px-3 py-1.5 rounded-xl border border-amber-400/50 bg-amber-500/10 text-amber-300 hover:bg-amber-500/20 transition-all cursor-pointer flex items-center gap-1.5 shadow-2xs'
          : 'btn-theme-toggle text-xs font-bold px-3 py-1.5 rounded-xl border border-slate-300 bg-white hover:bg-slate-100 text-slate-800 transition-all cursor-pointer flex items-center gap-1.5 shadow-2xs';
      });
    }

    // Inicializa o tema memorizado
    setTimeout(() => {
      setGlobalTheme(getStoredTheme());
    }, 10);

    function getStoredAccounts() {
      try {
        const raw = localStorage.getItem('brain_saved_accounts');
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr) && arr.length > 0) return arr;
        }
      } catch (e) {}
      return [
        { id: 'acc-1', name: 'Conta Google Pro 01 (Principal)', email: '', connected: false },
        { id: 'acc-2', name: 'Conta Google Pro 02 (Auxiliar/Tradução)', email: '', connected: false },
        { id: 'acc-3', name: 'Slot Google Pro 03', email: '', connected: false },
        { id: 'acc-4', name: 'Slot Google Pro 04', email: '', connected: false }
      ];
    }

    function getStoredMeetings() {
      try {
        const raw = localStorage.getItem('brain_saved_meetings');
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) return arr;
        }
      } catch (e) {}
      return [];
    }

    function getStoredAudioLanguageSettings() {
      let settings = {
        sourceLanguage: 'pt-BR',
        sourceLanguageLabel: 'Português (Brasil)',
        targetLanguage: 'en-US',
        targetLanguageLabel: 'Inglês (Estados Unidos / Global)',
        transmitterInputDevice: 'event-line',
        transmitterInputLabel: 'Áudio do Evento (Mesa de Som / Linha)',
        transmitterSpeakerMuted: true,
        receiverInputMuted: true,
        receiverOutputDevice: 'cable',
        receiverOutputLabel: 'CABLE Output / VB-Audio Virtual Cable (Mesa de Som)',
        cameraDisabled: true
      };
      try {
        const raw = localStorage.getItem('brain_audio_lang_settings');
        if (raw) {
          const parsed = JSON.parse(raw);
          settings = Object.assign(settings, parsed);
        }
      } catch (e) {}
      return settings;
    }

    function saveStoredAudioLanguageSettings(settings) {
      try {
        localStorage.setItem('brain_audio_lang_settings', JSON.stringify(settings));
      } catch (e) {}
    }

    // ========================================================
    // ROTEAMENTO DINÂMICO
    // ========================================================
    const params = new URLSearchParams(window.location.search);
    const isAudiencePage = params.get('view') === 'audience' || params.get('view') === 'listener' || params.get('listener') === 'true' || window.location.pathname.startsWith('/listener') || window.location.pathname.startsWith('/audience');
    const isOverlaySubtitles = params.get('overlay') === 'subtitles' || params.get('telao') === 'true' || window.location.pathname.startsWith('/overlay/subtitles') || window.location.pathname.startsWith('/telao');
    const isAdmin = params.get('admin') === 'true' || params.has('admin') || window.location.pathname === '/admin' || window.location.pathname.startsWith('/admin');
    const meetingId = params.get('meeting') || (window.location.pathname.startsWith('/meeting/') ? window.location.pathname.split('/')[2] : null);

    const root = document.getElementById('app-root') || document.body;

    try {
      // 1. ROTA DEDICADA: PÁGINA DO ESPECTADOR / AUDIÊNCIA (?meeting=xyz&view=audience)
      if (isAudiencePage && meetingId) {
        document.body.className = "bg-slate-50 text-slate-800 font-sans antialiased m-0 min-h-screen selection:bg-indigo-500/30 selection:text-indigo-600";
        setGlobalTheme(getStoredTheme());
        renderAudienceListenerPage(meetingId);
      }
      // 2. ROTA DEDICADA: JANELA EXCLUSIVA DE LEGENDAS PARA OBS / BROADCAST (?meeting=xyz&overlay=subtitles)
      else if (isOverlaySubtitles && meetingId) {
        document.body.className = "bg-black text-white font-sans antialiased m-0 min-h-screen overflow-x-hidden selection:bg-blue-500/30 selection:text-blue-200";
        renderSubtitleOverlayPage(meetingId);
      }
      // 3. ROTA: MONITOR DEDICADO DO COCKPIT DA REUNIÃO (?meeting=xyz ou /meeting/xyz)
      else if (meetingId) {
        document.body.className = "font-sans antialiased m-0 min-h-screen selection:bg-blue-500/30 selection:text-blue-200";
        setGlobalTheme(getStoredTheme());
        try {
          renderMeetingRoomMonitor(meetingId);
        } catch(err) {
          console.error("Erro crítico ao inicializar Cockpit da Reunião:", err);
          root.innerHTML = `
            <div class="min-h-screen flex items-center justify-center p-6">
              <div class="max-w-md w-full bg-slate-900 border border-rose-500/40 rounded-3xl p-8 text-center shadow-2xl">
                <div class="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-xl font-bold mx-auto mb-4">⚠️</div>
                <h2 class="text-base font-bold text-white mb-2">Erro ao Iniciar Cockpit</h2>
                <p class="text-xs text-slate-400 mb-6 font-mono">${err.message || String(err)}</p>
                <div class="flex items-center justify-center gap-3">
                  <button onclick="window.location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2.5 rounded-xl font-semibold transition-all">Recarregar</button>
                  <a href="/admin" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-4 py-2.5 rounded-xl font-semibold transition-all">Voltar ao Painel</a>
                </div>
              </div>
            </div>
          `;
        }
      } 
      // 4. ROTA: ÁREA ADMINISTRATIVA / DASHBOARD CENTRAL DE EVENTOS (/admin ou ?admin=true)
      else if (isAdmin) {
        document.body.className = "font-sans antialiased m-0 min-h-screen";
        setGlobalTheme(getStoredTheme());
        renderAdminDashboard();
      }
      // 5. ROTA PADRÃO PÚBLICA: PÁGINA EM CONSTRUÇÃO CLEAN E CLARA (/)
      else {
        document.body.className = "bg-[#f8fafc] text-[#0f172a] font-sans antialiased m-0 min-h-screen flex items-center justify-center p-6 text-center";
        renderPublicConstructionPage();
      }
    } catch(globalRouterErr) {
      console.error("Erro fatal no roteamento da aplicação:", globalRouterErr);
      if (root) {
        root.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-6">
            <div class="max-w-md w-full bg-white dark:bg-slate-900 border border-rose-300 dark:border-rose-800 rounded-3xl p-8 text-center shadow-xl">
              <div class="w-12 h-12 rounded-2xl bg-rose-500/10 text-rose-500 flex items-center justify-center text-xl font-bold mx-auto mb-4">⚠️</div>
              <h2 class="text-base font-bold text-slate-900 dark:text-white mb-2">Erro de Inicialização</h2>
              <p class="text-xs text-slate-500 dark:text-slate-400 mb-6 font-mono">${globalRouterErr.message || String(globalRouterErr)}</p>
              <div class="flex items-center justify-center gap-3">
                <button onclick="window.location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2.5 rounded-xl font-semibold transition-all">Recarregar</button>
                <a href="/admin" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-4 py-2.5 rounded-xl font-semibold transition-all">Acessar Admin</a>
              </div>
            </div>
          </div>
        `;
      }
    }

    // ========================================================
    // TELA 0: CALLBACK DA JANELA POPUP DO GOOGLE OAUTH
    // ========================================================
    function renderOAuthCallbackPopup() {
      document.body.className = "bg-slate-900 text-white font-sans antialiased m-0 flex items-center justify-center min-h-screen p-6 text-center";
      
      const searchParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash);
      
      const error = searchParams.get('error') || hashParams.get('error');
      const code = searchParams.get('code');
      const accessToken = hashParams.get('access_token');
      const slotId = searchParams.get('state') || hashParams.get('state') || 'acc-1';

      root.innerHTML = `
        <div class="max-w-md w-full bg-slate-950 border border-slate-800 rounded-3xl p-8 shadow-2xl">
          <div id="cb-box">
            <div class="w-12 h-12 rounded-full border-4 border-blue-500 border-t-transparent animate-spin mx-auto mb-4"></div>
            <h2 class="text-base font-bold text-white mb-2">Processando Conexão com o Google...</h2>
            <p class="text-xs text-slate-400">Verificando a autenticação da sua conta Google Workspace Pro.</p>
          </div>
        </div>
      `;

      if (error) {
        document.getElementById('cb-box').innerHTML = `
          <div class="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-xl font-bold mx-auto mb-4">✕</div>
          <h2 class="text-base font-bold text-rose-400 mb-2">Autorização Não Concluída</h2>
          <p class="text-xs text-slate-400 mb-5">${error === 'access_denied' ? 'O acesso foi recusado na janela do Google.' : error}</p>
          <button onclick="window.close()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-5 py-2.5 rounded-xl font-semibold">Fechar Janela</button>
        `;
        if (window.opener) {
          try {
            window.opener.postMessage({ type: 'GOOGLE_AUTH_ERROR', error, slotId }, '*');
          } catch (e) {}
        }
        return;
      }

      if (accessToken) {
        // Valida imediatamente com a API oficial do Google
        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: { 'Authorization': 'Bearer ' + accessToken }
        })
        .then(r => r.json())
        .then(userInfo => {
          document.getElementById('cb-box').innerHTML = `
            <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl font-bold mx-auto mb-4">✓</div>
            <h2 class="text-base font-bold text-emerald-400 mb-1">Conta Google Pro Conectada!</h2>
            <p class="text-xs text-slate-300 font-semibold mb-1">${userInfo.name || 'Conta Google'}</p>
            <p class="text-xs text-blue-400 font-mono mb-4">${userInfo.email}</p>
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-[11px] font-medium border border-emerald-500/20 mb-3">
              <span>● Token Pro Verificado com Sucesso</span>
            </div>
            <p class="text-[11px] text-slate-500">Retornando ao painel em instantes...</p>
          `;

          if (window.opener) {
            try {
              window.opener.postMessage({
                type: 'GOOGLE_AUTH_SUCCESS',
                slotId: slotId,
                email: userInfo.email,
                name: userInfo.name,
                picture: userInfo.picture,
                tokens: { access_token: accessToken }
              }, '*');
            } catch (e) {}
          }
          setTimeout(() => { window.close(); }, 1400);
        })
        .catch(err => {
          document.getElementById('cb-box').innerHTML = `
            <div class="text-rose-400 text-xs">Erro na validação do token: ${err.message}</div>
          `;
        });
      } else if (code) {
        // Envia o código para o opener
        if (window.opener) {
          try {
            window.opener.postMessage({
              type: 'GOOGLE_AUTH_CODE',
              slotId: slotId,
              code: code
            }, '*');
          } catch (e) {}
        }
        document.getElementById('cb-box').innerHTML = `
          <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl font-bold mx-auto mb-4">✓</div>
          <h2 class="text-base font-bold text-emerald-400 mb-2">Código de Autorização Recebido!</h2>
          <p class="text-xs text-slate-400 mb-4">Concluindo validação no painel...</p>
        `;
        setTimeout(() => { window.close(); }, 1200);
      }
    }

    // ========================================================
    // TELA 1: PÁGINA PÚBLICA CLEAN (EM CONSTRUÇÃO)
    // ========================================================
    function renderPublicConstructionPage() {
      document.title = "Brain Audiovisual — Página em construção";
      document.documentElement.classList.remove('dark');
      document.body.className = "bg-[#f8fafc] text-[#0f172a] font-sans antialiased m-0 min-h-screen flex items-center justify-center p-6 text-center";
      root.innerHTML = `
        <div class="max-w-xl flex flex-col items-center justify-center" style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; width: 100%; max-width: 36rem;">
          <h1 class="text-4xl sm:text-5xl md:text-6xl font-semibold tracking-tight text-[#0f172a] mb-5 leading-tight" style="font-family: inherit; font-size: 2.75rem; font-weight: 600; letter-spacing: -0.025em; color: #0f172a; margin-bottom: 1.25rem; line-height: 1.15;">
            Brain Audiovisual
          </h1>
          <div class="w-12 h-[1.5px] bg-[#cbd5e1] mb-6" style="width: 3rem; height: 1.5px; background-color: #cbd5e1; margin-bottom: 1.5rem;"></div>
          <p class="text-xs sm:text-sm font-medium tracking-[0.22em] uppercase text-[#64748b]" style="font-size: 0.85rem; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: #64748b; margin: 0;">
            Página em construção
          </p>
        </div>
      `;
    }

    // ========================================================
    // CONTROLE DE AUTENTICAÇÃO DO ADMINISTRADOR
    // ========================================================
    function checkAdminAuthAndRender() {
      // Suporte a acesso direto via URL (?auto=1 ou ?token=master)
      if (params.get('auto') === '1' || params.get('token') === 'master') {
        localStorage.setItem('brain_admin_token', 'bat_static_master');
        renderAdminDashboard();
        return;
      }

      const token = localStorage.getItem('brain_admin_token') || sessionStorage.getItem('brain_admin_token');

      if (!token) {
        renderAdminLoginScreen();
        return;
      }

      // Se tiver token estático válido, renderiza direto o dashboard sem depender de requisição de rede
      if (token.startsWith('bat_') || token === 'admin_auth_success') {
        renderAdminDashboard();
        return;
      }

      // Valida sessão com o backend se disponível
      fetch('/api/admin/verify', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(r => {
        if (!r.ok) throw new Error('API indisponível');
        return r.json();
      })
      .then(data => {
        if (data.authenticated) {
          renderAdminDashboard();
        } else {
          localStorage.removeItem('brain_admin_token');
          sessionStorage.removeItem('brain_admin_token');
          renderAdminLoginScreen('Sessão expirada. Faça login novamente.');
        }
      })
      .catch(() => {
        renderAdminLoginScreen();
      });
    }

    window.handleAdminLoginSubmit = function(e) {
      e.preventDefault();
      const user = document.getElementById('admin-username').value.trim();
      const pass = document.getElementById('admin-password').value;
      const remember = document.getElementById('remember-me').checked;

      // Autenticação instantânea para credencial master padrão
      if (user === 'admin' && pass === 'BrainAdmin@2026') {
        const token = 'bat_static_' + Date.now();
        if (remember) localStorage.setItem('brain_admin_token', token);
        else sessionStorage.setItem('brain_admin_token', token);
        renderAdminDashboard();
        return;
      }

      // Tenta autenticar via API backend caso seja outro usuário/senha
      fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, password: pass })
      })
      .then(r => {
        if (!r.ok) throw new Error('API indisponível');
        return r.json();
      })
      .then(data => {
        if (data.token) {
          if (remember) localStorage.setItem('brain_admin_token', data.token);
          else sessionStorage.setItem('brain_admin_token', data.token);
          checkAdminAuthAndRender();
        } else {
          renderAdminLoginScreen(data.error || 'Credenciais inválidas.');
        }
      })
      .catch(() => {
        renderAdminLoginScreen('Usuário ou senha incorretos.');
      });
    };

    window.handleAdminLogout = function() {
      const token = localStorage.getItem('brain_admin_token') || sessionStorage.getItem('brain_admin_token');
      fetch('/api/admin/logout', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      }).catch(() => {});
      localStorage.removeItem('brain_admin_token');
      sessionStorage.removeItem('brain_admin_token');
      renderAdminLoginScreen('Você saiu da sessão com segurança.');
    };

    // TELA 2: DASHBOARD CENTRAL DE EVENTOS & MULTISSALAS (SEM MEET)

    function renderAdminDashboard() {
      // Reuniões salvas no localStorage com higienização estrita
      let meetings = [];
      try {
        const savedMeetings = localStorage.getItem('brain_saved_meetings');
        if (savedMeetings) {
          const parsed = JSON.parse(savedMeetings);
          if (Array.isArray(parsed)) {
            meetings = parsed.filter(m => m && typeof m === 'object').map(m => {
              const id = m.id || ('sala-' + Math.random().toString(36).substring(2, 7));
              const title = m.title || ('Sessão de Tradução ' + id);
              const sourceLanguage = (typeof m.sourceLanguage === 'string' && m.sourceLanguage) ? m.sourceLanguage : 'pt-BR';
              const targetLanguages = Array.isArray(m.targetLanguages) && m.targetLanguages.length > 0 
                ? m.targetLanguages.filter(t => typeof t === 'string') 
                : ['en-US', 'es-ES'];
              return {
                id,
                title,
                createdAt: m.createdAt || new Date().toISOString(),
                status: m.status || 'active',
                sourceLanguage,
                autoDetectLanguage: !!m.autoDetectLanguage,
                inputDevice: m.inputDevice || 'default',
                targetLanguages: targetLanguages.length > 0 ? targetLanguages : ['en-US', 'es-ES']
              };
            });
          }
        }
      } catch(e) {
        meetings = [];
      }

      // Idiomas do sistema
      const SUPPORTED_LANGS = [
        { code: 'en-US', name: 'Inglês (Estados Unidos / Global)', flag: '🇺🇸', default: true },
        { code: 'es-ES', name: 'Espanhol (Internacional)', flag: '🇪🇸', default: true },
        { code: 'fr-FR', name: 'Francês', flag: '🇫🇷', default: false },
        { code: 'de-DE', name: 'Alemão', flag: '🇩🇪', default: false },
        { code: 'it-IT', name: 'Italiano', flag: '🇮🇹', default: false },
        { code: 'zh-CN', name: 'Mandarim (China)', flag: '🇨🇳', default: false },
        { code: 'ja-JP', name: 'Japonês', flag: '🇯🇵', default: false }
      ];

      // Estado do formulário de criação
      if (!window._newMeetingFormState) {
        window._newMeetingFormState = {
          title: 'Palco Principal — Sessão Internacional',
          customId: 'sala-' + Math.random().toString(36).substring(2, 7),
          sourceLanguage: 'pt-BR',
          autoDetectLanguage: true,
          inputDevice: 'default',
          selectedTargetLangs: ['en-US', 'es-ES']
        };
      }

      let audioInputDevices = [];
      async function refreshDashboardAudioDevices() {
        try {
          if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
            const devs = await navigator.mediaDevices.enumerateDevices();
            audioInputDevices = devs.filter(d => d.kind === 'audioinput');
            const selectEl = document.getElementById('new-m-input-device');
            if (selectEl && audioInputDevices.length > 0) {
              const currentVal = selectEl.value;
              selectEl.innerHTML = audioInputDevices.map((d, i) => `
                <option value="${d.deviceId}" ${(currentVal === d.deviceId || (i === 0 && currentVal === 'default')) ? 'selected' : ''}>
                  🎙️ ${d.label || ('Microfone / Entrada ' + (i + 1))}
                </option>
              `).join('');
            }
          }
        } catch(e) {}
      }

      // Solicita permissão se ainda não concedida para listar os nomes reais dos microfones
      window.requestMicPermissionForDashboard = async function() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(t => t.stop());
          await refreshDashboardAudioDevices();
          alert('✅ Dispositivos de áudio carregados com sucesso!');
        } catch(err) {
          alert('Aviso: Permissão de microfone não concedida. O sistema usará o dispositivo padrão.');
        }
      };

      window.toggleNewMeetingTargetLang = function(code) {
        const state = window._newMeetingFormState;
        if (!state.selectedTargetLangs) state.selectedTargetLangs = ['en-US', 'es-ES'];
        const idx = state.selectedTargetLangs.indexOf(code);
        if (idx === -1) {
          state.selectedTargetLangs.push(code);
        } else {
          if (state.selectedTargetLangs.length <= 1) {
            alert('A reunião precisa de pelo menos 1 idioma de saída para tradução simultânea.');
            return;
          }
          state.selectedTargetLangs.splice(idx, 1);
        }
        renderDashboardUI();
      };

      window.handleCreateMeetingSubmit = function(e) {
        e.preventDefault();
        const state = window._newMeetingFormState;
        const titleInput = document.getElementById('new-m-title');
        const idInput = document.getElementById('new-m-id');
        const sourceLangInput = document.getElementById('new-m-source-lang');
        const autoDetectInput = document.getElementById('new-m-auto-detect');
        const deviceInput = document.getElementById('new-m-input-device');

        const title = titleInput ? titleInput.value.trim() : state.title;
        let meetingId = idInput ? idInput.value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '-') : state.customId;
        if (!meetingId) meetingId = 'sala-' + Date.now().toString(36);

        const sourceLang = sourceLangInput ? sourceLangInput.value : state.sourceLanguage;
        const autoDetect = autoDetectInput ? autoDetectInput.checked : true;
        const inputDevice = deviceInput ? deviceInput.value : 'default';
        const targetLanguages = state.selectedTargetLangs && state.selectedTargetLangs.length ? state.selectedTargetLangs : ['en-US', 'es-ES'];

        const newMeeting = {
          id: meetingId,
          title: title || 'Sessão Ao Vivo',
          createdAt: new Date().toISOString(),
          status: 'active',
          sourceLanguage: sourceLang,
          autoDetectLanguage: autoDetect,
          inputDevice: inputDevice,
          targetLanguages: targetLanguages
        };

        // Salva nas reuniões
        const existingIdx = meetings.findIndex(m => m.id === meetingId);
        if (existingIdx !== -1) {
          meetings[existingIdx] = newMeeting;
        } else {
          meetings.unshift(newMeeting);
        }
        localStorage.setItem('brain_saved_meetings', JSON.stringify(meetings));

        // Atualiza preferências de áudio
        saveStoredAudioLanguageSettings({
          sourceLanguage: sourceLang,
          targetLanguage: targetLanguages[0] || 'en-US',
          targetLanguages: targetLanguages,
          transmitterInputDevice: inputDevice
        });

        // Redireciona imediatamente para o Cockpit da nova reunião
        window.location.href = '/?meeting=' + encodeURIComponent(meetingId);

    // ========================================================
    // TELA DEDICADA: OVERLAY EXCLUSIVO DE LEGENDAS (OBS / vMIX / BROADCAST)
    // ========================================================
    function renderSubtitleOverlayPage(id) {
      const audioSettings = getStoredAudioLanguageSettings();
      let meeting = null;
      try {
        const saved = JSON.parse(localStorage.getItem('brain_saved_meetings') || '[]');
        meeting = saved.find(m => m.id === id);
      } catch(e) {}

      if (!meeting) {
        meeting = {
          id: id,
          title: 'Sessão de Tradução — ' + id,
          sourceLanguage: audioSettings.sourceLanguage || 'pt-BR',
          targetLanguages: audioSettings.targetLanguages || ['en-US', 'es-ES']
        };
      }

      // Parâmetros de URL
      const urlParams = new URLSearchParams(window.location.search);
      const urlBg = urlParams.get('bg'); // 'chroma' | 'black' | 'transparent'
      let currentBg = urlBg === 'chroma' ? '#00ff00' : (urlBg === 'transparent' ? 'transparent' : '#000000');
      let areControlsHidden = false;

      // Colunas de idiomas suportadas (Padrão: Português, Inglês, Espanhol)
      const ALL_POSSIBLE_COLS = [
        { key: 'trans', name: 'Português (Palestrante)', flag: '🇧🇷', defaultColor: '#ffffff' },
        { key: 'rec', name: 'Inglês (Tradução)', flag: '🇺🇸', defaultColor: '#fde047' },
        { key: 'spanish', name: 'Espanhol', flag: '🇪🇸', defaultColor: '#38bdf8' },
        { key: 'french', name: 'Francês', flag: '🇫🇷', defaultColor: '#c084fc' },
        { key: 'german', name: 'Alemão', flag: '🇩🇪', defaultColor: '#fb923c' },
        { key: 'italian', name: 'Italiano', flag: '🇮🇹', defaultColor: '#4ade80' }
      ];

      // Colunas ativas carregadas do localStorage (Padrão: trans, rec, spanish)
      let enabledCols = ['trans', 'rec', 'spanish'];
      try {
        const storedCols = localStorage.getItem('brain_overlay_enabled_cols');
        if (storedCols) {
          const parsed = JSON.parse(storedCols);
          if (Array.isArray(parsed) && parsed.length > 0) enabledCols = parsed;
        }
      } catch(e) {}

      // Configurações e estilos independentes para cada coluna
      let overlayActiveCustomCol = enabledCols[0] || 'trans';
      let overlayColConfigs = {};
      ALL_POSSIBLE_COLS.forEach(col => {
        overlayColConfigs[col.key] = {
          label: col.name,
          flag: col.flag,
          textColor: localStorage.getItem('brain_overlay_' + col.key + '_color') || col.defaultColor,
          fontSize: parseInt(localStorage.getItem('brain_overlay_' + col.key + '_size')) || 24
        };
      });

      function saveColStyles(colKey) {
        try {
          localStorage.setItem('brain_overlay_' + colKey + '_color', overlayColConfigs[colKey].textColor);
          localStorage.setItem('brain_overlay_' + colKey + '_size', overlayColConfigs[colKey].fontSize);
        } catch(e) {}
      }

      function updateGridColClasses() {
        const grid = document.getElementById('overlay-grid');
        if (!grid) return;
        const visibleCount = enabledCols.length;
        grid.className = 'grid gap-6 w-full ' + (
          visibleCount >= 4 ? 'grid-cols-4 max-w-[98%]' :
          visibleCount === 3 ? 'grid-cols-3 max-w-[96%]' :
          visibleCount === 2 ? 'grid-cols-2 max-w-5xl' :
          'grid-cols-1 max-w-3xl'
        ) + ' mx-auto';

        ALL_POSSIBLE_COLS.forEach(col => {
          const colEl = document.getElementById('overlay-col-' + col.key);
          if (colEl) {
            colEl.classList.toggle('hidden', !enabledCols.includes(col.key));
          }
        });
      }

      window.toggleOverlayColVisibility = function(colKey) {
        const idx = enabledCols.indexOf(colKey);
        if (idx !== -1) {
          if (enabledCols.length <= 1) {
            alert('A janela do OBS precisa de pelo menos 1 coluna de idioma visível.');
            return;
          }
          enabledCols.splice(idx, 1);
        } else {
          enabledCols.push(colKey);
        }
        try {
          localStorage.setItem('brain_overlay_enabled_cols', JSON.stringify(enabledCols));
        } catch(e) {}

        if (!enabledCols.includes(overlayActiveCustomCol)) {
          overlayActiveCustomCol = enabledCols[0] || 'trans';
        }

        renderOverlayUI();
      };

      window.selectOverlayCustomCol = function(colKey) {
        overlayActiveCustomCol = colKey;
        const cfg = overlayColConfigs[colKey];
        const label = document.getElementById('overlay-col-editing-label');
        if (label) label.innerText = cfg.flag + ' ' + cfg.label.split(' ')[0] + ':';
        const ind = document.getElementById('overlay-font-indicator');
        if (ind) ind.innerText = cfg.fontSize + 'px';
        const picker = document.getElementById('overlay-color-picker');
        if (picker) picker.value = cfg.textColor;

        ALL_POSSIBLE_COLS.forEach(col => {
          const tab = document.getElementById('tab-custom-' + col.key);
          if (tab) {
            tab.className = col.key === colKey
              ? 'px-2 py-0.5 rounded-md bg-indigo-600 text-white font-bold'
              : 'px-2 py-0.5 rounded-md text-slate-300 hover:text-white';
          }
        });
      };

      window.setOverlayActiveColColor = function(color) {
        const colKey = overlayActiveCustomCol;
        overlayColConfigs[colKey].textColor = color;
        saveColStyles(colKey);

        const feed = document.getElementById('overlay-feed-' + colKey);
        if (feed) {
          feed.style.color = color;
          feed.querySelectorAll('p').forEach(p => {
            if (!p.classList.contains('italic')) p.style.color = color;
          });
        }
        const picker = document.getElementById('overlay-color-picker');
        if (picker) picker.value = color;
      };

      window.changeOverlayActiveColFont = function(delta) {
        const colKey = overlayActiveCustomCol;
        overlayColConfigs[colKey].fontSize = Math.max(16, Math.min(56, overlayColConfigs[colKey].fontSize + delta));
        saveColStyles(colKey);

        const ind = document.getElementById('overlay-font-indicator');
        if (ind) ind.innerText = overlayColConfigs[colKey].fontSize + 'px';

        const feed = document.getElementById('overlay-feed-' + colKey);
        if (feed) feed.style.fontSize = overlayColConfigs[colKey].fontSize + 'px';
      };

      window.setOverlayBg = function(bg) {
        currentBg = bg;
        const container = document.getElementById('overlay-container');
        if (container) {
          container.style.backgroundColor = bg;
          document.body.style.backgroundColor = bg;
        }
      };

      window.toggleOverlayControls = function() {
        areControlsHidden = !areControlsHidden;
        const bar = document.getElementById('overlay-topbar');
        const hint = document.getElementById('overlay-hidden-hint');
        if (bar) bar.style.display = areControlsHidden ? 'none' : 'flex';
        if (hint) hint.classList.toggle('hidden', !areControlsHidden);
      };

      window.addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') {
          toggleOverlayControls();
        }
      });

      function renderOverlayUI() {
        const activeCfg = overlayColConfigs[overlayActiveCustomCol];

        root.innerHTML = `
          <div id="overlay-container" class="min-h-screen flex flex-col justify-between transition-colors duration-300 relative select-none" style="background-color: ${currentBg};">
            <!-- BARRA DE CONTROLE SUPERIOR (OCULTÁVEL COM 'H') -->
            <div id="overlay-topbar" class="p-3 bg-slate-900/95 backdrop-blur-md border-b border-slate-700 flex flex-wrap items-center justify-between gap-3 text-xs z-50 text-slate-200">
              
              <div class="flex items-center gap-2.5">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <strong class="font-bold text-white tracking-wide">BROADCAST MULTI-IDIOMAS (OBS & TELÃO)</strong>
                <span class="text-slate-400 font-mono text-[11px]">(${meeting.title})</span>
                
                <span id="overlay-cloud-indicator" class="hidden sm:flex items-center gap-1.5 text-[11px] font-semibold text-emerald-400 bg-emerald-950/40 border border-emerald-800/60 px-2 py-0.5 rounded-full">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Nuvem Ao Vivo
                </span>
              </div>

              <!-- SELETOR DE COLUNAS VISÍVEIS (CHECKBOXES DE IDIOMAS) -->
              <div class="flex items-center gap-1.5 bg-slate-800/90 p-1 rounded-xl border border-slate-700 text-xs">
                <span class="text-slate-400 text-[11px] font-semibold px-1">Exibir Colunas:</span>
                <div class="flex flex-wrap items-center gap-1">
                  ${ALL_POSSIBLE_COLS.slice(0, 4).map(col => {
                    const isChecked = enabledCols.includes(col.key);
                    return `
                      <button 
                        type="button" 
                        onclick="toggleOverlayColVisibility('${col.key}')" 
                        class="px-2 py-1 rounded-lg text-[11px] font-bold transition-all cursor-pointer flex items-center gap-1 ${
                          isChecked 
                            ? 'bg-indigo-600 text-white shadow-2xs' 
                            : 'bg-slate-700/60 text-slate-400 hover:text-white'
                        }"
                      >
                        <span>${col.flag}</span>
                        <span>${col.name.split(' ')[0]}</span>
                        <span class="text-[9px] opacity-80">${isChecked ? '✓' : ''}</span>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>

              <!-- CONTROLES DA COLUNA SELECIONADA (COR E TAMANHO) -->
              <div class="flex items-center gap-2 border-l border-slate-700 pl-2">
                <div class="flex items-center bg-slate-800 p-0.5 rounded-lg border border-slate-700 text-[10px] font-bold">
                  ${enabledCols.map(colKey => {
                    const col = ALL_POSSIBLE_COLS.find(c => c.key === colKey) || { name: colKey, flag: '🌐' };
                    return `
                      <button 
                        onclick="selectOverlayCustomCol('${colKey}')" 
                        id="tab-custom-${colKey}" 
                        class="px-2 py-0.5 rounded-md ${colKey === overlayActiveCustomCol ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:text-white'}"
                      >
                        ${col.flag} ${col.name.split(' ')[0]}
                      </button>
                    `;
                  }).join('')}
                </div>

                <div class="flex items-center gap-1">
                  <button onclick="setOverlayActiveColColor('#ffffff')" title="Branco" class="w-4 h-4 rounded-full bg-white border border-slate-400 cursor-pointer shadow-2xs hover:scale-110"></button>
                  <button onclick="setOverlayActiveColColor('#fde047')" title="Amarelo Cinema" class="w-4 h-4 rounded-full bg-yellow-300 border border-slate-400 cursor-pointer shadow-2xs hover:scale-110"></button>
                  <button onclick="setOverlayActiveColColor('#38bdf8')" title="Ciano" class="w-4 h-4 rounded-full bg-sky-400 border border-slate-400 cursor-pointer shadow-2xs hover:scale-110"></button>

      // RENDERIZAÇÃO UNIFICADA DE MENSAGENS COM DEDUPLICAÇÃO (DE BAIXO PARA CIMA)
      const seenSubtitles = new Set();
      function handleIncomingSubtitle(data) {
        if (!data || data.type !== 'NEW_SUBTITLE' || !data.text) return;
        const dedupeKey = data.channel + '_' + data.text.trim();
        if (seenSubtitles.has(dedupeKey)) return;
        seenSubtitles.add(dedupeKey);
        if (seenSubtitles.size > 150) {
          const first = seenSubtitles.values().next().value;
          seenSubtitles.delete(first);
        }

        let feedId = 'overlay-feed-rec';
        let colKey = 'rec';
        if (data.channel === 'transmitter') {
          feedId = 'overlay-feed-trans';
          colKey = 'trans';
        } else if (data.channel === 'spanish') {
          feedId = 'overlay-feed-spanish';
          colKey = 'spanish';
        } else if (data.channel === 'french' || data.channel === 'fr-FR') {
          feedId = 'overlay-feed-french';
          colKey = 'french';
        }

        const feed = document.getElementById(feedId);
        if (feed) {
          const firstP = feed.querySelector('.italic');
          if (firstP) firstP.remove();

          if (feed.lastElementChild) {
            feed.lastElementChild.className = 'leading-relaxed transition-all duration-200 mb-3 whitespace-normal break-words';
            feed.lastElementChild.style.opacity = '0.70';
            feed.lastElementChild.style.fontWeight = '400';
            feed.lastElementChild.style.color = overlayColConfigs[colKey].textColor;
          }

          const p = document.createElement('p');
          p.className = 'leading-relaxed transition-all duration-300 mb-3 font-bold drop-shadow-md whitespace-normal break-words';
          p.style.opacity = '1.0';
          p.style.fontWeight = '700';
          p.style.color = overlayColConfigs[colKey].textColor;
          p.innerText = data.text;
          feed.appendChild(p);

          while (feed.children.length > 25) {
            feed.removeChild(feed.firstChild);
          }

          feed.scrollTop = feed.scrollHeight;
          const stage = document.getElementById('overlay-stage');
          if (stage) stage.scrollTop = stage.scrollHeight;
        }
      }

      // 1. SINCRONIZAÇÃO LOCAL (BroadcastChannel)
      try {
        const channel = new BroadcastChannel('brain_subtitles_channel');
        channel.onmessage = (event) => {
          handleIncomingSubtitle(event.data);
        };
      } catch(e) {}

      // 2. SINCRONIZAÇÃO GLOBAL EM NUVEM (MQTT)
      const safeMeetingId = encodeURIComponent(id).replace(/[^a-zA-Z0-9_-]/g, '_');
      const mqttTopic = 'brainaudiovisual/meeting/' + safeMeetingId + '/subtitles';
      try {
        if (typeof mqtt !== 'undefined') {
          const mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId: 'brain_telao_' + Math.random().toString(16).substring(2, 8),
            clean: true,
            connectTimeout: 7000,
            reconnectPeriod: 3000
          });
          mqttClient.on('connect', () => {
            const ind = document.getElementById('overlay-cloud-indicator');
            if (ind) {
              ind.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Nuvem Ao Vivo';

            }
          });
          mqttClient.on('message', (topic, payload) => {
            try {
              const parsed = JSON.parse(payload.toString());
              handleIncomingSubtitle(parsed);
            } catch(err) {}
          });
        }
      } catch(e) {}
    }

      // GERENCIAMENTO DE VOZES HUMANIZADAS (Web Speech API)
      function getBestVoiceForCurrentLang(genderPref) {
        if (!('speechSynthesis' in window)) return null;
        const voices = window.speechSynthesis.getVoices();
        if (!voices || voices.length === 0) return null;

        const langCode = (currentAudienceLang || 'en').split('-')[0].toLowerCase();
        const matchedVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(langCode));
        if (matchedVoices.length === 0) return voices[0] || null;

        const femaleKeywords = ['female', 'jenny', 'aria', 'zira', 'elena', 'elvira', 'francisca', 'monica', 'paloma', 'sabina', 'laura', 'victoria', 'luciana', 'helena', 'samantha', 'karen', 'moira', 'tessa', 'fiona', 'google'];
        const maleKeywords = ['male', 'guy', 'david', 'mark', 'george', 'alvaro', 'jorge', 'pablo', 'diego', 'julio', 'carlos', 'daniel', 'oliver', 'thomas', 'alex', 'fred'];

        if (genderPref === 'female') {
          // Prioriza vozes femininas e naturais
          const female = matchedVoices.find(v => {
            const n = v.name.toLowerCase();
            return femaleKeywords.some(k => n.includes(k)) && (n.includes('natural') || n.includes('neural') || n.includes('online') || n.includes('google'));
          }) || matchedVoices.find(v => femaleKeywords.some(k => v.name.toLowerCase().includes(k)));
          if (female) return female;
        } else if (genderPref === 'male') {
          // Prioriza vozes masculinas e naturais
          const male = matchedVoices.find(v => {
            const n = v.name.toLowerCase();
            return maleKeywords.some(k => n.includes(k)) && (n.includes('natural') || n.includes('neural') || n.includes('online') || n.includes('google'));
          }) || matchedVoices.find(v => maleKeywords.some(k => v.name.toLowerCase().includes(k)));
          if (male) return male;
        }

        // Padrão: Voz natural/neural do idioma
        const natural = matchedVoices.find(v => {
          const n = v.name.toLowerCase();
          return n.includes('natural') || n.includes('neural') || n.includes('online') || n.includes('google');
        });
        return natural || matchedVoices[0];

        if (!('speechSynthesis' in window)) {

        const t = getI18n();
        try {
          window.speechSynthesis.cancel();

        } catch(e) {}

        const persona = getAudienceVoicePersona(selectedVoicePersonaId);
        const utterance = new SpeechSynthesisUtterance(t.audioTestPhrase);
        utterance.lang = currentAudienceLang || 'en-US';
        utterance.volume = Math.max(0.1, currentVolume);
        utterance.rate = persona.rate;
        utterance.pitch = persona.pitch;

        const voice = getBestVoiceForCurrentLang(persona.gender);

        utterance.onstart = () => startDiscreetVuMeter(true);
        utterance.onend = () => startDiscreetVuMeter(false);
        utterance.onerror = () => startDiscreetVuMeter(false);

      window.toggleAudienceAudioPlayback = function() {
        isAudioPlaybackActive = !isAudioPlaybackActive;
        const t = getI18n();
        const btn = document.getElementById('btn-toggle-audience-audio');
        const dot = document.getElementById('audience-audio-status-dot');

        if (btn) {
          btn.className = isAudioPlaybackActive
            ? 'w-full py-4 px-4 rounded-2xl font-black text-sm sm:text-base transition-all duration-300 flex items-center justify-center gap-2.5 cursor-pointer shadow-md bg-emerald-600 hover:bg-emerald-700 text-white shadow-emerald-600/20'
            : 'w-full py-4 px-4 rounded-2xl font-black text-sm sm:text-base transition-all duration-300 flex items-center justify-center gap-2.5 cursor-pointer shadow-md bg-gradient-to-r from-emerald-500 via-indigo-600 to-purple-600 hover:from-emerald-600 hover:to-indigo-500 text-white shadow-indigo-600/25 ring-2 ring-emerald-400/40';
          btn.innerHTML = '<span>' + (isAudioPlaybackActive ? t.audioActive : t.startAudio) + '</span>';
        }

        if (dot) {
          dot.className = isAudioPlaybackActive ? 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse' : 'w-2.5 h-2.5 rounded-full bg-amber-400';
        }

        if (isAudioPlaybackActive) {
          // Desbloqueia sintetizador de áudio
          if ('speechSynthesis' in window) {
            try {
              window.speechSynthesis.cancel();
              window.speechSynthesis.resume();
              const persona = getAudienceVoicePersona(selectedVoicePersonaId);
              const unlock = new SpeechSynthesisUtterance(t.langName + ' audio connected.');
              unlock.volume = 0.05;
              unlock.rate = persona.rate;
              unlock.pitch = persona.pitch;
              const v = getBestVoiceForCurrentLang(persona.gender);
              if (v) unlock.voice = v;
              window.speechSynthesis.speak(unlock);
            } catch(e) {}
          }
          processSpeechQueue();
        } else {
          if ('speechSynthesis' in window) {
            try { window.speechSynthesis.cancel(); } catch(e) {}
          }
          speechQueue = [];
          isSpeakingNow = false;
          startDiscreetVuMeter(false);
        }
      };

      // FILA DE SÍNTESE DE FALA SEQUENCIAL (TTS) HUMANIZADA
      let speechQueue = [];
      let isSpeakingNow = false;
      let speechQueueWatchdog = null;

      function processSpeechQueue() {
        if (!isAudioPlaybackActive || isSpeakingNow || speechQueue.length === 0) return;
        if (!('speechSynthesis' in window)) return;

        try {
          if (window.speechSynthesis.paused) window.speechSynthesis.resume();
        } catch(e) {}

        let nextText = speechQueue.shift();
        if (!nextText || !nextText.trim()) {
          setTimeout(processSpeechQueue, 40);
          return;
        }

        // Garante pontuação final suave para cadência natural
        nextText = nextText.trim();
        if (!/[.!?]$/.test(nextText)) nextText += '.';

        isSpeakingNow = true;
        const persona = getAudienceVoicePersona(selectedVoicePersonaId);
        const utterance = new SpeechSynthesisUtterance(nextText);
        utterance.lang = currentAudienceLang || 'en-US';
        utterance.volume = Math.max(0.1, currentVolume);
        utterance.rate = persona.rate;
        utterance.pitch = persona.pitch;

        const voice = getBestVoiceForCurrentLang(persona.gender);
        if (voice) utterance.voice = voice;

        const finalizeSpeech = () => {
          if (speechQueueWatchdog) clearTimeout(speechQueueWatchdog);
          isSpeakingNow = false;
          startDiscreetVuMeter(false);
          setTimeout(processSpeechQueue, 60);
        };

        utterance.onstart = () => {
          startDiscreetVuMeter(true);
        };
        utterance.onend = finalizeSpeech;
        utterance.onerror = (err) => {
          console.warn('SpeechSynthesis aviso:', err);
          finalizeSpeech();
        };

        const maxExpectedMs = Math.max(3000, nextText.length * 90);
        if (speechQueueWatchdog) clearTimeout(speechQueueWatchdog);
        speechQueueWatchdog = setTimeout(() => {
          if (isSpeakingNow) finalizeSpeech();
        }, maxExpectedMs);

        try {
          window.speechSynthesis.resume();
          window.speechSynthesis.speak(utterance);
        } catch(e) {
          finalizeSpeech();
        }
      }

      function queueAudienceSpeech(text) {
        if (!isAudioPlaybackActive || !text || !text.trim()) return;
        speechQueue.push(text.trim());
        processSpeechQueue();
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
          try { window.speechSynthesis.getVoices(); } catch(e) {}
        };
      }

      // ROTEAMENTO DE LEGENDAS TRADUZIDAS PARA O ESPECTADOR
      // ROTEAMENTO DE LEGENDAS TRADUZIDAS PARA O ESPECTADOR
      const audienceSeenSubtitles = new Map();
      async function handleAudienceIncomingSubtitle(data) {
        if (!data || data.type !== 'NEW_SUBTITLE' || !data.text) return;
        const text = data.text.trim();
        const currentLangPrefix = (currentAudienceLang || 'en').split('-')[0].toLowerCase();
        const dataChan = (data.channel || '').toLowerCase();

        let isForThisAudience = false;
        if (currentLangPrefix === 'en' && (dataChan === 'en' || dataChan === 'receiver' || dataChan === 'en-us')) isForThisAudience = true;
        else if (currentLangPrefix === 'es' && (dataChan === 'es' || dataChan === 'spanish' || dataChan === 'es-es')) isForThisAudience = true;
        else if (dataChan === currentLangPrefix || dataChan === currentAudienceLang.toLowerCase()) isForThisAudience = true;

        if (!isForThisAudience) return;

        // Desduplicação universal por texto e janela temporal de 15 segundos
        const now = Date.now();
        const textLower = text.toLowerCase();
        if (audienceSeenSubtitles.has(textLower)) {
          const lastTime = audienceSeenSubtitles.get(textLower);
          if (now - lastTime < 15000) return;
        }
        audienceSeenSubtitles.set(textLower, now);

        if (audienceSeenSubtitles.size > 200) {
          const oldestKey = audienceSeenSubtitles.keys().next().value;
          audienceSeenSubtitles.delete(oldestKey);
        }

        const feed = document.getElementById('audience-subtitles-feed');
        if (feed) {
          const emptyP = feed.querySelector('.placeholder-empty');
          if (emptyP) emptyP.remove();

          if (feed.lastElementChild) {
            feed.lastElementChild.className = 'leading-relaxed transition-all duration-200 mb-2 whitespace-normal break-words opacity-70';
          }

          const p = document.createElement('p');
          p.className = 'leading-relaxed transition-all duration-300 mb-2 font-bold whitespace-normal break-words opacity-100 text-slate-900 dark:text-white';
          p.innerText = text;
          feed.appendChild(p);

          while (feed.children.length > 30) feed.removeChild(feed.firstChild);
          feed.scrollTop = feed.scrollHeight;
        }

        // Envia a fala para a voz humanizada
        queueAudienceSpeech(text);
      }

      // 1. SINCRONIZAÇÃO LOCAL (BroadcastChannel)
      try {
        const channel = new BroadcastChannel('brain_subtitles_channel');
        channel.onmessage = (event) => {
          handleAudienceIncomingSubtitle(event.data);
        };
      } catch(e) {}

      // 2. SINCRONIZAÇÃO GLOBAL EM NUVEM (MQTT)
      const safeMeetingId = encodeURIComponent(id).replace(/[^a-zA-Z0-9_-]/g, '_');
      const mqttTopic = 'brainaudiovisual/meeting/' + safeMeetingId + '/subtitles';
      try {
        if (typeof mqtt !== 'undefined') {
          const mqttAudienceClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId: 'brain_aud_' + Math.random().toString(16).substring(2, 8),
            clean: true,
            connectTimeout: 7000,
            reconnectPeriod: 2500
          });
          mqttAudienceClient.on('connect', () => {
            mqttAudienceClient.subscribe(mqttTopic, { qos: 0 });
          });
          mqttAudienceClient.on('message', (topic, payload) => {
            try {
              const parsed = JSON.parse(payload.toString());
              handleAudienceIncomingSubtitle(parsed);
            } catch(e) {}
          });
        }
      } catch(e) {}
    }


    function renderMeetingRoomMonitor(id) {
      let isTimerPaused = false;
      let sessionElapsedSeconds = 0;
      let latency = 24;

      // Carrega dados da reunião do localStorage
      let meeting = null;
      try {
        const saved = JSON.parse(localStorage.getItem('brain_saved_meetings') || '[]');
        meeting = saved.find(m => m.id === id);
      } catch(e) {}

      if (!meeting) {
        meeting = {
          id: id,
          title: 'Sessão de Tradução — ' + id,
          createdAt: new Date().toISOString(),
          sourceLanguage: 'pt-BR',
          autoDetectLanguage: true,
          targetLanguages: ['en-US', 'es-ES'],
          inputDevice: 'default'
        };
      }

      // Mapeamento e metadados de idiomas
      const SUPPORTED_LANG_MAP = {
        'pt-BR': { name: 'Português', flag: '🇧🇷', code: 'pt', channel: 'transmitter' },
        'en-US': { name: 'Inglês', flag: '🇺🇸', code: 'en', channel: 'receiver' },
        'es-ES': { name: 'Espanhol', flag: '🇪🇸', code: 'es', channel: 'spanish' },
        'fr-FR': { name: 'Francês', flag: '🇫🇷', code: 'fr', channel: 'french' },
        'de-DE': { name: 'Alemão', flag: '🇩🇪', code: 'de', channel: 'german' },
        'it-IT': { name: 'Italiano', flag: '🇮🇹', code: 'it', channel: 'italian' },
        'zh-CN': { name: 'Mandarim', flag: '🇨🇳', code: 'zh', channel: 'chinese' },
        'ja-JP': { name: 'Japonês', flag: '🇯🇵', code: 'ja', channel: 'japanese' }
      };

      let selectedSourceLanguage = meeting.sourceLanguage || 'pt-BR';
      let isAutoDetectLanguage = meeting.autoDetectLanguage !== false;
      let activeTargetLanguages = meeting.targetLanguages && meeting.targetLanguages.length ? meeting.targetLanguages : ['en-US', 'es-ES'];

      // Estilos independentes por coluna
      let transSubtitleConfig = {
        bgColor: '#000000',
        textColor: '#ffffff',
        fontSize: '16px',
        fontFamily: 'font-sans'
      };
      try {
        const s = localStorage.getItem('brain_trans_subtitle_style');
        if (s) transSubtitleConfig = Object.assign(transSubtitleConfig, JSON.parse(s));
      } catch(e) {}

      let targetColumnConfigs = {};
      activeTargetLanguages.forEach(lang => {
        const defaultColor = lang === 'en-US' ? '#fde047' : (lang === 'es-ES' ? '#38bdf8' : '#c084fc');
        targetColumnConfigs[lang] = {
          bgColor: '#000000',
          textColor: defaultColor,
          fontSize: '16px',
          fontFamily: 'font-sans'
        };
        try {
          const s = localStorage.getItem('brain_target_style_' + lang);
          if (s) targetColumnConfigs[lang] = Object.assign(targetColumnConfigs[lang], JSON.parse(s));
        } catch(e) {}
      });

      // Histórico de transcrições e áudios gravados
      let transmitterTranscriptions = []; // { text, timeStart, timeEnd }
      let targetTranscriptions = {};     // langCode -> [{ text, timeStart, timeEnd }]
      activeTargetLanguages.forEach(l => { targetTranscriptions[l] = []; });

      // Buffers de áudio para exportação sem travamento
      let transmitterAudioChunks = [];
      let transmitterRecordedBlob = null;
      let isRecordingTransmitter = false;

      let targetAudioBlobs = {}; // langCode -> [Blob]
      let targetAudioBlobsFemale = {}; // langCode -> [Blob] (faixa feminina padrão Sofia)
      let targetAudioBlobsMale = {}; // langCode -> [Blob] (faixa masculina padrão Arthur)
      let targetMeterStates = {}; // langCode -> { activeUntil: timestamp }
      activeTargetLanguages.forEach(l => { 
        targetAudioBlobs[l] = []; 
        targetAudioBlobsFemale[l] = []; 
        targetAudioBlobsMale[l] = []; 
        targetMeterStates[l] = { activeUntil: 0 };
      });

      // Estado do Microfone do Palestrante
      let isRealMicActive = false;
      let isTransmitterMicMuted = false;
      let selectedMicDeviceId = meeting.inputDevice || 'default';
      let micMediaStream = null;
      let micAudioContext = null;
      let micAnalyserNode = null;
      let micMediaRecorder = null;
      let micVuAnimFrameId = null;

      // Estado de Reconhecimento Contínuo de Fala
      let speechRecognizer = null;
      let isTranscribingSpeech = false;
      let isStartingSpeechRecognition = false;
      let speechInterimBuffer = '';
      let speechSilenceCommitTimer = null;
      let lastSpeechActivityTimestamp = Date.now();
      let lastCommittedSpeechText = '';
      let lastCommittedSpeechTimestamp = 0;
      let speechWatchdogInterval = null;
      let speechRecognizerRestartTimeout = null;

      // Controle estrito de cortes sem repetição (ponteiro de caracteres já consumidos)
      let currentResultIndex = -1;
      let committedCharsForIndex = 0;
      let recentCommittedPhrases = [];

      // Sincronização Local (BroadcastChannel) e Nuvem (MQTT)
      let subtitleBroadcast = null;
      try {
        subtitleBroadcast = new BroadcastChannel('brain_subtitles_channel');
      } catch(e) {}

        if (typeof mqtt === 'undefined') return;
        try {
          mqttPublisherClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId: 'brain_cockpit_' + Math.random().toString(16).substring(2, 8),
            clean: true,
            connectTimeout: 5000,
            reconnectPeriod: 3000
          });
          mqttPublisherClient.on('connect', () => {

            if (badge) {
              badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Nuvem Conectada (24ms)';

          type: 'NEW_SUBTITLE',
          meetingId: id,
          channel: channel,
          text: text,
          startSec: startSec,
          endSec: endSec,
          timestamp: Date.now()
        };

        if (subtitleBroadcast) {
          try { subtitleBroadcast.postMessage(payload); } catch(e) {}
        }
        if (mqttPublisherClient && mqttPublisherClient.connected) {
          try { mqttPublisherClient.publish(mqttMeetingTopic, JSON.stringify(payload), { qos: 0 }); } catch(e) {}
        }
      }

      function formatDuration(sec) {
        const pad = (n) => String(Math.floor(n)).padStart(2, '0');
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = Math.floor(sec % 60);
        return h > 0 ? `${pad(h)}h ${pad(m)}m ${pad(s)}s` : `${pad(m)}m ${pad(s)}s`;
      }

      function formatClockTime(sec) {
        const pad = (n) => String(Math.floor(n)).padStart(2, '0');
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = Math.floor(sec % 60);
        return `${pad(h)}:${pad(m)}:${pad(s)}`;
      }
