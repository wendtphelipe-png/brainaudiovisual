      function addTargetSentenceClean(targetLang, text, startSec, endSec) {
        if (!text || !text.trim()) return;
        const clean = text.trim();
        if (!targetTranscriptions[targetLang]) targetTranscriptions[targetLang] = [];
        targetTranscriptions[targetLang].push({ text: clean, timeStart: startSec, timeEnd: endSec });

        getOrCreateActiveParagraph();
        const tp = currentTargetParagraphs[targetLang];
        if (tp) {
          const prev = tp.confirmedSpan.textContent.trim();
          tp.confirmedSpan.textContent = prev ? (prev + ' ' + clean) : clean;
          tp.liveSpan.textContent = '';
          const els = getTargetColumnElements(targetLang);
          if (els.box) els.box.scrollTop = els.box.scrollHeight;
        }

        const targetCode = targetLang.split('-')[0].toLowerCase();
        broadcastSubtitleGlobally(targetCode, clean, startSec, endSec);
        if (targetCode === 'en') broadcastSubtitleGlobally('receiver', clean, startSec, endSec);
        if (targetCode === 'es') broadcastSubtitleGlobally('spanish', clean, startSec, endSec);

        triggerTargetAudioMeter(targetLang, Math.max(3000, clean.length * 90));
        fetchAudioChunkForExport(targetLang, clean, 'female');
        fetchAudioChunkForExport(targetLang, clean, 'male');
      }

      function triggerTargetAudioMeter(targetLang, durationMs) {
        const langCode = (targetLang || '').split('-')[0].toLowerCase();
        const duration = durationMs || 3000;
        const until = Date.now() + duration;
        targetMeterStates[targetLang] = { activeUntil: until };

      // SÍNTESE NATIVA DE VOZES MULTILÍNGUES (FEMININA SOFIA E MASCULINA ARTHUR VIA AMAZON POLLY NATIVO)
      async function fetchAudioChunkForExport(targetLang, text, gender = 'female') {
        if (!text || !text.trim()) return null;
        const clean = text.trim();
        try {
          const targetCode = targetLang.split('-')[0].toLowerCase();
          const encoded = encodeURIComponent(clean);
          const candidateUrls = [
            `/tts.php?tl=${targetCode}&gender=${gender}&q=${encoded}`,
            `https://brainaudiovisual.com.br/tts.php?tl=${targetCode}&gender=${gender}&q=${encoded}`
          ];

          let blob = null;
          for (const url of candidateUrls) {
            try {
              const res = await fetch(url);
              if (res.ok) {
                const b = await res.blob();
                if (b && b.size > 250) {
                  blob = b;
                  break;
                }
              }
            } catch(fetchErr) {}
          }

          if (blob) {
            if (gender === 'male') {
              if (!targetAudioBlobsMale[targetLang]) targetAudioBlobsMale[targetLang] = [];
              targetAudioBlobsMale[targetLang].push(blob);
            } else {
              if (!targetAudioBlobsFemale[targetLang]) targetAudioBlobsFemale[targetLang] = [];
              targetAudioBlobsFemale[targetLang].push(blob);
              if (!targetAudioBlobs[targetLang]) targetAudioBlobs[targetLang] = [];
              targetAudioBlobs[targetLang].push(blob);
            }
            return blob;
          }
        } catch(e) {
          console.warn('Erro ao obter áudio nativo de ' + gender + ':', e);
        }
        return null;
      }

      // ========================================================
      // ENCERRAMENTO E EXPORTAÇÃO ZIP COM BARRA DE PROGRESSO
      // ========================================================
      function formatVttTime(sec) {
        const pad = (n, z = 2) => String(Math.floor(n)).padStart(z, '0');
        const h = pad(sec / 3600);
        const m = pad((sec % 3600) / 60);
        const s = pad(sec % 60);
        const ms = pad((sec % 1) * 1000, 3);
        return `${h}:${m}:${s}.${ms}`;
      }

      function buildVttString(items, title) {
        let vtt = 'WEBVTT\n\nNOTE Brain Audiovisual - ' + title + '\n\n';
        if (!items || items.length === 0) {
          return vtt + '1\n00:00:01.000 --> 00:00:04.000\n[' + title + '] Transmissão Brain Audiovisual.\n';
        }
        const sorted = [...items].sort((a, b) => (a.timeStart || 0) - (b.timeStart || 0));
        sorted.forEach((item, idx) => {
          const start = item.timeStart || (idx * 3);
          const end = item.timeEnd || (start + Math.max(2.2, item.text.length * 0.08));
          vtt += `${idx + 1}\n${formatVttTime(start)} --> ${formatVttTime(end)}\n${item.text}\n\n`;
        });
        return vtt;
      }

      function buildFullTxtLog() {
        const dateNow = new Date().toLocaleString('pt-BR');
        let txt = `============================================================\n`;
        txt += `BRAIN AUDIOVISUAL — TRANSCRIÇÃO & GRAVAÇÃO DA SESSÃO\n`;
        txt += `Reunião: ${meeting.title}\n`;
        txt += `Data: ${dateNow}\n`;
        txt += `Duração Total: ${formatDuration(sessionElapsedSeconds)}\n`;
        txt += `Palestrante: [${selectedSourceLanguage}]\n`;
        txt += `Idiomas Traduzidos: ${activeTargetLanguages.join(', ')}\n`;
        txt += `============================================================\n\n`;

        txt += `--- TRANSCRIÇÃO DO PALESTRANTE (${selectedSourceLanguage}) ---\n`;
        transmitterTranscriptions.forEach(it => {
          txt += `[${formatClockTime(it.timeStart || 0)}] ${it.text}\n`;
        });

        activeTargetLanguages.forEach(lang => {
          const info = SUPPORTED_LANG_MAP[lang] || { name: lang };
          txt += `\n--- TRANSCRIÇÃO EM ${info.name.toUpperCase()} (${lang}) ---\n`;
          const list = targetTranscriptions[lang] || [];
          list.forEach(it => {
            txt += `[${formatClockTime(it.timeStart || 0)}] ${it.text}\n`;
          });
        });

        return txt;
      }

      // UTILITÁRIOS DE CODIFICAÇÃO E CONVERSÃO PARA MP3 (LAMEJS)
      function generateValidSilentMp3(seconds = 2) {
        if (typeof lamejs !== 'undefined') {
          try {
            const sampleRate = 44100;
            const numSamples = Math.round(sampleRate * Math.max(1, seconds));
            const mp3encoder = new lamejs.Mp3Encoder(1, sampleRate, 128);
            const sampleBlockSize = 1152;
            const silence = new Int16Array(sampleBlockSize);
            const mp3Data = [];

            for (let i = 0; i < numSamples; i += sampleBlockSize) {
              const mp3buf = mp3encoder.encodeBuffer(silence);
              if (mp3buf && mp3buf.length > 0) mp3Data.push(mp3buf);
            }
            const endBuf = mp3encoder.flush();
            if (endBuf && endBuf.length > 0) mp3Data.push(endBuf);
            return new Blob(mp3Data, { type: 'audio/mp3' });
          } catch(e) {}
        }
        return new Blob([new Uint8Array([0xff, 0xfb, 0x90, 0x64])], { type: 'audio/mp3' });
      }

      async function convertAudioBlobToMp3(audioBlob) {
        if (!audioBlob || audioBlob.size === 0) {
          return generateValidSilentMp3(2);
        }
        if (typeof lamejs === 'undefined') {
          console.warn('lamejs não disponível no navegador');
          return audioBlob;
        }

        try {
          const arrayBuffer = await audioBlob.arrayBuffer();
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

          const numChannels = audioBuffer.numberOfChannels;
          const sampleRate = audioBuffer.sampleRate;
          const mp3encoder = new lamejs.Mp3Encoder(numChannels, sampleRate, 128);
          const mp3Data = [];

          // Normalização inteligente de estúdio (-0.5 dBFS) para garantir volume potente e audível
          let maxPeak = 0;
          for (let c = 0; c < numChannels; c++) {
            const ch = audioBuffer.getChannelData(c);
            for (let i = 0; i < ch.length; i++) {
              const v = Math.abs(ch[i]);
              if (v > maxPeak) maxPeak = v;
            }
          }
          const targetPeak = 0.94;
          const normGain = (maxPeak > 0.005) ? Math.min(8.0, targetPeak / maxPeak) : 1.0;

          if (numChannels === 1) {
            const samples = audioBuffer.getChannelData(0);
            const sampleBlockSize = 1152;
            const sample16 = new Int16Array(samples.length);
            for (let i = 0; i < samples.length; i++) {
              const s = Math.max(-1, Math.min(1, samples[i] * normGain));
              sample16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            for (let i = 0; i < sample16.length; i += sampleBlockSize) {
              const chunk = sample16.subarray(i, i + sampleBlockSize);
              const mp3buf = mp3encoder.encodeBuffer(chunk);
              if (mp3buf.length > 0) mp3Data.push(mp3buf);
              if ((i / sampleBlockSize) % 80 === 0) {
                await new Promise(r => setTimeout(r, 0));
              }
            }
          } else {
            const left = audioBuffer.getChannelData(0);
            const right = audioBuffer.getChannelData(1);
            const sampleBlockSize = 1152;
            const left16 = new Int16Array(left.length);
            const right16 = new Int16Array(right.length);
            for (let i = 0; i < left.length; i++) {
              const sl = Math.max(-1, Math.min(1, left[i] * normGain));
              const sr = Math.max(-1, Math.min(1, right[i] * normGain));
              left16[i] = sl < 0 ? sl * 0x8000 : sl * 0x7FFF;
              right16[i] = sr < 0 ? sr * 0x8000 : sr * 0x7FFF;
            }
            for (let i = 0; i < left16.length; i += sampleBlockSize) {
              const leftChunk = left16.subarray(i, i + sampleBlockSize);
              const rightChunk = right16.subarray(i, i + sampleBlockSize);
              const mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
              if (mp3buf.length > 0) mp3Data.push(mp3buf);
              if ((i / sampleBlockSize) % 80 === 0) {
                await new Promise(r => setTimeout(r, 0));
              }
            }
          }

          const endBuf = mp3encoder.flush();
          if (endBuf.length > 0) mp3Data.push(endBuf);

          try { await audioCtx.close(); } catch(e) {}

          return new Blob(mp3Data, { type: 'audio/mp3' });
        } catch(err) {
          console.warn('Erro ao converter áudio do palestrante para MP3:', err);
          return generateValidSilentMp3(2);
        }
      }

      window.saveZipFileWithExplorer = async function() {
        const btn = document.getElementById('btn-save-zip-explorer');
        const progressWrapper = document.getElementById('finish-progress-wrapper');
        const progressBar = document.getElementById('finish-progress-bar');
        const progressPct = document.getElementById('finish-progress-pct');
        const progressStatus = document.getElementById('finish-progress-status');

        if (btn) btn.disabled = true;
        if (progressWrapper) progressWrapper.classList.remove('hidden');

        function updateProgress(pct, statusText) {
          if (progressBar) progressBar.style.width = pct + '%';
          if (progressPct) progressPct.innerText = Math.round(pct) + '%';
          if (progressStatus && statusText) progressStatus.innerText = statusText;
        }

        try {
          updateProgress(5, 'Preparando arquivos para gravação...');
          await new Promise(r => setTimeout(r, 50));

          if (typeof JSZip === 'undefined') {
            throw new Error('Biblioteca JSZip carregando... Tente novamente em 2 segundos.');
          }

          const zip = new JSZip();
          const safeTitle = (meeting.title || 'Reuniao').replace(/[^a-zA-Z0-9_-]/g, '_');
          const dateStr = new Date().toISOString().slice(0, 10);
          const zipFileName = `Gravacao_${safeTitle}_${dateStr}.zip`;

          // 1. Garantir que todas as falas traduzidas tenham áudio MP3 de Sofia e Arthur
          updateProgress(15, 'Validando e preparando áudios com vozes nativas (Sofia e Arthur)...');
          for (const lang of activeTargetLanguages) {
            const list = targetTranscriptions[lang] || [];
            const langInfo = SUPPORTED_LANG_MAP[lang] || { name: lang };

            // Faixa feminina Sofia
            if (!targetAudioBlobsFemale[lang]) targetAudioBlobsFemale[lang] = [];
            if (targetAudioBlobsFemale[lang].length < list.length) {
              const startIdx = targetAudioBlobsFemale[lang].length;
              for (let i = startIdx; i < list.length; i++) {
                const item = list[i];
                if (item && item.text) {
                  updateProgress(15 + Math.round(((i + 1) / list.length) * 10), `Gravando voz nativa Sofia (${langInfo.name}): ${i + 1} de ${list.length}...`);
                  await fetchAudioChunkForExport(lang, item.text, 'female');
                  await new Promise(r => setTimeout(r, 15));
                }
              }
            }

            // Faixa masculina Arthur NATIVA (sem manipulação de pitch)
            if (!targetAudioBlobsMale[lang]) targetAudioBlobsMale[lang] = [];
            if (targetAudioBlobsMale[lang].length < list.length) {
              const startIdx = targetAudioBlobsMale[lang].length;
              for (let i = startIdx; i < list.length; i++) {
                const item = list[i];
                if (item && item.text) {
                  updateProgress(25 + Math.round(((i + 1) / list.length) * 10), `Gravando voz nativa Arthur (${langInfo.name}): ${i + 1} de ${list.length}...`);
                  await fetchAudioChunkForExport(lang, item.text, 'male');
                  await new Promise(r => setTimeout(r, 15));
                }
              }
            }
          }

          // 2. Áudio Original do Palestrante convertido em MP3 (128kbps) com ganho normalizado e yield assíncrono
          updateProgress(40, 'Codificando e normalizando áudio do palestrante em MP3...');
          await new Promise(r => setTimeout(r, 50));

          let rawTransAudio = transmitterRecordedBlob;
          if (!rawTransAudio && transmitterAudioChunks && transmitterAudioChunks.length > 0) {
            rawTransAudio = new Blob(transmitterAudioChunks, { type: 'audio/webm' });
          }

          const speakerMp3Blob = await convertAudioBlobToMp3(rawTransAudio);
          zip.file(`Audio_Palestrante_Original_${safeTitle}.mp3`, speakerMp3Blob);

          // 3. Montagem dos arquivos das traduções (.mp3) com vozes nativas limpas
          updateProgress(55, 'Empacotando faixas traduzidas nativas (Sofia e Arthur)...');
          await new Promise(r => setTimeout(r, 50));

          for (const lang of activeTargetLanguages) {
            const info = SUPPORTED_LANG_MAP[lang] || { name: lang };
            const femaleChunks = (targetAudioBlobsFemale[lang] && targetAudioBlobsFemale[lang].length > 0) ? targetAudioBlobsFemale[lang] : (targetAudioBlobs[lang] || []);
            const maleChunks = targetAudioBlobsMale[lang] || [];

            const langBlobFemale = femaleChunks.length > 0 ? new Blob(femaleChunks, { type: 'audio/mp3' }) : generateValidSilentMp3(3);
            const langBlobMale = maleChunks.length > 0 ? new Blob(maleChunks, { type: 'audio/mp3' }) : generateValidSilentMp3(3);

            zip.file(`Audio_${info.name}_${lang}_Voz_Feminina_Sofia_${safeTitle}.mp3`, langBlobFemale);
            zip.file(`Audio_${info.name}_${lang}_Voz_Masculina_Arthur_${safeTitle}.mp3`, langBlobMale);
          }

          // 4. Legendas .VTT para todos os idiomas
          updateProgress(70, 'Gerando legendas VTT com sincronismo...');
          await new Promise(r => setTimeout(r, 60));

          zip.file(`Legenda_Palestrante_Original_${safeTitle}.vtt`, buildVttString(transmitterTranscriptions, 'Palestrante'));
          for (const lang of activeTargetLanguages) {
            const info = SUPPORTED_LANG_MAP[lang] || { name: lang };
            const list = targetTranscriptions[lang] || [];
            zip.file(`Legenda_${info.name}_${lang}_${safeTitle}.vtt`, buildVttString(list, info.name));
          }

          // 5. Log em Texto Completo
          zip.file(`Transcricao_Completa_${safeTitle}.txt`, buildFullTxtLog());

          // 6. Compactação do ZIP com barra de progresso assíncrona não-bloqueante
          updateProgress(80, 'Compactando pacote ZIP sem travamentos...');
          const zipBlob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 2 } }, (metadata) => {
            const p = 80 + (metadata.percent * 0.20);
            updateProgress(p, 'Compactando pacote ZIP: ' + Math.round(metadata.percent) + '%');
          });

          updateProgress(100, 'Pronto para salvar!');

          // Salvar com Explorer do Windows (showSaveFilePicker)
          if ('showSaveFilePicker' in window) {
            try {
              const handle = await window.showSaveFilePicker({
                suggestedName: zipFileName,
                types: [{
                  description: 'Pacote ZIP com Áudios e Legendas VTT (*.zip)',
                  accept: { 'application/zip': ['.zip'] }
                }]
              });
              const writable = await handle.createWritable();
              await writable.write(zipBlob);
              await writable.close();
              alert('Sucesso! O pacote "' + zipFileName + '" com todos os áudios e legendas VTT foi salvo com sucesso!');
              return;
            } catch(e) {
              if (e.name === 'AbortError') return;
            }
          }

          // Fallback de download direto
          const url = URL.createObjectURL(zipBlob);
          const a = document.createElement('a');
          a.href = url;
          a.download = zipFileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          alert('Pacote ZIP "' + zipFileName + '" baixado com sucesso!');
        } catch(err) {
          alert('Erro ao gerar pacote ZIP: ' + err.message);
        } finally {
          if (btn) btn.disabled = false;
        }
      };

      window.confirmAndExitMeeting = function() {
        if (confirm('Deseja realmente sair da sala e voltar ao painel?')) {
          if (isRealMicActive) stopMasterMicCapture();
          try {
            localStorage.removeItem('brain_room_heartbeat_' + id);
            if (typeof roomHeartbeatTimer !== 'undefined') clearInterval(roomHeartbeatTimer);
          } catch(e) {}
          window.location.href = getAdminBaseUrl('module=translation');
        }
      };

      window.openDedicatedSubtitleOverlay = function() {
        const url = (window.location.protocol === 'file:')
          ? (window.location.pathname + '?meeting=' + encodeURIComponent(id) + '&overlay=subtitles')
          : ('/?meeting=' + encodeURIComponent(id) + '&overlay=subtitles');
        window.open(url, '_blank');
      };

      window.copyTelaoShareLink = function() {
        const url = window.location.origin + window.location.pathname + '?meeting=' + encodeURIComponent(id) + '&overlay=subtitles';
        navigator.clipboard.writeText(url);
        alert('Link da Janela OBS copiado com sucesso!');
      };

      window.toggleTimerPause = function() {
        isTimerPaused = !isTimerPaused;
        const btn = document.getElementById('cockpit-pause-btn');
        if (btn) btn.innerText = isTimerPaused ? 'Retomar' : 'Pausar';
      };

      // Cronômetro global crescente de sessão
      setInterval(() => {
        if (!isTimerPaused) {
          sessionElapsedSeconds++;
          const timerEl = document.getElementById('cockpit-elapsed-timer');
          if (timerEl) timerEl.innerText = formatDuration(sessionElapsedSeconds);
        }
      }, 1000);

      // Loop em tempo real dos VU Meters de Áudio Traduzido & Gravação de cada coluna
      setInterval(() => {
        const now = Date.now();
        activeTargetLanguages.forEach(lang => {
          const els = getTargetColumnElements(lang);
          if (!els.bar || !els.led || !els.textEl) return;

          const shortCode = lang.split('-')[0].toLowerCase();
          const st = targetMeterStates[lang] || targetMeterStates[shortCode];
          const isPlaying = st && st.activeUntil > now;

          if (isPlaying) {
            // Modulação ativa e dinâmica do canal traduzido
            const randLevel = Math.floor(Math.random() * 32) + 68;
            els.bar.style.width = randLevel + '%';
            els.bar.className = 'h-full rounded-full transition-all duration-75 bg-gradient-to-r from-emerald-500 via-teal-400 to-indigo-500 shadow-xs';
            els.textEl.innerText = randLevel + '%';
            els.led.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse';
            if (els.statusEl) els.statusEl.innerText = '● Transmitindo Áudio';
          } else if (isRealMicActive && !isTransmitterMicMuted) {
            // Microfone do palestrante está ativo captando fala: canal traduzido em prontidão imediata
            const activeLevel = Math.max(8, Math.min(30, Math.floor(Math.random() * 12) + 10));
            els.bar.style.width = activeLevel + '%';
            els.bar.className = 'h-full rounded-full transition-all duration-150 bg-emerald-500/60';
            els.textEl.innerText = activeLevel + '%';
            els.led.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400/80';
            if (els.statusEl) els.statusEl.innerText = 'Pronto p/ Traduzir';
          } else {
            // Em espera
            els.bar.style.width = '2%';
            els.bar.className = 'h-full rounded-full transition-all duration-200 bg-slate-300 dark:bg-slate-700';
            els.textEl.innerText = '0%';
            els.led.className = 'w-2.5 h-2.5 rounded-full bg-slate-300 dark:bg-slate-600';
            if (els.statusEl) els.statusEl.innerText = 'Em espera';
          }
        });
      }, 100);
    }
