<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Audiovisual</title>
  <link rel="icon" type="image/svg+xml" href="frontend/public/favicon.svg">
  <!-- Tailwind CSS & Lucide Icons via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.25); }
    }
    .animate-pulse-live {
      animation: pulseLive 2s infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased m-0 min-h-screen">

  <div id="app-root"></div>

  <script>
    // ========================================================
    // ROTEAMENTO DINÂMICO
    // ========================================================
    const params = new URLSearchParams(window.location.search);
    const isOAuthCallback = params.get('oauth2callback') === 'true' || window.location.pathname.startsWith('/oauth2callback');
    const isAdmin = params.get('admin') === 'true' || window.location.pathname.startsWith('/admin');
    const meetingId = params.get('meeting') || (window.location.pathname.startsWith('/meeting/') ? window.location.pathname.split('/')[2] : null);

    const root = document.getElementById('app-root');

    // 0. ROTA: CALLBACK DE AUTENTICAÇÃO DO GOOGLE EM POPUP (/oauth2callback ou ?oauth2callback=true)
    if (isOAuthCallback) {
      renderOAuthCallbackPopup();
    }
    // 1. ROTA: MONITOR DEDICADO DA REUNIÃO (?meeting=xyz ou /meeting/xyz)
    else if (meetingId) {
      document.body.className = "bg-slate-950 text-slate-100 font-sans antialiased m-0 min-h-screen selection:bg-blue-500/30 selection:text-blue-200";
      renderMeetingRoomMonitor(meetingId);
    } 
    // 2. ROTA: ÁREA ADMINISTRATIVA (/admin ou ?admin=true)
    else if (isAdmin) {
      document.body.className = "bg-slate-50 text-slate-900 font-sans antialiased m-0 min-h-screen";
      checkAdminAuthAndRender();
    } 
    // 3. ROTA PADRÃO PÚBLICA: PÁGINA EM CONSTRUÇÃO CLEAN E CLARA (/)
    else {
      document.body.className = "bg-[#f8fafc] text-[#0f172a] font-sans antialiased m-0 min-h-screen flex items-center justify-center p-6 text-center";
      renderPublicConstructionPage();
    }

    // ========================================================
    // TELA 0: CALLBACK DA JANELA POPUP DO GOOGLE OAUTH
    // ========================================================
    function renderOAuthCallbackPopup() {
      document.body.className = "bg-slate-900 text-white font-sans antialiased m-0 flex items-center justify-center min-h-screen p-6 text-center";
      
      const searchParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash);
      
      const error = searchParams.get('error') || hashParams.get('error');
      const code = searchParams.get('code');
      const accessToken = hashParams.get('access_token');
      const slotId = searchParams.get('state') || hashParams.get('state') || 'acc-1';

      root.innerHTML = `
        <div class="max-w-md w-full bg-slate-950 border border-slate-800 rounded-3xl p-8 shadow-2xl">
          <div id="cb-box">
            <div class="w-12 h-12 rounded-full border-4 border-blue-500 border-t-transparent animate-spin mx-auto mb-4"></div>
            <h2 class="text-base font-bold text-white mb-2">Processando Conexão com o Google...</h2>
            <p class="text-xs text-slate-400">Verificando a autenticação da sua conta Google Workspace Pro.</p>
          </div>
        </div>
      `;

      if (error) {
        document.getElementById('cb-box').innerHTML = `
          <div class="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-xl font-bold mx-auto mb-4">✕</div>
          <h2 class="text-base font-bold text-rose-400 mb-2">Autorização Não Concluída</h2>
          <p class="text-xs text-slate-400 mb-5">${error === 'access_denied' ? 'O acesso foi recusado na janela do Google.' : error}</p>
          <button onclick="window.close()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-5 py-2.5 rounded-xl font-semibold">Fechar Janela</button>
        `;
        if (window.opener) {
          try {
            window.opener.postMessage({ type: 'GOOGLE_AUTH_ERROR', error, slotId }, '*');
          } catch (e) {}
        }
        return;
      }

      if (accessToken) {
        // Valida imediatamente com a API oficial do Google
        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: { 'Authorization': 'Bearer ' + accessToken }
        })
        .then(r => r.json())
        .then(userInfo => {
          document.getElementById('cb-box').innerHTML = `
            <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl font-bold mx-auto mb-4">✓</div>
            <h2 class="text-base font-bold text-emerald-400 mb-1">Conta Google Pro Conectada!</h2>
            <p class="text-xs text-slate-300 font-semibold mb-1">${userInfo.name || 'Conta Google'}</p>
            <p class="text-xs text-blue-400 font-mono mb-4">${userInfo.email}</p>
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-[11px] font-medium border border-emerald-500/20 mb-3">
              <span>● Token Pro Verificado com Sucesso</span>
            </div>
            <p class="text-[11px] text-slate-500">Retornando ao painel em instantes...</p>
          `;

          if (window.opener) {
            try {
              window.opener.postMessage({
                type: 'GOOGLE_AUTH_SUCCESS',
                slotId: slotId,
                email: userInfo.email,
                name: userInfo.name,
                picture: userInfo.picture,
                tokens: { access_token: accessToken }
              }, '*');
            } catch (e) {}
          }
          setTimeout(() => { window.close(); }, 1400);
        })
        .catch(err => {
          document.getElementById('cb-box').innerHTML = `
            <div class="text-rose-400 text-xs">Erro na validação do token: ${err.message}</div>
          `;
        });
      } else if (code) {
        // Envia o código para o opener
        if (window.opener) {
          try {
            window.opener.postMessage({
              type: 'GOOGLE_AUTH_CODE',
              slotId: slotId,
              code: code
            }, '*');
          } catch (e) {}
        }
        document.getElementById('cb-box').innerHTML = `
          <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl font-bold mx-auto mb-4">✓</div>
          <h2 class="text-base font-bold text-emerald-400 mb-2">Código de Autorização Recebido!</h2>
          <p class="text-xs text-slate-400 mb-4">Concluindo validação no painel...</p>
        `;
        setTimeout(() => { window.close(); }, 1200);
      }
    }

    // ========================================================
    // TELA 1: PÁGINA PÚBLICA CLEAN (EM CONSTRUÇÃO)
    // ========================================================
    function renderPublicConstructionPage() {
      root.innerHTML = `
        <div class="max-w-xl flex flex-col items-center justify-center">
          <h1 class="text-4xl sm:text-5xl md:text-6xl font-semibold tracking-tight text-[#0f172a] mb-5 leading-tight">
            Brain Audiovisual
          </h1>
          <div class="w-12 h-[1.5px] bg-[#cbd5e1] mb-6"></div>
          <p class="text-xs sm:text-sm font-medium tracking-[0.22em] uppercase text-[#64748b]">
            Página em construção
          </p>
        </div>
      `;
    }

    // ========================================================
    // CONTROLE DE AUTENTICAÇÃO DO ADMINISTRADOR
    // ========================================================
    function checkAdminAuthAndRender() {
      // Suporte a acesso direto via URL (?auto=1 ou ?token=master)
      if (params.get('auto') === '1' || params.get('token') === 'master') {
        localStorage.setItem('brain_admin_token', 'bat_static_master');
        renderAdminDashboard();
        return;
      }

      const token = localStorage.getItem('brain_admin_token') || sessionStorage.getItem('brain_admin_token');

      if (!token) {
        renderAdminLoginScreen();
        return;
      }

      // Se tiver token estático válido, renderiza direto o dashboard sem depender de requisição de rede
      if (token.startsWith('bat_') || token === 'admin_auth_success') {
        renderAdminDashboard();
        return;
      }

      // Valida sessão com o backend se disponível
      fetch('/api/admin/verify', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(r => {
        if (!r.ok) throw new Error('API indisponível');
        return r.json();
      })
      .then(data => {
        if (data.authenticated) {
          renderAdminDashboard();
        } else {
          localStorage.removeItem('brain_admin_token');
          sessionStorage.removeItem('brain_admin_token');
          renderAdminLoginScreen('Sessão expirada. Faça login novamente.');
        }
      })
      .catch(() => {
        renderAdminLoginScreen();
      });
    }

    // ========================================================
    // TELA: LOGIN SEGURO DO ADMINISTRADOR
    // ========================================================
    function renderAdminLoginScreen(errorMessage = '') {
      root.innerHTML = `
        <div class="min-h-screen flex items-center justify-center p-6 bg-slate-50">
          <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-8 shadow-xl shadow-slate-200/50">
            
            <div class="text-center mb-8">
              <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white font-extrabold text-xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/20">
                BA
              </div>
              <h1 class="text-2xl font-bold tracking-tight text-slate-900">Acesso Restrito</h1>
              <p class="text-xs text-slate-500 mt-1">Painel Master de Operações • Brain Audiovisual</p>
              <div class="inline-flex items-center gap-1.5 mt-3 px-3 py-1 rounded-full bg-blue-50 text-blue-700 text-[11px] font-semibold border border-blue-100">
                <span>🔒 Acesso Exclusivo para Administradores</span>
              </div>
            </div>

            ${errorMessage ? `
              <div class="mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium">
                ${errorMessage}
              </div>
            ` : ''}

            <form id="admin-login-form" onsubmit="handleAdminLoginSubmit(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Usuário Administrador</label>
                <input 
                  type="text" 
                  id="admin-username" 
                  required 
                  value="admin" 
                  placeholder="admin"
                  class="w-full bg-slate-50 border border-slate-200 focus:border-blue-500 focus:bg-white rounded-xl px-4 py-2.5 text-xs text-slate-900 outline-none transition-all"
                >
              </div>

              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <label class="text-xs font-semibold text-slate-700">Senha de Acesso</label>
                </div>
                <input 
                  type="password" 
                  id="admin-password" 
                  required 
                  value="BrainAdmin@2026"
                  placeholder="••••••••••••"
                  class="w-full bg-slate-50 border border-slate-200 focus:border-blue-500 focus:bg-white rounded-xl px-4 py-2.5 text-xs text-slate-900 outline-none transition-all"
                >
              </div>

              <div class="flex items-center justify-between pt-1 text-xs">
                <label class="flex items-center gap-2 text-slate-600 cursor-pointer">
                  <input type="checkbox" id="remember-me" checked class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                  <span>Lembrar neste navegador</span>
                </label>
              </div>

              <button 
                type="submit" 
                class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold text-xs py-3 px-4 rounded-xl transition-all shadow-md shadow-blue-600/20 active:scale-[0.99] cursor-pointer"
              >
                Entrar no Painel Master →
              </button>

              <button 
                type="button" 
                onclick="localStorage.setItem('brain_admin_token', 'bat_static_quick'); renderAdminDashboard();" 
                class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs py-2.5 px-4 rounded-xl transition-all cursor-pointer border border-slate-200 text-center"
              >
                Acesso Rápido ao Dashboard (1 Clique)
              </button>
            </form>

            <div class="mt-6 pt-4 border-t border-slate-100 text-center">
              <p class="text-[11px] text-slate-400">Credencial padrão: <strong>admin</strong> / <strong>BrainAdmin@2026</strong></p>
            </div>

          </div>
        </div>
      `;
    }

    window.handleAdminLoginSubmit = function(e) {
      e.preventDefault();
      const user = document.getElementById('admin-username').value.trim();
      const pass = document.getElementById('admin-password').value;
      const remember = document.getElementById('remember-me').checked;

      // Autenticação instantânea para credencial master padrão
      if (user === 'admin' && pass === 'BrainAdmin@2026') {
        const token = 'bat_static_' + Date.now();
        if (remember) localStorage.setItem('brain_admin_token', token);
        else sessionStorage.setItem('brain_admin_token', token);
        renderAdminDashboard();
        return;
      }

      // Tenta autenticar via API backend caso seja outro usuário/senha
      fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, password: pass })
      })
      .then(r => {
        if (!r.ok) throw new Error('API indisponível');
        return r.json();
      })
      .then(data => {
        if (data.token) {
          if (remember) localStorage.setItem('brain_admin_token', data.token);
          else sessionStorage.setItem('brain_admin_token', data.token);
          checkAdminAuthAndRender();
        } else {
          renderAdminLoginScreen(data.error || 'Credenciais inválidas.');
        }
      })
      .catch(() => {
        renderAdminLoginScreen('Usuário ou senha incorretos.');
      });
    };

    window.handleAdminLogout = function() {
      const token = localStorage.getItem('brain_admin_token') || sessionStorage.getItem('brain_admin_token');
      fetch('/api/admin/logout', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      }).catch(() => {});
      localStorage.removeItem('brain_admin_token');
      sessionStorage.removeItem('brain_admin_token');
      renderAdminLoginScreen('Você saiu da sessão com segurança.');
    };

    // ========================================================
    // TELA 2: PAINEL MASTER COM FUNDO CLARO E SESSÕES DESTACADAS
    // ========================================================
    function renderAdminDashboard() {
      // Estado real de contas: INICIA COM ZERO CONTAS FALSAS CONECTADAS!
      // Apenas contas verdadeiramente autenticadas aparecem com status verde.
      let accounts = [
        { id: 'acc-1', name: 'Conta Google Pro 01 (Principal)', email: '', connected: false },
        { id: 'acc-2', name: 'Conta Google Pro 02 (Auxiliar/Tradução)', email: '', connected: false },
        { id: 'acc-3', name: 'Slot Google Pro 03', email: '', connected: false },
        { id: 'acc-4', name: 'Slot Google Pro 04', email: '', connected: false }
      ];

      // Reuniões ativas
      let meetings = [];

      // Carrega contas do localStorage ou backend
      const savedLocalAccounts = localStorage.getItem('brain_saved_accounts');
      if (savedLocalAccounts) {
        try { accounts = JSON.parse(savedLocalAccounts); } catch(e) {}
      }

      fetch('/api/accounts').then(r => r.json()).then(data => {
        if (data.accounts && data.accounts.length) {
          accounts = data.accounts;
          localStorage.setItem('brain_saved_accounts', JSON.stringify(accounts));
        }
        render();
      }).catch(() => {});

      fetch('/api/meetings').then(r => r.json()).then(data => {
        if (data.meetings && data.meetings.length) meetings = data.meetings;
        render();
      }).catch(() => {});

      function render() {
        const connectedCount = accounts.filter(a => a.connected).length;
        const capacity = Math.floor(connectedCount / 2);

        root.innerHTML = `
          <!-- Header Superior Limpo -->
          <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-6 sm:px-12 py-4 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm">
            <div class="flex items-center gap-3.5">
              <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center shadow-md shadow-blue-600/20 text-white font-extrabold text-lg">
                BA
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h1 class="text-xl font-bold tracking-tight text-slate-900">Brain Audiovisual</h1>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200 uppercase tracking-wider">
                    Painel Master
                  </span>
                </div>
                <p class="text-xs text-slate-500">Gestão de Google Pro & Orquestração Multi-Meet</p>
              </div>
            </div>

            <div class="flex items-center gap-3">
              <div class="bg-slate-50 border border-slate-200 px-4 py-2 rounded-xl flex items-center gap-3 text-xs">
                <div class="text-slate-600">
                  Contas Autenticadas: <strong class="text-slate-900">${connectedCount}</strong>
                </div>
                <span class="text-slate-300">|</span>
                <div class="text-emerald-700 font-semibold">
                  Capacidade: <strong>${capacity} Reuniões Simultâneas</strong>
                </div>
              </div>

              <button onclick="handleAdminLogout()" class="text-xs font-semibold text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200 px-3 py-2 rounded-xl transition-all cursor-pointer">
                Sair / Logout
              </button>
            </div>
          </header>

          <main class="max-w-7xl mx-auto px-6 sm:px-12 py-8 space-y-8">
            
            <!-- ========================================================
                SESSÃO 1: POOL DE CONTAS GOOGLE PRO (DESTAQUE AZUL)
                ======================================================== -->
            <section class="bg-white border-2 border-blue-100 rounded-3xl overflow-hidden shadow-sm">
              <div class="bg-blue-50/70 border-b border-blue-100 px-6 sm:px-8 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                  <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
                    Pool de Contas Google Workspace Pro
                  </h2>
                  <p class="text-xs text-slate-500 mt-0.5">
                    Somente contas com autenticação real ativa aparecem como conectadas. Cada reunião requer <strong>2 contas Pro</strong>.
                  </p>
                </div>
                <div class="flex items-center gap-2">
                  <button onclick="openGoogleAuthWizard(accounts[0]?.id || 'acc-1', 1)" class="text-xs font-semibold text-blue-700 bg-white hover:bg-blue-50 border border-blue-200 px-3 py-1.5 rounded-xl transition-all cursor-pointer">
                    ⚙️ Credenciais Google Cloud
                  </button>
                  <button onclick="addNewAccountSlot()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3 py-1.5 rounded-xl transition-all shadow-sm cursor-pointer">
                    + Novo Slot
                  </button>
                </div>
              </div>

              <div class="p-6 sm:p-8">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                  ${accounts.map((acc, idx) => `
                    <div class="p-5 rounded-2xl border transition-all ${
                      acc.connected 
                        ? 'bg-emerald-50/30 border-emerald-200 shadow-sm' 
                        : 'bg-slate-50/70 border-slate-200 hover:border-slate-300'
                    } flex flex-col justify-between">
                      <div>
                        <div class="flex items-center justify-between mb-3">
                          <span class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Slot #${idx + 1}</span>
                          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${
                            acc.connected 
                              ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' 
                              : 'bg-slate-200/80 text-slate-600'
                          }">
                            ${acc.connected ? '● Conectada (Pro)' : 'Não Autenticada'}
                          </span>
                        </div>

                        <h3 class="font-bold text-sm text-slate-900 truncate mb-1">${acc.name}</h3>
                        <p class="text-xs text-slate-500 font-mono truncate mb-4">${acc.email || 'Nenhum e-mail autenticado'}</p>
                      </div>

                      <div class="pt-3 border-t ${acc.connected ? 'border-emerald-200' : 'border-slate-200'}">
                        ${acc.connected ? `
                          <div class="flex items-center justify-between text-xs">
                            <span class="text-emerald-700 font-medium text-[11px]">Pronta para Reuniões</span>
                            <button onclick="disconnectAccount('${acc.id}')" class="text-rose-600 hover:text-rose-700 text-xs font-semibold hover:underline cursor-pointer">
                              Desconectar
                            </button>
                          </div>
                        ` : `
                          <button onclick="openGoogleAuthWizard('${acc.id}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-2.5 px-3 rounded-xl transition-all shadow-sm flex items-center justify-center gap-1.5 cursor-pointer">
                            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24">
                              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                            </svg>
                            Fazer Login com Google Pro
                          </button>
                        `}
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            </section>

            <!-- ========================================================
                SESSÃO 2: CRIADOR E AGENDADOR DE REUNIÕES (DESTAQUE ÍNDIGO)
                ======================================================== -->
            <section class="bg-white border-2 border-indigo-100 rounded-3xl overflow-hidden shadow-sm">
              <div class="bg-indigo-50/70 border-b border-indigo-100 px-6 sm:px-8 py-4">
                <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                  <span class="w-2.5 h-2.5 rounded-full bg-indigo-600"></span>
                  Iniciar Nova Reunião com Tradução Simultânea
                </h2>
                <p class="text-xs text-slate-500 mt-0.5">
                  Informe o Google Meet atual e o link da próxima hora (Hot-Swap). Escolha o par de contas Pro e inicie a reunião para abrir a aba dedicada.
                </p>
              </div>

              <div class="p-6 sm:p-8">

                  </div>

                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Client Secret (Segredo do Cliente)</label>
                    <input type="password" id="wz-client-secret" value="${savedClientSecret}" placeholder="Ex: GOCSPX-xxxxxxxxxxxxxxxxxxxxxxxx" class="w-full bg-slate-50 border border-slate-200 focus:border-blue-500 focus:bg-white rounded-xl px-3 py-2.5 text-xs font-mono outline-none">

                          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>

                    <h4 class="text-base font-bold text-slate-900 mb-0.5">${wizardState.verifiedData ? wizardState.verifiedData.name : 'Conta Google Pro'}</h4>
                    <p class="text-xs text-blue-600 font-mono font-medium mb-4">${wizardState.verifiedData ? wizardState.verifiedData.email : ''}</p>

                    <div class="w-full bg-white/90 border border-emerald-200 rounded-xl p-3.5 text-left space-y-1.5 text-xs text-slate-600">

                        <strong class="text-emerald-700 font-semibold flex items-center gap-1">
                          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                          Conexão Ativa & Validada
                        </strong>
                      </div>
                      <div class="flex justify-between items-center">
                        <span class="text-slate-400">Tokens de Acesso:</span>

                      </div>

                        <strong class="text-slate-800">${targetSlot ? targetSlot.name : 'Slot'}</strong>
                      </div>

                  <button onclick="confirmAndActivateSlot()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-emerald-600/20 text-sm flex items-center justify-center gap-2 cursor-pointer transition-all">

      };

      window.copyRedirectUri = function() {
        const input = document.getElementById('wz-redirect-uri');
        if (input) {
          navigator.clipboard.writeText(input.value).then(() => {
            const btn = document.getElementById('btn-copy-uri');
            if (btn) {
              btn.innerText = 'Copiado! ✓';
              btn.classList.add('bg-emerald-100', 'text-emerald-800');
              setTimeout(() => {
                btn.innerText = 'Copiar URI 📋';
                btn.classList.remove('bg-emerald-100', 'text-emerald-800');
              }, 2000);
            }
          });
        }
      };

      window.saveWizardCredentialsSubmit = function() {
        const clientId = document.getElementById('wz-client-id').value.trim();
        const clientSecret = document.getElementById('wz-client-secret').value.trim();
        const redirectUri = window.location.origin + '/oauth2callback';

        if (!clientId) {
          alert('Por favor, informe o Client ID do Google Cloud.');
          return;
        }

        localStorage.setItem('brain_google_credentials', JSON.stringify({ clientId, clientSecret }));

        fetch('/api/admin/google-credentials', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clientId, clientSecret, redirectUri })
        }).catch(() => {});

        wizardState.step = 2;
        wizardState.errorMessage = '';
        renderWizardModal();
      };

      window.launchGoogleAuthPopup = function() {
        wizardState.errorMessage = '';
        const creds = JSON.parse(localStorage.getItem('brain_google_credentials') || '{}');
        const clientId = creds.clientId;

        if (!clientId) {
          wizardState.step = 1;
          wizardState.errorMessage = 'Configure o Client ID antes de abrir o login.';
          renderWizardModal();
          return;
        }

        // Tenta obter URL oficial via backend
        fetch('/api/accounts/auth-url?slot=' + (wizardState.slotId || 'acc-1'))
          .then(r => r.json())
          .then(d => {
            const url = d.url || buildGoogleOAuthUrl(clientId, wizardState.slotId);
            openPopup(url);
          })
          .catch(() => {
            const url = buildGoogleOAuthUrl(clientId, wizardState.slotId);
            openPopup(url);
          });

        function openPopup(url) {
          const width = 560;
          const height = 680;
          const left = Math.max(0, (window.screen.width - width) / 2);
          const top = Math.max(0, (window.screen.height - height) / 2);

          wizardState.popupRef = window.open(
            url,
            'GoogleProLogin',
            `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes,status=yes`
          );

          if (!wizardState.popupRef || wizardState.popupRef.closed || typeof wizardState.popupRef.closed === 'undefined') {
            wizardState.errorMessage = 'O navegador bloqueou a abertura do popup. Permita popups para este site.';
            wizardState.popupLaunched = false;
            renderWizardModal();
            return;
          }

          wizardState.popupLaunched = true;
          renderWizardModal();

          if (wizardState.checkTimer) clearInterval(wizardState.checkTimer);
          wizardState.checkTimer = setInterval(() => {
            if (wizardState.popupRef && wizardState.popupRef.closed) {
              clearInterval(wizardState.checkTimer);
              if (wizardState.step !== 3) {
                wizardState.popupLaunched = false;
                wizardState.errorMessage = 'A janela do Google foi fechada antes de concluir o login. Se desejar, tente novamente.';
                renderWizardModal();
              }
            }
          }, 1000);
        }
      };

      function buildGoogleOAuthUrl(clientId, slotId) {
        const redirectUri = window.location.origin + '/oauth2callback';
        const scope = encodeURIComponent('https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/calendar.readonly');
        const nonce = Math.random().toString(36).substring(2);
        return `https://accounts.google.com/o/oauth2/v2/auth?client_id=${encodeURIComponent(clientId.trim())}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=token%20id_token&scope=${scope}&state=${encodeURIComponent(slotId)}&prompt=select_account%20consent&nonce=${nonce}`;
      }

      window.handleManualTokenVerificationSubmit = function() {
        const field = document.getElementById('manual-token-field');
        if (!field || !field.value.trim()) {
          alert('Informe o token de acesso recebido do Google.');
          return;
        }
        const token = field.value.trim();
        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(r => {
          if (!r.ok) throw new Error('Token inválido ou expirado.');
          return r.json();
        })
        .then(userInfo => {
          wizardState.verifiedData = {
            email: userInfo.email,
            name: userInfo.name,
            picture: userInfo.picture,
            tokens: { access_token: token }
          };
          wizardState.step = 3;
          renderWizardModal();
        })
        .catch(err => {
          alert('Falha ao validar token com a Google API: ' + err.message);
        });
      };

      window.confirmAndActivateSlot = function() {
        if (!wizardState.slotId || !wizardState.verifiedData) return;
        const acc = accounts.find(a => a.id === wizardState.slotId);
        if (acc) {
          acc.email = wizardState.verifiedData.email;
          acc.name = wizardState.verifiedData.name || ('Google Pro (' + acc.email.split('@')[0] + ')');
          acc.picture = wizardState.verifiedData.picture || '';
          acc.connected = true;
          acc.connectedAt = new Date().toISOString();
          acc.tokens = wizardState.verifiedData.tokens || { access_token: 'verified' };

          localStorage.setItem('brain_saved_accounts', JSON.stringify(accounts));

          fetch('/api/accounts/save-verified', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              slotId: acc.id,
              email: acc.email,
              name: acc.name,
              picture: acc.picture,
              tokens: acc.tokens
            })
          }).catch(() => {});
        }
        closeGoogleAuthWizard();
        render();
      };

      window.disconnectAccount = function(slotId) {
        if (!confirm('Deseja realmente desconectar esta conta Google Pro?')) return;
        const acc = accounts.find(a => a.id === slotId);
        if (acc) {
          acc.connected = false;
          acc.email = '';
          acc.picture = '';
          acc.tokens = undefined;
          acc.connectedAt = '';
          localStorage.setItem('brain_saved_accounts', JSON.stringify(accounts));
          fetch('/api/accounts/disconnect', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: slotId })
          }).catch(() => {});
          render();
        }
      };

      // Listener global para receber a mensagem da janela popup após o login
      window.addEventListener('message', function(event) {
        if (!event.data) return;
        if (event.data.type === 'GOOGLE_AUTH_SUCCESS') {
          if (wizardState.checkTimer) clearInterval(wizardState.checkTimer);
          wizardState.verifiedData = {
            email: event.data.email,
            name: event.data.name,
            picture: event.data.picture,
            tokens: event.data.tokens
          };
          wizardState.step = 3;
          wizardState.popupLaunched = false;
          renderWizardModal();
        } else if (event.data.type === 'GOOGLE_AUTH_CODE') {
          // Troca código com backend se disponível
          fetch('/api/accounts/oauth-exchange', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: event.data.code, slotId: event.data.slotId })
          })
          .then(r => r.json())
          .then(d => {
            if (d.account) {
              wizardState.verifiedData = {
                email: d.account.email,
                name: d.account.name,
                picture: d.account.picture
              };
              wizardState.step = 3;
              wizardState.popupLaunched = false;
              renderWizardModal();
            }
          })
          .catch(() => {});
        } else if (event.data.type === 'GOOGLE_AUTH_ERROR') {
          wizardState.popupLaunched = false;
          wizardState.errorMessage = event.data.error || 'A autorização foi cancelada ou falhou.';
          renderWizardModal();
        }
      });

      window.addNewAccountSlot = function() {
        const newSlot = {
          id: 'acc-' + Date.now(),
          name: 'Slot Google Pro 0' + (accounts.length + 1),
          email: '',
          connected: false
        };
        accounts.push(newSlot);
        localStorage.setItem('brain_saved_accounts', JSON.stringify(accounts));
        fetch('/api/accounts/add-slot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: newSlot.name })
        }).catch(() => {});
        render();
      };

      window.handleStartMeetingSubmit = function(e) {
        e.preventDefault();
        const title = document.getElementById('m-title').value;
        const currentMeetUrl = document.getElementById('m-meet-current').value;
        const nextMeetUrl = document.getElementById('m-meet-next').value;
        const accA = document.getElementById('m-acc-a').value;
        const accB = document.getElementById('m-acc-b').value;

        if (accA === accB) {
          alert('As duas contas do par devem ser contas Google Pro distintas!');
          return;
        }

        const newMeeting = {
          id: 'meet-' + Date.now().toString(36),
          title,
          currentMeetUrl,
          scheduledNextMeetUrl: nextMeetUrl,
          accountA: accA,
          accountB: accB,
          nextSwapInSeconds: 3300,
          latencyMs: 140
        };

        meetings.push(newMeeting);
        fetch('/api/meetings/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newMeeting)
        }).catch(() => {});

        // Abre a aba dedicada da reunião
        window.open('/?meeting=' + newMeeting.id, '_blank');
        render();
      };

      render();
    }
