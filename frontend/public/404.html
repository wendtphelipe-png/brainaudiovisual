<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Não Encontrada | Brain Audiovisual</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background: #020617;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.15), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.1), transparent 40%);
    }
    .container {
      max-width: 540px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 48px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h2 {
      font-size: 22px;
      margin-bottom: 12px;
      color: #e2e8f0;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #ffffff;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px -5px rgba(37, 99, 235, 0.5);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">ERRO 404</div>
    <h1>404</h1>
    <h2>Página Não Encontrada</h2>
    <p>O link que você tentou acessar não existe, expirou ou foi movido para um novo endereço na plataforma Brain Audiovisual.</p>
    <a href="/" class="btn">Voltar para o Início</a>
  </div>
</body>
</html>
