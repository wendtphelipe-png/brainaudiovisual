<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telão</title>
<link rel="icon" type="image/svg+xml" href="/logo/icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  /* Telão: uma LINHA por idioma, empilhadas, com altura fixa. Habilitar um
     idioma novo acrescenta uma linha embaixo e não muda o tamanho das
     outras. O operador recorta no programa de transmissão a linha do idioma
     que quer projetar.
     Dentro da linha o texto é corrido: cada frase nova se soma ao parágrafo
     e o conjunto sobe suavemente de baixo para cima, como uma legenda de
     teleprompter. A frase sendo dublada fica em destaque.
     Ajustes pelo endereço: ?altura=216 (altura da linha em px; padrão 216,
     cinco linhas numa tela 1920x1080) e ?limpo=1 (sem o nome do idioma). */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  :root { --row-h: 216px; }
  html, body { margin: 0; background: #04060A; color: #EAF0F7; font-family: Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { overflow-x: hidden; }
  .rows { display: flex; flex-direction: column; width: 100vw; }
  .row { position: relative; height: var(--row-h); flex: 0 0 var(--row-h); border-bottom: 1px solid #141B28; overflow: hidden; }
  .tag { position: absolute; top: calc(var(--row-h) * .07); left: 2.2vw; z-index: 2; display: inline-flex; align-items: center; gap: .5em;
    font-size: calc(var(--row-h) * .075); color: #8592A8; font-weight: 700; font-variation-settings: "wdth" 118; letter-spacing: .1em; }
  .tag b { width: .5em; height: .5em; border-radius: 50%; background: #FFB224; box-shadow: 0 0 12px rgba(255, 178, 36, .8); }
  .row[dir="rtl"] .tag { left: auto; right: 2.2vw; }
  /* Janela do texto: fica presa embaixo; o que passa do topo some em degradê */
  .viewport { position: absolute; inset: calc(var(--row-h) * .2) 2.2vw calc(var(--row-h) * .1); display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
    mask-image: linear-gradient(transparent 0, #000 30%); -webkit-mask-image: linear-gradient(transparent 0, #000 30%); }
  body.clean .viewport { top: calc(var(--row-h) * .08); }
  body.clean .tag { display: none; }
  .text { font-size: calc(var(--row-h) * .175); line-height: 1.3; color: #6F7D96; text-wrap: pretty; will-change: transform; }
  .seg { transition: color .5s; }
  .seg.current { color: #FFFFFF; font-weight: 600; text-decoration: underline; text-decoration-color: rgba(255, 178, 36, .85); text-decoration-thickness: .08em; text-underline-offset: .18em; }
  .msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; color: #8592A8; font-size: 22px; padding: 30px; }
</style>
</head>
<body>
  <main class="rows" id="rows"></main>
  <div class="msg" id="msg">Conectando…</div>
<script>
(function () {
  // Nome de cada idioma escrito nele mesmo (é o que a plateia lê)
  const NAMES = { 'pt-BR': 'PORTUGUÊS', 'en-US': 'ENGLISH', 'es-ES': 'ESPAÑOL', 'fr-FR': 'FRANÇAIS', 'de-DE': 'DEUTSCH', 'it-IT': 'ITALIANO', 'ar-SA': 'العربية' };
  const MAX_SEGS = 60;
  const params = new URLSearchParams(location.search);
  const sala = (params.get('sala') || '').toUpperCase();
  const altura = Number(params.get('altura'));
  if (altura >= 80 && altura <= 1080) document.documentElement.style.setProperty('--row-h', altura + 'px');
  if (params.get('limpo') === '1') document.body.classList.add('clean');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);

  let config = { targets: [] };
  let items = {};      // idioma -> Map(seq -> item)
  let outputs = [];

  // Cada linha guarda a fila de palavras ainda não mostradas
  let rows = {};       // idioma -> { text, queue: [{ span, words, i }], have: Set, last }

  function build() {
    $('rows').innerHTML = config.targets.map(l => `
      <section class="row" data-lang="${l}" ${l.startsWith('ar') ? 'dir="rtl"' : ''}>
        <div class="tag"><b></b>${NAMES[l] || l}</div>
        <div class="viewport"><div class="text" id="text-${l}"></div></div>
      </section>`).join('');
    rows = {};
    for (const l of config.targets) {
      rows[l] = { text: $('text-' + l), queue: [], have: new Set(), last: 0 };
      render(l, true); // o que já existia aparece de uma vez
    }
  }

  // O que mostrar: com uma saída de voz ligada, só o que já foi (ou está
  // sendo) dublado, com destaque no atual; sem saída, tudo o que chegou,
  // com destaque no último.
  function visible(lang) {
    const all = [...(items[lang] || new Map()).values()].filter(i => i.text).sort((a, b) => a.seq - b.seq);
    const out = outputs.filter(o => o.lang === lang && o.age < 4000 && o.playing);
    if (!out.length) return { shown: all, current: all.length ? all[all.length - 1].seq : 0 };
    const cur = Math.max(...out.map(o => o.currentSeq || 0));
    const upto = Math.max(cur, ...out.map(o => o.spokenSeq || 0));
    return { shown: all.filter(i => i.seq <= upto), current: cur };
  }

  // Frases novas entram na fila; as palavras aparecem uma a uma no relógio
  // abaixo. Assim o texto cresce aos poucos e a linha só sobe quando o
  // texto passa para a linha de baixo (antes, a frase inteira entrava de
  // uma vez e a linha toda "piscava").
  function render(lang, instant = false) {
    const row = rows[lang];
    if (!row) return;
    const { shown, current } = visible(lang);
    for (const it of shown) {
      if (row.have.has(it.seq)) continue;
      row.have.add(it.seq);
      const span = document.createElement('span');
      span.className = 'seg';
      span.dataset.seq = it.seq;
      row.text.appendChild(span);
      if (instant || reduce) span.textContent = it.text + ' ';
      else row.queue.push({ span, words: it.text.split(/\s+/), i: 0 });
    }
    // Guarda só o fim do texto (o começo já saiu da tela pelo topo)
    while (row.text.children.length > MAX_SEGS && !row.queue.some(q => q.span === row.text.firstChild)) row.text.firstChild.remove();
    for (const el of row.text.children) el.classList.toggle('current', Number(el.dataset.seq) === current);
  }

  function slideUp(el, grow) {
    el.style.transition = 'none';
    el.style.transform = `translateY(${grow}px)`;
    el.getBoundingClientRect();
    el.style.transition = 'transform .5s cubic-bezier(.2, .7, .2, 1)';
    el.style.transform = 'translateY(0)';
  }

  // Relógio das palavras: ritmo de fala (uns 300 ms por palavra) e mais
  // rápido se acumular texto, para nunca ficar para trás da voz.
  setInterval(() => {
    const now = performance.now();
    for (const lang of Object.keys(rows)) {
      const row = rows[lang];
      if (!row.queue.length) continue;
      const pending = row.queue.reduce((s, q) => s + q.words.length - q.i, 0);
      const interval = pending > 40 ? 60 : pending > 20 ? 130 : 300;
      if (now - row.last < interval) continue;
      row.last = now;
      const q = row.queue[0];
      const before = row.text.offsetHeight;
      q.span.textContent += q.words[q.i++] + ' ';
      if (q.i >= q.words.length) row.queue.shift();
      const grow = row.text.offsetHeight - before;
      if (grow > 0) slideUp(row.text, grow);
    }
  }, 40);

  let ws, retry = 0;
  function connect() {
    if (!sala) { $('msg').textContent = 'Abra esta página pelo botão "Telão" do cockpit.'; return; }
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
    ws.onopen = () => { retry = 0; ws.send(JSON.stringify({ type: 'hello', role: 'telao', sala })); };
    ws.onclose = () => { setTimeout(connect, Math.min(4000, 500 + retry++ * 500)); };
    ws.onmessage = ev => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'error') { $('msg').hidden = false; $('msg').textContent = msg.text; ws.onclose = null; return; }
      if (msg.type === 'welcome') {
        $('msg').hidden = true;
        config = msg.config;
        items = {};
        for (const [l, list] of Object.entries(msg.translations || {})) items[l] = new Map(list.map(i => [i.seq, i]));
        outputs = msg.outputs || [];
        document.title = 'Telão · Sala ' + msg.room;
        build();
      } else if (msg.type === 'config') {
        // Idioma novo entra como linha nova; as outras ficam como estão
        const prev = config.targets;
        config = msg.config;
        if (prev.join() !== config.targets.join()) build();
      } else if (msg.type === 'tr') {
        (items[msg.lang] = items[msg.lang] || new Map()).set(msg.item.seq, msg.item);
        const m = items[msg.lang];
        if (m.size > 300) m.delete(m.keys().next().value);
        render(msg.lang);
      } else if (msg.type === 'outputs') {
        outputs = msg.outputs;
        for (const l of config.targets) render(l);
      }
    };
  }
  connect();
})();
</script>
</body>
</html>
