<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telão</title>
<link rel="icon" type="image/svg+xml" href="/logo/icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  /* Telão: uma LINHA por idioma, empilhadas, com altura fixa. Habilitar um
     idioma novo acrescenta uma linha embaixo e não muda o tamanho das
     outras. O operador recorta no programa de transmissão a linha do idioma
     que quer projetar.
     Dentro da linha o texto é corrido: cada frase nova se soma ao parágrafo
     e o conjunto sobe suavemente de baixo para cima, como uma legenda de
     teleprompter. A frase sendo dublada fica em destaque.
     Ajustes pelo endereço: ?altura=216 (altura da linha em px; padrão 216,
     cinco linhas numa tela 1920x1080) e ?limpo=1 (sem o nome do idioma).

     Modo "em blocos" (?modo=blocos, ou o seletor que aparece ao mexer o
     mouse, ou a tecla B): em vez do texto corrido, cada linha mostra uma
     legenda por vez, como no cinema: frases inteiras de no máximo 2 linhas,
     que ficam na tela o tempo de leitura antes de dar lugar à próxima.
     Ajustes: ?leitura=15 (caracteres por segundo; padrão 15) e
     ?caracteres=110 (tamanho máximo de cada legenda). */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  :root { --row-h: 216px; }
  html, body { margin: 0; background: #04060A; color: #EAF0F7; font-family: Archivo, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { overflow-x: hidden; }
  .rows { display: flex; flex-direction: column; width: 100vw; }
  .row { position: relative; height: var(--row-h); flex: 0 0 var(--row-h); border-bottom: 1px solid #141B28; overflow: hidden; }
  .tag { position: absolute; top: calc(var(--row-h) * .07); left: 2.2vw; z-index: 2; display: inline-flex; align-items: center; gap: .5em;
    font-size: calc(var(--row-h) * .075); color: #8592A8; font-weight: 700; font-variation-settings: "wdth" 118; letter-spacing: .1em; }
  .tag b { width: .5em; height: .5em; border-radius: 50%; background: #FFB224; box-shadow: 0 0 12px rgba(255, 178, 36, .8); }
  .row[dir="rtl"] .tag { left: auto; right: 2.2vw; }
  /* Janela do texto: fica presa embaixo; o que passa do topo some em degradê */
  .viewport { position: absolute; inset: calc(var(--row-h) * .2) 2.2vw calc(var(--row-h) * .1); display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
    mask-image: linear-gradient(transparent 0, #000 30%); -webkit-mask-image: linear-gradient(transparent 0, #000 30%); }
  body.clean .viewport { top: calc(var(--row-h) * .08); }
  body.clean .tag { display: none; }
  .text { font-size: calc(var(--row-h) * .175); line-height: 1.3; color: #6F7D96; text-wrap: pretty; will-change: transform; }
  .seg { transition: color .5s; }
  .seg.current { color: #FFFFFF; font-weight: 600; text-decoration: underline; text-decoration-color: rgba(255, 178, 36, .85); text-decoration-thickness: .08em; text-underline-offset: .18em; }
  .msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; color: #8592A8; font-size: 22px; padding: 30px; }

  /* Modo em blocos: uma legenda centralizada por linha de idioma */
  .caps { position: absolute; inset: calc(var(--row-h) * .2) 8vw calc(var(--row-h) * .08); display: flex; align-items: center; justify-content: center; }
  body.clean .caps { top: calc(var(--row-h) * .08); }
  .cap, .cap-measure { width: 100%; text-align: center; font-size: calc(var(--row-h) * .19); line-height: 1.25; font-weight: 600; color: #FFFFFF; text-wrap: balance; }
  .cap-measure { position: absolute; left: 0; top: 0; visibility: hidden; pointer-events: none; }
  .cap.in { animation: capIn .22s ease-out; }
  .cap.out { opacity: 0; transition: opacity .6s; }
  @keyframes capIn { from { opacity: 0; transform: translateY(.12em); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .cap.in { animation: none; } }

  /* Seletor do modo: só aparece quando o mouse mexe, para não sair na captura */
  .ctl { position: fixed; right: 18px; bottom: 18px; z-index: 10; display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 10px;
    background: rgba(13, 20, 33, .94); border: 1px solid #22304A; font-size: 14px; color: #8592A8; opacity: 0; transition: opacity .25s; }
  body.ctl-on .ctl, .ctl:hover, .ctl:focus-within { opacity: 1; }
  .ctl span { padding: 0 6px 0 8px; }
  .ctl button { font: inherit; font-weight: 600; color: #C9D6E6; background: transparent; border: 1px solid transparent; border-radius: 7px; padding: 7px 12px; cursor: pointer; }
  .ctl button:hover { background: #16213A; }
  .ctl button[aria-pressed="true"] { color: #FFFFFF; background: #16213A; border-color: #3FA9F5; }
</style>
</head>
<body>
  <main class="rows" id="rows"></main>
  <div class="msg" id="msg">Conectando…</div>
  <div class="ctl" id="ctl" role="group" aria-label="Modo da legenda">
    <span>Legenda</span>
    <button type="button" data-modo="continuo" aria-pressed="true">Contínua</button>
    <button type="button" data-modo="blocos" aria-pressed="false">Em blocos</button>
  </div>
<script>
(function () {
  // Nome de cada idioma escrito nele mesmo (é o que a plateia lê)
  const NAMES = { 'pt-BR': 'PORTUGUÊS', 'en-US': 'ENGLISH', 'es-ES': 'ESPAÑOL', 'fr-FR': 'FRANÇAIS', 'de-DE': 'DEUTSCH', 'it-IT': 'ITALIANO', 'ar-SA': 'العربية' };
  const MAX_SEGS = 60;
  const params = new URLSearchParams(location.search);
  const sala = (params.get('sala') || '').toUpperCase();
  const altura = Number(params.get('altura'));
  if (altura >= 80 && altura <= 1080) document.documentElement.style.setProperty('--row-h', altura + 'px');
  if (params.get('limpo') === '1') document.body.classList.add('clean');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);

  let config = { targets: [] };
  let items = {};      // idioma -> Map(seq -> item)
  let outputs = [];

  // Modo da legenda: endereço (?modo=) tem prioridade; depois a última
  // escolha feita nesta máquina; o padrão é o texto corrido de sempre.
  const MODES = ['continuo', 'blocos'];
  let mode = 'continuo';
  try { if (MODES.includes(localStorage.getItem('telao-modo'))) mode = localStorage.getItem('telao-modo'); } catch (e) {}
  if (MODES.includes(params.get('modo'))) mode = params.get('modo');

  // Cada linha guarda a fila de palavras ainda não mostradas (modo contínuo)
  // ou as legendas montadas e a que está na tela (modo em blocos).
  let rows = {};

  function build() {
    $('rows').innerHTML = config.targets.map(l => `
      <section class="row" data-lang="${l}" ${l.startsWith('ar') ? 'dir="rtl"' : ''}>
        <div class="tag"><b></b>${NAMES[l] || l}</div>
        ${mode === 'blocos'
          ? `<div class="caps"><div class="cap" id="cap-${l}"></div><div class="cap-measure" id="meas-${l}" aria-hidden="true"></div></div>`
          : `<div class="viewport"><div class="text" id="text-${l}"></div></div>`}
      </section>`).join('');
    rows = {};
    for (const l of config.targets) {
      if (mode === 'blocos') {
        rows[l] = { blocos: true, cap: $('cap-' + l), meas: $('meas-' + l), lang: l, buf: [], lastSeq: 0, lastInput: 0, queue: [], showing: null };
      } else {
        rows[l] = { text: $('text-' + l), queue: [], have: new Set(), last: 0 };
      }
      render(l, true); // o que já existia aparece de uma vez (no modo em blocos, começa do próximo)
    }
    for (const b of document.querySelectorAll('#ctl button')) b.setAttribute('aria-pressed', String(b.dataset.modo === mode));
  }

  function setMode(m) {
    if (!MODES.includes(m) || m === mode) return;
    mode = m;
    try { localStorage.setItem('telao-modo', m); } catch (e) {}
    const url = new URL(location.href);
    url.searchParams.set('modo', m);
    history.replaceState(null, '', url);
    build();
  }

  // O que mostrar: com uma saída de voz ligada, só o que já foi (ou está
  // sendo) dublado, com destaque no atual; sem saída, tudo o que chegou,
  // com destaque no último.
  function visible(lang) {
    const all = [...(items[lang] || new Map()).values()].filter(i => i.text).sort((a, b) => a.seq - b.seq);
    const out = outputs.filter(o => o.lang === lang && o.age < 4000 && o.playing);
    if (!out.length) return { shown: all, current: all.length ? all[all.length - 1].seq : 0 };
    const cur = Math.max(...out.map(o => o.currentSeq || 0));
    const upto = Math.max(cur, ...out.map(o => o.spokenSeq || 0));
    return { shown: all.filter(i => i.seq <= upto), current: cur };
  }

  // Frases novas entram na fila; as palavras aparecem uma a uma no relógio
  // abaixo. Assim o texto cresce aos poucos e a linha só sobe quando o
  // texto passa para a linha de baixo (antes, a frase inteira entrava de
  // uma vez e a linha toda "piscava").
  function render(lang, instant = false) {
    const row = rows[lang];
    if (!row) return;
    if (row.blocos) return feedBlocks(row, instant);
    const { shown, current } = visible(lang);
    for (const it of shown) {
      if (row.have.has(it.seq)) continue;
      row.have.add(it.seq);
      const span = document.createElement('span');
      span.className = 'seg';
      span.dataset.seq = it.seq;
      row.text.appendChild(span);
      if (instant || reduce) span.textContent = it.text + ' ';
      else row.queue.push({ span, words: it.text.split(/\s+/), i: 0 });
    }
    // Guarda só o fim do texto (o começo já saiu da tela pelo topo)
    while (row.text.children.length > MAX_SEGS && !row.queue.some(q => q.span === row.text.firstChild)) row.text.firstChild.remove();
    for (const el of row.text.children) el.classList.toggle('current', Number(el.dataset.seq) === current);
  }

  function slideUp(el, grow) {
    el.style.transition = 'none';
    el.style.transform = `translateY(${grow}px)`;
    el.getBoundingClientRect();
    el.style.transition = 'transform .5s cubic-bezier(.2, .7, .2, 1)';
    el.style.transform = 'translateY(0)';
  }

  // Relógio das palavras: ritmo de fala (uns 300 ms por palavra) e mais
  // rápido se acumular texto, para nunca ficar para trás da voz.
  setInterval(() => {
    const now = performance.now();
    for (const lang of Object.keys(rows)) {
      const row = rows[lang];
      if (row.blocos || !row.queue.length) continue;
      const pending = row.queue.reduce((s, q) => s + q.words.length - q.i, 0);
      const interval = pending > 40 ? 60 : pending > 20 ? 130 : 300;
      if (now - row.last < interval) continue;
      row.last = now;
      const q = row.queue[0];
      const before = row.text.offsetHeight;
      q.span.textContent += q.words[q.i++] + ' ';
      if (q.i >= q.words.length) row.queue.shift();
      const grow = row.text.offsetHeight - before;
      if (grow > 0) slideUp(row.text, grow);
    }
  }, 40);

  // ---------------------------------------------------------------------
  // Modo em blocos
  //
  // O texto traduzido chega em pedaços que não respeitam o fim das frases.
  // Aqui ele vai para um buffer e sai em LEGENDAS:
  //  - cada legenda cabe em no máximo 2 linhas (medido na própria tela) e
  //    em LEGENDA_MAX caracteres;
  //  - o corte prefere fim de frase, depois vírgula, depois antes de uma
  //    conjunção ("and", "pero", "que"...), e só em último caso no meio;
  //  - frase incompleta espera um pouco (ESPERA_MS) pelo resto antes de sair;
  //  - cada legenda fica na tela o tempo de leitura (LEITURA caracteres por
  //    segundo). Se as legendas se acumularem, o ritmo acelera para o atraso
  //    não crescer; nada é descartado.
  // ---------------------------------------------------------------------
  const LEITURA = Math.min(30, Math.max(8, Number(params.get('leitura')) || 15));
  const LEGENDA_MAX = Math.min(200, Math.max(40, Number(params.get('caracteres')) || 110));
  const ESPERA_MS = 1600;        // frase sem ponto final: quanto esperar pelo resto
  const MIN_MS = 1600;           // nenhuma legenda some antes disso
  const MAX_MS = 7000;           // nenhuma legenda trava a fila além disso
  const SOME_MS = 8000;          // sem fala nova, a última legenda some depois disso
  const END_RE = /[.?!…]["'”’»)\]]*$/;
  const CLAUSE_RE = /[,;:]["'”’»)\]]*$/;
  const CONNECT = new Set([
    'e', 'mas', 'que', 'porque', 'pois', 'então', 'quando', 'onde', 'porém', 'ou', 'se', 'como', 'enquanto', 'depois', 'antes', 'para',
    'and', 'but', 'so', 'because', 'when', 'which', 'that', 'while', 'where', 'or', 'if', 'after', 'before', 'since', 'although', 'to',
    'y', 'pero', 'porque', 'cuando', 'donde', 'pues', 'entonces', 'mientras', 'aunque', 'o', 'si', 'después', 'antes', 'para',
    'et', 'mais', 'donc', 'parce', 'quand', 'où', 'ou', 'si', 'pendant', 'ed', 'ma', 'perché', 'quando', 'dove', 'und', 'aber', 'weil', 'wenn', 'dass', 'oder']);
  const bare = w => w.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');

  // Pega as frases novas (na ordem) e joga as palavras no buffer
  function feedBlocks(row, instant) {
    const { shown } = visible(row.lang);
    if (instant) { // ao abrir ou trocar de modo, começa da próxima frase
      row.lastSeq = shown.length ? shown[shown.length - 1].seq : 0;
      return;
    }
    for (const it of shown) {
      if (it.seq <= row.lastSeq) continue;
      row.lastSeq = it.seq;
      const words = it.text.split(/\s+/).filter(Boolean);
      if (!words.length) continue;
      // O fim de cada pedaço traduzido é um bom ponto de corte (o
      // reconhecimento de voz quase nunca põe ponto final)
      row.buf.push(...words.map((w, i) => ({ w, end: i === words.length - 1 })));
      row.lastInput = performance.now();
    }
  }

  // A legenda cabe em 2 linhas? Mede num elemento invisível igual ao real.
  const join = list => list.map(x => x.w).join(' ');

  function fits(row, words) {
    const text = join(words);
    if (words.length > 1 && text.length > LEGENDA_MAX) return false;
    // Janela minimizada ou ainda sem tamanho: não dá para medir; vale só o
    // limite de caracteres (senão sairiam legendas de uma palavra)
    if (row.meas.parentNode.clientWidth < 300) return true;
    row.meas.textContent = text;
    const lh = parseFloat(getComputedStyle(row.meas).lineHeight) || 40;
    return row.meas.offsetHeight <= lh * 2 + 2;
  }

  function fitCount(row) {
    let n = 1;
    while (n < row.buf.length && fits(row, row.buf.slice(0, n + 1))) n++;
    return n;
  }

  // Onde cortar quando o buffer não cabe numa legenda só (n = quantas cabem)
  function bestCut(words, n) {
    for (let i = n - 1; i >= 2; i--) if (END_RE.test(words[i].w)) return i + 1;
    for (let i = n - 1; i >= Math.floor(n * 0.45); i--) if (CLAUSE_RE.test(words[i].w)) return i + 1;
    for (let i = n - 1; i >= Math.floor(n * 0.4); i--) if (words[i].end) return i + 1;
    for (let i = n - 1; i >= Math.max(1, Math.floor(n * 0.5)); i--) if (CONNECT.has(bare(words[i].w))) return i;
    return n;
  }

  function compose(row, now) {
    while (row.buf.length) {
      const n = fitCount(row);
      if (row.buf.length > n) { row.queue.push(join(row.buf.splice(0, bestCut(row.buf, n)))); continue; }
      // Tudo cabe: sai se a frase terminou; senão espera o resto um pouco
      let k = -1;
      for (let i = row.buf.length - 1; i >= 0; i--) if (END_RE.test(row.buf[i].w)) { k = i; break; }
      if (k === row.buf.length - 1 || now - row.lastInput >= ESPERA_MS) { row.queue.push(join(row.buf.splice(0))); break; }
      if (k >= 2) { row.queue.push(join(row.buf.splice(0, k + 1))); continue; }
      break;
    }
  }

  // Tempo de leitura; acelera se houver legendas esperando
  function readMs(text, waiting) {
    const cps = waiting >= 5 ? LEITURA * 2 : waiting >= 3 ? LEITURA * 1.6 : waiting >= 1 ? LEITURA * 1.15 : LEITURA;
    const min = waiting >= 5 ? 1200 : MIN_MS;
    return Math.min(MAX_MS, Math.max(min, text.length / cps * 1000));
  }

  function showCaption(row, text, now) {
    row.showing = text === null ? null : { text, since: now };
    row.cap.classList.remove('in', 'out');
    if (text === null) { row.cap.classList.add('out'); return; }
    row.cap.textContent = text;
    void row.cap.offsetWidth; // reinicia a animação de entrada
    row.cap.classList.add('in');
  }

  setInterval(() => {
    const now = performance.now();
    for (const lang of Object.keys(rows)) {
      const row = rows[lang];
      if (!row.blocos) continue;
      compose(row, now);
      if (!row.showing) {
        if (row.queue.length) showCaption(row, row.queue.shift(), now);
        continue;
      }
      const elapsed = now - row.showing.since;
      const need = readMs(row.showing.text, row.queue.length);
      if (row.queue.length && elapsed >= need) showCaption(row, row.queue.shift(), now);
      else if (!row.queue.length && !row.buf.length && elapsed >= need + SOME_MS) showCaption(row, null, now);
    }
  }, 100);

  // Seletor do modo: aparece ao mexer o mouse e some sozinho
  let ctlTimer = 0;
  const showCtl = () => {
    document.body.classList.add('ctl-on');
    clearTimeout(ctlTimer);
    ctlTimer = setTimeout(() => document.body.classList.remove('ctl-on'), 2500);
  };
  document.addEventListener('mousemove', showCtl);
  $('ctl').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { setMode(b.dataset.modo); showCtl(); } });
  document.addEventListener('keydown', e => {
    if (e.key === 'b' || e.key === 'B') { setMode(mode === 'blocos' ? 'continuo' : 'blocos'); showCtl(); }
  });

  let ws, retry = 0;
  function connect() {
    if (!sala) { $('msg').textContent = 'Abra esta página pelo botão "Telão" do cockpit.'; return; }
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
    ws.onopen = () => { retry = 0; ws.send(JSON.stringify({ type: 'hello', role: 'telao', sala })); };
    ws.onclose = () => { setTimeout(connect, Math.min(4000, 500 + retry++ * 500)); };
    ws.onmessage = ev => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'error') { $('msg').hidden = false; $('msg').textContent = msg.text; ws.onclose = null; return; }
      if (msg.type === 'welcome') {
        $('msg').hidden = true;
        config = msg.config;
        items = {};
        for (const [l, list] of Object.entries(msg.translations || {})) items[l] = new Map(list.map(i => [i.seq, i]));
        outputs = msg.outputs || [];
        document.title = 'Telão · Sala ' + msg.room;
        build();
      } else if (msg.type === 'config') {
        // Idioma novo entra como linha nova; as outras ficam como estão
        const prev = config.targets;
        config = msg.config;
        if (prev.join() !== config.targets.join()) build();
      } else if (msg.type === 'tr') {
        (items[msg.lang] = items[msg.lang] || new Map()).set(msg.item.seq, msg.item);
        const m = items[msg.lang];
        if (m.size > 300) m.delete(m.keys().next().value);
        render(msg.lang);
      } else if (msg.type === 'outputs') {
        outputs = msg.outputs;
        for (const l of config.targets) render(l);
      }
    };
  }
  connect();
})();
</script>
</body>
</html>
