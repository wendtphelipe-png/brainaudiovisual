<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabine</title>
<link rel="icon" type="image/svg+xml" href="/logo/icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/cabine.css">
<style>
  body { height: 100vh; display: grid; grid-template-rows: auto auto 1fr auto; overflow: hidden;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 28px 28px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .wordmark { font-weight: 700; font-variation-settings: "wdth" 125; letter-spacing: .02em; font-size: .95rem; }
  .wordmark small { color: var(--muted); font-weight: 500; font-variation-settings: "wdth" 100; letter-spacing: 0; margin-left: 6px; }
  .status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .timecode { font-variant-numeric: tabular-nums; font-variation-settings: "wdth" 112; font-weight: 700; font-size: 1.05rem; letter-spacing: .04em; }
  .icon-btn { width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--line); background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
  .icon-btn:hover { color: var(--ink); }

  .toolbar { display: flex; align-items: center; gap: 14px 22px; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 85%, transparent); }
  .field { display: flex; align-items: center; gap: 10px; }
  .field > span { color: var(--muted); font-size: .85rem; white-space: nowrap; }
  .langs { display: flex; gap: 4px; flex-wrap: wrap; }
  .lang-toggle { height: 34px; min-width: 44px; padding: 0 10px; border-radius: 5px; border: 1px solid var(--line); background: transparent; cursor: pointer;
    font-weight: 700; font-variation-settings: "wdth" 112; color: var(--muted); letter-spacing: .03em; }
  .lang-toggle[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); border-color: var(--amber); box-shadow: inset 0 -2px 0 var(--amber); }
  .meter { display: flex; align-items: center; gap: 10px; min-width: 220px; flex: 1; }
  .meter-track { flex: 1; height: 8px; border-radius: 2px; background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
  .meter-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--ok) 0 70%, var(--amber) 70% 90%, var(--bad) 90%); transition: width 80ms linear; }
  .meter small { color: var(--muted); font-size: .8rem; white-space: nowrap; }
  .actions { display: flex; gap: 8px; margin-left: auto; }

  .lanes { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(300px, 1fr); gap: 1px; background: var(--line); overflow-x: auto; min-height: 0; }
  .lane { background: color-mix(in srgb, var(--panel) 94%, transparent); display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .lane-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
  .lane-title { display: flex; align-items: center; gap: 10px; }
  .code { display: inline-grid; place-items: center; height: 26px; min-width: 36px; padding: 0 7px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line);
    font-weight: 800; font-variation-settings: "wdth" 118; font-size: .8rem; letter-spacing: .05em; }
  .lane.source .code { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); }
  .lane-name { font-weight: 700; font-variation-settings: "wdth" 112; }
  .lane-stats { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
  .lane-stats b { color: var(--ink); font-weight: 600; }
  .lane-body { overflow-y: auto; padding: 10px 16px 18px; scroll-behavior: smooth; }
  .blk { display: grid; grid-template-columns: 38px 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px dashed color-mix(in srgb, var(--line) 70%, transparent); animation: blkIn .25s ease-out; }
  @keyframes blkIn { from { opacity: 0; transform: translateY(4px); } }
  .blk-seq { color: var(--dim); font-size: .78rem; font-variant-numeric: tabular-nums; padding-top: 3px; }
  .blk-text { line-height: 1.5; font-size: 1.02rem; }
  .blk-meta { color: var(--dim); font-size: .74rem; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .blk.spoken .blk-text { color: var(--muted); }
  .blk.merged .blk-text { color: var(--dim); font-style: italic; font-size: .85rem; }
  .interim { color: var(--dim); line-height: 1.5; padding: 8px 0 0 46px; min-height: 2em; }
  .interim:not(:empty)::after { content: ""; display: inline-block; width: 7px; height: 1em; margin-left: 3px; vertical-align: -2px; background: var(--amber); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .empty { color: var(--dim); padding: 24px 0; line-height: 1.5; font-size: .92rem; }

  .outputs { border-top: 1px solid var(--line); background: var(--bg); padding: 10px 18px; display: flex; gap: 10px 18px; flex-wrap: wrap; align-items: center; font-size: .85rem; }
  .outputs > span { color: var(--muted); }
  .out-link { display: inline-flex; align-items: center; gap: 8px; padding: 5px 6px 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  .out-link code { font-family: inherit; font-variant-numeric: tabular-nums; color: var(--ink); }
  .out-link button { height: 26px; padding: 0 9px; border-radius: 4px; border: 0; background: var(--panel-2); cursor: pointer; font-size: .78rem; color: var(--muted); }
  .out-link button:hover { color: var(--ink); }
  .toast { position: fixed; right: 18px; bottom: 70px; max-width: 380px; padding: 12px 14px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--amber); color: var(--ink); font-size: .9rem; box-shadow: 0 16px 40px -18px rgba(0,0,0,.6); }
  @media (max-width: 900px) { body { height: auto; overflow: auto; } .lanes { grid-auto-flow: row; grid-auto-columns: auto; } .lane-body { max-height: 50vh; } .actions { margin-left: 0; } }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="/logo/icone.svg" width="30" height="30" alt="">
      <span class="wordmark">BRAIN AUDIOVISUAL<small>Cabine</small></span>
    </div>
    <div class="status">
      <span class="timecode" id="timecode" title="Tempo de captação">00:00:00</span>
      <span class="chip" id="chipServer">Servidor</span>
      <span class="chip" id="chipStt">Captação parada</span>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Alternar tema" title="Alternar tema">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </div>
  </header>

  <div class="toolbar">
    <label class="field"><span>Palestrante fala</span>
      <select id="source">
        <option value="pt-BR">Português</option><option value="en-US">Inglês</option><option value="es-ES">Espanhol</option>
        <option value="fr-FR">Francês</option><option value="de-DE">Alemão</option><option value="it-IT">Italiano</option>
      </select>
    </label>
    <div class="field"><span>Saídas</span><div class="langs" id="targets"></div></div>
    <div class="meter" title="Nível do microfone padrão do Windows (é ele que o reconhecimento escuta)">
      <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
      <small id="meterLabel">Entrada: microfone padrão</small>
    </div>
    <div class="actions">
      <button class="btn btn-onair btn-cut" id="startBtn" type="button">Iniciar captação</button>
      <button class="btn btn-ghost" id="newBtn" type="button">Nova sessão</button>
    </div>
  </div>

  <main class="lanes" id="lanes"></main>

  <footer class="outputs" id="outputs"></footer>

<script>
(function () {
  const LANGS = { 'pt-BR': ['PT', 'Português'], 'en-US': ['EN', 'Inglês'], 'es-ES': ['ES', 'Espanhol'], 'fr-FR': ['FR', 'Francês'],
    'de-DE': ['DE', 'Alemão'], 'it-IT': ['IT', 'Italiano'], 'ar-SA': ['AR', 'Árabe'] };
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Tema: escuro por padrão (cabine na penumbra), claro opcional
  try { if (localStorage.getItem('cabine_tema') === 'light') document.documentElement.dataset.theme = 'light'; } catch (_) {}
  $('themeBtn').onclick = () => {
    const light = document.documentElement.dataset.theme !== 'light';
    if (light) document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme;
    try { localStorage.setItem('cabine_tema', light ? 'light' : 'dark'); } catch (_) {}
  };

  // ---------------- Estado ----------------
  let config = { source: 'pt-BR', targets: ['en-US', 'es-ES'] };
  let session = null, addresses = [], port = location.port;
  let blocks = [];
  let tr = {};          // idioma -> Map(seq -> item)
  let outputs = [];

  // ---------------- Faixas ----------------
  function buildLanes() {
    const lanes = $('lanes');
    const src = LANGS[config.source] || ['??', config.source];
    lanes.innerHTML = `
      <section class="lane source">
        <div class="lane-head">
          <div class="lane-title"><span class="code">${src[0]}</span><span class="lane-name">Original</span></div>
          <div class="lane-stats"><span>Blocos <b id="st-blocks">0</b></span><span>Média <b id="st-words">0</b> palavras</span></div>
        </div>
        <div class="lane-body" id="body-source"><div id="list-source"></div><div class="interim" id="interim"></div></div>
      </section>` +
      config.targets.map(l => {
        const m = LANGS[l] || ['??', l];
        return `<section class="lane">
          <div class="lane-head">
            <div class="lane-title"><span class="code">${m[0]}</span><span class="lane-name">${m[1]}</span><span class="chip" id="out-${l}">Sem saída</span></div>
            <div class="lane-stats"><span>Tradução <b id="lat-${l}">–</b></span><span>Fila na saída <b id="q-${l}">–</b></span><span>Voz <b id="v-${l}">–</b></span></div>
          </div>
          <div class="lane-body" id="body-${l}"><div id="list-${l}"></div></div>
        </section>`;
      }).join('');
    for (const b of blocks) addBlock(b, false);
    for (const l of config.targets) for (const it of (tr[l] || new Map()).values()) addTr(l, it, false);
    if (!blocks.length) $('list-source').innerHTML = '<p class="empty">Clique em "Iniciar captação". O texto do palestrante aparece aqui em blocos curtos, e as traduções ao lado.</p>';
    stats();
  }

  function stick(el, wasAtEnd) { if (wasAtEnd) el.scrollTop = el.scrollHeight; }
  const atEnd = el => el.scrollHeight - el.scrollTop - el.clientHeight < 80;

  function addBlock(b, live = true) {
    const list = $('list-source'), body = $('body-source');
    if (!list) return;
    const end = atEnd(body);
    list.querySelector('.empty')?.remove();
    list.insertAdjacentHTML('beforeend', `<div class="blk"><span class="blk-seq">${b.seq}</span><div><div class="blk-text">${esc(b.text)}</div></div></div>`);
    if (live) $('interim').textContent = '';
    stick(body, end);
  }

  function addTr(lang, it, live = true) {
    const list = $('list-' + lang), body = $('body-' + lang);
    if (!list) return;
    const end = atEnd(body);
    const lat = it.tTr && it.tClose ? ((it.tTr - it.tClose) / 1000).toFixed(1).replace('.', ',') + ' s' : '';
    const html = it.mergedInto
      ? `<div class="blk merged" data-seq="${it.seq}"><span class="blk-seq">${it.seq}</span><div><div class="blk-text">traduzido junto com o bloco ${it.mergedInto}</div></div></div>`
      : `<div class="blk" data-seq="${it.seq}"><span class="blk-seq">${it.seq}</span><div><div class="blk-text">${esc(it.text)}</div><div class="blk-meta">${lat}</div></div></div>`;
    list.insertAdjacentHTML('beforeend', html);
    stick(body, end);
    if (live) stats();
  }

  function stats() {
    $('st-blocks') && ($('st-blocks').textContent = blocks.length);
    const avg = blocks.length ? blocks.reduce((s, b) => s + b.words, 0) / blocks.length : 0;
    $('st-words') && ($('st-words').textContent = avg.toFixed(0));
    for (const l of config.targets) {
      const items = [...(tr[l] || new Map()).values()].filter(i => i.tTr && i.tClose && !i.mergedInto).slice(-20);
      const el = $('lat-' + l);
      if (el) el.textContent = items.length ? (items.reduce((s, i) => s + (i.tTr - i.tClose), 0) / items.length / 1000).toFixed(1).replace('.', ',') + ' s' : '–';
    }
  }

  function renderOutputs() {
    for (const l of config.targets) {
      const mine = outputs.filter(o => o.lang === l && o.age < 4000);
      const chip = $('out-' + l);
      if (!chip) continue;
      if (!mine.length) { chip.className = 'chip'; chip.textContent = 'Sem saída'; $('q-' + l).textContent = '–'; $('v-' + l).textContent = '–'; continue; }
      const o = mine[0];
      chip.className = o.playing ? 'chip onair' : 'chip warn';
      chip.textContent = o.playing ? (mine.length > 1 ? `${mine.length} saídas no ar` : 'Saída no ar') : 'Saída parada';
      $('q-' + l).textContent = `${Math.round((o.backlogWords || 0) / 2.6)} s · ${String(o.rate || 1).replace('.', ',')}x`;
      $('v-' + l).textContent = (o.voice || '–').replace(/^Microsoft /, '').replace(/ Online \(Natural\).*/, '');
      // Marca na faixa o que já foi falado no notebook
      document.querySelectorAll(`#list-${CSS.escape(l)} .blk`).forEach(el => el.classList.toggle('spoken', Number(el.dataset.seq) <= (o.spokenSeq || 0)));
    }
    const host = addresses[0] || location.hostname;
    $('outputs').innerHTML = '<span>Links das saídas (abrir no Microsoft Edge de cada notebook, mesma rede)</span>' + config.targets.map(l => {
      const url = `http://${host}:${port}/saida?lang=${l}`;
      return `<span class="out-link"><b>${(LANGS[l] || [l])[0]}</b><code>${esc(url)}</code><button type="button" data-copy="${esc(url)}">Copiar</button></span>`;
    }).join('');
  }
  $('outputs').addEventListener('click', e => {
    const url = e.target.dataset && e.target.dataset.copy;
    if (!url) return;
    navigator.clipboard?.writeText(url);
    e.target.textContent = 'Copiado';
    setTimeout(() => (e.target.textContent = 'Copiar'), 1200);
  });

  // ---------------- Idiomas ----------------
  function renderControls() {
    $('source').value = config.source;
    $('targets').innerHTML = Object.entries(LANGS).filter(([code]) => code !== config.source)
      .map(([code, m]) => `<button type="button" class="lang-toggle" data-lang="${code}" aria-pressed="${config.targets.includes(code)}" title="${m[1]}">${m[0]}</button>`).join('');
  }
  $('targets').addEventListener('click', e => {
    const code = e.target.dataset && e.target.dataset.lang;
    if (!code) return;
    const targets = config.targets.includes(code) ? config.targets.filter(c => c !== code) : [...config.targets, code];
    send({ type: 'config', source: config.source, targets });
  });
  $('source').onchange = e => {
    if (recognizing) { alert('Pare a captação antes de trocar o idioma do palestrante.'); e.target.value = config.source; return; }
    send({ type: 'config', source: e.target.value, targets: config.targets.filter(t => t !== e.target.value) });
  };

  // ---------------- Servidor ----------------
  let ws, retry = 0;
  function send(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }
  function connect() {
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
    ws.onopen = () => { retry = 0; chip('chipServer', 'Servidor conectado', 'ok'); send({ type: 'hello', role: 'cockpit' }); };
    ws.onclose = () => { chip('chipServer', 'Servidor desconectado', 'bad'); setTimeout(connect, Math.min(4000, 500 + retry++ * 500)); };
    ws.onmessage = ev => {
      const msg = JSON.parse(ev.data);
      switch (msg.type) {
        case 'welcome':
          session = msg.session; config = msg.config; addresses = msg.addresses || []; port = msg.port || port;
          blocks = msg.blocks || [];
          tr = {};
          for (const [l, items] of Object.entries(msg.translations || {})) tr[l] = new Map(items.map(i => [i.seq, i]));
          outputs = msg.outputs || [];
          renderControls(); buildLanes(); renderOutputs();
          break;
        case 'config':
          config = msg.config; renderControls(); buildLanes(); renderOutputs();
          break;
        case 'block':
          blocks.push(msg.block); addBlock(msg.block); stats();
          break;
        case 'tr':
          (tr[msg.lang] = tr[msg.lang] || new Map()).set(msg.item.seq, msg.item);
          addTr(msg.lang, msg.item);
          break;
        case 'interim':
          // Texto provisório vindo de outro cockpit (ex.: monitor em outro aparelho)
          if (!recognizing && $('interim')) $('interim').textContent = msg.text;
          break;
        case 'outputs':
          outputs = msg.outputs; renderOutputs();
          break;
        case 'alert':
          toast(msg.text);
          break;
      }
    };
  }
  function chip(id, text, cls) { const c = $(id); c.textContent = text; c.className = 'chip ' + (cls || ''); }
  let toastTimer = 0;
  function toast(text) {
    let t = document.querySelector('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = text;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.remove(), 6000);
  }

  // ---------------- Captação (reconhecimento de voz do Chrome) ----------------
  // O reconhecimento escuta o microfone padrão do Windows. Para capturar uma
  // aula do Vimeo, mande o som do navegador para o VB-Cable e deixe
  // "CABLE Output" como microfone padrão.
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, recognizing = false, run = 0, startedAt = 0, lastResult = 0;

  function startRecognition() {
    if (!SR) { toast('Este navegador não tem reconhecimento de voz. Use o Google Chrome.'); return; }
    rec = new SR();
    rec.lang = config.source;
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    const myRun = ++run;
    rec.onresult = ev => {
      lastResult = Date.now();
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i];
        const text = r[0].transcript;
        send({ type: 'stt', utt: `${session}:${myRun}:${i}`, text, final: r.isFinal });
        if (!r.isFinal) $('interim').textContent = text;
      }
    };
    rec.onerror = ev => {
      if (ev.error === 'not-allowed') { toast('O navegador bloqueou o microfone. Libere o acesso e tente de novo.'); stopRecognition(); }
      else if (ev.error !== 'no-speech' && ev.error !== 'aborted') chip('chipStt', 'Reconhecimento: ' + ev.error, 'warn');
    };
    rec.onend = () => {
      // O Chrome encerra sozinho de tempos em tempos: confirma o que estava na tela e reinicia
      send({ type: 'stt-end' });
      if (recognizing) setTimeout(() => { if (recognizing) startRecognition(); }, 60);
    };
    try { rec.start(); } catch (_) {}
  }
  function stopRecognition() {
    recognizing = false;
    try { rec && rec.stop(); } catch (_) {}
    send({ type: 'flush' });
    chip('chipStt', 'Captação parada');
    $('startBtn').textContent = 'Iniciar captação';
    $('startBtn').className = 'btn btn-onair btn-cut';
  }
  $('startBtn').onclick = () => {
    if (recognizing) return stopRecognition();
    recognizing = true;
    startedAt = startedAt || Date.now();
    lastResult = Date.now();
    startRecognition();
    startMeter();
    chip('chipStt', 'Captando', 'onair');
    $('startBtn').textContent = 'Parar captação';
    $('startBtn').className = 'btn btn-stop btn-cut';
  };
  // Se o reconhecimento travar sem avisar (acontece no Chrome), reinicia
  setInterval(() => {
    if (recognizing && Date.now() - lastResult > 12000 && meterLevel > 0.08) {
      lastResult = Date.now();
      try { rec.abort(); } catch (_) {}
    }
  }, 2000);
  $('newBtn').onclick = () => {
    if (!confirm('Começar uma sessão nova? As saídas também recomeçam do zero.')) return;
    if (recognizing) stopRecognition();
    startedAt = 0;
    send({ type: 'new-session' });
  };

  // Medidor de nível do microfone padrão
  let meterLevel = 0, meterOn = false;
  async function startMeter() {
    if (meterOn) return;
    meterOn = true;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      const track = stream.getAudioTracks()[0];
      $('meterLabel').textContent = 'Entrada: ' + (track.label || 'microfone padrão').replace(/\s*\(.*\)\s*$/, '');
      const ctx = new AudioContext();
      const an = ctx.createAnalyser();
      an.fftSize = 1024;
      ctx.createMediaStreamSource(stream).connect(an);
      const buf = new Float32Array(an.fftSize);
      (function loop() {
        an.getFloatTimeDomainData(buf);
        let sum = 0; for (const v of buf) sum += v * v;
        meterLevel = Math.min(1, Math.sqrt(sum / buf.length) * 4);
        $('meterFill').style.width = (meterLevel * 100).toFixed(0) + '%';
        requestAnimationFrame(loop);
      })();
    } catch (_) {
      $('meterLabel').textContent = 'Sem acesso ao microfone';
    }
  }

  setInterval(() => {
    const s = startedAt ? Math.floor((Date.now() - startedAt) / 1000) : 0;
    $('timecode').textContent = [s / 3600, (s % 3600) / 60, s % 60].map(n => String(Math.floor(n)).padStart(2, '0')).join(':');
  }, 500);

  connect();
})();
</script>
</body>
</html>
